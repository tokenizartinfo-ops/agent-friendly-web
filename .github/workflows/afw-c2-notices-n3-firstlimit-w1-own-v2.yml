name: AFW FIRSTLIMIT W1 OWN v2 native
on:
  push:
    branches:
      - lab/afw-c2-own-receiver-20261116-notices-n3-firstlimit-w1-v2
permissions:
  contents: read
jobs:
  c2-notices-n3-firstlimit-w1-own-v2:
    if: github.event_name == 'push' && github.run_attempt == 1 && github.ref == 'refs/heads/lab/afw-c2-own-receiver-20261116-notices-n3-firstlimit-w1-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout exact OWN v2 model tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Setup exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Run native OWN W1 v2 controls
        run: node --test --test-reporter=tap --test-concurrency=1 docs/superpowers/root-own/c2-notices-n3-firstlimit-w1-v2/run-controls.mjs
      - name: Preserve compact OWN v2 proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afw-c2-notices-n3-firstlimit-w1-own-v2-proof
          path: firstlimit-w1-own-v2-proof.json
          if-no-files-found: error
          retention-days: 7
