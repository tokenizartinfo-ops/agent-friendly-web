name: AFW independent coupled QA restore
run-name: AFW independent QA restore
on:
  workflow_dispatch:
    inputs:
      intent_id:
        description: Original prepared intent identifier
        required: true
        type: string
      control_hash:
        description: Original committed control hash
        required: true
        type: string
      handoff_hash:
        description: Original committed handoff hash
        required: true
        type: string
      restore_before:
        description: Exact original recovery deadline in Unix milliseconds
        required: true
        type: string
permissions:
  contents: read
jobs:
  restore:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.repository_id == '1347578006' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && github.actor == 'tokenizartinfo-ops' && github.actor_id == '290715446' && github.triggering_actor == 'tokenizartinfo-ops' }}
    concurrency:
      group: afw-qa-cloud-closed-rollback
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: afw-qa-cloud-closed-rollback
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore exact QA after original owner closure
        id: coupled_restore_once
        env:
          AFW_QA_CLOSED_TOKEN: ${{ secrets.AFW_QA_CLOSED_TOKEN }}
          AFW_R2_BACKUPS_READ_URL: ${{ secrets.AFW_R2_BACKUPS_READ_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          export AFW_COUPLED_RESTORE_ORIGINAL_PID=$$
          exec node scripts/run-qa-finite-coupled-restore.mjs
