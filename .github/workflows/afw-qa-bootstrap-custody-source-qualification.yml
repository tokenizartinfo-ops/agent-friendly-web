name: AFW bootstrap custody source qualification
on:
  push:
    branches: [feat/qa-bootstrap-custody-inspection-20261101]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/mcp-qa-bootstrap-custody-inspection.test.mjs
      - name: Scoped lint with isolated cloud tooling only
        run: |
          npm install --prefix "${RUNNER_TEMP}/afw-custody-lint" --ignore-scripts --no-audit --no-fund --no-package-lock eslint@9.39.4
          "${RUNNER_TEMP}/afw-custody-lint/node_modules/.bin/eslint" --no-config-lookup --no-ignore --rule 'no-unused-vars:error' --rule 'no-undef:error' --global Buffer --global process --global fetch --global AbortController --global AbortSignal --global Headers --global Response --global TextDecoder --global TextEncoder --global setTimeout --global clearTimeout --global performance lib/mcp-qa-bootstrap-custody-inspection.mjs scripts/qa-bootstrap-custody-inspection.mjs test/mcp-qa-bootstrap-custody-inspection.test.mjs
