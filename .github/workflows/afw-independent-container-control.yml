name: AFW independent Container control source check
on:
  pull_request:
    paths:
      - 'examples/container-control-20261022/**'
      - 'test/independent-container-control.test.mjs'
      - 'test/independent-container-control-native.test.mjs'
      - 'test/fixtures/independent-container-control-worker.mjs'
      - '.github/workflows/afw-independent-container-control.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'tokenizartinfo-ops/agent-friendly-web' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original-budget and result guards without network
        run: node --test test/independent-container-control.test.mjs
      - name: Validate closed diagnostic profile without deployment
        env:
          WRANGLER_SEND_METRICS: 'false'
          CI: 'true'
        run: npx --yes wrangler@4.149.0 deploy --dry-run --config examples/container-control-20261022/wrangler.jsonc --outdir "$RUNNER_TEMP/afw-control"
