name: AFW native notice closure
on:
  push:
    branches: [lab/afw-qa-notice-closure-20261118]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.run_attempt == '1' && contains(fromJSON('["AFW-QA-NOTICE-CLOSURE-RED-20261118","AFW-QA-NOTICE-CLOSURE-GREEN-20261118"]'), github.event.head_commit.message) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify native closure and protected recovery
        run: node --test test/mcp-qa-finite-notice-closure.test.mjs test/mcp-qa-finite-cleanup-store.test.mjs test/mcp-qa-finite-trial-guard.test.mjs test/mcp-qa-finite-finalizer.test.mjs test/mcp-own-finite-reduction-native.test.mjs test/mcp-own-finite-entrypoints-native.test.mjs
      - name: Verify staging remains non-publishable
        if: github.event.head_commit.message == 'AFW-QA-NOTICE-CLOSURE-GREEN-20261118'
        run: |
          node scripts/build-finite-native-package.mjs --staging "$GITHUB_SHA"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const x=JSON.parse(readFileSync("output/finite-native-staging/staging.json")); if(x.sourceRevision!==process.env.GITHUB_SHA||x.completePackage!==false||x.operationalReadiness!==false)process.exit(1); console.log(JSON.stringify({revision:x.sourceRevision,completePackage:x.completePackage,operationalReadiness:x.operationalReadiness}));'
