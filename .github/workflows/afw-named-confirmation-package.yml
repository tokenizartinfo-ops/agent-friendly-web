name: AFW named confirmation package only

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/afw-named-confirmation-package.yml'
      - 'scripts/**'
      - 'lib/**'
      - 'worker/**'
      - 'test/mcp-named-confirmation-package.native.mjs'
      - 'test/mcp-private-confirmation-*.test.mjs'
      - 'test/mcp-named-template-snapshot.test.mjs'
      - 'test/fixtures/inert-named-confirmation-policy.mjs'
      - 'test/fixtures/named-confirmation-compile-fault.mjs'
      - 'test/fixtures/named-confirmation-native-rehearsal.mjs'
      - 'test/fixtures/private-template-compile-observation.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: afw-named-confirmation-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: >-
      github.repository == 'tokenizartinfo-ops/agent-friendly-web' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source
    env:
      AFW_PACKAGE_SOURCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      AFW_FROZEN_ARTIFACT_PATH: ${{ github.workspace }}/source/output/mcp-release-confirmation/frozen-artifact.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AFW_PACKAGE_SOURCE }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Read the recorded frozen source pin
        id: frozen
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const p=JSON.parse(readFileSync('scripts/mcp-confirmation-frozen-artifact.json','utf8'));
          assert.match(p.sourceRevision,/^[a-f0-9]{40}$/);
          appendFileSync(process.env.GITHUB_OUTPUT,'revision='+p.sourceRevision+'\n');
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.frozen.outputs.revision }}
          path: frozen
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            frozen/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: frozen
      - name: Verify public named snapshot contract
        run: node --test test/mcp-named-template-snapshot.test.mjs
      - name: Rebuild the historical artifact with its own lockfile
        working-directory: frozen
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,mkdirSync,writeFileSync} from 'node:fs';
          import {dirname} from 'node:path';
          import assert from 'node:assert/strict';
          import {verifyMcpReleaseSource} from './scripts/mcp-release-source.mjs';
          import {buildMcpOwnWorker} from './scripts/build-mcp-own-worker.mjs';
          const pins=JSON.parse(readFileSync('../source/scripts/mcp-confirmation-frozen-artifact.json','utf8'));
          const before=await verifyMcpReleaseSource({cwd:process.cwd(),sourceRevision:pins.sourceRevision});
          assert.equal(before.tree,pins.sourceTree);
          const own=await buildMcpOwnWorker({sourceRevision:pins.sourceRevision});
          const after=await verifyMcpReleaseSource({cwd:process.cwd(),sourceRevision:pins.sourceRevision});
          assert.equal(after.tree,before.tree);
          assert.equal(own.workerHash,pins.workerHash);
          assert.equal(own.programHash,pins.programHash);
          assert.equal(Buffer.byteLength(own.script),pins.workerBytes);
          mkdirSync(dirname(process.env.AFW_FROZEN_ARTIFACT_PATH),{recursive:true});
          writeFileSync(process.env.AFW_FROZEN_ARTIFACT_PATH,JSON.stringify({...own,sourceTree:after.tree,sourceCheck:'git-inputs-before-after-v1'}));
          console.log('Frozen source and exact bytes verified: '+own.workerHash);
          NODE
      - name: Prepare only the expired synthetic fixture
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          import {inertNamedConfirmationPolicy} from './test/fixtures/inert-named-confirmation-policy.mjs';
          const artifact=JSON.parse(readFileSync(process.env.AFW_FROZEN_ARTIFACT_PATH,'utf8'));
          const policy=inertNamedConfirmationPolicy(artifact);
          assert.equal(policy.startAt,0);assert.equal(policy.expiresAt,1);
          writeFileSync('output/mcp-release-confirmation/policy.json',JSON.stringify(policy,null,2)+'\n');
          NODE
      - name: Build the public template without consent data
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          import {verifyMcpReleaseSource} from './scripts/mcp-release-source.mjs';
          import {buildMcpPrivateConfirmationTemplate,materializeMcpPrivateConfirmation} from './scripts/build-mcp-release-operator.mjs';
          import {inertNamedConfirmationPolicy} from './test/fixtures/inert-named-confirmation-policy.mjs';
          const hash=x=>createHash('sha256').update(x).digest('hex'),directory='output/mcp-release-confirmation/';
          const before=await verifyMcpReleaseSource({cwd:process.cwd(),sourceRevision:process.env.AFW_PACKAGE_SOURCE});
          const artifactBytes=readFileSync(process.env.AFW_FROZEN_ARTIFACT_PATH),artifact=JSON.parse(artifactBytes);
          const pins=JSON.parse(readFileSync('scripts/mcp-confirmation-frozen-artifact.json','utf8'));
          const {template,manifest}=await buildMcpPrivateConfirmationTemplate({artifact,policy:inertNamedConfirmationPolicy(artifact)});
          const materializer=readFileSync('lib/mcp-private-confirmation-template.mjs');
          assert.equal(manifest.workerHash,pins.workerHash);assert.equal(manifest.programHash,pins.programHash);
          assert.equal(manifest.artifactKey,pins.artifactKey);assert.equal(manifest.artifactSourceRevision,pins.sourceRevision);assert.equal(manifest.artifactSourceTree,pins.sourceTree);
          assert.equal(manifest.templateHash,hash(template));assert.equal(manifest.templateBytes,Buffer.byteLength(template));
          assert.equal(manifest.materialized,false);assert.equal(manifest.remotePublished,false);
          const fake=await materializeMcpPrivateConfirmation({template,manifest,policyJson:JSON.stringify(inertNamedConfirmationPolicy(artifact)),expectedTemplateHash:manifest.templateHash});
          assert.equal(fake.operatorHash,hash(fake.script));assert.equal(fake.startAt,0);assert.equal(fake.expiresAt,1);assert.equal(fake.remotePublished,false);
          const after=await verifyMcpReleaseSource({cwd:process.cwd(),sourceRevision:process.env.AFW_PACKAGE_SOURCE});assert.equal(after.tree,before.tree);
          assert.equal(after.tree,execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim());
          writeFileSync(directory+'template.mjs',template);
          writeFileSync(directory+'template.json',JSON.stringify(manifest,null,2)+'\n');
          writeFileSync(directory+'materializer.mjs',materializer);
          const receipt={operatorSourceRevision:process.env.AFW_PACKAGE_SOURCE,operatorSourceTree:after.tree,
           templateHash:manifest.templateHash,templateBytes:manifest.templateBytes,materializerHash:hash(materializer),materializerBytes:materializer.length,
           artifactJsonHash:hash(artifactBytes),artifactJsonBytes:artifactBytes.length,artifactSourceRevision:pins.sourceRevision,artifactSourceTree:pins.sourceTree,
           artifactKey:pins.artifactKey,workerHash:pins.workerHash,programHash:pins.programHash,materialized:false,realPolicyAccepted:false,remotePublished:false,invoked:false};
          writeFileSync(directory+'private-template-build.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt));
          NODE
      - name: Qualify exact artifact packaging with native closed Workflow
        run: node --test test/mcp-named-confirmation-package.native.mjs
      - name: Compile the current operator around the frozen artifact
        run: node scripts/build-mcp-named-confirmation.mjs "$AFW_PACKAGE_SOURCE" output/mcp-release-confirmation/frozen-artifact.json output/mcp-release-confirmation/policy.json
      - name: Verify separate provenance and output bytes
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const m=JSON.parse(readFileSync('output/mcp-release-confirmation/build.json','utf8'));
          const pins=JSON.parse(readFileSync('scripts/mcp-confirmation-frozen-artifact.json','utf8'));
          const policy=JSON.parse(readFileSync('output/mcp-release-confirmation/policy.json','utf8'));
          assert.equal(m.operatorSourceRevision,process.env.AFW_PACKAGE_SOURCE);
          assert.equal(m.operatorSourceTree,execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim());
          assert.equal(m.artifactSourceRevision,pins.sourceRevision);assert.equal(m.artifactSourceTree,pins.sourceTree);
          assert.equal(m.workerHash,pins.workerHash);assert.equal(m.programHash,pins.programHash);assert.equal(m.artifactKey,pins.artifactKey);
          assert.equal(m.operatorHash,createHash('sha256').update(readFileSync('output/mcp-release-confirmation/index.mjs')).digest('hex'));
          assert.equal(m.operation,'confirm_named');assert.equal(m.startAt,policy.startAt);assert.equal(m.expiresAt,policy.expiresAt);
          assert.equal(m.remotePublished,false);assert.equal(m.invoked,false);
          if(process.env.GITHUB_EVENT_NAME==='pull_request')assert.equal(m.inertPreparation,true);
          console.log(JSON.stringify(m));
          NODE
      - name: Select only verified public named template outputs
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,readdirSync,mkdirSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          import {createMcpPublicNamedTemplateSnapshot} from './lib/mcp-named-template-public-snapshot.mjs';
          const from='output/mcp-release-confirmation/',to='output/mcp-named-public-template/';
          const names=['template.mjs','materializer.mjs','template.json','private-template-build.json'],files={};
          for(const name of names)files[name]=readFileSync(from+name,'utf8');
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.AFW_PACKAGE_SOURCE);
          const pins=JSON.parse(readFileSync('scripts/mcp-confirmation-frozen-artifact.json'));
          await createMcpPublicNamedTemplateSnapshot({files,expectedOperatorRevision:process.env.AFW_PACKAGE_SOURCE,
           expectedOperatorTree:execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),expectedFrozenArtifact:pins,
           expectedMaterializerHash:createHash('sha256').update(readFileSync('lib/mcp-private-confirmation-template.mjs')).digest('hex')});
          mkdirSync(to,{recursive:true});assert.deepEqual(readdirSync(to),[]);
          for(const name of names)writeFileSync(to+name,files[name]);
          assert.deepEqual(readdirSync(to).sort(),names.sort());
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: afw-named-public-template-${{ env.AFW_PACKAGE_SOURCE }}
          path: source/output/mcp-named-public-template/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: afw-named-confirmation-${{ env.AFW_PACKAGE_SOURCE }}
          path: |
            source/output/mcp-release-confirmation/index.mjs
            source/output/mcp-release-confirmation/build.json
            source/output/mcp-release-confirmation/policy.json
            source/output/mcp-release-confirmation/template.mjs
            source/output/mcp-release-confirmation/template.json
            source/output/mcp-release-confirmation/materializer.mjs
            source/output/mcp-release-confirmation/frozen-artifact.json
            source/output/mcp-release-confirmation/private-template-build.json
          if-no-files-found: error
          retention-days: 7

  preserve:
    needs: package
    if: >-
      github.repository == 'tokenizartinfo-ops/agent-friendly-web' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: afw-named-public-template-${{ github.sha }}
          path: public-package
      - name: Preserve only verified public code in a create-only ref
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            const {readFile,readdir}=await import('node:fs/promises');
            const {createHash}=await import('node:crypto');
            const {pathToFileURL}=await import('node:url');
            const {resolve}=await import('node:path');
            const {createMcpPublicNamedTemplateSnapshot}=await import(pathToFileURL(resolve('lib/mcp-named-template-public-snapshot.mjs')).href);
            const {owner,repo}=context.repo;
            if(owner+'/'+repo!=='tokenizartinfo-ops/agent-friendly-web'||context.eventName!=='workflow_dispatch'||context.ref!=='refs/heads/main')throw Error('Public snapshot unavailable');
            const commit=await github.rest.git.getCommit({owner,repo,commit_sha:context.sha});
            const expected=['materializer.mjs','private-template-build.json','template.json','template.mjs'];
            const found=(await readdir('public-package')).sort();
            if(JSON.stringify(found)!==JSON.stringify(expected))throw Error('Public snapshot unavailable');
            const files={};
            for(const name of expected)files[name]=await readFile('public-package/'+name,'utf8');
            const sourceMaterializer=await readFile('lib/mcp-private-confirmation-template.mjs');
            const pins=JSON.parse(await readFile('scripts/mcp-confirmation-frozen-artifact.json','utf8'));
            const p=await createMcpPublicNamedTemplateSnapshot({files,expectedOperatorRevision:context.sha,expectedOperatorTree:commit.data.tree.sha,expectedFrozenArtifact:pins,
              expectedMaterializerHash:createHash('sha256').update(sourceMaterializer).digest('hex')});
            const made=await github.rest.git.createTree({owner,repo,tree:p.entries.map(({path,mode,type,content})=>({path,mode,type,content}))});
            if(made.data.truncated||made.data.tree.length!==p.entries.length)throw Error('Public snapshot unavailable');
            const actual=new Map(made.data.tree.map(e=>[e.path,e]));
            if(p.entries.some(e=>{const a=actual.get(e.path);return !a||a.sha!==e.sha||a.mode!==e.mode||a.type!==e.type;}))throw Error('Public snapshot unavailable');
            let current;
            try{current=await github.rest.git.getRef({owner,repo,ref:p.ref.slice(5)});}catch(e){if(e.status!==404)throw Error('Public snapshot lookup unavailable');}
            if(current){
              const existing=await github.rest.git.getCommit({owner,repo,commit_sha:current.data.object.sha});
              if(existing.data.tree.sha!==made.data.sha)throw Error('Existing public snapshot differs; overwrite denied');
              core.info(JSON.stringify({sourceRevision:context.sha,tree:made.data.sha,ref:p.ref,created:false,reconciled:true,runtimePublished:false,operationalReadiness:false}));
            }else{
              const snapshot=await github.rest.git.createCommit({owner,repo,message:'Preserve public named confirmation template '+context.sha,tree:made.data.sha,parents:[]});
              await github.rest.git.createRef({owner,repo,ref:p.ref,sha:snapshot.data.sha});
              core.info(JSON.stringify({sourceRevision:context.sha,tree:made.data.sha,commit:snapshot.data.sha,ref:p.ref,created:true,reconciled:false,runtimePublished:false,operationalReadiness:false}));
            }
