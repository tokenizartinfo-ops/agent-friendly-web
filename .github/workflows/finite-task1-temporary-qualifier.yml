# Branch-only C2-B2a source qualifier; EXCLUDE from eventual integration.
name: Finite initial inactive upload temporary qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['lib/mcp-qa-finite-initial-*.mjs', 'lib/mcp-qa-finite-historical-source.mjs', 'test/mcp-qa-finite-initial-*.test.mjs', 'test/mcp-qa-finite-historical-source-native.test.mjs', 'test/fixtures/finite-initial-*.mjs', '.github/workflows/finite-task1-temporary-qualifier.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Shared historical boundary native baseline and regression
        run: |
          node --test test/mcp-qa-finite-historical-source-native.test.mjs
          node --test --test-name-pattern='actual native winner|private backup|fresh pre-send|wrong-uploaded-module' test/mcp-qa-finite-initial-upload-native.test.mjs
      - name: Scoped lint
        if: always()
        run: npx eslint lib/mcp-qa-finite-historical-source.mjs test/mcp-qa-finite-historical-source-native.test.mjs
