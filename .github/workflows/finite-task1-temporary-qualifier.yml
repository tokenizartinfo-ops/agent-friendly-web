# Branch-only C2-B1 initial native entry source qualifier; EXCLUDE from eventual integration.
name: Finite C2-B1 initial native entry temporary qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['lib/mcp-qa-finite-initial-*.mjs', 'test/mcp-qa-finite-initial-*.test.mjs', 'test/fixtures/finite-initial-*.mjs', 'worker/independent-closure/finite.mjs', '.github/workflows/finite-task1-temporary-qualifier.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: C2-B1 fix round 1 native method prerequisites
        run: node --test test/mcp-qa-finite-initial-entry-native.test.mjs
      - name: Scoped lint
        if: always()
        run: npx eslint lib/mcp-qa-finite-initial-entry.mjs test/mcp-qa-finite-initial-entry-native.test.mjs test/fixtures/finite-initial-entry-world.mjs
