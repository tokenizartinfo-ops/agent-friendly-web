# Branch-only T5-B2-AB source qualifier; EXCLUDE from eventual integration.
name: Finite T5-B2-AB fix1 temporary source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['test/mcp-qa-finite-historical-source-native.test.mjs', '.github/workflows/finite-task1-temporary-qualifier.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: B2-AB actual private native historical reader
        run: node --test test/mcp-qa-finite-historical-source-native.test.mjs
      - name: Scoped lint
        if: always()
        run: npx eslint test/mcp-qa-finite-historical-source-native.test.mjs
