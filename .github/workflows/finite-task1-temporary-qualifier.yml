# Branch-only Task4 source qualifier; EXCLUDE from eventual integration.
name: Finite C2 Task4 temporary source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['lib/mcp-qa-finite-policy-setup*.mjs', 'lib/mcp-qa-finite-policy-transport.mjs', 'lib/mcp-qa-finite-owner-preparation.mjs', 'lib/mcp-qa-finite-preparation-store.mjs', 'worker/independent-closure/finite.mjs', 'test/mcp-qa-finite-policy-setup-native.test.mjs', 'test/mcp-qa-finite-preparation-store-native.test.mjs', 'test/fixtures/finite-policy-setup*.mjs', '.github/workflows/finite-task1-temporary-qualifier.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Task4 setup and affected contracts
        run: node --test test/mcp-qa-finite-policy-setup-native.test.mjs test/mcp-qa-finite-seed-http.test.mjs test/mcp-qa-finite-publication-bridge.test.mjs test/mcp-qa-finite-trial-control-native.test.mjs test/mcp-qa-finite-preparation-store-native.test.mjs
      - name: Shared transport and owner regression
        run: node --test test/mcp-qa-finite-policy-transport.test.mjs test/mcp-qa-finite-owner-preparation-native.test.mjs
      - name: Scoped changed-source lint
        if: always()
        run: npx eslint lib/mcp-qa-finite-policy-setup.mjs lib/mcp-qa-finite-policy-setup-source.mjs lib/mcp-qa-finite-policy-transport.mjs lib/mcp-qa-finite-owner-preparation.mjs lib/mcp-qa-finite-preparation-store.mjs worker/independent-closure/finite.mjs test/mcp-qa-finite-policy-setup-native.test.mjs test/fixtures/finite-policy-setup-worker.mjs test/fixtures/finite-policy-setup-native.mjs
