# Branch-only C1 source qualifier; EXCLUDE from eventual integration.
name: Finite PRE-T0 QA provenance temporary source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['lib/mcp-qa-finite-bootstrap-*.mjs', 'scripts/run-qa-finite-bootstrap.mjs', 'scripts/build-finite-native-package.mjs', 'worker/independent-closure/finite.mjs', 'test/*finite-bootstrap*.mjs', 'test/fixtures/*finite-bootstrap*.mjs', '.github/workflows/afw-finite-qa-bootstrap.yml', '.github/workflows/finite-task1-temporary-qualifier.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Actual new bootstrap behavior
        run: node --test test/*finite-bootstrap*.mjs
      - name: Actual compiler and affected profile regressions
        run: node --test test/build-finite-native-package.test.mjs test/mcp-qa-finite-profile.test.mjs test/mcp-qa-finite-candidate-residency.test.mjs
      - name: Scoped lint
        if: always()
        run: npx eslint lib/mcp-qa-finite-bootstrap-*.mjs scripts/run-qa-finite-bootstrap.mjs scripts/build-finite-native-package.mjs worker/independent-closure/finite.mjs test/*finite-bootstrap*.mjs test/fixtures/finite-bootstrap-world.mjs
