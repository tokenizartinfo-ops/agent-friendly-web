name: Finite Task4 temporary source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Task4 finite receiver contracts
        run: node --test --test-reporter=spec test/mcp-own-finite-entrypoints.test.mjs test/mcp-own-finite-entrypoints-native.test.mjs test/mcp-own-worker-native.test.mjs test/mcp-own-worker-historical-close.test.mjs
      - name: Scoped lint
        if: always()
        run: npx eslint worker/mcp-own/index.mjs test/mcp-own-finite-entrypoints.test.mjs test/mcp-own-finite-entrypoints-native.test.mjs
