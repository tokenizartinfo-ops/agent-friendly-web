name: Finite material Task3 temporary source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Task3 actual transports and affected native paths
        run: node --test test/mcp-qa-finite-seed.test.mjs test/mcp-qa-finite-seed-http.test.mjs test/mcp-qa-finite-custody.test.mjs test/mcp-qa-finite-http.test.mjs test/mcp-qa-finite-cf-http.test.mjs test/mcp-qa-finite-command.test.mjs test/mcp-qa-finite-observer.test.mjs test/mcp-qa-finite-observer-native.test.mjs test/mcp-qa-finite-read-rpc-native.test.mjs test/mcp-qa-finite-finalizer.test.mjs test/mcp-qa-finite-trial-control-native.test.mjs test/mcp-qa-finite-package.test.mjs test/mcp-qa-finite-seed-issuer.test.mjs test/mcp-qa-finite-publication-bridge.test.mjs
      - name: Task3 scoped lint
        if: always()
        run: npx eslint lib/mcp-qa-finite-seed.mjs lib/mcp-qa-finite-source-authority.mjs lib/mcp-qa-finite-custody.mjs lib/mcp-qa-finite-seed-wire.mjs lib/mcp-qa-finite-seed-primary.mjs lib/mcp-qa-finite-seed-http.mjs lib/mcp-qa-finite-publication.mjs lib/mcp-qa-finite-seed-issuer.mjs lib/mcp-qa-finite-publication-bridge.mjs lib/mcp-qa-finite-http.mjs lib/mcp-qa-finite-external-contract.mjs scripts/run-qa-finite-trial-finalizer.mjs test/fixtures/finite-seed-primary.mjs test/mcp-qa-finite-seed-http.test.mjs test/mcp-qa-finite-custody.test.mjs test/fixtures/finite-github.mjs test/fixtures/finite-cf-http.mjs test/mcp-qa-finite-cf-http.test.mjs test/fixtures/finite-finalizer.mjs test/fixtures/finite-seed-world.mjs test/mcp-qa-finite-seed-issuer.test.mjs test/mcp-qa-finite-publication-bridge.test.mjs test/fixtures/finite-http-module.mjs test/mcp-qa-finite-command.test.mjs
