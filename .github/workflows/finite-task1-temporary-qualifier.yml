# Branch-only fixed factual owner reader TDD qualifier. EXCLUDE before main.
name: Finite initial owner source temporary qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['lib/mcp-qa-finite-initial-owner-source.mjs','test/mcp-qa-finite-initial-owner-source-native.test.mjs','.github/workflows/finite-task1-temporary-qualifier.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/mcp-qa-finite-initial-owner-source-records.test.mjs test/mcp-qa-finite-initial-owner-source-native.test.mjs test/mcp-qa-finite-initial-capsule-records.test.mjs test/mcp-qa-finite-initial-capsule-native.test.mjs test/mcp-qa-finite-initial-cleanup-native.test.mjs test/mcp-qa-finite-initial-entry-native.test.mjs test/mcp-qa-finite-initial-scope.test.mjs test/mcp-qa-finite-initial-custody-probe-native.test.mjs test/mcp-qa-finite-pre-entry-host-native.test.mjs
      - name: Scoped lint
        if: always()
        run: npx eslint lib/mcp-qa-finite-initial-owner-source.mjs test/mcp-qa-finite-initial-owner-source-*.test.mjs test/fixtures/finite-initial-entry-world.mjs
      - name: Fixed source artifact hashes
        run: |
          wc -c lib/mcp-qa-finite-initial-owner-source.mjs test/mcp-qa-finite-initial-owner-source-*.test.mjs test/fixtures/finite-initial-entry-world.mjs
          sha256sum lib/mcp-qa-finite-initial-owner-source.mjs test/mcp-qa-finite-initial-owner-source-*.test.mjs test/fixtures/finite-initial-entry-world.mjs
