# Branch-only C1 fix1 source qualifier; EXCLUDE from eventual integration.
name: Finite PRE-T0 QA provenance fix1 temporary qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['lib/mcp-qa-finite-bootstrap-primary.mjs', 'test/mcp-qa-finite-bootstrap-issuer.test.mjs', 'test/mcp-qa-finite-bootstrap-primary.test.mjs', '.github/workflows/finite-task1-temporary-qualifier.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: C1 fix1 actual issuer and affected primary
        run: node --test test/mcp-qa-finite-bootstrap-issuer.test.mjs test/mcp-qa-finite-bootstrap-primary.test.mjs
      - name: Scoped lint
        if: always()
        run: npx eslint lib/mcp-qa-finite-bootstrap-primary.mjs test/mcp-qa-finite-bootstrap-issuer.test.mjs test/mcp-qa-finite-bootstrap-primary.test.mjs
