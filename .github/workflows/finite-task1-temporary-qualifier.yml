name: Finite Native5 Task3 temporary source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['lib/**', 'worker/**', 'scripts/**', 'test/**', '.github/workflows/finite-task1-temporary-qualifier.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native5 Task3 focused RED GREEN
        run: node --test test/mcp-qa-finite-adoption-wait.test.mjs test/mcp-qa-finite-launcher-native.test.mjs test/mcp-qa-finite-confirmation-native.test.mjs test/mcp-qa-finite-launch-inventory-native.test.mjs test/mcp-release-known-cancellation.test.mjs test/mcp-qa-finite-observer-native.test.mjs test/mcp-qa-finite-read-rpc-native.test.mjs
      - name: Affected finite consumers
        if: always()
        run: node --test test/mcp-qa-finite-command.test.mjs test/mcp-qa-finite-cf-http.test.mjs test/mcp-qa-finite-canary-restorer.test.mjs test/mcp-qa-finite-phase-inventory.test.mjs test/mcp-qa-finite-profile-native.test.mjs
      - name: Native5 scoped lint
        if: always()
        run: npx eslint lib/mcp-qa-finite-launcher.mjs lib/mcp-qa-finite-adoption.mjs lib/mcp-qa-finite-adoption-source.mjs scripts/run-qa-finite-trial-finalizer.mjs test/mcp-qa-finite-adoption-wait.test.mjs lib/mcp-qa-finite-trial-control.mjs lib/mcp-qa-finite-confirmation-source.mjs lib/mcp-qa-finite-confirmation.mjs worker/independent-closure/finite.mjs lib/mcp-fixed-terminal-workflows.mjs lib/mcp-qa-finite-canary-restorer.mjs test/fixtures/finite-restoration.mjs lib/mcp-qa-finite-http.mjs test/mcp-qa-finite-confirmation-native.test.mjs test/mcp-qa-finite-canary-restorer.test.mjs test/mcp-qa-finite-cf-http.test.mjs test/mcp-qa-finite-launcher-native.test.mjs test/fixtures/finite-cf-http.mjs test/mcp-qa-finite-command.test.mjs test/fixtures/finite-http-module.mjs
