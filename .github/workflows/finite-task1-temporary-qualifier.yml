# Branch-only Task3 qualifier; EXCLUDE from eventual integration.
name: Finite C2 Task3 temporary source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['lib/mcp-qa-finite-preparation-records.mjs', 'lib/mcp-qa-finite-preparation-store.mjs', 'test/mcp-qa-finite-owner-preparation-native.test.mjs', 'lib/mcp-qa-finite-profile.mjs', 'wrangler.mcp-own.finite.jsonc', 'test/mcp-qa-finite-profile.test.mjs', '.github/workflows/finite-task1-temporary-qualifier.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Task3 existing Container source preservation
        run: node --test test/mcp-qa-finite-profile.test.mjs test/mcp-qa-finite-profile-native.test.mjs test/build-finite-native-package.test.mjs
      - name: Task3 stage approval original native owner path
        run: node --test test/mcp-qa-finite-owner-preparation-native.test.mjs test/mcp-qa-finite-preparation-records.test.mjs test/mcp-qa-finite-preparation-store-native.test.mjs test/mcp-qa-finite-policy-journal-native.test.mjs
      - name: Scoped lint
        if: always()
        run: npx eslint lib/mcp-qa-finite-profile.mjs lib/mcp-qa-finite-preparation-records.mjs lib/mcp-qa-finite-preparation-store.mjs test/mcp-qa-finite-profile.test.mjs test/mcp-qa-finite-owner-preparation-native.test.mjs
      - name: Generated finite byte dry-run without provider or Container build
        run: |
          node --input-type=module <<'NODE'
          import {compileFiniteNativeStaging} from './scripts/build-finite-native-package.mjs';
          import {finiteWranglerProfileTemplate} from './lib/mcp-qa-finite-profile.mjs';
          import {mkdir,writeFile} from 'node:fs/promises';
          import {resolve} from 'node:path';
          const r=await compileFiniteNativeStaging({cwd:process.cwd(),sourceRevision:process.env.GITHUB_SHA});
          await mkdir('output/task3-profile',{recursive:true});
          for(const role of ['qaLive','canaryLive']){
            const p=structuredClone(finiteWranglerProfileTemplate(role));
            await writeFile('output/task3-profile/'+role+'.mjs',r.files[role+'/index.mjs']);
            p.main=resolve('output/task3-profile/'+role+'.mjs');
            await writeFile('output/task3-profile/'+role+'.json',JSON.stringify(p));
          }
          console.log(JSON.stringify({sourceRevision:r.sourceRevision,publicStatic:Object.fromEntries(Object.entries(r.modules).map(([k,v])=>[k,v.publicStatic])),completePackage:false,operationalReadiness:false}));
          NODE
          npx wrangler deploy --config output/task3-profile/canaryLive.json --dry-run --no-bundle --outdir output/task3-profile/dry-canary
          npx wrangler deploy --config output/task3-profile/qaLive.json --dry-run --no-bundle --outdir output/task3-profile/dry-qa
