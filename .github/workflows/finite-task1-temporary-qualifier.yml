# Branch-only T5-B2-AB source qualifier; EXCLUDE from eventual integration.
name: Finite T5-B2-AB temporary source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['lib/mcp-qa-finite-historical-source.mjs', 'lib/dossier-event-policy-data.mjs', 'lib/dossier-event-rpc-authority.mjs', 'lib/mcp-own-retirement-host.mjs', 'test/mcp-qa-finite-historical-source-native.test.mjs', '.github/workflows/finite-task1-temporary-qualifier.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: B2-AB actual private native historical reader
        run: node --test test/mcp-qa-finite-historical-source-native.test.mjs
      - name: Scoped historical and metadata regressions
        run: node --test test/mcp-qa-original-pins.test.mjs test/mcp-qa-historical-identity.test.mjs test/mcp-qa-legacy-predecessor.test.mjs test/mcp-qa-cloud-closed-http.test.mjs test/mcp-release-known-cancellation.test.mjs test/dossier-event-rpc-authority.test.mjs test/mcp-successor-retirement-host.test.mjs test/mcp-qa-original-pins-native.test.mjs test/mcp-qa-historical-identity-native.test.mjs
      - name: Affected B1 compiler and native decoder graph measurement
        run: node --test test/mcp-qa-finite-candidate-residency.test.mjs test/build-finite-native-package.test.mjs
      - name: Scoped lint
        if: always()
        run: npx eslint lib/mcp-qa-finite-historical-source.mjs lib/dossier-event-policy-data.mjs lib/dossier-event-rpc-authority.mjs lib/mcp-own-retirement-host.mjs test/mcp-qa-finite-historical-source-native.test.mjs
