# Branch-only Task3 qualifier; EXCLUDE from eventual integration.
name: Finite C2 Task3 temporary source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['test/mcp-qa-finite-policy-journal-native.test.mjs', '.github/workflows/finite-task1-temporary-qualifier.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect pinned native namespace persistence schema
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          for(const path of ['node_modules/miniflare/dist/src/index.d.ts','node_modules/miniflare/dist/src/index.js']){
            const code=await readFile(path,'utf8');
            for(const word of ['isolatedResourcePersistencePath','ephemeral local storage','namespaceKey =','uniqueKey','localPersistence']){
              let at=code.indexOf(word),count=0;
              while(at>=0&&count++<5){console.log(path+' '+word+': '+code.slice(Math.max(0,at-500),at+700));at=code.indexOf(word,at+word.length);}
            }
          }
          NODE
      - name: Native journal actual runtime restart
        run: node --test test/mcp-qa-finite-policy-journal-native.test.mjs
      - name: Scoped fixture lint
        if: always()
        run: npx eslint test/mcp-qa-finite-policy-journal-native.test.mjs test/mcp-qa-finite-policy-transport.test.mjs test/fixtures/finite-transport-native.mjs
