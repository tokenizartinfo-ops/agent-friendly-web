# Branch-only owner request retention TDD qualifier. EXCLUDE before main.
name: Finite owner request retention temporary qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/mcp-qa-finite-owner-request-retention.test.mjs test/mcp-qa-finite-owner-request-retention-native.test.mjs test/mcp-qa-finite-owner-preparation-native.test.mjs test/mcp-qa-finite-initial-owner-source-native.test.mjs test/build-finite-native-package.test.mjs
      - name: Scoped lint
        if: always()
        run: npx eslint lib/mcp-qa-finite-stage-work.mjs lib/mcp-qa-finite-owner-{preparation,http}.mjs lib/mcp-qa-finite-policy-transport.mjs lib/mcp-qa-finite-initial-owner-source.mjs test/mcp-qa-finite-owner-request-retention*.test.mjs test/mcp-qa-finite-initial-owner-source-native.test.mjs test/fixtures/finite-{owner*,connection-worker,initial-entry-world}.mjs
      - name: Fixed source artifact hashes
        run: |
          wc -c lib/mcp-qa-finite-{stage-work,owner-preparation,owner-http,policy-transport,initial-owner-source}.mjs
          sha256sum lib/mcp-qa-finite-{stage-work,owner-preparation,owner-http,policy-transport,initial-owner-source}.mjs test/mcp-qa-finite-owner-request-retention*.test.mjs
