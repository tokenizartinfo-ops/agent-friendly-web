# Branch-only source qualifier; EXCLUDE from eventual integration.
name: Finite C2 Task2 temporary source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['lib/mcp-qa-finite-owner-*.mjs', 'lib/mcp-qa-finite-preparation-*.mjs', 'lib/delegated-oauth-worker.mjs', 'lib/dossier-monitoring-owner-http.mjs', 'test/mcp-qa-finite-owner-preparation-native.test.mjs', 'test/delegated-oauth-flow.test.mjs', 'test/fixtures/finite-owner-*.mjs', '.github/workflows/finite-task1-temporary-qualifier.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Task2 native behavioral RED GREEN
        run: node --test test/mcp-qa-finite-owner-preparation-native.test.mjs
      - name: Existing affected OAuth monitoring identity and records storage
        if: always()
        run: node --test test/cloudflare-access-identity-expiry.test.mjs test/delegated-oauth-flow.test.mjs test/dossier-monitoring-oauth-native.test.mjs test/dossier-monitoring-owner-native.test.mjs test/mcp-qa-finite-preparation-records.test.mjs test/mcp-qa-finite-preparation-store-native.test.mjs
      - name: Scoped lint
        if: always()
        run: npx eslint lib/mcp-qa-finite-owner-source.mjs lib/mcp-qa-finite-owner-preparation.mjs lib/mcp-qa-finite-owner-http.mjs test/fixtures/finite-owner-source.mjs test/fixtures/finite-owner-worker.mjs test/mcp-qa-finite-owner-preparation-native.test.mjs lib/mcp-qa-finite-preparation-records.mjs lib/mcp-qa-finite-preparation-store.mjs lib/delegated-oauth-worker.mjs lib/dossier-monitoring-owner-http.mjs test/delegated-oauth-flow.test.mjs
