name: Finite Native5 Task1 temporary source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native5 Task1 focused RED GREEN
        run: node --test test/mcp-qa-finite-launch-records.test.mjs test/mcp-qa-finite-launch-inventory-native.test.mjs test/mcp-qa-finite-trial-control-native.test.mjs
      - name: Affected control phase and external fixtures
        if: always()
        run: node --test test/mcp-qa-finite-trial-control.test.mjs test/mcp-qa-finite-phase-inventory.test.mjs test/mcp-qa-finite-finalizer.test.mjs test/mcp-qa-finite-http.test.mjs test/mcp-qa-finite-trial-guard.test.mjs
      - name: Native5 scoped lint
        if: always()
        run: npx eslint lib/mcp-qa-finite-launch-records.mjs lib/mcp-qa-finite-launch-inventory.mjs lib/mcp-qa-finite-launch-source.mjs lib/mcp-qa-finite-trial-control.mjs lib/mcp-qa-finite-external-contract.mjs lib/mcp-finite-evidence.mjs lib/mcp-fixed-terminal-workflows.mjs test/mcp-qa-finite-launch-records.test.mjs test/mcp-qa-finite-launch-inventory-native.test.mjs test/fixtures/finite-launch-native.mjs test/fixtures/finite-finalizer.mjs test/fixtures/qa-finite-trial.mjs test/mcp-qa-finite-trial-control.test.mjs
