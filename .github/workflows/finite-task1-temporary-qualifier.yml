name: Finite Task3 round1 temporary source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Task3 round1 covering contracts
        run: node --test --test-reporter=spec test/mcp-qa-finite-finalizer.test.mjs test/mcp-qa-finite-http.test.mjs test/mcp-qa-finite-cf-http.test.mjs test/mcp-qa-finite-command.test.mjs
      - name: Scoped lint
        if: always()
        run: npx eslint lib/mcp-qa-finite-http.mjs lib/mcp-qa-finite-trial-finalizer.mjs scripts/run-qa-finite-trial-finalizer.mjs test/mcp-qa-finite-http.test.mjs test/fixtures/finite-github.mjs
