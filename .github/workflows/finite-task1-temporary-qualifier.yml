# Branch-only T5-B1 source qualifier; EXCLUDE from eventual integration.
name: Finite T5-B1 temporary source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['scripts/build-finite-native-package.mjs', 'lib/mcp-qa-finite-candidate-residency.mjs', 'worker/independent-closure/finite.mjs', 'test/mcp-qa-finite-candidate-residency.test.mjs', 'test/build-finite-native-package.test.mjs', '.github/workflows/finite-task1-temporary-qualifier.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: B1 actual compiler and private native decoder
        run: node --test test/mcp-qa-finite-candidate-residency.test.mjs test/build-finite-native-package.test.mjs
      - name: Existing source profile and native closed entrypoints
        run: node --test test/mcp-qa-finite-profile-native.test.mjs test/mcp-qa-finite-profile.test.mjs
      - name: Scoped changed-source lint
        if: always()
        run: npx eslint lib/mcp-qa-finite-candidate-residency.mjs scripts/build-finite-native-package.mjs worker/independent-closure/finite.mjs test/mcp-qa-finite-candidate-residency.test.mjs
