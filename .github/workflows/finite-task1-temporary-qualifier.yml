# Branch-only fix qualifier; EXCLUDE from eventual integration.
name: Finite C2 Task2 round1 temporary source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['lib/mcp-qa-finite-owner-preparation.mjs', 'test/mcp-qa-finite-owner-preparation-native.test.mjs', 'test/fixtures/finite-owner-worker.mjs', '.github/workflows/finite-task1-temporary-qualifier.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Task2 round1 child and original OAuth monitoring leases
        run: node --test test/mcp-qa-finite-owner-preparation-native.test.mjs test/delegated-oauth-flow.test.mjs test/dossier-monitoring-oauth-native.test.mjs
      - name: Round1 scoped lint
        if: always()
        run: npx eslint lib/mcp-qa-finite-owner-preparation.mjs test/mcp-qa-finite-owner-preparation-native.test.mjs test/fixtures/finite-owner-worker.mjs
