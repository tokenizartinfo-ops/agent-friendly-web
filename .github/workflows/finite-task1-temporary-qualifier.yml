# Branch-only C3 source qualifier; EXCLUDE from eventual integration.
name: Finite C3 premature admission temporary qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['lib/mcp-own-finite-primary.mjs', 'lib/mcp-own-finite-admission-gate.mjs', 'lib/mcp-own-finite-cleanup-host.mjs', 'lib/mcp-own-durable-host.mjs', 'lib/mcp-node-process-custody.mjs', 'test/mcp-own-finite-premature-admission-native.test.mjs', 'test/fixtures/finite-premature-admission-*.mjs', 'test/mcp-node-process-custody.test.mjs', '.github/workflows/finite-task1-temporary-qualifier.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: C3 causal native regressions
        run: node --test test/mcp-own-finite-premature-admission-native.test.mjs test/mcp-node-process-custody.test.mjs
      - name: Final actual compiler and candidate residency
        run: node --test test/mcp-qa-finite-candidate-residency.test.mjs
      - name: Scoped lint
        if: always()
        run: npx eslint lib/mcp-own-finite-primary.mjs lib/mcp-own-finite-admission-gate.mjs lib/mcp-own-finite-cleanup-host.mjs lib/mcp-own-durable-host.mjs lib/mcp-node-process-custody.mjs test/mcp-own-finite-premature-admission-native.test.mjs test/fixtures/finite-premature-admission-worker.mjs test/fixtures/finite-premature-admission-native.mjs test/mcp-node-process-custody.test.mjs
