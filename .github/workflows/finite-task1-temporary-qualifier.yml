name: Finite Task2 temporary source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Task2 focused RED GREEN
        run: node --test --test-reporter=spec test/mcp-own-finite-admission-gate.test.mjs test/mcp-finite-nominal-control.test.mjs
      - name: Discriminated finite proof
        run: node --test --test-reporter=spec test/mcp-own-finite-cleanup-proof.test.mjs
      - name: Retained proof and finite alarm
        run: node --test --test-reporter=spec test/mcp-qa-finite-cleanup-store.test.mjs test/mcp-qa-finite-trial-guard.test.mjs test/mcp-finite-cleanup-readiness.test.mjs
      - name: Finite native writer and proof fixture
        run: node --test --test-reporter=spec test/mcp-own-finite-cleanup-native.test.mjs test/mcp-own-finite-reduction-native.test.mjs
      - name: Finite exact canary restoration
        run: node --test --test-reporter=spec test/mcp-qa-finite-canary-restorer.test.mjs
      - name: Actual finite writer hooks
        run: node --test --test-reporter=spec test/mcp-node-process-custody.test.mjs test/mcp-successor-launch-gate.test.mjs test/mcp-successor-reservation.test.mjs
      - name: Task1 focused RED GREEN
        run: node --test --test-reporter=spec test/mcp-qa-finite-trial-control.test.mjs
      - name: Task1 native persistence
        if: ${{ hashFiles('test/mcp-qa-finite-trial-control-native.test.mjs') != '' }}
        run: node --test --test-reporter=spec test/mcp-qa-finite-trial-control-native.test.mjs
      - name: Nearby strict ledger and execution pin
        run: node --test --test-reporter=spec test/mcp-qa-generation-ledger.test.mjs test/mcp-qa-execution-identity.test.mjs test/mcp-own-synthetic-save.test.mjs
      - name: Nearby native and legacy restoration
        run: node --test --test-reporter=spec test/mcp-canary-restoration-transport.test.mjs test/mcp-successor-canary-restorer.test.mjs test/mcp-successor-canary-restorer-native.test.mjs test/mcp-own-worker-native.test.mjs test/mcp-own-worker-build.test.mjs test/mcp-own-worker-historical-close.test.mjs test/mcp-own-closed-rollback-native.test.mjs test/mcp-own-permissions-only-reduction-native.test.mjs test/mcp-invocation-storage-native.test.mjs test/mcp-known-cancellation-native.test.mjs
      - name: Scoped lint
        if: ${{ hashFiles('lib/mcp-qa-finite-trial-control.mjs') != '' }}
        run: npx eslint lib/mcp-*finite*.mjs lib/mcp-node-process-custody.mjs lib/mcp-own-permission-withdrawal.mjs lib/mcp-successor-launch-gate.mjs lib/mcp-successor-reservation.mjs lib/mcp-release-successor-reservation.mjs lib/mcp-own-durable-host.mjs lib/mcp-fixed-terminal-workflows.mjs lib/mcp-canary-restoration-transport.mjs worker/mcp-own/index.mjs worker/independent-closure/index.mjs test/*finite*.test.mjs test/fixtures/*finite*.mjs
