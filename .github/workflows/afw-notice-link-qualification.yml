name: AFW NoticeLink qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths:
      - lib/mcp-qa-finite-owner-phase-context.mjs
      - test/fixtures/finite-owner-notice-get.mjs
      - test/mcp-qa-finite-owner-notice-link-native.test.mjs
      - test/mcp-qa-finite-owner-notice-consent-native.test.mjs
      - .github/workflows/afw-notice-link-qualification.yml
permissions:
  contents: read
jobs:
  link-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AFW_NOTICE_BUNDLE_CAPTURE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fixed native qualification
        shell: bash
        run: |
          set +e
          qualification_status=0
          show_tap() {
            node --input-type=module - "$1" <<'NODE'
          import {readFileSync} from 'node:fs';
          for(const line of readFileSync(process.argv[2],'utf8').split('\n')){
            const marker='# NOTICE actual principal costs ';
            if(line.startsWith(marker)){const d=JSON.parse(line.slice(marker.length));console.log(marker+JSON.stringify({...d,traceCount:d.trace?.length,trace:undefined,queryCount:d.queries?.length,queries:undefined,noticeListCount:d.noticeLists?.length,noticeLists:undefined}));}
            else console.log(line);
          }
          NODE
          }
          check_count() {
            node --input-type=module - "$1" "$2" <<'NODE'
          import {readFileSync} from 'node:fs';
          const text=readFileSync(process.argv[2],'utf8'),count=Number(/^# tests (\d+)$/m.exec(text)?.[1]);console.log('QUALIFICATION selected count',count,'expected',process.argv[3]);if(count!==Number(process.argv[3]))process.exitCode=1;
          NODE
          }
          node --test test/mcp-qa-finite-owner-notice-link-native.test.mjs > "$RUNNER_TEMP/link.tap" 2>&1
          group_status=$?
          show_tap "$RUNNER_TEMP/link.tap"
          check_count "$RUNNER_TEMP/link.tap" 31
          count_status=$?
          if [ "$group_status" -ne 0 ] || [ "$count_status" -ne 0 ]; then qualification_status=1; fi
          exit "$qualification_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afw-notice-link-link-native
          path: |
            ${{ runner.temp }}/*.tap
            ${{ runner.temp }}/lint.txt
            ${{ runner.temp }}/afw-notice-get-bundles/*.json
          retention-days: 7
  post-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AFW_NOTICE_BUNDLE_CAPTURE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fixed native qualification
        shell: bash
        run: |
          set +e
          qualification_status=0
          show_tap() {
            node --input-type=module - "$1" <<'NODE'
          import {readFileSync} from 'node:fs';
          for(const line of readFileSync(process.argv[2],'utf8').split('\n')){
            const marker='# NOTICE actual principal costs ';
            if(line.startsWith(marker)){const d=JSON.parse(line.slice(marker.length));console.log(marker+JSON.stringify({...d,traceCount:d.trace?.length,trace:undefined,queryCount:d.queries?.length,queries:undefined,noticeListCount:d.noticeLists?.length,noticeLists:undefined}));}
            else console.log(line);
          }
          NODE
          }
          check_count() {
            node --input-type=module - "$1" "$2" <<'NODE'
          import {readFileSync} from 'node:fs';
          const text=readFileSync(process.argv[2],'utf8'),count=Number(/^# tests (\d+)$/m.exec(text)?.[1]);console.log('QUALIFICATION selected count',count,'expected',process.argv[3]);if(count!==Number(process.argv[3]))process.exitCode=1;
          NODE
          }
          node --test test/mcp-qa-finite-owner-notice-consent-native.test.mjs > "$RUNNER_TEMP/post.tap" 2>&1
          group_status=$?
          show_tap "$RUNNER_TEMP/post.tap"
          check_count "$RUNNER_TEMP/post.tap" 50
          count_status=$?
          if [ "$group_status" -ne 0 ] || [ "$count_status" -ne 0 ]; then qualification_status=1; fi
          exit "$qualification_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afw-notice-link-post-native
          path: |
            ${{ runner.temp }}/*.tap
            ${{ runner.temp }}/lint.txt
            ${{ runner.temp }}/afw-notice-get-bundles/*.json
          retention-days: 7
  get-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AFW_NOTICE_BUNDLE_CAPTURE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fixed native qualification
        shell: bash
        run: |
          set +e
          qualification_status=0
          show_tap() {
            node --input-type=module - "$1" <<'NODE'
          import {readFileSync} from 'node:fs';
          for(const line of readFileSync(process.argv[2],'utf8').split('\n')){
            const marker='# NOTICE actual principal costs ';
            if(line.startsWith(marker)){const d=JSON.parse(line.slice(marker.length));console.log(marker+JSON.stringify({...d,traceCount:d.trace?.length,trace:undefined,queryCount:d.queries?.length,queries:undefined,noticeListCount:d.noticeLists?.length,noticeLists:undefined}));}
            else console.log(line);
          }
          NODE
          }
          check_count() {
            node --input-type=module - "$1" "$2" <<'NODE'
          import {readFileSync} from 'node:fs';
          const text=readFileSync(process.argv[2],'utf8'),count=Number(/^# tests (\d+)$/m.exec(text)?.[1]);console.log('QUALIFICATION selected count',count,'expected',process.argv[3]);if(count!==Number(process.argv[3]))process.exitCode=1;
          NODE
          }
          node --test test/mcp-qa-finite-owner-notice-get-native.test.mjs > "$RUNNER_TEMP/get.tap" 2>&1
          group_status=$?
          show_tap "$RUNNER_TEMP/get.tap"
          check_count "$RUNNER_TEMP/get.tap" 37
          count_status=$?
          if [ "$group_status" -ne 0 ] || [ "$count_status" -ne 0 ]; then qualification_status=1; fi
          node --test test/mcp-qa-finite-owner-phase-context.test.mjs > "$RUNNER_TEMP/pure.tap" 2>&1
          group_status=$?
          show_tap "$RUNNER_TEMP/pure.tap"
          check_count "$RUNNER_TEMP/pure.tap" 18
          count_status=$?
          if [ "$group_status" -ne 0 ] || [ "$count_status" -ne 0 ]; then qualification_status=1; fi
          node --test --test-name-pattern='^(closed source keeps|settled first connection|unknown issuer SEND|absent original issuer never|failed schema SELECT|fresh current owner|fresh QA pointer|same ambient original request)' test/mcp-qa-finite-owner-phase-context-native.test.mjs > "$RUNNER_TEMP/phase-selected.tap" 2>&1
          group_status=$?
          show_tap "$RUNNER_TEMP/phase-selected.tap"
          check_count "$RUNNER_TEMP/phase-selected.tap" 16
          count_status=$?
          if [ "$group_status" -ne 0 ] || [ "$count_status" -ne 0 ]; then qualification_status=1; fi
          node --test --test-name-pattern='^(uninstrumented actual native|missing actual SDK binding cookie|actual current publication drift|owned begin recheck rejects actual foreign delta owner-revision|fanout causal control delay0)' test/mcp-qa-finite-owner-qa-sdk-native.test.mjs > "$RUNNER_TEMP/sdk-selected.tap" 2>&1
          group_status=$?
          show_tap "$RUNNER_TEMP/sdk-selected.tap"
          check_count "$RUNNER_TEMP/sdk-selected.tap" 6
          count_status=$?
          if [ "$group_status" -ne 0 ] || [ "$count_status" -ne 0 ]; then qualification_status=1; fi
          node --test --test-name-pattern='^D04 actual exchange (retains|then SYN valid native timestamp drift|then SYN immutable original current-(owner|revision))' test/mcp-qa-finite-owner-qa-sdk-token-compat-native.test.mjs > "$RUNNER_TEMP/d04-selected.tap" 2>&1
          group_status=$?
          show_tap "$RUNNER_TEMP/d04-selected.tap"
          check_count "$RUNNER_TEMP/d04-selected.tap" 4
          count_status=$?
          if [ "$group_status" -ne 0 ] || [ "$count_status" -ne 0 ]; then qualification_status=1; fi
          npx --no-install eslint lib/mcp-qa-finite-owner-phase-context.mjs test/fixtures/finite-owner-notice-get.mjs test/mcp-qa-finite-owner-notice-link-native.test.mjs test/mcp-qa-finite-owner-notice-consent-native.test.mjs > "$RUNNER_TEMP/lint.txt" 2>&1
          lint_status=$?
          cat "$RUNNER_TEMP/lint.txt"
          if [ "$lint_status" -ne 0 ]; then qualification_status=1; fi
          exit "$qualification_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afw-notice-link-get-and-regressions
          path: |
            ${{ runner.temp }}/*.tap
            ${{ runner.temp }}/lint.txt
            ${{ runner.temp }}/afw-notice-get-bundles/*.json
          retention-days: 7
