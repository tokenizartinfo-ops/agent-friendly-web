name: AFW own Worker build only

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/afw-own-worker-build.yml'
      - 'scripts/build-mcp-own-worker.mjs'
      - 'scripts/build-mcp-node-program.mjs'
      - 'scripts/mcp-release-source.mjs'

permissions:
  contents: read

concurrency:
  group: afw-own-worker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    if: >-
      github.repository == 'tokenizartinfo-ops/agent-friendly-web' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AFW_BUILD_SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AFW_BUILD_SOURCE_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile exact source without publishing
        run: node scripts/build-mcp-own-worker.mjs "$AFW_BUILD_SOURCE_REVISION"
      - name: Verify compiled bytes and provenance
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const bytes = readFileSync('output/mcp-own-worker/index.mjs');
          const manifest = JSON.parse(readFileSync('output/mcp-own-worker/build.json','utf8'));
          assert.equal(manifest.sourceRevision,process.env.AFW_BUILD_SOURCE_REVISION);
          assert.equal(manifest.sourceCheck,'git-inputs-before-after-v1');
          assert.match(manifest.sourceTree,/^[a-f0-9]{40}$/);
          assert.match(manifest.programHash,/^[a-f0-9]{64}$/);
          assert.ok(bytes.length > 0);
          assert.equal(manifest.workerHash,createHash('sha256').update(bytes).digest('hex'));
          console.log(JSON.stringify({...manifest,workerBytes:bytes.length}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: afw-own-worker-${{ env.AFW_BUILD_SOURCE_REVISION }}
          path: |
            output/mcp-own-worker/index.mjs
            output/mcp-own-worker/build.json
          if-no-files-found: error
          retention-days: 7
