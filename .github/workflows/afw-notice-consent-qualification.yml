name: AFW notice consent qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths:
      - lib/mcp-qa-finite-owner-phase-context.mjs
      - lib/mcp-qa-finite-owner-notice-get-wire.mjs
      - lib/mcp-qa-finite-owner-notice-get-forward.mjs
      - lib/mcp-qa-finite-owner-notice-get-qa.mjs
      - lib/mcp-qa-finite-owner-notice-consent-body.mjs
      - test/mcp-qa-finite-owner-notice-consent-native.test.mjs
      - test/fixtures/finite-owner-notice-get.mjs
      - test/fixtures/finite-owner-qa-sdk.mjs
      - test/mcp-qa-finite-owner-notice-get-native.test.mjs
      - test/fixtures/finite-owner-io-fanout.mjs
      - .github/workflows/afw-notice-consent-qualification.yml
permissions:
  contents: read
jobs:
  post-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: CONTRAST original invocation native M streams
        run: |
          set +e
          node --test --test-name-pattern='^native consent failed body retains actual cancellation (M|held read M)$' test/mcp-qa-finite-owner-notice-consent-native.test.mjs > "$RUNNER_TEMP/notice-contrast.tap" 2>&1
          code=$?
          grep -E '^# Subtest:|^(not )?ok [0-9]|^# (tests|pass|fail|skipped|cancelled|duration_ms)' "$RUNNER_TEMP/notice-contrast.tap"
          if [ "$code" -ne 0 ]; then head -n 16 "$RUNNER_TEMP/notice-contrast.tap"; grep -A 28 '^not ok' "$RUNNER_TEMP/notice-contrast.tap"; fi
          exit "$code"
        env:
          AFW_NOTICE_BUNDLE_CAPTURE: '1'
      - name: Lint changed fixture and test
        if: ${{ !cancelled() }}
        run: npx --no-install eslint test/mcp-qa-finite-owner-notice-consent-native.test.mjs test/fixtures/finite-owner-qa-sdk.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notice-consent-contrast-${{ github.sha }}
          path: |
            ${{ runner.temp }}/afw-notice-get-bundles
            ${{ runner.temp }}/notice-contrast.tap
          retention-days: 7
