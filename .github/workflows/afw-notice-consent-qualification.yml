name: AFW notice consent qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths:
      - lib/mcp-qa-finite-owner-phase-context.mjs
      - lib/mcp-qa-finite-owner-notice-get-wire.mjs
      - lib/mcp-qa-finite-owner-notice-get-forward.mjs
      - lib/mcp-qa-finite-owner-notice-get-qa.mjs
      - lib/mcp-qa-finite-owner-notice-consent-body.mjs
      - test/mcp-qa-finite-owner-notice-consent-native.test.mjs
      - test/fixtures/finite-owner-notice-get.mjs
      - test/fixtures/finite-owner-qa-sdk.mjs
      - test/mcp-qa-finite-owner-notice-get-native.test.mjs
      - test/fixtures/finite-owner-io-fanout.mjs
      - .github/workflows/afw-notice-consent-qualification.yml
permissions:
  contents: read
jobs:
  post-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Final native POST and causal retained bodies
        run: |
          set +e
          node --test --test-name-pattern='^(native consent POST records original decision|native consent malformed unrelated cookie|notice cookie-list|native consent failed body retains actual cancellation (M|held read M)$)' test/mcp-qa-finite-owner-notice-consent-native.test.mjs > "$RUNNER_TEMP/notice-final-post-native.tap" 2>&1
          code=$?
          grep -E '^# Subtest:|^(not )?ok [0-9]|^# (tests|pass|fail|skipped|cancelled|duration_ms)|^# (NOTICE actual compiler graph|CONSENT native principal costs|CONSENT native original window)' "$RUNNER_TEMP/notice-final-post-native.tap"
          if [ "$code" -ne 0 ]; then head -n 16 "$RUNNER_TEMP/notice-final-post-native.tap"; grep -A 28 '^not ok' "$RUNNER_TEMP/notice-final-post-native.tap"; fi
          exit "$code"
        env:
          AFW_NOTICE_BUNDLE_CAPTURE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notice-consent-final-post-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/afw-notice-get-bundles
            ${{ runner.temp }}/notice-final-post-native.tap
          retention-days: 7
  get-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Final SOURCE active GET and cookie P3
        run: |
          set +e
          node --test --test-name-pattern='^(GET acknowledged original|notice GET malformed unrelated cookie|notice cookie-list)' test/mcp-qa-finite-owner-notice-get-native.test.mjs > "$RUNNER_TEMP/notice-final-get-regressions.tap" 2>&1
          code=$?
          grep -E '^# Subtest:|^(not )?ok [0-9]|^# (tests|pass|fail|skipped|cancelled|duration_ms)|^# (NOTICE actual compiler graph|CONSENT native principal costs|CONSENT native original window)' "$RUNNER_TEMP/notice-final-get-regressions.tap"
          if [ "$code" -ne 0 ]; then head -n 16 "$RUNNER_TEMP/notice-final-get-regressions.tap"; grep -A 28 '^not ok' "$RUNNER_TEMP/notice-final-get-regressions.tap"; fi
          exit "$code"
        env:
          AFW_NOTICE_BUNDLE_CAPTURE: '1'
      - name: Lint all ten allowed source and test paths
        if: ${{ !cancelled() }}
        run: npx --no-install eslint lib/mcp-qa-finite-owner-phase-context.mjs lib/mcp-qa-finite-owner-notice-get-wire.mjs lib/mcp-qa-finite-owner-notice-get-forward.mjs lib/mcp-qa-finite-owner-notice-get-qa.mjs lib/mcp-qa-finite-owner-notice-consent-body.mjs test/mcp-qa-finite-owner-notice-consent-native.test.mjs test/fixtures/finite-owner-notice-get.mjs test/fixtures/finite-owner-qa-sdk.mjs test/mcp-qa-finite-owner-notice-get-native.test.mjs test/fixtures/finite-owner-io-fanout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notice-consent-final-get-regressions-${{ github.sha }}
          path: |
            ${{ runner.temp }}/afw-notice-get-bundles
            ${{ runner.temp }}/notice-final-get-regressions.tap
          retention-days: 7
