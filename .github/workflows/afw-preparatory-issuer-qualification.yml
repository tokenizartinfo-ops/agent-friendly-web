name: AFW preparatory issuer component qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths:
      - 'lib/mcp-qa-finite-preparation-issuer*'
      - 'lib/mcp-qa-finite-initial-cleanup.mjs'
      - 'db/finite-preparation-issuer-fences.sql'
      - 'test/*preparation-issuer*'
      - 'test/fixtures/finite-preparation-issuer*'
      - '.github/workflows/afw-preparatory-issuer-qualification.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Scoped lint before native work
        run: npx eslint lib/mcp-qa-finite-preparation-issuer-*.mjs lib/mcp-qa-finite-initial-cleanup.mjs test/mcp-qa-finite-preparation-issuer-*.test.mjs test/mcp-qa-finite-initial-cleanup-native.test.mjs test/fixtures/finite-preparation-issuer-worker.mjs
      - name: Cheap codec schema and import graph checks
        run: node --test test/mcp-qa-finite-preparation-issuer-records.test.mjs
      - name: Fast native OPEN barrier preflight
        run: node --test --test-timeout=30000 --test-name-pattern='REAL OPEN then' test/mcp-qa-finite-preparation-issuer-native.test.mjs
      - name: Actual native D1 and DO component ordering
        run: node --test --test-timeout=30000 test/mcp-qa-finite-preparation-issuer-native.test.mjs
      - name: Affected ordinary store and initial cleanup regressions
        run: node --test test/delegated-oauth-store.test.mjs test/mcp-qa-finite-initial-cleanup-records.test.mjs test/mcp-qa-finite-initial-cleanup-native.test.mjs test/mcp-qa-finite-preparation-cleanup-native.test.mjs
      - name: One changed runtime graph compiler
        run: npx esbuild worker/independent-closure/index.mjs --bundle --format=esm --platform=neutral --target=es2022 '--external:node:*' '--external:cloudflare:*' --outfile=/tmp/issuer-qa-graph.mjs
