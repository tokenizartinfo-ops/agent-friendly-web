name: AFW private R2 draft verification
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact current main revision
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
      github.repository == 'tokenizartinfo-ops/agent-friendly-web' &&
      github.repository_id == '1347578006' &&
      github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
      inputs.source_revision == github.sha &&
      github.actor == 'tokenizartinfo-ops' && github.actor_id == '290715446' &&
      github.triggering_actor == 'tokenizartinfo-ops' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: afw-qa-cloud-closed-rollback
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify isolated startup, review, withdrawal and simulated restoration
        run: node --test test/mcp-qa-finite-receiver-workerd.test.mjs
      - name: Verify pinned private backup and current compiler output
        env:
          AFW_R2_BACKUPS_READ_URL: ${{ secrets.AFW_R2_BACKUPS_READ_URL }}
        run: node scripts/build-finite-native-package.mjs --verify-r2-draft "$GITHUB_SHA"
