name: AFW C2 GREEN20 frontier Source adapter controls
on:
  push:
    branches:
      - lab/afw-c2-source-20261116-green-frontier-diag1-tools
permissions:
  contents: read
jobs:
  c2-green-frontier-diag1-tools:
    if: >-
      github.repository == 'tokenizartinfo-ops/agent-friendly-web' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lab/afw-c2-source-20261116-green-frontier-diag1-tools' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'AFW-C2-GREEN-FRONTIER-DIAG1-TOOLS-ONEUSE-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read the exact Source tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Use the fixed Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Exercise the six Source collection adapters
        shell: bash
        run: node --test --test-reporter=tap --test-concurrency=1 docs/superpowers/source-lab/c2-t1-green-frontier-diag1/tools-controls.mjs
      - name: Preserve the Source tooling proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afw-c2-green-frontier-diag1-tools-proof
          path: output/c2-green-frontier-diag1-tools-proof.json
          if-no-files-found: error
          retention-days: 7
