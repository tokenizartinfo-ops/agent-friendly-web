name: AFW verified Access expiry
on:
  pull_request:
    paths: ['lib/cloudflare-access-identity.mjs', 'test/cloudflare-access-identity-expiry.test.mjs', 'test/cloudflare-access-identity.test.mjs', '.github/workflows/afw-verified-access-expiry.yml']
  push:
    branches: [main]
    paths: ['lib/cloudflare-access-identity.mjs', 'test/cloudflare-access-identity-expiry.test.mjs', 'test/cloudflare-access-identity.test.mjs', '.github/workflows/afw-verified-access-expiry.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node --test test/cloudflare-access-identity.test.mjs test/cloudflare-access-identity-expiry.test.mjs
