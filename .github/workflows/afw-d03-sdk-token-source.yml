name: AFW D03 native SDK token source qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths:
      - '.github/workflows/afw-d03-sdk-token-source.yml'
      - 'lib/delegated-oauth-worker.mjs'
      - 'test/mcp-qa-finite-owner-qa-sdk-token-compat-native.test.mjs'
      - 'test/fixtures/finite-owner-qa-sdk.mjs'
      - 'test/fixtures/finite-initial-entry-world.mjs'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Scoped lint before native work
        run: npx eslint lib/delegated-oauth-worker.mjs test/fixtures/finite-owner-qa-sdk.mjs test/fixtures/finite-initial-entry-world.mjs test/mcp-qa-finite-owner-qa-sdk-token-compat-native.test.mjs
      - name: Corrected four SDK identity scope and actual MCP carrier cases
        run: timeout 180s node --test --test-name-pattern='actual original QA code negative (sdk-subject|requested-scope)|otherwise valid actual token' test/mcp-qa-finite-owner-qa-sdk-token-compat-native.test.mjs
      - name: Relevant unchanged D02 actual positive after shared fixture composition
        run: timeout 150s node --test --test-name-pattern='uninstrumented actual native source/SDK/Unit2a GET POST' test/mcp-qa-finite-owner-qa-sdk-native.test.mjs
      - name: Affected actual OAuth token refresh and MCP regressions
        run: timeout 180s node --test --test-concurrency=1 test/delegated-oauth-flow.test.mjs test/delegated-oauth-store.test.mjs test/delegated-project-mcp.test.mjs test/delegated-project-read.test.mjs test/delegated-pilot-permission-expiry.test.mjs
      - name: Exact-head standard token-hardening compiler graph remains unmounted
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {compileFiniteNativeStaging} from './scripts/build-finite-native-package.mjs';
          const built=await compileFiniteNativeStaging({cwd:process.cwd(),sourceRevision:process.env.GITHUB_SHA});
          assert.equal(built.sourceRevision,process.env.GITHUB_SHA);
          assert.equal(built.completePackage,false);assert.equal(built.operationalReadiness,false);
          console.info('D03 standard compiler entrypoints',JSON.stringify({compileFiniteNativeStaging:1,buildFiniteNativePackage:0,nodeProgramEsbuild:1,roleEsbuild:2,sourceRevision:built.sourceRevision,sourceTree:built.sourceTree}));
          for(const role of ['canaryLive','qaLive']){
            const meta=built.metafiles[role],output=Object.values(meta.outputs)[0],inputs=output.inputs;
            console.info('D03 standard role',JSON.stringify({role,...built.modules[role].module,parsedInputs:Object.keys(meta.inputs).length,readerInGraph:!!meta.inputs['lib/mcp-qa-finite-owner-phase-context.mjs'],readerBytesInOutput:inputs['lib/mcp-qa-finite-owner-phase-context.mjs']?.bytesInOutput??0,parsedSdkInputs:Object.keys(meta.inputs).filter(k=>k.includes('workers-oauth-provider')).length,sdkBytesInOutput:Object.entries(inputs).filter(([k])=>k.includes('workers-oauth-provider')).reduce((n,[,v])=>n+v.bytesInOutput,0),newReceiverInGraph:!!meta.inputs['lib/mcp-qa-finite-owner-oauth-qa.mjs'],newForwarderInGraph:!!meta.inputs['lib/mcp-qa-finite-owner-oauth-forward.mjs'],qualification:'standard unmounted source graph; not full mounting proof'}));
            assert.equal(!!meta.inputs['lib/mcp-qa-finite-owner-oauth-qa.mjs'],false);assert.equal(!!meta.inputs['lib/mcp-qa-finite-owner-oauth-forward.mjs'],false);
            if(role==='canaryLive'){for(const path of ['lib/mcp-qa-finite-owner-phase-context.mjs','lib/mcp-qa-finite-preparation-issuer-store.mjs','lib/mcp-qa-finite-preparation-issuer-journal.mjs','lib/mcp-qa-finite-owner-issuer-provenance-journal.mjs','lib/mcp-qa-finite-initial-entry.mjs','lib/mcp-qa-finite-candidate-residency.mjs'])assert.equal(!!meta.inputs[path],false,path);assert.equal(output.imports.some(v=>/^node:fs(?:\/|$)/.test(v.path)),false);}
          }
          JS
