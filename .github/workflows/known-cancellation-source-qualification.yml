name: Known cancellation source qualification
on:
  push:
    branches: [feat/native-known-cancellation-adapter-20261101]
    paths:
      - worker/mcp-release/index.mjs
      - test/fixtures/**
      - test/mcp-release-known-cancellation-native.test.mjs
      - test/mcp-release-reservation-native.test.mjs
      - test/mcp-named-authorization-native.test.mjs
      - test/mcp-qa-named-authorization-native.test.mjs
      - test/mcp-named-known-history-native.test.mjs
      - lib/mcp-release-runtime.mjs
      - test/mcp-release-known-cancellation.test.mjs
      - .github/workflows/known-cancellation-source-qualification.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inventory shared native fixture consumers
        run: git grep -l -E 'rehearseExactNamedConfirmation|seedNamedHistoryFixture' -- test
      - name: Broad focused regression and all synthetic fixture consumers
        run: node --test test/mcp-qa-closed-context.test.mjs test/mcp-qa-closed-context-native.test.mjs test/mcp-qa-named-authorization.test.mjs test/mcp-qa-named-authorization-native.test.mjs test/mcp-qa-named-eligibility.test.mjs test/mcp-qa-named-eligibility-native.test.mjs test/mcp-successor-canary-restorer.test.mjs test/mcp-successor-canary-restorer-native.test.mjs test/mcp-canary-restoration-transport.test.mjs test/mcp-qa-cloud-closed-rollback.test.mjs test/mcp-qa-cloud-closed-http.test.mjs test/mcp-qa-cloud-closed-invocation.test.mjs test/mcp-qa-generation-resolver.test.mjs test/mcp-qa-generation-resolver-native.test.mjs test/mcp-qa-named-packet-reader.test.mjs test/mcp-qa-named-packet-d1-native.test.mjs test/mcp-qa-named-packet-assembly.test.mjs test/mcp-qa-named-preflight.test.mjs test/mcp-qa-named-preflight-native.test.mjs test/mcp-qa-arm-eligibility.test.mjs test/mcp-qa-generation-ledger.test.mjs test/mcp-qa-original-pins.test.mjs test/mcp-qa-original-pins-native.test.mjs test/mcp-qa-arm-observation-package.test.mjs test/mcp-restoration-configuration.test.mjs test/mcp-qa-arm-http.test.mjs test/mcp-qa-arm-fanout.test.mjs test/mcp-qa-closed-observation-v2.test.mjs test/mcp-qa-closed-observation-v2-native.test.mjs test/mcp-qa-closed-observation-v2-package.test.mjs test/mcp-qa-native-admission.test.mjs test/mcp-qa-native-artifact.test.mjs test/mcp-qa-cloud-native-observation.test.mjs test/mcp-qa-cloud-native-cli.test.mjs test/mcp-qa-cloud-native-workflow.test.mjs test/mcp-qa-cloud-clone.test.mjs test/mcp-qa-cloud-clone-workflow.test.mjs test/mcp-qa-cloud-clone-cli.test.mjs test/mcp-qa-github-opaque-credential.test.mjs test/mcp-qa-cloud-lifecycle-admission.test.mjs test/mcp-qa-own-closed-command.test.mjs test/mcp-qa-own-closed-http.test.mjs test/mcp-qa-own-closed-readback.test.mjs test/mcp-qa-own-closed-workflow.test.mjs test/mcp-qa-own-closed-cli.test.mjs test/mcp-qa-arm-observation.test.mjs test/mcp-qa-arm-observation-native.test.mjs test/mcp-qa-legacy-inspection-native.test.mjs test/mcp-qa-legacy-predecessor.test.mjs test/mcp-qa-historical-identity.test.mjs test/mcp-qa-historical-identity-native.test.mjs test/mcp-qa-generation-material.test.mjs test/mcp-qa-generation-preparation.test.mjs test/mcp-qa-generation-preparation-native.test.mjs test/mcp-qa-generation-draft-reader.test.mjs test/mcp-qa-generation-draft-d1-native.test.mjs test/mcp-known-cancellation-native.test.mjs test/mcp-release-workflow-native.test.mjs test/mcp-release-reservation-native.test.mjs test/mcp-release-runtime-native.test.mjs test/mcp-named-authorization-native.test.mjs test/mcp-release-known-cancellation-native.test.mjs test/mcp-release-known-cancellation.test.mjs test/mcp-named-known-history-native.test.mjs test/mcp-qa-generation-arm-native.test.mjs
      - name: Scoped lint
        run: npx eslint test/mcp-qa-named-authorization-native.test.mjs test/mcp-named-known-history-native.test.mjs test/mcp-named-authorization-native.test.mjs worker/mcp-release/index.mjs test/mcp-release-known-cancellation-native.test.mjs test/mcp-release-reservation-native.test.mjs test/fixtures/named-confirmation-native-rehearsal.mjs test/fixtures/named-known-cancellation.mjs test/fixtures/known-cancellation-native-harness.mjs
