name: AFW preparation source intake
on:
  pull_request:
    paths: ['lib/preparation-source-intake-store.mjs', 'test/preparation-source-intake-store.test.mjs', '.github/workflows/afw-preparation-source-intake.yml']
  push:
    branches: [main]
    paths: ['lib/preparation-source-intake-store.mjs', 'test/preparation-source-intake-store.test.mjs', '.github/workflows/afw-preparation-source-intake.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --test test/preparation-source-intake-store.test.mjs
