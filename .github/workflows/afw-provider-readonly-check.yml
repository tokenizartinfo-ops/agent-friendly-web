name: AFW public provider check (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afw-public-provider-check
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read fixed official status sources without account credentials
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { checkOwnCronProvider } from './scripts/check-own-cron-provider.mjs';
          const sourceRevision=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const sourceTree=execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          assert.match(sourceRevision,/^[a-f0-9]{40}$/);
          assert.match(sourceTree,/^[a-f0-9]{40}$/);
          assert.equal(sourceRevision,process.env.GITHUB_SHA);
          assert.equal(process.env.GITHUB_REPOSITORY,'tokenizartinfo-ops/agent-friendly-web');
          assert.equal(process.env.GITHUB_REF,'refs/heads/main');
          const result=await checkOwnCronProvider({dependencyProfile:'prebuilt-closed-publication'});
          assert.ok(['resolved','blocked','unknown'].includes(result.providerGate));
          assert.equal(result.operationalReadiness,false);
          assert.equal(result.mayRunClosedVerification,result.providerGate==='resolved');
          assert.ok(Number.isSafeInteger(result.requestCount)&&result.requestCount>=0&&result.requestCount<=2);
          const receipt={execution:'github-actions',workflowSuccessMeans:'read-only-check-completed',sourceRevision,sourceTree,runId:process.env.GITHUB_RUN_ID,result};
          mkdirSync('output/afw-provider-check',{recursive:true});
          writeFileSync('output/afw-provider-check/result.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: afw-provider-check-${{ github.run_id }}
          path: output/afw-provider-check/result.json
          if-no-files-found: error
          retention-days: 7
