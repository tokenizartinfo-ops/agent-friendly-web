name: Finite notice GET temporary qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths:
      - 'lib/mcp-qa-finite-owner-phase-context.mjs'
      - 'lib/mcp-qa-finite-owner-notice-get-wire.mjs'
      - 'lib/mcp-qa-finite-owner-notice-get-forward.mjs'
      - 'lib/mcp-qa-finite-owner-notice-get-qa.mjs'
      - 'test/mcp-qa-finite-owner-notice-get-native.test.mjs'
      - 'test/fixtures/finite-owner-notice-get.mjs'
      - 'test/fixtures/finite-initial-entry-world.mjs'
      - 'test/fixtures/finite-owner-qa-sdk.mjs'
      - 'test/fixtures/finite-owner-io-fanout.mjs'
      - 'test/mcp-qa-finite-owner-qa-sdk-native.test.mjs'
      - '.github/workflows/afw-notice-get-qualification.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Only affected fanout control0 metric
        run: |
          set -o pipefail
          node --test --test-name-pattern='^fanout causal control delay0' test/mcp-qa-finite-owner-qa-sdk-native.test.mjs 2>&1 | tee "$RUNNER_TEMP/notice-fanout.tap"
          node --input-type=module -e "import{readFileSync}from'node:fs';const s=readFileSync(process.argv[1],'utf8');if(!/^# tests 1$/m.test(s)||!/^# pass 1$/m.test(s)||!/^# fail 0$/m.test(s))throw Error('Unexpected TAP count');" "$RUNNER_TEMP/notice-fanout.tap"
      - name: Selected D04 token4
        run: |
          set -o pipefail
          node --test --test-name-pattern='^D04 actual exchange (retains|then SYN valid native timestamp drift|then SYN immutable original current-(owner|revision))' test/mcp-qa-finite-owner-qa-sdk-token-compat-native.test.mjs 2>&1 | tee "$RUNNER_TEMP/notice-regression-2.tap"
          node --input-type=module -e "import{readFileSync}from'node:fs';const s=readFileSync(process.argv[1],'utf8');if(!/^# tests 4$/m.test(s)||!/^# pass 4$/m.test(s)||!/^# fail 0$/m.test(s))throw Error('Unexpected TAP count');" "$RUNNER_TEMP/notice-regression-2.tap"
      - name: Targeted ten-file ESLint
        run: ./node_modules/.bin/eslint lib/mcp-qa-finite-owner-phase-context.mjs lib/mcp-qa-finite-owner-notice-get-wire.mjs lib/mcp-qa-finite-owner-notice-get-forward.mjs lib/mcp-qa-finite-owner-notice-get-qa.mjs test/mcp-qa-finite-owner-notice-get-native.test.mjs test/fixtures/finite-owner-notice-get.mjs test/fixtures/finite-initial-entry-world.mjs test/fixtures/finite-owner-qa-sdk.mjs test/fixtures/finite-owner-io-fanout.mjs test/mcp-qa-finite-owner-qa-sdk-native.test.mjs
