name: AFW finite native package
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/afw-finite-native-package.yml"
      - "scripts/build-finite-native-package.mjs"
      - "scripts/verify-finite-native-staging.mjs"
      - "scripts/verify-finite-native-rollback.mjs"
      - "scripts/verify-qa-finite-archive.py"
      - "test/verify-finite-native-rollback.test.mjs"
      - "test/mcp-qa-finite-closed-profile.test.mjs"
      - "lib/**"
      - "worker/**"
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact current main revision of the verified R2 package
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: >-
      ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.source_revision == github.sha))) }}
    env:
      AFW_PACKAGE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AFW_PACKAGE_REVISION }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint the compiler and native mount checks
        run: npx --no-install eslint scripts/build-finite-native-package.mjs scripts/verify-finite-native-staging.mjs scripts/verify-finite-native-rollback.mjs test/verify-finite-native-rollback.test.mjs lib/mcp-qa-finite-profile.mjs lib/mcp-qa-finite-publication.mjs test/mcp-qa-finite-closed-profile.test.mjs
      - name: Mount exact compiled modules in Workerd
        run: |
          staging=$(node scripts/build-finite-native-package.mjs --staging "$AFW_PACKAGE_REVISION")
          printf '%s\n' "$staging"
          jq -e --arg revision "$AFW_PACKAGE_REVISION" '.sourceRevision == $revision and .nativeMount.nativeWorkflowDenials == 2 and .nativeMount.operationalReadiness == false' <<< "$staging"
      - name: Verify the bounded archive parser
        run: python3 -m unittest discover -s test -p finite_archive_test.py
      - name: Verify private R2 package transport and release provenance
        run: node --test test/mcp-qa-finite-package.test.mjs test/mcp-qa-finite-r2-object.test.mjs test/verify-finite-native-rollback.test.mjs test/mcp-qa-finite-closed-profile.test.mjs test/mcp-qa-finite-seed-issuer.test.mjs test/mcp-qa-finite-publication-bridge.test.mjs
  package:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt == '1' && inputs.source_revision == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: afw-qa-cloud-closed-rollback
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify private R2 bundle and write its public locator
        env:
          AFW_R2_PACKAGE_SOURCE_REVISION: ${{ inputs.source_revision }}
          AFW_R2_BUNDLE_READ_URL: ${{ secrets.AFW_R2_BUNDLE_READ_URL }}
        run: node scripts/write-finite-r2-locator.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: afw-finite-native-package-${{ github.sha }}
          path: output/finite-r2-locator/locator.json
          if-no-files-found: error
          retention-days: 7
