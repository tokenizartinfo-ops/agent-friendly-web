name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Keep the OS family used by native workerd/SQLite acceptance.
    # Qualify a new OS explicitly instead of following ubuntu-latest migration.
    runs-on: ubuntu-24.04
    # Native fixture setup failures must not occupy a runner indefinitely.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Provenance tests verify source blobs at their pinned repository revision.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Qualify pure QA execution pin
        run: node --test test/mcp-qa-execution-identity.test.mjs test/mcp-release-runtime-native.test.mjs
      - name: Qualify exact known cancellation history
        run: node --test test/mcp-known-cancellation-native.test.mjs
      - name: Qualify permissions-only separation
        run: node --test test/mcp-own-permissions-only-reduction.test.mjs test/mcp-own-permissions-only-reduction-native.test.mjs test/mcp-own-permission-withdrawal.test.mjs test/mcp-own-permission-withdrawal-native.test.mjs
      - name: Qualify explicit finite execution context
        run: node --test test/mcp-release-runtime-native.test.mjs test/mcp-named-authorization-native.test.mjs
      - name: Qualify retirement review fences
        run: node --test --test-name-pattern='final pre-RPC microtask|stay fresh through final provider' test/mcp-successor-host.test.mjs test/mcp-retirement-receipt-integration.test.mjs
      - name: Qualify retirement parent lease
        run: node --test --test-name-pattern='original monotonic assertion|original deadline after deployment|independent SQL clock|observer clock ahead|challenged successor handoff|independently ahead observer clock|challenged successor custody' test/mcp-successor-reservation.test.mjs test/mcp-successor-launch-gate.test.mjs test/mcp-release-reservation-native.test.mjs test/mcp-successor-retirement-handoff.test.mjs test/mcp-successor-retirement-workflow.test.mjs test/mcp-hosted-canary-restoration.test.mjs
      - name: Qualify challenged successor consumers
        run: node --test test/mcp-retired-rpc-observation-native.test.mjs test/mcp-successor-host.test.mjs test/mcp-successor-retirement-workflow.test.mjs test/mcp-successor-retirement-workflow-native.test.mjs test/mcp-successor-retirement-handoff.test.mjs test/mcp-hosted-canary-restoration.test.mjs test/mcp-hosted-canary-restoration-native.test.mjs test/mcp-private-reduce-restore.test.mjs test/mcp-release-reservation-native.test.mjs
      - name: Qualify retirement receipt integration
        run: node --test test/mcp-retirement-receipt-integration.test.mjs test/mcp-retirement-receipt-integration-native.test.mjs
      - name: Qualify challenged retired RPC receipt
        run: node --test test/mcp-retired-rpc-receipt.test.mjs test/mcp-retired-rpc-receipt-native.test.mjs
      - name: Qualify private prepared dispatch
        run: node --test test/mcp-private-prepared-materialization.test.mjs test/mcp-private-confirmation-template.test.mjs test/mcp-private-prepared-dispatch.test.mjs test/mcp-private-prepared-dispatch-native.test.mjs
      - name: Qualify private identity preflight
        run: node --test test/mcp-release-identity-observation.test.mjs test/mcp-release-identity-observation-native.test.mjs
      - name: Qualify public journey audit regressions
        run: node --test test/public-journey-audit.test.mjs test/public-guide.test.mjs test/intake-assistant-contract.test.mjs
      - name: Qualify private withdrawal before full suite
        run: node --test test/mcp-private-reduce-restore.test.mjs test/mcp-private-reduce-restore-native.test.mjs test/mcp-own-guarded-close.test.mjs test/mcp-own-permission-withdrawal-host.test.mjs test/mcp-own-permission-withdrawal-rpc-native.test.mjs test/mcp-own-permission-withdrawal.test.mjs test/mcp-own-permission-withdrawal-native.test.mjs
      - name: Qualify original custody clock observation
        run: node --test test/mcp-release-custody-clock-observation.test.mjs test/mcp-release-custody-clock-observation-native.test.mjs
      - name: Qualify named custody clock diagnostic
        run: node --test --test-name-pattern='custody clock' test/mcp-release-reservation-native.test.mjs
      - name: Qualify private publisher boundary before full suite
        run: node --test test/mcp-closure-publisher-probe.test.mjs test/mcp-closure-publisher-probe-native.test.mjs
      - name: Qualify private reader boundary before full suite
        run: node --test test/mcp-closure-reader-probe.test.mjs test/mcp-closure-reader-probe-native.test.mjs
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Preserve production build for controlled Cloudflare release
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: afw-build-${{ github.sha }}
          path: dist/
          # Public discovery contracts live under dist/client/.well-known/.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

