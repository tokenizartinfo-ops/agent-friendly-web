name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Keep the OS family used by native workerd/SQLite acceptance.
    # Qualify a new OS explicitly instead of following ubuntu-latest migration.
    runs-on: ubuntu-24.04
    # Native fixture setup failures must not occupy a runner indefinitely.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Provenance tests verify source blobs at their pinned repository revision.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Qualify sealed closed QA source without publication
        run: node --test test/mcp-qa-sealed-build.test.mjs test/mcp-qa-sealed-build-native.test.mjs test/mcp-qa-fixed-context-build.test.mjs
      - name: Qualify private QA identity generation and closure fences
        run: node --test test/mcp-qa-closed-context.test.mjs test/mcp-qa-closed-context-native.test.mjs test/mcp-qa-named-authorization.test.mjs test/mcp-qa-named-authorization-native.test.mjs test/mcp-qa-named-eligibility.test.mjs test/mcp-qa-named-eligibility-native.test.mjs test/mcp-successor-canary-restorer.test.mjs test/mcp-successor-canary-restorer-native.test.mjs test/mcp-canary-restoration-transport.test.mjs test/mcp-qa-cloud-closed-rollback.test.mjs test/mcp-qa-cloud-closed-http.test.mjs test/mcp-qa-cloud-closed-invocation.test.mjs test/mcp-qa-generation-resolver.test.mjs test/mcp-qa-generation-resolver-native.test.mjs test/mcp-qa-named-packet-reader.test.mjs test/mcp-qa-named-packet-d1-native.test.mjs test/mcp-qa-named-packet-assembly.test.mjs test/mcp-qa-named-preflight.test.mjs test/mcp-qa-named-preflight-native.test.mjs test/mcp-qa-arm-eligibility.test.mjs test/mcp-qa-generation-ledger.test.mjs test/mcp-qa-original-pins.test.mjs test/mcp-qa-original-pins-native.test.mjs test/mcp-qa-arm-http.test.mjs test/mcp-qa-legacy-inspection-native.test.mjs
      # The full top-level test glob covers every historical focused file.
      # Keep the two short closed-QA checks above for fast failure feedback.
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Preserve production build for controlled Cloudflare release
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: afw-build-${{ github.sha }}
          path: dist/
          # Public discovery contracts live under dist/client/.well-known/.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

