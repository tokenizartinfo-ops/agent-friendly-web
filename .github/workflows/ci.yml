name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Keep the OS family used by native workerd/SQLite acceptance.
    # Qualify a new OS explicitly instead of following ubuntu-latest migration.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Provenance tests verify source blobs at their pinned repository revision.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Qualify private withdrawal before full suite
        run: node --test test/mcp-own-permission-withdrawal-host.test.mjs test/mcp-own-permission-withdrawal.test.mjs test/mcp-own-permission-withdrawal-native.test.mjs
      - name: Qualify private publisher boundary before full suite
        run: node --test test/mcp-closure-publisher-probe.test.mjs test/mcp-closure-publisher-probe-native.test.mjs
      - name: Qualify private reader boundary before full suite
        run: node --test test/mcp-closure-reader-probe.test.mjs test/mcp-closure-reader-probe-native.test.mjs
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Preserve production build for controlled Cloudflare release
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: afw-build-${{ github.sha }}
          path: dist/
          # Public discovery contracts live under dist/client/.well-known/.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

