name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Provenance tests verify source blobs at their pinned repository revision.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Preserve production build for controlled Cloudflare release
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: afw-build-${{ github.sha }}
          path: dist/
          # Public discovery contracts live under dist/client/.well-known/.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

