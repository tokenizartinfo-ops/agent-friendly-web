name: AFW C2 finite GET diagnostic 3 tools
on:
  push:
    branches:
      - lab/afw-c2-source-20261117-finite-get-diag3-tools
permissions:
  contents: read
jobs:
  c2-finite-get-diag3-tools:
    if: >-
      github.repository == 'tokenizartinfo-ops/agent-friendly-web' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lab/afw-c2-source-20261117-finite-get-diag3-tools' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'AFW-C2-FINITE-GET-DIAG3-TOOLS-ONEUSE-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read the exact one-use tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Use the fixed Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Install only the existing locked dependencies
        id: deps
        shell: bash
        run: node docs/superpowers/source-lab/c2-t1-finite-get-diag3/tools-finite-get.mjs --install
      - name: Check finite GET projection controls
        id: source
        env:
          FG3_TEMP: ${{ steps.deps.outputs.root }}
          FG3_DEV: ${{ steps.deps.outputs.dev }}
          FG3_INO: ${{ steps.deps.outputs.ino }}
        shell: bash
        run: node docs/superpowers/source-lab/c2-t1-finite-get-diag3/tools-finite-get.mjs
      - name: Preserve bounded finite GET tooling evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afw-c2-finite-get-diag3-tools
          path: output/c2-finite-get-diag3-tools.json
          if-no-files-found: error
          retention-days: 7
