name: AFW preparation view QA

on:
  pull_request:
    paths:
      - 'lib/delegated-preparation-consent-view.mjs'
      - 'lib/delegated-preparation-consent-policy.mjs'
      - 'lib/agent-consumption-input.mjs'
      - 'test/delegated-preparation-consent-view.test.mjs'
      - 'scripts/check-preparation-consent-view-browser.mjs'
      - '.github/workflows/afw-preparation-view-qa.yml'
  push:
    branches: [main]
    paths:
      - 'lib/delegated-preparation-consent-view.mjs'
      - 'lib/delegated-preparation-consent-policy.mjs'
      - 'lib/agent-consumption-input.mjs'
      - 'test/delegated-preparation-consent-view.test.mjs'
      - 'scripts/check-preparation-consent-view-browser.mjs'
      - '.github/workflows/afw-preparation-view-qa.yml'

permissions:
  contents: read

jobs:
  synthetic-browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AFW_QA_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser tools only in runner temp
        env:
          AFW_BROWSER_TOOLS: ${{ runner.temp }}/afw-consent-browser
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/afw-consent-browsers
        shell: bash
        run: |
          command -v npx >/dev/null
          npm install --prefix "$AFW_BROWSER_TOOLS" --ignore-scripts --no-audit --no-fund playwright@1.64.1
          node "$AFW_BROWSER_TOOLS/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check synthetic consent layout, keyboard and form decisions
        env:
          AFW_BROWSER_TOOLS: ${{ runner.temp }}/afw-consent-browser
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/afw-consent-browsers
        run: node scripts/check-preparation-consent-view-browser.mjs
      - name: Preserve synthetic screenshots and sanitized receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afw-consent-view-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/playwright/
          if-no-files-found: error
          retention-days: 7
