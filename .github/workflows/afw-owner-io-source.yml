name: Finite owner I/O source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths:
      - .github/workflows/afw-owner-io-source.yml
      - lib/mcp-qa-finite-owner-phase-context.mjs
      - test/mcp-qa-finite-owner-qa-sdk-native.test.mjs
      - test/fixtures/finite-owner-io-fanout.mjs
      - test/fixtures/finite-initial-entry-world.mjs
      - test/fixtures/finite-owner-qa-sdk.mjs
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx eslint lib/mcp-qa-finite-owner-phase-context.mjs test/mcp-qa-finite-owner-qa-sdk-native.test.mjs test/fixtures/finite-initial-entry-world.mjs test/fixtures/finite-owner-qa-sdk.mjs test/fixtures/finite-owner-io-fanout.mjs
      - run: timeout 300s node --test --test-concurrency=1 --test-name-pattern="fanout causal control|fanout 50ms|fanout fixed two" test/mcp-qa-finite-owner-qa-sdk-native.test.mjs
