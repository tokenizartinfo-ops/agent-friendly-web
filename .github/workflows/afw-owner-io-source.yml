name: Finite owner I/O fix1 qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths:
      - .github/workflows/afw-owner-io-source.yml
      - test/fixtures/finite-owner-io-fanout.mjs
      - test/mcp-qa-finite-owner-qa-sdk-native.test.mjs
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx eslint test/fixtures/finite-owner-io-fanout.mjs test/mcp-qa-finite-owner-qa-sdk-native.test.mjs
      - run: timeout 180s node --test --test-concurrency=1 --test-name-pattern="fanout pending branch" test/mcp-qa-finite-owner-qa-sdk-native.test.mjs
