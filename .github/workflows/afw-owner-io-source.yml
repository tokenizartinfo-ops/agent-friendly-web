name: Finite owner I/O source qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths:
      - .github/workflows/afw-owner-io-source.yml
      - lib/mcp-qa-finite-owner-phase-context.mjs
      - test/mcp-qa-finite-owner-qa-sdk-native.test.mjs
      - test/fixtures/finite-owner-io-fanout.mjs
      - test/fixtures/finite-initial-entry-world.mjs
      - test/fixtures/finite-owner-qa-sdk.mjs
      - test/fixtures/finite-owner-phase-context.mjs
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx eslint lib/mcp-qa-finite-owner-phase-context.mjs test/mcp-qa-finite-owner-qa-sdk-native.test.mjs test/fixtures/finite-initial-entry-world.mjs test/fixtures/finite-owner-qa-sdk.mjs test/fixtures/finite-owner-io-fanout.mjs test/fixtures/finite-owner-phase-context.mjs
      - run: |
          timeout 360s node --test --test-concurrency=1 --test-name-pattern="^fresh current owner and current publication are independently rechecked: (owner|schema)$|^original primary issuer denies |^original retained read blocks foreign root|^original retained request with 29 seconds|^same ambient original request|^absent exact issuer table|^original issuer reservation|^existing orphan original fence|^failed schema SELECT|^exact original metadata prefix|^missing original ticket|^fresh QA pointer drift|^actual allocated phase fixture|^settled original M journals" test/mcp-qa-finite-owner-phase-context-native.test.mjs
      - run: timeout 150s node --test --test-name-pattern="uninstrumented actual native source/SDK/Unit2a GET POST" test/mcp-qa-finite-owner-qa-sdk-native.test.mjs
      - run: timeout 240s node --test --test-concurrency=1 test/mcp-qa-finite-owner-request-retention-native.test.mjs test/mcp-qa-finite-owner-request-retention.test.mjs test/mcp-qa-finite-preparation-issuer-native.test.mjs test/mcp-qa-finite-profile-native.test.mjs test/mcp-qa-finite-profile.test.mjs test/mcp-qa-finite-owner-sdk-binding-facts.test.mjs
