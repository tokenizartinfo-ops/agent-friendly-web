name: AFW coupled receiver and native closure verification
on:
  push:
    branches: [lab/afw-finite-alarm-handoff-20261118]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.run_attempt == '1' && github.event.head_commit.message == 'AFW-R2-ROLLBACK-COMPILER-VERIFICATION-20261119' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify compiler, archive, custody and closed runtime checks
        run: >-
          node --test --test-concurrency=2
          test/build-finite-native-package.test.mjs
          test/mcp-qa-own-closed-readback.test.mjs
          test/mcp-qa-finite-package.test.mjs
          test/mcp-qa-finite-r2-object.test.mjs
          test/mcp-restoration-configuration.test.mjs
          test/mcp-qa-finite-coupled-restorer.test.mjs
      - run: python3 -m unittest discover -s test -p 'finite*archive_test.py'
