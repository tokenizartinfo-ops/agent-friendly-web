name: AFW native baseline comparison
on:
  push:
    branches: [lab/afw-finite-alarm-handoff-20261118]
permissions:
  contents: read
jobs:
  compare:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.run_attempt == '1' && github.event.head_commit.message == 'AFW-COMPARE-NATIVE-RELATED-FAILURES-20261119' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            ref: 0bc68f1cf620fa9553be9943aa3d1876f3861566
          - variant: candidate
            ref: e73060beefef0a0c2f698c4fb9d082474b978469
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    name: Compare ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare related failures against unchanged baseline
        shell: bash
        run: |
          mapfile -t files < <(git grep -l -E 'native authenticated help review recovers a lost claim|Q2 one native entry and duplicate settlement|R3S12 actual generated fixture|compiled finite receiver denies legacy delivery|finite scheduled legacy event route|real native CLI validates source-correlated metadata' -- 'test/*.test.mjs')
          test "${#files[@]}" -gt 0
          printf '%s\n' "${files[@]}"
          node --test --test-reporter=spec --test-concurrency=2 --test-timeout=60000 "${files[@]}"
