name: AFW coupled receiver and native closure verification
on:
  push:
    branches: [lab/afw-finite-alarm-handoff-20261118]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.run_attempt == '1' && github.event.head_commit.message == 'AFW-QA-BOOTSTRAP-SIGNING-DONOR-DIAGNOSE-20261119' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Diagnose one synthetic bootstrap boundary
        run: |
          node --input-type=module <<'AFW_DIAG'
          import {readFileSync,writeFileSync} from 'node:fs';
          const dir='lib/mcp-qa-finite-';
          const entry=dir+'initial-entry.mjs';
          const source=readFileSync(entry,'utf8').replaceAll('}catch{return pending();}finally','}catch(error){console.error("AFW_SYNTHETIC_FRAME",error?.stack);return pending();}finally');
          writeFileSync(entry,source);
          const wire=dir+'initial-upload-wire.mjs';
          const original=readFileSync(wire,'utf8').split('\n');
          writeFileSync(wire,original.map((line,i)=>line.includes(')fail();')?line.replaceAll(')fail();',')throw Error("AFW_SYNTHETIC_WIRE_LINE_'+(i+1)+'");'):line).join('\n'));
          AFW_DIAG
          node --test --test-name-pattern='B1 actual finite actor durable entry' test/mcp-qa-finite-initial-entry-native.test.mjs
