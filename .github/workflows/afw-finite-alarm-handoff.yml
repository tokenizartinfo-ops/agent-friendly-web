name: AFW owner context reference comparison
on:
  push:
    branches: [lab/afw-finite-alarm-handoff-20261118]
permissions:
  contents: read
jobs:
  compare:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.run_attempt == '1' && github.event.head_commit.message == 'AFW-FINITE-NATIVE-ALARM-HANDOFF-VERIFY-20261118' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: reference
            revision: '0c7bc887cf5dd2e880a868655ba2dd3cca92b916'
          - label: candidate
            revision: '64e3f6910ab6d0f2a2dc73c72fd268512d917dd1'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the scoped original issuer
        run: node --test --test-timeout=90000 --test-name-pattern="absent original issuer never triggers" test/mcp-qa-finite-owner-phase-context-native.test.mjs
