name: AFW coupled receiver and native closure verification
on:
  push:
    branches: [lab/afw-finite-alarm-handoff-20261118]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.run_attempt == '1' && github.event.head_commit.message == 'AFW-INDEPENDENT-OBSERVER-VERIFICATION-20261120' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 94ef3010007dfff6e68e27125d3aaf648053d552
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify independent restoration, observer and same-notice evidence
        run: >-
          node --test --test-concurrency=2 --test-timeout=90000
          test/build-finite-native-package.test.mjs
          test/mcp-qa-finite-command.test.mjs
          test/mcp-qa-finite-coupled-github.test.mjs
          test/mcp-qa-finite-observer.test.mjs
          test/mcp-qa-finite-alarm-handoff.test.mjs
          test/mcp-qa-finite-coupled-restorer.test.mjs
          test/mcp-qa-finite-cf-http.test.mjs
          test/mcp-qa-finite-notice-closure.test.mjs
          test/mcp-qa-finite-receiver-workerd.test.mjs
          test/mcp-qa-finite-adoption-wait.test.mjs
          test/mcp-qa-finite-observer-native.test.mjs
      - run: python3 -m unittest discover -s test -p 'finite*archive_test.py'
