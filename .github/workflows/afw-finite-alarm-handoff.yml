name: AFW staged main integration
on:
  push:
    branches: [integration/afw-private-finite-20261120]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.run_attempt == '1' && github.event.head_commit.message == 'QUALIFY-AFW-SCOPED-MAIN-INTEGRATION-20261120' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d05e2cfc51357cf4c3679d027ac9b9d134711ebd
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify scoped main overlay and native restoration contracts
        run: >-
          node --test --test-concurrency=2 --test-timeout=90000
          test/build-finite-native-package.test.mjs
          test/mcp-qa-finite-r2-object.test.mjs
          test/mcp-qa-finite-command.test.mjs
          test/mcp-qa-finite-coupled-github.test.mjs
          test/mcp-qa-finite-observer.test.mjs
          test/mcp-qa-finite-alarm-handoff.test.mjs
          test/mcp-qa-finite-coupled-restorer.test.mjs
          test/mcp-qa-finite-cf-http.test.mjs
          test/mcp-qa-finite-notice-closure.test.mjs
          test/mcp-qa-finite-receiver-workerd.test.mjs
          test/mcp-qa-finite-adoption-wait.test.mjs
          test/mcp-qa-finite-observer-native.test.mjs
      - run: python3 -m unittest discover -s test -p 'finite*archive_test.py'
