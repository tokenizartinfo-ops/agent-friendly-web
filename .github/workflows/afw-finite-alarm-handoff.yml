name: AFW coupled receiver and native closure verification
on:
  push:
    branches: [lab/afw-finite-alarm-handoff-20261118]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.run_attempt == '1' && github.event.head_commit.message == 'AFW-EXACT-SIGNED-NOTICE-INGRESS-20261119' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify original closure, provider transport and compatibility
        run: node --test --test-concurrency=2 --test-timeout=60000 test/mcp-qa-finite-seed-http.test.mjs test/mcp-qa-finite-coupled-github.test.mjs test/mcp-qa-finite-coupled-restorer.test.mjs test/mcp-restoration-configuration.test.mjs test/mcp-qa-finite-alarm-handoff.test.mjs test/mcp-qa-finite-finalizer.test.mjs test/mcp-qa-finite-http.test.mjs test/mcp-qa-finite-cf-http.test.mjs test/mcp-qa-finite-observer.test.mjs test/mcp-qa-finite-observer-native.test.mjs test/mcp-qa-finite-launch-native.test.mjs test/mcp-qa-finite-launcher-native.test.mjs test/mcp-qa-finite-launch-inventory-native.test.mjs test/mcp-qa-finite-trial-guard.test.mjs test/build-finite-native-package.test.mjs test/mcp-qa-finite-cloud-review.test.mjs test/mcp-qa-finite-receiver-workerd.test.mjs test/mcp-qa-finite-launch-ready.test.mjs test/mcp-qa-finite-native-launch-dispatch.test.mjs test/mcp-qa-finite-r2-object.test.mjs test/mcp-own-finite-reduction-native.test.mjs test/mcp-qa-finite-notice-closure.test.mjs test/dossier-supervision.test.mjs test/dossier-supervision-workerd.test.mjs test/operations-service-controls.test.mjs
      - run: python3 -m unittest discover -s test -p finite_historical_archive_test.py
      - name: Verify staging and rejection of a premature complete package
        run: |
          node scripts/build-finite-native-package.mjs --staging "$GITHUB_SHA"
          if node scripts/build-finite-native-package.mjs "$GITHUB_SHA"; then exit 1; fi
          test ! -e output/finite-native-package
          echo "Complete package remains gated"
      - name: Build the dedicated private QA receiver
        run: |
          npx --no-install wrangler deploy --dry-run --config wrangler.operations-manager.jsonc --outdir "$RUNNER_TEMP/afw-receiver-build"
          mkdir "$RUNNER_TEMP/afw-receiver-transfer"
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json, os
          temp = Path(os.environ['RUNNER_TEMP'])
          files = list((temp / 'afw-receiver-build').glob('*.js'))
          assert len(files) == 1
          source = files[0].read_bytes()
          assert 0 < len(source) < 262144 and b'FiniteDossierReviews' in source
          target = temp / 'afw-receiver-transfer'
          (target / 'index.mjs').write_bytes(source)
          manifest = {'purpose':'afw.private-qa-receiver-staging.v1','sourceRevision':os.environ['GITHUB_SHA'],'bytes':len(source),'sha256':sha256(source).hexdigest(),'deploymentPerformed':False}
          (target / 'receipt.json').write_text(json.dumps(manifest))
          print(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afw-private-receiver-source-build
          path: ${{ runner.temp }}/afw-receiver-transfer
          if-no-files-found: error
          retention-days: 1
