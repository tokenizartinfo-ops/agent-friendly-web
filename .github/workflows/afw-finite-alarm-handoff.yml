name: AFW coupled receiver and native closure verification
on:
  push:
    branches: [lab/afw-finite-alarm-handoff-20261118]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.run_attempt == '1' && github.event.head_commit.message == 'AFW-QA-BOOTSTRAP-RENEWAL-DIAGNOSE-20261119' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Diagnose the native initial boundary with synthetic facts
        run: |
          node --input-type=module <<'AFW_DIAG'
          import {readFileSync,writeFileSync} from 'node:fs';
          const targets=['initial-entry','initial-material','historical-source','bootstrap-native'];
          for(const name of targets){
            const path='lib/mcp-qa-finite-'+name+'.mjs';
            let source=readFileSync(path,'utf8');
            source=source.replace(/\}\s*catch\s*(?:\((\w+)\))?\s*\{(?=(?:return pending\(\)|fail\(|if\(success\)|const match=))/, (whole,error)=>'}catch('+(error||'afwDiagnosticError')+'){console.error("AFW_SYNTHETIC_FRAME",'+JSON.stringify(name)+','+(error||'afwDiagnosticError')+'?.stack);');
            writeFileSync(path,source);
          }
          AFW_DIAG
          node --test --test-name-pattern='B1 actual finite actor durable entry' test/mcp-qa-finite-initial-entry-native.test.mjs
