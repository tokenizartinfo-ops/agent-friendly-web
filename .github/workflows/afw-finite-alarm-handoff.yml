name: AFW coupled receiver and native closure verification
on:
  push:
    branches: [lab/afw-finite-alarm-handoff-20261118]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.run_attempt == '1' && github.event.head_commit.message == 'AFW-QA-BOOTSTRAP-CLEANUP-DIAGNOSE-20261119' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Diagnose the original synthetic alarm
        run: |
          node --input-type=module <<'AFW_DIAG'
          import {readFileSync,writeFileSync} from 'node:fs';
          const initial='lib/mcp-qa-finite-initial-cleanup.mjs';
          const x=readFileSync(initial,'utf8').replace('}catch{return pending();}finally','}catch(error){console.error("AFW_SYNTHETIC_CLEANUP",error?.stack);return pending();}finally');
          writeFileSync(initial,x.split('\n').map((line,i)=>line.includes(')fail();')&&!line.includes('const fail')?line.replace(/\)fail\(\);/g,')throw Error("AFW_SYNTHETIC_CLEANUP_LINE_'+(i+1)+'");'):line).join('\n'));
          AFW_DIAG
          node --test --test-name-pattern='persisted native restart owns initial alarm|complete future SYN activation evidence|actual native alarm rejects active-workflow' test/mcp-qa-finite-initial-cleanup-native.test.mjs
