name: AFW final approval compiler staging
on:
  push:
    branches: [lab/afw-final-approval-build-20261118]
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/lab/afw-final-approval-build-20261118' && github.run_attempt == '1' && github.event.head_commit.message == 'AFW-FINAL-APPROVAL-BUILD-20261118' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and verify the source candidate in staging
        shell: bash
        run: |
          node scripts/build-finite-native-package.mjs --staging "$GITHUB_SHA"
          node <<'AFW_VERIFY'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('output/finite-native-staging/staging.json', 'utf8'));
          if (p.purpose !== 'afw.finite-native-compiler-staging.v1' || p.sourceRevision !== process.env.GITHUB_SHA ||
              p.completePackage !== false || p.operationalReadiness !== false ||
              Object.keys(p.modules).sort().join(',') !== 'canaryLive,qaLive') process.exit(1);
          const evidence = {sourceRevision:p.sourceRevision,sourceTree:p.sourceTree,completePackage:false,operationalReadiness:false,
            modules:Object.fromEntries(Object.entries(p.modules).map(([role,value])=>[role,value.module]))};
          console.log('AFW_FINAL_APPROVAL_STAGING ' + JSON.stringify(evidence));
          AFW_VERIFY
