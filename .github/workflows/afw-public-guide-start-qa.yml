name: AFW public guide entry browser QA

on:
  pull_request:
    paths:
      - 'app/page.tsx'
      - 'app/components/comic-home-intro.tsx'
      - 'app/components/maturity-map.tsx'
      - 'lib/home-copy.mjs'
      - 'lib/home-markdown.mjs'
      - 'public/images/agent-friendly-call-robots-screen.webp'
      - 'scripts/check-home-opening-browser.mjs'
      - 'lib/public-mcp-http.mjs'
      - 'test/public-mcp-http.test.mjs'
      - 'public/.well-known/agent-readiness.json'
      - 'public/.well-known/email-operations-contract.json'
      - 'app/mapa-del-sitio/page.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'app/api-catalog/route.ts'
      - 'test/agent-discovery.test.mjs'
      - 'test/public-a2a-discovery.test.mjs'
      - 'test/public-guide-discovery.test.mjs'
      - 'test/publication-capsule-discovery.test.mjs'
      - 'lib/public-guide.mjs'
      - 'lib/public-tools-copy.mjs'
      - 'app/guia/page.tsx'
      - 'app/components/public-guide-chat.tsx'
      - 'app/globals.css'
      - 'scripts/check-public-guide-start-browser.mjs'
      - '.github/workflows/afw-public-guide-start-qa.yml'

permissions:
  contents: read

jobs:
  guide-entry-browser:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AFW_QA_REVISION: ${{ github.event.pull_request.head.sha }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare runner-only browser paths
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFileSync} from 'node:fs';
          import path from 'node:path';
          const temp=process.env.RUNNER_TEMP;
          assert.ok(temp&&path.isAbsolute(temp));
          appendFileSync(process.env.GITHUB_ENV,'AFW_BROWSER_TOOLS='+path.join(temp,'afw-guide-start-tools')+'\nPLAYWRIGHT_BROWSERS_PATH='+path.join(temp,'afw-guide-start-browsers')+'\n');
          NODE
      - name: Install project in ephemeral runner
        run: npm ci
      - name: Compile actual branch product
        run: npm run build
      - name: Install pinned browser tools only in runner
        timeout-minutes: 3
        shell: bash
        run: |
          command -v npx >/dev/null
          npm install --prefix "$AFW_BROWSER_TOOLS" --ignore-scripts --no-audit --no-fund playwright@1.64.1
          # Avoid redundant apt refresh; the pinned browser launch still requires system libraries.
          node "$AFW_BROWSER_TOOLS/node_modules/playwright/cli.js" install chromium
      - name: Check guide entry on isolated native runtime
        run: node scripts/check-public-guide-start-browser.mjs
      - name: Check the scene-first home on the same immutable compiled artifact
        run: node scripts/check-home-opening-browser.mjs
      - name: Preserve the exact qualified public build
        uses: actions/upload-artifact@v4
        with:
          name: afw-guide-qualified-dist-${{ github.event.pull_request.head.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve public browser evidence and compiled provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afw-guide-start-preview-${{ github.event.pull_request.head.sha }}
          path: |
            output/playwright/guide-start/
            output/playwright/home-opening/
          if-no-files-found: ignore
          retention-days: 7
