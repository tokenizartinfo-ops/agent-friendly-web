name: AFW release and rollback validation
on:
  push:
    branches: [lab/afw-release-rollback-validation-20261118]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/lab/afw-release-rollback-validation-20261118' && github.run_attempt == '1' && github.event.head_commit.message == 'AFW release and rollback validation 20261118' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify source package gates and closed rollback contracts
        run: node --test test/build-finite-native-package.test.mjs test/mcp-qa-finite-package.test.mjs test/mcp-qa-finite-profile.test.mjs test/mcp-qa-finite-candidate-residency.test.mjs test/mcp-own-closed-rollback-native.test.mjs test/mcp-qa-cloud-closed-rollback.test.mjs test/mcp-qa-finite-canary-restorer.test.mjs test/mcp-finite-cleanup-readiness.test.mjs test/mcp-finite-activation-compatibility.test.mjs test/mcp-finite-nominal-control.test.mjs
      - name: Verify archive contract
        run: python3 -m unittest discover -s test -p finite_archive_test.py
