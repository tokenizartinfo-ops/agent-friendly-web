name: Finite owner native conduit fix round 1
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/finite-owner-native-conduit-qualification.yml]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused syntax and lint
        run: npx eslint lib/mcp-qa-finite-owner-native-wire.mjs test/mcp-qa-finite-owner-native-wire.test.mjs
      - name: Empty late response causal RED
        run: timeout 30s node --test --test-timeout=10000 --test-name-pattern="empty late successful response" test/mcp-qa-finite-owner-native-wire.test.mjs
