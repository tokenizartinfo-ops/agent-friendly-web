name: AFW publication template build only

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/afw-publication-template-build.yml'
      - 'scripts/**'
      - 'lib/**'
      - 'worker/**'
      - 'test/mcp-private-publication-template.test.mjs'
      - 'test/mcp-publication-snapshot.test.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: afw-publication-template-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    if: >-
      github.repository == 'tokenizartinfo-ops/agent-friendly-web' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AFW_PACKAGE_SOURCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AFW_PACKAGE_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify public snapshot contract before packaging
        run: node --test test/mcp-publication-snapshot.test.mjs
      - name: Compile public code without a live policy or credentials
        run: node scripts/build-mcp-private-publication-template.mjs "$AFW_PACKAGE_SOURCE"
      - name: Verify exact public outputs and provenance
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,readdirSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {materializeMcpPrivatePublication} from './lib/mcp-private-publication-template.mjs';
          import {RELEASE_TARGET} from './lib/mcp-release-operator-policy.mjs';
          const directory='output/mcp-publication-template/',hash=x=>createHash('sha256').update(x).digest('hex');
          assert.deepEqual(readdirSync(directory).sort(),['build.json','materializer.mjs','template.json','template.mjs']);
          const m=JSON.parse(readFileSync(directory+'template.json')),r=JSON.parse(readFileSync(directory+'build.json'));
          const template=readFileSync(directory+'template.mjs','utf8'),materializer=readFileSync(directory+'materializer.mjs');
          assert.equal(r.operatorSourceRevision,process.env.AFW_PACKAGE_SOURCE);
          assert.equal(r.operatorSourceTree,execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim());
          assert.equal(r.artifactSourceRevision,r.operatorSourceRevision);assert.equal(r.artifactSourceTree,r.operatorSourceTree);
          assert.equal(m.templateHash,hash(template));assert.equal(m.templateBytes,Buffer.byteLength(template));
          assert.equal(r.templateHash,m.templateHash);assert.equal(r.templateBytes,m.templateBytes);
          assert.equal(r.materializerHash,hash(materializer));assert.equal(r.materializerBytes,materializer.length);
          assert.equal(r.workerHash,m.workerHash);assert.equal(r.programHash,m.programHash);assert.equal(r.artifactKey,m.artifactKey);
          for(const k of ['materialized','realPolicyAccepted','remotePublished','invoked','operationalReadiness'])assert.equal(r[k],false);
          const policy={operation:'publish',startAt:0,expiresAt:1,pins:{...RELEASE_TARGET,baseVersionId:'00000000-0000-4000-8000-000000000000'}};
          const inert=await materializeMcpPrivatePublication({template,manifest:m,policyJson:JSON.stringify(policy),expectedTemplateHash:r.templateHash});
          assert.equal(inert.operatorHash,hash(inert.script));assert.equal(inert.remotePublished,false);
          console.log(JSON.stringify(r));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: afw-publication-template-${{ env.AFW_PACKAGE_SOURCE }}
          path: |
            output/mcp-publication-template/template.mjs
            output/mcp-publication-template/materializer.mjs
            output/mcp-publication-template/template.json
            output/mcp-publication-template/build.json
          if-no-files-found: error
          retention-days: 7

  preserve:
    needs: compile
    if: >-
      github.repository == 'tokenizartinfo-ops/agent-friendly-web' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: afw-publication-template-${{ github.sha }}
          path: public-package
      - name: Preserve only verified public code in a create-only ref
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            const {readFile,readdir}=await import('node:fs/promises');
            const {createHash}=await import('node:crypto');
            const {pathToFileURL}=await import('node:url');
            const {resolve}=await import('node:path');
            const {createMcpPublicPublicationSnapshot}=await import(pathToFileURL(resolve('lib/mcp-publication-public-snapshot.mjs')).href);
            const {owner,repo}=context.repo;
            if(owner+'/'+repo!=='tokenizartinfo-ops/agent-friendly-web'||context.eventName!=='workflow_dispatch'||context.ref!=='refs/heads/main')throw Error('Public snapshot unavailable');
            const commit=await github.rest.git.getCommit({owner,repo,commit_sha:context.sha});
            const expected=['build.json','materializer.mjs','template.json','template.mjs'];
            const found=(await readdir('public-package')).sort();
            if(JSON.stringify(found)!==JSON.stringify(expected))throw Error('Public snapshot unavailable');
            const files={};
            for(const name of expected)files[name]=await readFile('public-package/'+name,'utf8');
            const sourceMaterializer=await readFile('lib/mcp-private-publication-template.mjs');
            const p=await createMcpPublicPublicationSnapshot({files,expectedSourceRevision:context.sha,expectedSourceTree:commit.data.tree.sha,
              expectedMaterializerHash:createHash('sha256').update(sourceMaterializer).digest('hex')});
            const made=await github.rest.git.createTree({owner,repo,tree:p.entries.map(({path,mode,type,content})=>({path,mode,type,content}))});
            if(made.data.truncated||made.data.tree.length!==p.entries.length)throw Error('Public snapshot unavailable');
            const actual=new Map(made.data.tree.map(e=>[e.path,e]));
            if(p.entries.some(e=>{const a=actual.get(e.path);return !a||a.sha!==e.sha||a.mode!==e.mode||a.type!==e.type;}))throw Error('Public snapshot unavailable');
            let current;
            try{current=await github.rest.git.getRef({owner,repo,ref:p.ref.slice(5)});}catch(e){if(e.status!==404)throw Error('Public snapshot lookup unavailable');}
            if(current){
              const existing=await github.rest.git.getCommit({owner,repo,commit_sha:current.data.object.sha});
              if(existing.data.tree.sha!==made.data.sha)throw Error('Existing public snapshot differs; overwrite denied');
              core.info(JSON.stringify({sourceRevision:context.sha,tree:made.data.sha,ref:p.ref,created:false,reconciled:true,runtimePublished:false,operationalReadiness:false}));
            }else{
              const snapshot=await github.rest.git.createCommit({owner,repo,message:'Preserve public publication template '+context.sha,tree:made.data.sha,parents:[]});
              await github.rest.git.createRef({owner,repo,ref:p.ref,sha:snapshot.data.sha});
              core.info(JSON.stringify({sourceRevision:context.sha,tree:made.data.sha,commit:snapshot.data.sha,ref:p.ref,created:true,reconciled:false,runtimePublished:false,operationalReadiness:false}));
            }
