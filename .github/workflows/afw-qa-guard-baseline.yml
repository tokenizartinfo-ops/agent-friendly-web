name: AFW guard route regression and comparison
on:
  push:
    branches: [lab/afw-qa-guard-baseline-20261118]
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/lab/afw-qa-guard-baseline-20261118' && github.run_attempt == '1' && github.event.head_commit.message == 'AFW-QA-GUARD-BASELINE-20261118' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Measure the guard regression against the uncorrected route
        shell: bash
        run: |
          result=0
          node --test test/mcp-qa-finite-trial-guard.test.mjs || result=$?
          echo "AFW_GUARD_RED_EXIT $result"
          test "$result" -ne 0
      - name: Compare the existing adoption suite before the source changes
        shell: bash
        run: |
          git restore --source=9797829548e5b754c60b33ea619ab3709c3a7016 -- lib/mcp-qa-finite-adoption-source.mjs lib/mcp-qa-finite-adoption.mjs lib/mcp-qa-finite-http.mjs
          result=0
          node --test test/mcp-qa-finite-adoption-wait.test.mjs || result=$?
          echo "AFW_PREEXISTING_ADOPTION_BASELINE_EXIT $result"
