name: AFW preparation source Worker
on:
  pull_request:
    paths:
      - 'worker/mcp-preparation/**'
      - 'lib/preparation-source-session-*.mjs'
      - 'lib/cloudflare-access-identity.mjs'
      - 'lib/capsule-preparation-request-lease.mjs'
      - 'test/preparation-source-worker-native.test.mjs'
      - 'test/fixtures/preparation-source-worker-native.mjs'
      - '.github/workflows/afw-preparation-source-worker.yml'
  push:
    branches: [main]
    paths:
      - 'worker/mcp-preparation/**'
      - 'lib/preparation-source-session-*.mjs'
      - 'test/preparation-source-worker-native.test.mjs'
      - 'test/fixtures/preparation-source-worker-native.mjs'
      - '.github/workflows/afw-preparation-source-worker.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/preparation-source-worker-native.test.mjs
