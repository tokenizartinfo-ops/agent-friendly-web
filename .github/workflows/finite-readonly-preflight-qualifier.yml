name: Finite read-only preflight source qualification
on:
  push:
    branches: [feat/finite-readonly-preflight-20261103]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/mcp-qa-finite-pre-entry-host-native.test.mjs
      - name: Exact historical module is mandatory for primary qualification
        shell: bash
        run: |
          if AFW_REQUIRE_EXACT_BASELINE=1 node --test test/mcp-qa-finite-pre-entry-host-native.test.mjs > "$RUNNER_TEMP/exact-missing.log" 2>&1; then exit 1; fi
          grep -q 'Exact historical baseline required' "$RUNNER_TEMP/exact-missing.log"
          node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP+"/wrong-baseline.mjs",Buffer.alloc(395915))'
          if AFW_REQUIRE_EXACT_BASELINE=1 AFW_QA_INSPECTION_BASE_MODULE="$RUNNER_TEMP/wrong-baseline.mjs" node --test test/mcp-qa-finite-pre-entry-host-native.test.mjs > "$RUNNER_TEMP/exact-wrong.log" 2>&1; then exit 1; fi
          grep -q 'AssertionError' "$RUNNER_TEMP/exact-wrong.log"
      - run: node --test test/mcp-qa-finite-initial-cleanup-native.test.mjs test/mcp-qa-finite-initial-cleanup-records.test.mjs test/mcp-qa-finite-initial-workflows-native.test.mjs test/mcp-qa-finite-initial-history-schema-native.test.mjs test/mcp-qa-finite-initial-old-guard-native.test.mjs test/mcp-qa-finite-initial-gates-native.test.mjs test/mcp-qa-finite-initial-activation-wire-native.test.mjs test/mcp-qa-finite-initial-custody-probe-native.test.mjs test/mcp-qa-finite-initial-scope.test.mjs
      - run: npx eslint scripts/qa-finite-pre-entry-custody-wrapper.mjs test/mcp-qa-finite-pre-entry-host-native.test.mjs lib/mcp-qa-finite-stage-work.mjs lib/mcp-qa-finite-initial-custody-probe.mjs test/mcp-qa-finite-initial-scope.test.mjs test/mcp-qa-finite-initial-custody-probe-native.test.mjs test/fixtures/finite-initial-entry-world.mjs
