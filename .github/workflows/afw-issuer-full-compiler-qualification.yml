name: AFW issuer full compiler qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['.github/workflows/afw-issuer-full-compiler-qualification.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile actual finite QA and canary graphs once without runtime actions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {compileFiniteNativeStaging} from './scripts/build-finite-native-package.mjs';
          const r=await compileFiniteNativeStaging({cwd:process.cwd(),sourceRevision:process.env.GITHUB_SHA});
          assert.equal(r.completePackage,false);assert.equal(r.operationalReadiness,false);
          const qa=r.metafiles.qaLive.inputs;
          assert(Object.hasOwn(qa,'worker/independent-closure/finite.mjs'));
          assert(Object.hasOwn(qa,'lib/mcp-qa-finite-initial-cleanup.mjs'));
          assert(Object.hasOwn(qa,'lib/mcp-qa-finite-preparation-issuer-records.mjs'));
          for(const role of ['qaLive','canaryLive']){
            const m=r.metafiles[role];
            assert.equal(m.inputs['lib/mcp-qa-finite-preparation-issuer-store.mjs'],undefined);
            assert.equal(m.inputs['lib/mcp-qa-finite-preparation-issuer-journal.mjs'],undefined);
            for(const output of Object.values(m.outputs))assert(output.imports.every(x=>!/^node:fs(?:\/|$)/.test(x.path)));
            assert(r.modules[role].module.bytes<=(role==='qaLive'?3145728:2097152));
          }
          assert(r.candidateResidency.compressedBytes<=2098176);
          console.log('AFW_ISSUER_FULL_COMPILER '+JSON.stringify({sourceRevision:r.sourceRevision,sourceTree:r.sourceTree,modules:r.modules,candidateCompressedBytes:r.candidateResidency.compressedBytes,unmountedSqlAndJournal:true,completePackage:false,operationalReadiness:false}));
          NODE
