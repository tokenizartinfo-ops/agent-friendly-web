name: AFW prebuilt publication provider preflight only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afw-public-provider-preflight
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: One bounded public GET; never an AFW runtime action
        run: |
          node --input-type=module <<'NODE'
          import {mkdirSync,writeFileSync} from 'node:fs';
          import {checkOwnCronProvider} from './scripts/check-own-cron-provider.mjs';
          const result=await checkOwnCronProvider({dependencyProfile:'prebuilt-closed-publication'});
          // The helper emits only fixed public provenance and enum/numeric diagnostics.
          const allowed=new Set(['source','incidentId','checkedAt','providerGate','mayRunClosedVerification','operationalReadiness','reason','impactAttribution','relatedIncidents','httpStatus','receivedBytes','dependencyProfile','nonBlockingIncidents']);
          if(Object.keys(result).some(k=>!allowed.has(k))||result.operationalReadiness!==false)throw Error('Unexpected diagnostic projection');
          const receipt={sourceRevision:process.env.GITHUB_SHA,...result};
          const text=JSON.stringify(receipt)+'\n';
          mkdirSync('output/provider-preflight',{recursive:true});
          writeFileSync('output/provider-preflight/result.json',text);
          console.log(text.trim());
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: afw-public-provider-preflight-${{ github.sha }}
          path: output/provider-preflight/result.json
          if-no-files-found: error
          retention-days: 7
