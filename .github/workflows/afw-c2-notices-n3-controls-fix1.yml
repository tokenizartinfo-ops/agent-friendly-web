name: AFW C2 notices N3 tooling controls fix1
on:
  push:
    branches:
      - lab/afw-c2-source-20261116-notices-n3-controls-fix1
permissions:
  contents: read
jobs:
  c2-notices-n3-controls-fix1:
    if: >-
      github.repository == 'tokenizartinfo-ops/agent-friendly-web' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lab/afw-c2-source-20261116-notices-n3-controls-fix1' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'AFW-C2-N3-CONTROLS-FIX1-ONEUSE-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read the exact one-use tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Use fixed Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Execute tooling controls only
        run: node --test --test-reporter=tap --test-concurrency=1 docs/superpowers/source-lab/c2-t1-notices-n3-controls-fix1/run-controls.mjs
      - name: Preserve sanitized tooling proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afw-c2-notices-n3-tooling
          path: output/c2-notices-n3-tooling.json
          if-no-files-found: error
          retention-days: 7
