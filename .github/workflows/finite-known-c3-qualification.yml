name: AFW finite Known C3 qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/finite-known-c3-qualification.yml]
permissions:
  contents: read
jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Final consumer assertions
        run: node --test test/mcp-qa-finite-profile.test.mjs test/mcp-qa-finite-preparation-records.test.mjs test/mcp-qa-finite-policy-transport.test.mjs
      - name: Lint
        run: npm run lint
      - name: Exact clean source compiler with original byte limits
        run: |
          node --input-type=module <<'NODE'
          import {compileFiniteNativeStaging} from './scripts/build-finite-native-package.mjs';
          const r=await compileFiniteNativeStaging({cwd:process.cwd(),sourceRevision:process.env.GITHUB_SHA});
          const {content:omitted,...residency}=r.candidateResidency;void omitted;
          console.log(JSON.stringify({sourceRevision:r.sourceRevision,sourceTree:r.sourceTree,sourceCheck:r.sourceCheck,buildWorkflowHash:r.buildWorkflowHash,bootstrapSource:r.bootstrapSource,modules:r.modules,residency,completePackage:r.completePackage,operationalReadiness:r.operationalReadiness,PCoff:false}));
          NODE
