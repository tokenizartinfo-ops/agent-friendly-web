name: AFW finite Known C3 qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/finite-known-c3-qualification.yml]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Consumer records and transport RED
        run: node --test test/mcp-qa-finite-profile.test.mjs test/mcp-qa-finite-preparation-records.test.mjs test/mcp-qa-finite-policy-transport.test.mjs
      - name: Native setup and confirmation RED
        if: always()
        run: node --test --test-concurrency=1 test/mcp-qa-finite-policy-setup-native.test.mjs test/mcp-qa-finite-confirmation-native.test.mjs
      - name: Isolate previously unsettled final initial-upload cases
        if: always()
        run: node --test --test-timeout=30000 --test-name-pattern='publisher-revoked-before-send|upload-config-tamper' test/mcp-qa-finite-initial-upload-native.test.mjs
