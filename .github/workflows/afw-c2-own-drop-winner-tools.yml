name: AFW receiver DROP tooling
on:
  push:
    branches:
      - lab/afw-c2-own-20261117-drop-winner-tools
permissions:
  contents: read
jobs:
  own-drop-winner-tools:
    if: >-
      github.repository == 'tokenizartinfo-ops/agent-friendly-web' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lab/afw-c2-own-20261117-drop-winner-tools' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'AFW-C2-OWN-DROP-WINNER-TOOLS-ONEUSE-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read the exact one-use receiver head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Use the fixed Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Check receiver modules and test syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA 6791ce1bab9372e206d3c7b42b3e1394dc6e0c68"
          test "$(git rev-parse HEAD^:)" = "62e78926635d6b74f288d6c0d69e0f2516306989"
          test "$(git show -s --format=%B HEAD)" = "AFW-C2-OWN-DROP-WINNER-TOOLS-ONEUSE-20261117"
          test ! -e output/own-drop-winner-tools.json
          node --check docs/superpowers/root-own/c2-t1-drop-winner-diag4/bindings.mjs
          node --check docs/superpowers/root-own/c2-t1-drop-winner-diag4/drop-winner.mjs
          node --check docs/superpowers/root-own/c2-t1-drop-winner-diag4/reader.mjs
          node --check docs/superpowers/root-own/c2-t1-drop-winner-diag4/occurrence.mjs
          node --check docs/superpowers/root-own/c2-t1-drop-winner-diag4/occurrence-controls.mjs
          node --check docs/superpowers/root-own/c2-t1-drop-winner-diag4/drop-winner-tools.test.mjs
          node --check docs/superpowers/root-own/c2-t1-drop-winner-diag4/run-own-drop-tools.mjs
      - name: Run all receiver controls
        shell: bash
        run: timeout --kill-after=3s 110s node docs/superpowers/root-own/c2-t1-drop-winner-diag4/run-own-drop-tools.mjs
      - name: Preserve the bounded receiver tooling receipt
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afw-c2-own-drop-winner-tools
          path: output/own-drop-winner-tools.json
          if-no-files-found: error
          retention-days: 7
