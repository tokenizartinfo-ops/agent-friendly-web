name: AFW isolated preparation schema
on:
  pull_request:
    paths:
      - 'scripts/preparation-schema-package.mjs'
      - 'test/preparation-schema-package*.test.mjs'
      - 'test/preparation-worker-native.test.mjs'
      - 'drizzle/**'
      - 'db/agent-capsule-preparations.sql'
      - 'db/delegated-preparation-consents.sql'
      - '.github/workflows/afw-preparation-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/preparation-schema-package.test.mjs
      - run: npm ci --ignore-scripts
      - run: node --test test/preparation-schema-package-native.test.mjs test/preparation-worker-native.test.mjs
      - name: Preserve qualified public DDL package
        run: |
          mkdir -p output/preparation-schema
          node scripts/preparation-schema-package.mjs --json > output/preparation-schema/package.json
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const pkg=JSON.parse(readFileSync('output/preparation-schema/package.json','utf8'));
          const qualifierRevision=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const receipt={checkedAt:new Date().toISOString(),qualifierRevision,eventRevision:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,repository:process.env.GITHUB_REPOSITORY,schemaSha256:pkg.schemaSha256,tables:pkg.tables.length,statements:pkg.statements.length,nativeQualified:true,remoteMutations:0,operationalReadiness:false};
          writeFileSync('output/preparation-schema/receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log('AFW_SCHEMA_PACKAGE_JSON='+JSON.stringify(pkg));
          console.log('AFW_SCHEMA_RECEIPT_JSON='+JSON.stringify(receipt));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: afw-preparation-schema-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/preparation-schema/
          if-no-files-found: error
          retention-days: 7
