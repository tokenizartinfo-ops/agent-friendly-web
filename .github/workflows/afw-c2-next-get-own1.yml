name: AFW nextGET independent reader controls
on:
  push:
    branches:
      - lab/afw-c2-own-receiver-20261116-nextget1
permissions:
  contents: read
jobs:
  c2-next-get-own1:
    if: >-
      github.repository == 'tokenizartinfo-ops/agent-friendly-web' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lab/afw-c2-own-receiver-20261116-nextget1' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'AFW-C2-NEXT-GET-OWN-ONEUSE-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read exact one-use OWN head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Use fixed Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Validate independent nextGET reader only
        run: node docs/superpowers/root-own/c2-next-get1/run-own-controls.mjs
