name: Unit1 preparation cleanup qualifier
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: ['.github/workflows/unit1-preparation-cleanup.yml', 'lib/**', 'test/**']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/mcp-qa-finite-preparation-cleanup-records.test.mjs test/mcp-qa-finite-preparation-cleanup-native.test.mjs
      - run: npx eslint lib/mcp-qa-finite-initial-anchors.mjs test/fixtures/finite-initial-entry-world.mjs test/mcp-qa-finite-preparation-cleanup-native.test.mjs test/mcp-qa-finite-preparation-cleanup-build.test.mjs
      - run: git diff --check e256ee1a43ca3125fdb12485ceab712b6a7e197e HEAD
      - run: node --test test/mcp-qa-finite-preparation-cleanup-build.test.mjs
