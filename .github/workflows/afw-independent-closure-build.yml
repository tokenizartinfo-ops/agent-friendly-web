name: AFW independent closure build only

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/afw-independent-closure-build.yml'
      - 'wrangler.independent-closure-qa.jsonc'
      - 'wrangler.independent-closure-qa.rollback.jsonc'
      - 'scripts/**'
      - 'worker/**'
      - 'tsconfig.json'
      - '.npmrc'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/afw-independent-closure-build.yml'
      - 'wrangler.independent-closure-qa.jsonc'
      - 'wrangler.independent-closure-qa.rollback.jsonc'
      - 'scripts/**'
      - 'worker/**'
      - 'tsconfig.json'
      - '.npmrc'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: afw-independent-closure-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    if: >-
      github.repository == 'tokenizartinfo-ops/agent-friendly-web' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AFW_BUILD_SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AFW_BUILD_SOURCE_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Seal closed source and compatible rollback; never upload
        run: node scripts/build-private-qa-closed-context.mjs "$AFW_BUILD_SOURCE_REVISION"
      - name: Qualify exact sealed candidate with Wrangler; no network upload
        run: npx wrangler deploy output/qa-sealed/index.mjs --no-bundle --config wrangler.independent-closure-qa.jsonc --dry-run --outdir output/independent-closure
      - name: Qualify exact sealed rollback with Wrangler; no network upload
        run: npx wrangler deploy output/qa-sealed/closed-rollback.mjs --no-bundle --config wrangler.independent-closure-qa.rollback.jsonc --dry-run --outdir output/independent-closure-rollback
      - name: Verify exact modules and preserve both closed configuration hashes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, readdir, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const revision=process.env.AFW_BUILD_SOURCE_REVISION,manifest=JSON.parse(await readFile('output/qa-sealed/build.json','utf8'));
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),revision);
          assert.equal(manifest.sourceRevision,revision);
          assert.equal(manifest.sourceTree,execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim());
          assert.equal(manifest.purpose,'afw.qa-closed-context-build.v1');
          assert.equal(manifest.remotePublished,false);assert.equal(manifest.invoked,false);assert.equal(manifest.remoteConfigurationPreserved,false);assert.equal(manifest.operationalReadiness,false);
          assert.equal(sha(await readFile('wrangler.independent-closure-qa.jsonc')),manifest.configurationHash);
          assert.equal(sha(await readFile('wrangler.independent-closure-qa.rollback.jsonc')),manifest.rollbackConfigurationHash);
          assert.equal(sha(await readFile('.github/workflows/afw-independent-closure-build.yml')),manifest.workflowHash);
          const results=[];
          for(const [kind,directory] of [['module','output/independent-closure'],['rollback','output/independent-closure-rollback']]){
            const modules=[];
            async function walk(relative=''){
              for(const entry of await readdir(directory+(relative?'/'+relative:''),{withFileTypes:true})){
                const name=(relative?relative+'/':'')+entry.name;assert.equal(entry.isSymbolicLink(),false);
                if(entry.isDirectory()){await walk(name);continue;}
                if(!/\.(?:m?js|wasm)$/.test(name))continue;
                const bytes=await readFile(directory+'/'+name);modules.push({name,sha256:sha(bytes),bytes:bytes.length});
              }
            }
            await walk();assert.equal(modules.length,1);
            assert.equal(modules[0].sha256,manifest[kind].sha256);assert.equal(modules[0].bytes,manifest[kind].bytes);assert.equal(modules[0].name,manifest[kind].name);
            assert.ok((await readFile(directory+'/'+modules[0].name)).equals(await readFile('output/qa-sealed/'+manifest[kind].name)));
            results.push({kind,directory,modules});
          }
          const result={...manifest,wranglerDryRunVerified:true,dryRuns:results};
          await writeFile('output/independent-closure/build.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: afw-independent-closure-${{ env.AFW_BUILD_SOURCE_REVISION }}
          path: |
            output/independent-closure/
            output/independent-closure-rollback/
            output/qa-sealed/
          if-no-files-found: error
          retention-days: 7
