name: Tokenizart case visual QA
on:
  push:
    branches: ['design/tokenizart-case-readable-20261103']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/tokenizart-case-freshness.test.mjs
      - run: npm run build
      - run: npm install --prefix "$RUNNER_TEMP/afw-browser" --no-package-lock --ignore-scripts playwright@1.55.0
      - run: node "$RUNNER_TEMP/afw-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - run: node scripts/tokenizart-case-visual-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokenizart-case-visual-${{ github.sha }}
          path: case-visual-artifacts/
          retention-days: 7
