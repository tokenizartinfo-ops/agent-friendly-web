name: AFW public edge read-only check

on:
  pull_request:
    paths:
      - '.github/workflows/afw-public-edge-check.yml'
      - 'scripts/smoke-cloudflare-native-local.mjs'
      - 'test/cloudflare-native-parity.test.mjs'
      - 'scripts/check-public-reading-contracts.mjs'
      - 'test/public-reading-contracts.test.mjs'
      - 'scripts/check-public-waf-probe.mjs'
      - 'test/public-waf-probe.test.mjs'
      - 'lib/public-waf-snapshot.mjs'
      - 'test/public-waf-snapshot.test.mjs'
  workflow_dispatch:
    inputs:
      waf_probe:
        description: 'One synthetic WAF observation within an already prepared original window'
        type: boolean
        default: false
      probe_start:
        description: 'Original UTC start, Unix seconds; never renew an expired trial'
        type: string
        default: '0'
      probe_end:
        description: 'Original UTC end, Unix seconds; maximum900s after start'
        type: string
        default: '1'

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'tokenizartinfo-ops/agent-friendly-web' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the existing public and private boundary contracts with fixtures
        run: node --test test/cloudflare-native-parity.test.mjs test/public-reading-contracts.test.mjs test/public-waf-probe.test.mjs test/public-waf-snapshot.test.mjs
      - name: Observe the fixed public origin without authentication
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -o pipefail
          status=0
          node scripts/smoke-cloudflare-native-local.mjs --base-url https://agentfriendlyweb.dev --mode public-edge | tee "$RUNNER_TEMP/afw-public-edge.json" || status=1
          node scripts/check-public-reading-contracts.mjs | tee "$RUNNER_TEMP/afw-public-reading.json" || status=1
          exit "$status"
      - name: Observe one fixed synthetic WAF control
        if: github.event_name == 'workflow_dispatch' && inputs.waf_probe
        env:
          AFW_WAF_PROBE_START: ${{ inputs.probe_start }}
          AFW_WAF_PROBE_END: ${{ inputs.probe_end }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-public-waf-probe.mjs | tee "$RUNNER_TEMP/afw-public-waf-probe.json"
      - name: Preserve the dated run result without deploying
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: afw-public-edge-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/afw-public-edge.json
            ${{ runner.temp }}/afw-public-reading.json
            ${{ runner.temp }}/afw-public-waf-probe.json
          if-no-files-found: error
          retention-days: 7
