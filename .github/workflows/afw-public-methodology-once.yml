name: AFW public methodology once

on:
  pull_request:
    paths:
      - '.github/workflows/afw-public-methodology-once.yml'
      - 'scripts/check-public-methodology-once.mjs'
      - 'test/public-methodology-once.test.mjs'
  workflow_dispatch:
    inputs:
      not_before_ms:
        description: 'Original UTC start in integer Unix milliseconds; default closed'
        type: string
        default: '0'
      not_after_ms:
        description: 'Original UTC expiry, max600000ms after start; never renew'
        type: string
        default: '1'

permissions:
  contents: read

concurrency:
  group: afw-public-methodology-once
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'tokenizartinfo-ops/agent-friendly-web' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify finite observation with fixtures only
        run: node --test test/public-methodology-once.test.mjs
      - name: Observe one public methodology result
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1
        env:
          AFW_PUBLIC_TRIAL_START_MS: ${{ inputs.not_before_ms }}
          AFW_PUBLIC_TRIAL_END_MS: ${{ inputs.not_after_ms }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-public-methodology-once.mjs | tee "$RUNNER_TEMP/afw-public-methodology-once.json"
      - name: Preserve only the sanitized observation
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1
        uses: actions/upload-artifact@v4
        with:
          name: afw-public-methodology-once-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/afw-public-methodology-once.json
          if-no-files-found: warn
          retention-days: 7
