name: AFW finite budget qualification
run-name: AFW inspect one preserved SYN failure ${{ github.sha }}
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-finite-budget-qualification.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
jobs:
  inspect:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: afw-finite-syn-checkpoint
    steps:
      - name: Require the fixed inspection scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = tokenizartinfo-ops/agent-friendly-web
          test "$GITHUB_REF" = refs/heads/feat/finite-native-cleanup-20261101
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -z "${AFW_BUDGET_DIAGNOSTIC_CANDIDATE+x}"
          mkdir -m 700 "$RUNNER_TEMP/afw-inspection-control"
      - name: Checkout only the inspected failure revision
        uses: actions/checkout@v4
        with:
          repository: tokenizartinfo-ops/agent-friendly-web
          ref: 14071b396f8c9c66b70cf630d8823692a4521bd3
          persist-credentials: false
          fetch-depth: 1
      - name: Select Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source identities and three closed Node inputs
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = 14071b396f8c9c66b70cf630d8823692a4521bd3
          test "$GITHUB_SHA" != 14071b396f8c9c66b70cf630d8823692a4521bd3
          test "$(git hash-object test/fixtures/finite-checkpoint-custody.mjs)" = 9a486b839874ed8e9a950f6a823b18e7585de52e
          test "$(git hash-object test/fixtures/finite-budget-evidence.mjs)" = 81178d96e10784366ab1b11bbf0805e347dea173
          test "$(git hash-object test/fixtures/finite-budget-diagnostics.mjs)" = 82ff9a34f51c4e344e3c9bc8cd5d5640d1e0dac5
      - name: Confirm immutable public metadata for the one authorized archive
        id: metadata
        env:
          ARTIFACT_READER: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          try{
           const url='https://api.github.com/repos/tokenizartinfo-ops/agent-friendly-web/actions/artifacts/13902156351';
           const response=await fetch(url,{redirect:'error',headers:{Authorization:'Bearer '+process.env.ARTIFACT_READER,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
           if(!response.ok)throw Error();const a=await response.json();
           if(a.id!==13902156351||a.expired||a.size_in_bytes!==5398009||a.digest!=='sha256:f4e922e0e2d4174359cd43c1d7e652898bde9b41532c73d4afbc6d2ac1cfc551'||a.workflow_run?.id!==43121646075||a.workflow_run?.head_sha!=='14071b396f8c9c66b70cf630d8823692a4521bd3')throw Error();
           console.log('original_artifact_metadata_verified');
          }catch{console.log('original_metadata_unavailable');process.exitCode=1;}
          NODE
      - name: Validate dedicated custody material before fixture use
        id: key_preflight
        env:
          AFW_SYN_CHECKPOINT_KEY: ${{ secrets.AFW_SYN_CHECKPOINT_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node test/fixtures/finite-checkpoint-custody.mjs key-preflight consumer-failure
      - name: Download historical by exact ID attempt 1
        id: historical_1
        if: success()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '43121646075'
          artifact-ids: '13902156351'
          path: ${{ runner.temp }}/afw-inspect-input
          merge-multiple: true
      - name: Wait 2s before historical retrieval 2
        id: historical_wait2
        if: always() && !cancelled() && steps.historical_1.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sleep 2
      - name: Download historical by exact ID attempt 2
        id: historical_2
        if: always() && !cancelled() && steps.historical_wait2.outcome == 'success' && steps.historical_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '43121646075'
          artifact-ids: '13902156351'
          path: ${{ runner.temp }}/afw-inspect-input
          merge-multiple: true
      - name: Wait 5s before historical retrieval 3
        id: historical_wait3
        if: always() && !cancelled() && steps.historical_2.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sleep 5
      - name: Download historical by exact ID attempt 3
        id: historical_3
        if: always() && !cancelled() && steps.historical_wait3.outcome == 'success' && steps.historical_2.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '43121646075'
          artifact-ids: '13902156351'
          path: ${{ runner.temp }}/afw-inspect-input
          merge-multiple: true
      - name: Check the exterior closed inventory and original context
        id: outer
        if: always() && !cancelled() && steps.key_preflight.outcome == 'success'
        env:
          ARTIFACT_ID: '13902156351'
          DOWNLOADED: ${{ steps.historical_1.outcome == 'success' || steps.historical_2.outcome == 'success' || steps.historical_3.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$ARTIFACT_ID"
          test "$DOWNLOADED" = true || { echo evidence_not_preserved; exit 1; }
          node --input-type=module <<'NODE'
          import {readdir,lstat,readFile} from 'node:fs/promises';import {join} from 'node:path';import {createHash} from 'node:crypto';import {isDeepStrictEqual} from 'node:util';
          try{
           const dir=join(process.env.RUNNER_TEMP,'afw-inspect-input'),context={"purpose":"afw.finite-checkpoint-custody.syn.v1","repository":"tokenizartinfo-ops/agent-friendly-web","ref":"refs/heads/feat/finite-native-cleanup-20261101","sourceSha":"14071b396f8c9c66b70cf630d8823692a4521bd3","runId":"43121646075","runAttempt":1,"kind":"consumer-failure"},hash=b=>createHash('sha256').update(b).digest('hex');
