name: AFW finite budget qualification
run-name: AFW Task1 corrected four file historical classification ${{ github.sha }}
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-finite-budget-qualification.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
jobs:
  classify:
    name: four-file-${{ matrix.side }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: A
            source: eaf019aa872709d867aac53d9684ecdf1c21d013
          - side: B
            source: f5f52660d19ec9fc634bbc49558db75582fdaf88
    env:
      AFW_TEST_SOURCE: ${{ matrix.source }}
      AFW_WORKFLOW_SHA: ${{ github.sha }}
      AFW_AB_SIDE: ${{ matrix.side }}
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Require the fixed AFW source and first attempt
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = tokenizartinfo-ops/agent-friendly-web
          test "$GITHUB_REF" = refs/heads/feat/finite-native-cleanup-20261101
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_SHA" = "$AFW_WORKFLOW_SHA"
          test -z "${AFW_BUDGET_DIAGNOSTIC_CANDIDATE+x}"
          test -z "${AFW_BUDGET_GROUP+x}"
          mkdir -m 700 "$RUNNER_TEMP/afw-fourfile-ab"
          mkdir -m 700 "$RUNNER_TEMP/afw-fourfile-ab/private"
          mkdir -m 700 "$RUNNER_TEMP/afw-fourfile-ab/public"
      - name: Checkout this exact revision
        uses: actions/checkout@v4
        with:
          repository: tokenizartinfo-ops/agent-friendly-web
          ref: ${{ matrix.source }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact historical checkout and identical locked inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AFW_TEST_SOURCE"
          test "$(git hash-object package.json)" = f4fd38ac380c46a149d8cf0f3bd828a28406f761
          test "$(git hash-object package-lock.json)" = 36a8cd4b7d369d293ffd8c1fc5a29a0b97a7265b
          test -z "${AFW_BUDGET_GROUP+x}"
          printf 'historical_checkout_verified side=%s test_source=%s workflow_source=%s\n' "$AFW_AB_SIDE" "$AFW_TEST_SOURCE" "$AFW_WORKFLOW_SHA"
      - name: Use Node 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install the locked fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npm ci --ignore-scripts --no-audit --no-fund >"$RUNNER_TEMP/afw-locked-install.log" 2>&1 || { echo locked_install_failed; exit 1; }
      - name: Prepare temporary Node reporter and bounded wrapper
        id: reporter_setup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat >"$RUNNER_TEMP/afw-fourfile-ab/reporter.mjs" <<'AFW_REPORTER'
          import {readFileSync,writeFileSync,renameSync} from 'node:fs';
          import {resolve} from 'node:path';
          import {createHash} from 'node:crypto';
          const env=process.env,source=env.GITHUB_SHA,run=env.GITHUB_RUN_ID,attempt=Number(env.GITHUB_RUN_ATTEMPT),workflowSource=env.AFW_WORKFLOW_SHA,side=env.AFW_AB_SIDE;
          if(!/^[a-f0-9]{40}$/.test(source??'')||!/^\d+$/.test(run??'')||attempt!==1||!/^[a-f0-9]{40}$/.test(workflowSource??'')||!['A','B'].includes(side))throw Error('reporter context');
          const allowed=JSON.parse(readFileSync(env.AFW_REPORTER_ALLOWLIST,'utf8')),paths=new Map();
          for(const path of allowed){if(!/^test\/[A-Za-z0-9_.-]+\.test\.mjs$/.test(path))throw Error('reporter allowlist');paths.set(resolve(path),path);}
          const counters=()=>({dequeued:0,completed:0,passed:0,failed:0,skipped:0,todo:0,summaries:0});
          const state={source,workflowSource,side,run,attempt,utc:new Date().toISOString(),elapsedMs:0,counts:counters(),files:allowed.map(file=>({file,type:null,line:null,column:null,nesting:null,counts:counters(),summary:null,codes:[],failures:[],failureRecordsOmitted:0})),totals:null};
          const files=new Map(state.files.map(row=>[row.file,row])),started=Date.now(),codes=new Set(['ERR_ASSERTION','ERR_TEST_FAILURE','ERR_TEST_TIMEOUT','ERR_INVALID_ARG_TYPE','ERR_MODULE_NOT_FOUND','ERR_UNKNOWN_BUILTIN_MODULE']);
          const data=(o,k)=>{if(!o||typeof o!=='object')return undefined;const d=Object.getOwnPropertyDescriptor(o,k);return d&&Object.hasOwn(d,'value')?d.value:undefined;};
          const num=value=>Number.isSafeInteger(value)&&value>=0?value:null;
          const scalar=value=>typeof value==='number'&&Number.isFinite(value)&&value>=0?value:null;
          const countKeys=['tests','suites','passed','failed','cancelled','skipped','todo','topLevel'];
          const summary=d=>({counts:Object.fromEntries(countKeys.map(k=>[k,num(data(data(d,'counts'),k))])),success:data(d,'success')===true?1:data(d,'success')===false?0:null,durationMs:scalar(data(d,'duration_ms'))});
          const plus=(target,key)=>{target[key]=target[key]===null?null:num(target[key]+1);};
          function persist(){state.utc=new Date().toISOString();state.elapsedMs=Date.now()-started;writeFileSync(env.AFW_REPORTER_STATE+'.tmp',JSON.stringify(state),{mode:0o600});renameSync(env.AFW_REPORTER_STATE+'.tmp',env.AFW_REPORTER_STATE);}
          function errorCodes(error){const found=[];for(let i=0;i<2&&error;i++,error=data(error,'cause')){const code=data(error,'code');if(codes.has(code)&&!found.includes(code))found.push(code);}return found;}
          
          function failureDetails(error){
           const messageHashes=[];let messageTooLarge=0;
           for(let depth=0;depth<3&&error;depth++,error=data(error,'cause')){
            const message=data(error,'message');
            if(typeof message!=='string'){messageHashes.push(null);continue;}
            if(Buffer.byteLength(message,'utf8')>1048576){messageHashes.push(null);messageTooLarge=1;continue;}
            const hash=createHash('sha256').update(message,'utf8').digest('hex');if(!messageHashes.includes(hash))messageHashes.push(hash);
           }
           return {messageHashes,messageTooLarge};
          }
          
          export default async function* reporter(events){
           persist();const timer=setInterval(persist,1000);timer.unref();let lastOutput=0;
           try{
            for await(const event of events){
             if(!['test:dequeue','test:complete','test:summary'].includes(event.type))continue;
             const d=event.data,fileValue=data(d,'file'),file=typeof fileValue==='string'?paths.get(resolve(fileValue))??null:null,row=files.get(file);
             const record={type:event.type,source,workflowSource,side,run,attempt,utc:new Date().toISOString(),elapsedMs:Date.now()-started,file,line:num(data(d,'line')),column:num(data(d,'column')),nesting:num(data(d,'nesting'))};
             if(row){row.type=event.type;for(const key of ['line','column','nesting'])if(record[key]!==null)row[key]=record[key];}
             if(event.type==='test:dequeue'){plus(state.counts,'dequeued');if(row)plus(row.counts,'dequeued');}
             if(event.type==='test:complete'){
              const detail=data(d,'details'),passed=data(detail,'passed'),skip=data(d,'skip'),todo=data(d,'todo');
              const increments=['completed',...(passed===true?['passed']:passed===false?['failed']:[]),...(skip!==undefined&&skip!==false?['skipped']:[]),...(todo!==undefined&&todo!==false?['todo']:[])];
              for(const key of increments){plus(state.counts,key);if(row)plus(row.counts,key);}
              record.passed=passed===true?1:0;record.failed=passed===false?1:0;record.codes=errorCodes(data(detail,'error'));
              if(row)row.codes=[...new Set([...row.codes,...record.codes])];
              if(passed===false){Object.assign(record,failureDetails(data(detail,'error')));record.testNumber=num(data(d,'testNumber'));if(row){if(row.failures.length<128)row.failures.push({file,line:record.line,column:record.column,nesting:record.nesting,testNumber:record.testNumber,codes:record.codes,messageHashes:record.messageHashes,messageTooLarge:record.messageTooLarge});else plus(row,'failureRecordsOmitted');}}
             }
             if(event.type==='test:summary'){plus(state.counts,'summaries');record.summary=summary(d);if(row){plus(row.counts,'summaries');row.summary=record.summary;}if(fileValue===undefined)state.totals=record.summary;}
             if(event.type==='test:summary'||record.failed===1)persist();
             if(Date.now()-lastOutput>=1000||event.type==='test:summary'||record.failed===1){lastOutput=Date.now();const line=JSON.stringify(record);if(Buffer.byteLength(line)>2048)throw Error('reporter record bound');yield line+'\n';}
            }
           }finally{clearInterval(timer);persist();}
          }
          
          AFW_REPORTER
          cat >"$RUNNER_TEMP/afw-fourfile-ab/wrapper.mjs" <<'AFW_WRAPPER'
          import assert from 'node:assert/strict';
          import {spawn,execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync,mkdirSync,openSync,closeSync,existsSync,readdirSync,createReadStream,statSync} from 'node:fs';
          import {join,resolve} from 'node:path';
          import {createHash} from 'node:crypto';
          const env=process.env,root=join(env.RUNNER_TEMP,'afw-fourfile-ab'),privateDir=join(root,'private'),publicDir=join(root,'public'),reporter=join(root,'reporter.mjs'),mode=process.argv[2];
          assert(['plumbing','four'].includes(mode));assert(/^[a-f0-9]{40}$/.test(env.GITHUB_SHA));assert(/^\d+$/.test(env.GITHUB_RUN_ID));assert.equal(env.GITHUB_RUN_ATTEMPT,'1');
          assert(/^[a-f0-9]{40}$/.test(env.AFW_WORKFLOW_SHA));assert(['A','B'].includes(env.AFW_AB_SIDE));assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),env.GITHUB_SHA);
          const context={source:env.GITHUB_SHA,workflowSource:env.AFW_WORKFLOW_SHA,side:env.AFW_AB_SIDE,run:env.GITHUB_RUN_ID,attempt:1};
          const digest=async path=>{if(!existsSync(path))return {bytes:null,sha256:null};const bytes=statSync(path).size,hash=createHash('sha256');for await(const chunk of createReadStream(path,{highWaterMark:65536}))hash.update(chunk);return {bytes,sha256:hash.digest('hex')};};
          const read=path=>{try{return JSON.parse(readFileSync(path,'utf8'));}catch{return null;}};
          const safeSummary=result=>({type:'diagnostic:result',...context,status:result.status,exit:result.exit,elapsedMs:result.elapsedMs,counts:result.state?.counts??null,totals:result.state?.totals??null});
          async function execute(label,files,allowlist,limit){
           const base=join(privateDir,label);mkdirSync(base,{mode:0o700});
           const manifest=join(base,'allowlist.json'),statePath=join(base,'progress.json'),specPath=join(base,'spec.log'),progressPath=join(base,'progress.ndjson'),stderrPath=join(base,'stderr.log');
           writeFileSync(manifest,JSON.stringify(allowlist),{mode:0o600});
           const childEnv={...env,AFW_REPORTER_ALLOWLIST:manifest,AFW_REPORTER_STATE:statePath};delete childEnv.AFW_BUDGET_GROUP;delete childEnv.NODE_TEST_CONTEXT;
           const specFd=openSync(specPath,'wx',0o600),stderrFd=openSync(stderrPath,'wx',0o600);closeSync(specFd);
           const args=['--test','--test-reporter=spec','--test-reporter='+reporter,'--test-reporter-destination='+specPath,'--test-reporter-destination='+progressPath,...files];
           const started=Date.now(),child=spawn(process.execPath,args,{env:childEnv,detached:true,stdio:['ignore','ignore',stderrFd]});
           let timedOut=false,killDone=null,startup=false;
           child.once('error',()=>{startup=true;});
           const stop=()=>{timedOut=true;killDone=new Promise(done=>{try{process.kill(-child.pid,'SIGTERM');}catch{}setTimeout(()=>{try{process.kill(-child.pid,'SIGKILL');}catch{}done();},5000);});};
           const deadline=setTimeout(stop,limit);
           const breadcrumbs=setInterval(()=>{if(label!=='four')return;const s=read(statePath),line='AFW_ORDINARY_PROGRESS '+JSON.stringify({type:'diagnostic:progress',...context,utc:new Date().toISOString(),elapsedMs:Date.now()-started,counts:s?.counts??null,filesStarted:s?.files.filter(f=>f.counts.dequeued>0).length??null,filesWithSummary:s?.files.filter(f=>f.summary!==null).length??null,pending:s?.files.filter(f=>f.counts.dequeued>f.counts.completed&&f.summary===null).slice(0,4).map(({file,type,line,column,nesting})=>({file,type,line,column,nesting}))??null});assert(Buffer.byteLength(line)<=2048);console.log(line);},15000);
           const exit=await new Promise(done=>child.once('close',code=>done(Number.isSafeInteger(code)&&code>=0?code:null)));
           clearTimeout(deadline);if(killDone)await killDone;clearInterval(breadcrumbs);closeSync(stderrFd);
           const state=read(statePath),status=timedOut?'timeout':startup?'unknown':exit===0&&state?.totals?.success===1?'passed':exit!==null&&state?.totals?'failed':'unknown';
           const result={...context,status,exit,elapsedMs:Date.now()-started,state,spec:await digest(specPath),stderr:await digest(stderrPath),progress:await digest(progressPath)};
           writeFileSync(join(base,'result.json'),JSON.stringify(result),{mode:0o600});return result;
          }
          try{
           if(mode==='plumbing'){
            const canary='AFW_REPORTER_CANARY_PAYLOAD_MUST_NOT_ESCAPE';
            const sources={
             pass:"import test from 'node:test';test('"+canary+"',t=>{console.log('"+canary+"');console.error('"+canary+"');t.diagnostic('"+canary+"');});",
             fail:"import test from 'node:test';test('"+canary+"',()=>{throw Object.assign(Error('"+canary+"'),{code:'ERR_ASSERTION',actual:'"+canary+"',expected:'"+canary+"'});});",
             hang:"import test from 'node:test';test('"+canary+"',async()=>{console.log('"+canary+"');await new Promise(resolve=>setTimeout(resolve,60000));});"
            },results=[];
            for(const label of ['pass','fail','hang']){
             const path=join(privateDir,label+'.test.mjs');writeFileSync(path,sources[label],{mode:0o600});
             const result=await execute(label,[path],[],label==='hang'?2000:15000);
             results.push(safeSummary(result));writeFileSync(join(publicDir,'plumbing-progress.json'),JSON.stringify(results),{mode:0o600});
             const output=readFileSync(join(privateDir,label,'progress.ndjson'),'utf8'),checkpoint=JSON.stringify(result.state);
             assert(!output.includes(canary)&&!checkpoint.includes(canary));assert(result.state?.counts.dequeued>0);assert(readFileSync(join(privateDir,label,'spec.log'),'utf8').includes(canary));
             if(label==='pass'){assert.equal(result.status,'passed');assert.equal(result.state.totals.counts.tests,1);assert.equal(result.state.totals.counts.passed,1);}
             if(label==='fail'){assert.equal(result.status,'failed');assert.equal(result.exit,1);assert.equal(result.state.totals.counts.failed,1);}
             if(label==='hang'){assert.equal(result.status,'timeout');assert(result.state.counts.completed<result.state.counts.dequeued);}
             results[results.length-1]={...safeSummary(result),canaryEmitted:0,partialPreserved:1};
            }
            writeFileSync(join(publicDir,'plumbing.json'),JSON.stringify(results),{mode:0o600});
            console.log('AFW_REPORTER_PLUMBING '+JSON.stringify({type:'plumbing:summary',...context,pass:1,fail:1,hang:1,canaryEmitted:0,partialPreserved:1}));
           }else{
            assert(existsSync(join(publicDir,'plumbing.json')));
            const files=['test/mcp-own-finite-entrypoints.test.mjs','test/mcp-qa-cloud-native-cli.test.mjs','test/mcp-qa-finite-adoption-wait.test.mjs','test/mcp-qa-finite-command.test.mjs'];
            assert.deepEqual(files,[...files].sort());assert(files.every(file=>existsSync(file)));
            const pkg=JSON.parse(readFileSync('package.json','utf8'));assert.equal(pkg.scripts.test,'node --test --test-reporter=spec test/*.test.mjs');
            const result=await execute('four',files,files,120000);
            const publicResult={...safeSummary(result),utc:new Date().toISOString(),fileCount:files.length,command:'node --test --test-reporter=spec --test-reporter=<temporary-safe-reporter> --test-reporter-destination=<private-spec> --test-reporter-destination=<safe-progress> test/mcp-own-finite-entrypoints.test.mjs test/mcp-qa-cloud-native-cli.test.mjs test/mcp-qa-finite-adoption-wait.test.mjs test/mcp-qa-finite-command.test.mjs',literalNpmTest:0,spec:result.spec,stderr:result.stderr,progress:result.progress};
            writeFileSync(join(publicDir,'result.json'),JSON.stringify(publicResult),{mode:0o600});
            writeFileSync(join(publicDir,'progress.json'),JSON.stringify(result.state),{mode:0o600});
            for(const file of result.state?.files??[]){console.log('AFW_AB_FILE '+JSON.stringify({...context,file:file.file,counts:file.counts,summary:file.summary,codes:file.codes,failureRecordsOmitted:file.failureRecordsOmitted}));for(const failure of file.failures){const row={...context,...failure};let line='AFW_AB_FAILURE '+JSON.stringify(row);assert(Buffer.byteLength(line)<=2048);console.log(line);}}
            const line='AFW_AB_DIAGNOSTIC '+JSON.stringify(publicResult);assert(Buffer.byteLength(line)<=2048);console.log(line);
            if(result.status!=='passed')process.exitCode=1;
           }
          }catch{
           writeFileSync(join(publicDir,'setup-status.json'),JSON.stringify({type:'diagnostic:result',...context,status:'unknown',utc:new Date().toISOString()}),{mode:0o600});
           console.log('diagnostic_setup_failed');process.exitCode=1;
          }
          
          AFW_WRAPPER
          cat >"$RUNNER_TEMP/afw-fourfile-ab/recorder-probe.mjs" <<'AFW_PROBE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {pathToFileURL} from 'node:url';
          const [modulePath,eventPath,mode]=process.argv.slice(2),event=JSON.parse(readFileSync(eventPath,'utf8'));let stackProbes=0,errorsProbes=0,stackGetterCalls=0,errorsGetterCalls=0;
          if(mode==='guarded'){
           const error=event.data.details.error;
           Object.defineProperty(error,'stack',{get(){stackGetterCalls++;throw Error('stack forbidden');}});
           Object.defineProperty(error,'errors',{get(){errorsGetterCalls++;throw Error('errors forbidden');}});
           event.data.details.error=new Proxy(error,{
            getOwnPropertyDescriptor(target,key){if(key==='stack'){stackProbes++;throw Error('stack descriptor forbidden');}if(key==='errors'){errorsProbes++;throw Error('errors descriptor forbidden');}return Reflect.getOwnPropertyDescriptor(target,key);},
            get(target,key,receiver){if(key==='stack'){stackProbes++;throw Error('stack forbidden');}if(key==='errors'){errorsProbes++;throw Error('errors forbidden');}return Reflect.get(target,key,receiver);}
           });
          }
          const {default:reporter}=await import(pathToFileURL(modulePath));
          async function* events(){yield event;}
          const records=[];for await(const line of reporter(events()))records.push(JSON.parse(line));
          const state=JSON.parse(readFileSync(process.env.AFW_REPORTER_STATE,'utf8'));
          process.stdout.write(JSON.stringify({records,state,stackProbes,errorsProbes,stackGetterCalls,errorsGetterCalls}));
          
          AFW_PROBE
          cat >"$RUNNER_TEMP/afw-fourfile-ab/recorder-control.mjs" <<'AFW_CONTROL'
          import assert from 'node:assert/strict';
          import {spawnSync,execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          import {join,resolve} from 'node:path';
          import {createHash} from 'node:crypto';
          const env=process.env,root=join(env.RUNNER_TEMP,'afw-fourfile-ab'),privateDir=join(root,'private'),publicDir=join(root,'public'),controlDir=join(privateDir,'recorder-control');
          mkdirSync(controlDir,{mode:0o700});
          const hash=value=>createHash('sha256').update(value).digest('hex');
          const workflow=execFileSync('git',['show','41b7cefae63c5ba335ad846f4f3eb32bf47e27d7:.github/workflows/afw-finite-budget-qualification.yml'],{encoding:'utf8',maxBuffer:1024*1024});
          assert.equal(execFileSync('git',['hash-object','--stdin'],{input:workflow,encoding:'utf8'}).trim(),'672a5ed9fd0281eff42d97542708285e516423fd');
          const begin=workflow.indexOf("<<'AFW_REPORTER'\n")+"<<'AFW_REPORTER'\n".length,end=workflow.indexOf('          AFW_REPORTER\n',begin);
          assert(begin>=18&&end>begin);
          const oldText=workflow.slice(begin,end).split('\n').map(line=>{assert(line===''||line.startsWith('          '));return line.slice(10);}).join('\n');
          const oldPath=join(controlDir,'old-reporter.mjs');writeFileSync(oldPath,oldText,{mode:0o600});
          const canary='AFW_MODELED_RECORDER_CANARY_MUST_NOT_ESCAPE',sourceFile='test/mcp-own-finite-entrypoints.test.mjs',payload=Buffer.alloc(786433).toString('base64');
          const stack='Error: '+canary+'\n    at data:text/javascript;base64,'+payload+':1:1\n    at '+resolve(sourceFile)+':10:1';
          assert(Buffer.byteLength(stack)>=1048576);
          const event={type:'test:complete',data:{file:resolve(sourceFile),line:10,column:1,nesting:0,testNumber:1,name:canary,details:{passed:false,error:{code:'ERR_ASSERTION',message:canary+'M'.repeat(1048577),stack,cause:null}}}};
          const eventPath=join(controlDir,'event.json');writeFileSync(eventPath,JSON.stringify(event),{mode:0o600});
          const allowlist=join(controlDir,'allowlist.json'),sources=join(controlDir,'sources.json');writeFileSync(allowlist,JSON.stringify([sourceFile]),{mode:0o600});writeFileSync(sources,JSON.stringify([sourceFile]),{mode:0o600});
          const rows=[];
          for(const [kind,modulePath,mode,deadline]of [['old',oldPath,'data',1000],['new',join(root,'reporter.mjs'),'data',3000],['new_guarded',join(root,'reporter.mjs'),'guarded',3000]]){
           const childEnv={...env,AFW_REPORTER_ALLOWLIST:allowlist,AFW_REPORTER_SOURCE_ALLOWLIST:sources,AFW_REPORTER_STATE:join(controlDir,kind+'-state.json')};delete childEnv.AFW_BUDGET_GROUP;delete childEnv.NODE_TEST_CONTEXT;
           const started=Date.now(),run=spawnSync(process.execPath,[join(root,'recorder-probe.mjs'),modulePath,eventPath,mode],{env:childEnv,timeout:deadline,killSignal:'SIGKILL',encoding:'utf8',maxBuffer:2*1024*1024});
           const elapsedMs=Date.now()-started,status=run.error?.code==='ETIMEDOUT'?'timeout':run.status===0?'completed':'setup_failure';
           const row={type:'recorder:control',source:env.GITHUB_SHA,workflowSource:env.AFW_WORKFLOW_SHA,side:env.AFW_AB_SIDE,run:env.GITHUB_RUN_ID,attempt:1,kind,status,elapsedMs,deadlineMs:deadline,exit:run.status,stackBytes:Buffer.byteLength(stack),eventSha256:hash(readFileSync(eventPath)),oldWorkflowBlob:'672a5ed9fd0281eff42d97542708285e516423fd',moduleSha256:hash(readFileSync(modulePath)),stdoutBytes:Buffer.byteLength(run.stdout??''),stdoutSha256:hash(run.stdout??''),stderrBytes:Buffer.byteLength(run.stderr??''),stderrSha256:hash(run.stderr??'')};
           if(kind!=='old'){
            assert.equal(status,'completed');const data=JSON.parse(run.stdout);
            assert(!run.stdout.includes(canary));assert.equal(data.stackProbes,0);assert.equal(data.errorsProbes,0);assert.equal(data.stackGetterCalls,0);assert.equal(data.errorsGetterCalls,0);
            const record=data.records.find(r=>r.type==='test:complete');assert(record);assert.equal(record.file,sourceFile);assert.equal(record.line,10);assert.equal(record.column,1);assert.deepEqual(record.codes,['ERR_ASSERTION']);assert.equal(record.messageTooLarge,1);assert(record.messageHashes.includes(null));
            const forbidden=['stack','errors','name','message','actual','expected'];
            function walk(value){if(!value||typeof value!=='object')return;for(const [key,item]of Object.entries(value)){assert(!forbidden.includes(key));walk(item);}}
            walk(data.records);walk(data.state);
            Object.assign(row,{safeIdentity:1,canaryEmitted:0,stackProbes:0,errorsProbes:0,stackGetterCalls:0,errorsGetterCalls:0,messageTooLarge:1});
           }else{assert(['timeout','completed'].includes(status));if(status==='completed')assert(!(run.stdout??'').includes(canary));}
           rows.push(row);writeFileSync(join(publicDir,'recorder-control.json'),JSON.stringify(rows),{mode:0o600});console.log('AFW_RECORDER_CONTROL '+JSON.stringify(row));
          }
          
          AFW_CONTROL
          node --check "$RUNNER_TEMP/afw-fourfile-ab/recorder-probe.mjs" >>"$RUNNER_TEMP/afw-fourfile-ab/private/syntax.log" 2>&1 || { echo recorder_setup_failed; exit 1; }
          node --check "$RUNNER_TEMP/afw-fourfile-ab/recorder-control.mjs" >>"$RUNNER_TEMP/afw-fourfile-ab/private/syntax.log" 2>&1 || { echo recorder_setup_failed; exit 1; }
          node --check "$RUNNER_TEMP/afw-fourfile-ab/reporter.mjs" >"$RUNNER_TEMP/afw-fourfile-ab/private/syntax.log" 2>&1 || { echo reporter_setup_failed; exit 1; }
          node --check "$RUNNER_TEMP/afw-fourfile-ab/wrapper.mjs" >>"$RUNNER_TEMP/afw-fourfile-ab/private/syntax.log" 2>&1 || { echo reporter_setup_failed; exit 1; }
      - name: Validate reporter plumbing pass fail hang and canary suppression
        id: plumbing
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$AFW_TEST_SOURCE" node "$RUNNER_TEMP/afw-fourfile-ab/wrapper.mjs" plumbing
      - name: Validate modeled large-stack recorder omission against exact old module
        id: recorder_control
        if: steps.plumbing.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          code=0
          GITHUB_SHA="$AFW_TEST_SOURCE" node "$RUNNER_TEMP/afw-fourfile-ab/recorder-control.mjs" >"$RUNNER_TEMP/afw-fourfile-ab/private/recorder-control.log" 2>&1 || code=$?
          GITHUB_SHA="$AFW_TEST_SOURCE" AFW_CONTROL_EXIT="$code" node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const env=process.env,root=env.RUNNER_TEMP+'/afw-fourfile-ab',path=root+'/public/recorder-control.json';
          let rows=[];try{rows=JSON.parse(readFileSync(path,'utf8'));}catch{}
          assert(Array.isArray(rows)&&rows.length<=3);
          const keys=['type','source','workflowSource','side','run','attempt','kind','status','elapsedMs','deadlineMs','exit','stackBytes','eventSha256','oldWorkflowBlob','moduleSha256','stdoutBytes','stdoutSha256','stderrBytes','stderrSha256','safeIdentity','canaryEmitted','stackProbes','errorsProbes','stackGetterCalls','errorsGetterCalls','messageTooLarge'];
          for(const row of rows){
           assert(Object.keys(row).every(key=>keys.includes(key)));assert.equal(row.source,env.GITHUB_SHA);assert.equal(row.workflowSource,env.AFW_WORKFLOW_SHA);assert.equal(row.side,env.AFW_AB_SIDE);
           assert(['old','new','new_guarded'].includes(row.kind)&&['timeout','completed','setup_failure'].includes(row.status));
           const line='AFW_RECORDER_CONTROL '+JSON.stringify(row);assert(Buffer.byteLength(line)<=2048);console.log(line);
          }
          const raw=readFileSync(root+'/private/recorder-control.log');
          const status={type:'recorder:control',source:env.GITHUB_SHA,workflowSource:env.AFW_WORKFLOW_SHA,side:env.AFW_AB_SIDE,run:env.GITHUB_RUN_ID,attempt:1,status:env.AFW_CONTROL_EXIT==='0'?'passed':'unknown',exit:Number(env.AFW_CONTROL_EXIT),logBytes:raw.length,logSha256:createHash('sha256').update(raw).digest('hex')};
          writeFileSync(root+'/public/recorder-control-status.json',JSON.stringify(status));console.log('AFW_RECORDER_CONTROL_STATUS '+JSON.stringify(status));
          NODE
          test "$code" = 0 || { echo recorder_control_failed; exit 1; }
      - name: Classify exactly four files with reporter and 120 second deadline
