          writeFileSync(join(root,'binding.json'),JSON.stringify({sourceTree,sourceBase:p.sourceBase,programsVerified:true,programCount:expected.count,programSetSha256:expected.setSha256,payloadExpandedSha256:expected.expandedSha256,production:p.production,core:p.core,sourcePins:p.sourcePins,prefixVerified:true,sourcePinsVerified:true}),{mode:0o600,flag:'wx'});
          
          NODE
      - name: Install the unchanged locked cloud dependencies
