          try{
           const root=process.env.RUNNER_TEMP;const receipt=await openDirectory({context:{"purpose":"afw.finite-checkpoint-custody.syn.v1","repository":"tokenizartinfo-ops/agent-friendly-web","ref":"refs/heads/feat/finite-native-cleanup-20261101","sourceSha":"14071b396f8c9c66b70cf630d8823692a4521bd3","runId":"43121646075","runAttempt":1,"kind":"consumer-failure"},stagingDir:join(root,'afw-inspect-input'),destinationDir:join(root,'afw-inspect-private')});
