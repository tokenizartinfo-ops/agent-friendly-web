        id: qualification
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node "$RUNNER_TEMP/afw-r3/qualify.mjs" >"$RUNNER_TEMP/afw-r3-qualify-private.log" 2>&1
      - name: Print only the closed bounded qualification wire
        if: always() && !cancelled() && steps.bootstrap.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/afw-r3/qualifier-emit.mjs"
