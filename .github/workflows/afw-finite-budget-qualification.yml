           const source=new TextDecoder('utf-8',{fatal:true}).decode(checked.tests);assert(Buffer.from(source).equals(checked.tests));const anchors=[...source.matchAll(/^test\('(b\d\d_[^']+)',/gm)];assert.deepEqual(anchors.map(m=>m[1]),TEST_IDS);assert.equal(anchors.length,32);const index=anchors.findIndex(m=>m[1]==='b09_real_multiline_enumerable_poison');assert.equal(index,8);const prefix=source.slice(0,anchors[0].index),original=source.slice(anchors[index].index,anchors[index+1].index).trimEnd();
           for(const [key,text]of [['prefix',prefix],['family',original]]){assert.equal(Buffer.byteLength(text),BOUNDS[key].bytes);assert.equal(sha(Buffer.from(text)),BOUNDS[key].sha256);}
           const replaceOne=(text,from,to)=>{assert.equal(text.split(from).length,2);return text.replace(from,()=>to);};let instrumented=original;
           for(const [from,to]of PAIRS)instrumented=replaceOne(instrumented,from,to);let reversed=instrumented;for(const [from,to]of PAIRS.slice().reverse())reversed=replaceOne(reversed,to,from);assert.equal(reversed,original);
           const opening="test('b09_real_multiline_enumerable_poison',async()=>{";
           instrumented=replaceOne(instrumented,opening,opening+"\n let __b09Phase='entry',__b09Stats=null;try{");
           assert(instrumented.endsWith('\n});'));instrumented=instrumented.slice(0,-4)+" __b09Phase='complete';__b09Emit('not_reproduced',null,__b09Phase,__b09Stats);\n }catch(error){__b09Emit('observed_failure',error,__b09Phase,__b09Stats);throw error;}\n});";
           const text=prefix+HELPERS+'\n'+instrumented+'\n';assert.deepEqual([...text.matchAll(/^test\('(b\d\d_[^']+)',/gm)].map(m=>m[1]),['b09_real_multiline_enumerable_poison']);assert(Buffer.byteLength(text)<=32768);
           assert(typeof e.RUNNER_TEMP==='string'&&isAbsolute(e.RUNNER_TEMP)&&resolve(e.RUNNER_TEMP)===e.RUNNER_TEMP);const root=join(e.RUNNER_TEMP,'afw-readonly-b09-diagnostic-owned');await mkdir(root,{mode:0o700});
           try{
            const fixtures=join(root,'test','fixtures');await mkdir(fixtures,{recursive:true,mode:0o700});for(const key of ['observer','helper'])await writeFile(join(fixtures,PINS[key].path.split('/').at(-1)),checked[key],{flag:'wx',mode:0o600});const file=join(root,'test','finite-budget-readonly-observer.test.mjs');await writeFile(file,text,{flag:'wx',mode:0o600});
            const childEnv={...e};for(const key of ['NODE_OPTIONS','GH_ARTIFACT_TOKEN','AFW_SYN_CHECKPOINT_KEY','NODE_TEST_CONTEXT'])delete childEnv[key];
            const child=spawnSync(process.execPath,['--test','--test-reporter=tap',file],{cwd:root,env:childEnv,encoding:'utf8',timeout:30000,maxBuffer:65536});assert.equal(child.error,undefined);assert.equal(child.signal,null);assert.equal(child.stderr,'');assert(Buffer.byteLength(child.stdout)<=65536);assert([0,1].includes(child.status));
