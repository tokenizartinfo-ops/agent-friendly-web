        run: |
          set -euo pipefail
          umask 077
          npm ci --ignore-scripts --no-audit --no-fund >"$RUNNER_TEMP/afw-r3-install-private.log" 2>&1
      - name: Check syntax and lint the three scoped Source leaves
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for file in test/fixtures/finite-budget-world.mjs test/fixtures/finite-owner-cleanup.mjs test/finite-budget-r3-existing-sample.test.mjs; do node --check "$file" >>"$RUNNER_TEMP/afw-r3-syntax-private.log" 2>&1; done
