name: AFW frontiers final fix controls
run-name: AFW final fix control-only qualification ${{ github.sha }}
on:
  push:
    branches:
      - feat/finite-native-cleanup-20261101
    paths:
      - .github/workflows/afw-finite-budget-qualification.yml
permissions:
  contents: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
# INACTIVE. One control-only job; future Native programs remain DATA and are never invoked.
jobs:
  controls:
