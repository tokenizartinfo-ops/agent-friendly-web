             fence:present(n.fence,'fenced_at',truth),grantAbsentOrRevoked:present(n,'grant',g=>!g||g.revoked_at),
             noticesGrantThenRevoke:actions?actions.length===2&&actions[0]==='grant'&&actions[1]==='revoke':null,finalInventory:present(facts,'finalInventoryProof',truth),
             sdkCompletedOnce:present(producer,'completeNormal',v=>v===1),referenceOnce:present(producer,'referenceRows',v=>v===1),referenceReadback:present(producer,'referenceReadbacks',v=>v>0),
             postExchangePresent:present(v,'sdkAfterExchange',truth),sdkExpiresByC0:expires!==null&&C0!==null?expires*1000<=C0:null
            };
            return {kind:'businessPosthoc',...numbers,readyBeforeC0Ms:before,readyMarginSlackMs:diff(before,30000),dbAfterC0Ms:after,bitmap};
