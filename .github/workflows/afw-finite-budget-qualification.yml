            const marker='# AFW_READONLY_B09_DIAGNOSTIC_CHILD/1 ',lines=child.stdout.split('\n').filter(line=>line.startsWith(marker));assert.equal(lines.length,1);assert(Buffer.byteLength(lines[0])<=2048);const raw=lines[0].slice(marker.length),diagnostic=validateDiagnostic(JSON.parse(raw));assert.equal(JSON.stringify(diagnostic),raw);
