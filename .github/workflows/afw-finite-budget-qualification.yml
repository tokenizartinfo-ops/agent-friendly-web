name: AFW finite budget qualification
run-name: AFW ordinary excluded-reader verification ${{ github.sha }}
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-finite-budget-qualification.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
env:
  AFW_BUDGET_GROUP: positive
jobs:
  pure:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Static checks and eight pure contract groups before I0
        shell: bash
        run: |
          mkdir -p output/finite-budget/pure
          set -o pipefail
          files=(test/fixtures/finite-budget-diagnostics.mjs test/fixtures/finite-budget-world.mjs test/finite-budget-diagnostics.test.mjs)
          for file in "${files[@]}"; do node --check "$file"; done
          npx eslint "${files[@]}" 2>&1 | tee output/finite-budget/pure/lint.log
          node --test test/finite-budget-diagnostics.test.mjs 2>&1 | tee output/finite-budget/pure/tests.log
          node --input-type=module -e "import assert from 'node:assert/strict';import {readFile} from 'node:fs/promises';const log=await readFile('output/finite-budget/pure/tests.log','utf8');assert.match(log,/# tests 8\\b/);assert.match(log,/# pass 8\\b/);assert.match(log,/# fail 0\\b/);"
      - name: Exact prepared AST closure before I0
        shell: bash
        run: |
          set -o pipefail
          test -z "${AFW_BUDGET_DIAGNOSTIC_CANDIDATE+x}"
          node test/fixtures/finite-budget-world.mjs preflight-budget 2>&1 | tee output/finite-budget/pure/preflight.log
      - name: Seal pure evidence
        if: always()
        run: node --input-type=module -e "import {sealBudgetArtifact} from './test/fixtures/finite-budget-world.mjs'; await sealBudgetArtifact('output/finite-budget/pure','pure');"
      - uses: actions/upload-artifact@v4
        id: upload
        if: always()
        with:
          name: finite-budget-excluded-reader-pure-${{ github.sha }}
          path: output/finite-budget/pure/
          if-no-files-found: error
          retention-days: 7
      - name: Download pure_receipt by immutable ID (attempt 1)
        id: pure_receipt_1
        if: always() && !cancelled() && steps.upload.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/budget-pure-readback
          merge-multiple: true
      - name: Wait 2s before pure_receipt download 2
        id: pure_receipt_wait2
        if: always() && !cancelled() && steps.pure_receipt_1.outcome == 'failure'
        run: sleep 2
      - name: Download pure_receipt by immutable ID (attempt 2)
        id: pure_receipt_2
        if: always() && !cancelled() && steps.pure_receipt_wait2.outcome == 'success' && steps.pure_receipt_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/budget-pure-readback
          merge-multiple: true
      - name: Wait 5s before pure_receipt download 3
        id: pure_receipt_wait3
        if: always() && !cancelled() && steps.pure_receipt_2.outcome == 'failure'
        run: sleep 5
      - name: Download pure_receipt by immutable ID (attempt 3)
        id: pure_receipt_3
        if: always() && !cancelled() && steps.pure_receipt_wait3.outcome == 'success' && steps.pure_receipt_2.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/budget-pure-readback
          merge-multiple: true
      - name: Same-ID pure readback
        if: always() && !cancelled()
        env:
          READBACK: ${{ runner.temp }}/budget-pure-readback
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          DOWNLOAD_SUCCEEDED: ${{ steps.pure_receipt_1.outcome == 'success' || steps.pure_receipt_2.outcome == 'success' || steps.pure_receipt_3.outcome == 'success' }}
        run: |
          test -n "$ARTIFACT_ID"
          test "$DOWNLOAD_SUCCEEDED" = true
          node --input-type=module -e "import {verifyBudgetArtifact} from './test/fixtures/finite-budget-world.mjs'; await verifyBudgetArtifact(process.env.READBACK,'pure',process.env.ARTIFACT_ID);"
  positive_prepare:
    needs: pure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Original producer job budget
        run: echo "AFW_JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download prior_pure by immutable ID (attempt 1)
        id: prior_pure_1
        if: success() && needs.pure.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.pure.outputs.artifact-id }}
          path: output/finite-budget/prior-pure
          merge-multiple: true
      - name: Wait 2s before prior_pure download 2
        id: prior_pure_wait2
        if: always() && !cancelled() && steps.prior_pure_1.outcome == 'failure'
        run: sleep 2
      - name: Download prior_pure by immutable ID (attempt 2)
        id: prior_pure_2
        if: always() && !cancelled() && steps.prior_pure_wait2.outcome == 'success' && steps.prior_pure_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.pure.outputs.artifact-id }}
          path: output/finite-budget/prior-pure
          merge-multiple: true
      - name: Wait 5s before prior_pure download 3
        id: prior_pure_wait3
        if: always() && !cancelled() && steps.prior_pure_2.outcome == 'failure'
        run: sleep 5
      - name: Download prior_pure by immutable ID (attempt 3)
        id: prior_pure_3
        if: always() && !cancelled() && steps.prior_pure_wait3.outcome == 'success' && steps.prior_pure_2.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.pure.outputs.artifact-id }}
          path: output/finite-budget/prior-pure
          merge-multiple: true
      - name: Verify pure artifact and exact prior preflight
        if: always() && !cancelled()
        env:
          ARTIFACT_ID: ${{ needs.pure.outputs.artifact-id }}
          DOWNLOAD_SUCCEEDED: ${{ steps.prior_pure_1.outcome == 'success' || steps.prior_pure_2.outcome == 'success' || steps.prior_pure_3.outcome == 'success' }}
        run: |
          test -n "$ARTIFACT_ID"
          test "$DOWNLOAD_SUCCEEDED" = true
          node --input-type=module -e "import {verifyBudgetArtifact} from './test/fixtures/finite-budget-world.mjs'; await verifyBudgetArtifact('output/finite-budget/prior-pure','pure',process.env.ARTIFACT_ID);"
      - name: Partial producer probe before the original C0
        env:
          AFW_BUDGET_PREFLIGHT: output/finite-budget/prior-pure/preflight.json
        shell: bash
        run: |
          mkdir -p output/finite-budget/producer
          set -o pipefail
          test -z "${AFW_BUDGET_DIAGNOSTIC_CANDIDATE+x}"
          LC_ALL=C node test/fixtures/finite-budget-world.mjs prepare-positive-probe output/finite-budget/producer 2>&1 | LC_ALL=C awk '/^AFW_PROBE / && length($0)<=2048 {print}' | tee output/finite-budget/producer/console.log
      - name: Seal producer evidence
        if: always()
        run: node --input-type=module -e "import {sealBudgetArtifact} from './test/fixtures/finite-budget-world.mjs'; await sealBudgetArtifact('output/finite-budget/producer','checkpoint');"
      - uses: actions/upload-artifact@v4
        id: upload
        if: always()
        with:
          name: finite-budget-excluded-reader-producer-${{ github.sha }}
          path: output/finite-budget/producer/
          if-no-files-found: error
          retention-days: 7
      - name: Download producer_receipt by immutable ID (attempt 1)
        id: producer_receipt_1
        if: always() && !cancelled() && steps.upload.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/budget-producer-readback
          merge-multiple: true
      - name: Wait 2s before producer_receipt download 2
        id: producer_receipt_wait2
        if: always() && !cancelled() && steps.producer_receipt_1.outcome == 'failure'
        run: sleep 2
      - name: Download producer_receipt by immutable ID (attempt 2)
        id: producer_receipt_2
        if: always() && !cancelled() && steps.producer_receipt_wait2.outcome == 'success' && steps.producer_receipt_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/budget-producer-readback
          merge-multiple: true
      - name: Wait 5s before producer_receipt download 3
        id: producer_receipt_wait3
        if: always() && !cancelled() && steps.producer_receipt_2.outcome == 'failure'
        run: sleep 5
      - name: Download producer_receipt by immutable ID (attempt 3)
        id: producer_receipt_3
        if: always() && !cancelled() && steps.producer_receipt_wait3.outcome == 'success' && steps.producer_receipt_2.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/budget-producer-readback
          merge-multiple: true
      - name: Same-ID producer readback
        if: always() && !cancelled()
        env:
          READBACK: ${{ runner.temp }}/budget-producer-readback
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          DOWNLOAD_SUCCEEDED: ${{ steps.producer_receipt_1.outcome == 'success' || steps.producer_receipt_2.outcome == 'success' || steps.producer_receipt_3.outcome == 'success' }}
        run: |
          test -n "$ARTIFACT_ID"
          test "$DOWNLOAD_SUCCEEDED" = true
          node --input-type=module -e "import {verifyBudgetArtifact} from './test/fixtures/finite-budget-world.mjs'; await verifyBudgetArtifact(process.env.READBACK,'checkpoint',process.env.ARTIFACT_ID);"
