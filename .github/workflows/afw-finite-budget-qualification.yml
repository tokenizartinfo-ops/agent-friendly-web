           for(const name of names){assert.match(name,/^[a-z0-9][a-z0-9.-]{0,63}$/);const content=payload.helpers[name];assert.equal(typeof content,'string');const b=Buffer.from(content),pin=expected[name];assert(b.length<=32768);assert.equal(b.length,pin.bytes);assert.equal(sha(b),pin.sha256);assert.equal(blob(b),pin.blob);}
           assert.equal(sha(Buffer.from(payload.helpers['matrix.json'])),'1ae00081c12e4267601557ee085537d67f6c644075a9ba2a7559334971e87d85');
           assert.equal(realpathSync(e.RUNNER_TEMP),e.RUNNER_TEMP);const tempStat=lstatSync(e.RUNNER_TEMP);assert(tempStat.isDirectory()&&tempStat.uid===process.getuid()&&(tempStat.mode&0o022)===0);
           const root=join(e.RUNNER_TEMP,'afw-r3-delivery');mkdirSync(root,{mode:0o700});for(const name of names)writeFileSync(join(root,name),payload.helpers[name],{mode:0o600,flag:'wx'});
           for(const name of names){const b=readFileSync(join(root,name));assert.equal(b.length,expected[name].bytes);assert.equal(sha(b),expected[name].sha256);assert.equal(blob(b),expected[name].blob);}
           const nodeExec=realpathSync(process.execPath),ns=statSync(nodeExec,{bigint:true});assert.equal(nodeExec,process.execPath);
