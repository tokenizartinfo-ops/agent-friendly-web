           for(const [dataset,facts] of sources)rows.push({kind:'epochSetChecks',dataset,...facts});
           for(const p of byEpoch.values())rows.push({kind:'snapshotComparison',segment:p.segment,role:p.role,epoch:p.epoch,occurrence:p.occurrence,inResult:!!p.result,inFinal:!!p.final,identical:p.result&&p.final?p.result===p.final:null});
