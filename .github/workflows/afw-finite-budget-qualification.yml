          GITHUB_SHA="$AFW_TEST_SOURCE" node "$RUNNER_TEMP/afw-fourfile-ab/wrapper.mjs" four
      - name: Preserve sanitized partial or terminal diagnostic evidence
        id: diagnostic_seal
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          GITHUB_SHA="$AFW_TEST_SOURCE" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,writeFile,readdir,lstat} from 'node:fs/promises';
          import {sealBudgetArtifact} from './test/fixtures/finite-budget-world.mjs';
          const out=process.env.RUNNER_TEMP+'/afw-fourfile-ab/public';
          const files=await readdir(out),allowed=['result.json','progress.json','plumbing.json','plumbing-progress.json','setup-status.json','recorder-control.json','recorder-control-status.json'];
          assert(files.every(file=>allowed.includes(file)));
          for(const file of files){const stat=await lstat(out+'/'+file);assert(stat.isFile()&&stat.nlink===1);}
          for(const file of ['progress.json','plumbing.json','plumbing-progress.json'])if(!files.includes(file))await writeFile(out+'/'+file,'null',{mode:0o600});
          if(!files.includes('result.json'))await writeFile(out+'/result.json',JSON.stringify({type:'diagnostic:result',source:process.env.GITHUB_SHA,workflowSource:process.env.AFW_WORKFLOW_SHA,side:process.env.AFW_AB_SIDE,run:process.env.GITHUB_RUN_ID,attempt:1,status:'unknown',counts:null,totals:null}),{mode:0o600});
