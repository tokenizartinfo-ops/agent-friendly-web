           fields(v,['state','phase','errorclass','actual','expected','stats']);assert(['observed_failure','not_reproduced'].includes(v.state));assert(PHASES.includes(v.phase));assert(['assertion','other'].includes(v.errorclass));for(const k of ['actual','expected'])assert(v[k]===null||bounded(v[k],65536));
           if(v.stats!==null){fields(v.stats,['markerExactCount','markerMentionCount','maxLineBytes','rawBytes','oldGeneralCode']);for(const k of ['markerExactCount','markerMentionCount'])assert(bounded(v.stats[k],8));for(const k of ['maxLineBytes','rawBytes'])assert(bounded(v.stats[k],65536));assert(v.stats.markerExactCount<=v.stats.markerMentionCount);assert(v.stats.maxLineBytes<=v.stats.rawBytes);assert(['EACCES','unknown','other'].includes(v.stats.oldGeneralCode));}
           if(v.state==='not_reproduced'){assert.equal(v.phase,'complete');assert.equal(v.errorclass,'other');assert.equal(v.actual,null);assert.equal(v.expected,null);assert(v.stats!==null);}else assert.notEqual(v.phase,'complete');
           return v;
          }
          async function main(){
           const e=process.env;assert.equal(process.versions.node,'22.23.4');assert.deepEqual(process.execArgv,[]);for(const key of ['NODE_OPTIONS','GH_ARTIFACT_TOKEN','AFW_SYN_CHECKPOINT_KEY','NODE_TEST_CONTEXT'])assert.equal(e[key],undefined);assert.equal(e.GITHUB_JOB,'diagnose');assert.equal(e.GITHUB_EVENT_NAME,'push');assert.equal(e.GITHUB_RUN_ATTEMPT,'1');
           const context={repository:e.GITHUB_REPOSITORY,repositoryId:e.GITHUB_REPOSITORY_ID,ref:e.GITHUB_REF,source:e.GITHUB_SHA,tree:git(['rev-parse','HEAD^{tree}']),workflowBlob:git(['rev-parse','HEAD:.github/workflows/afw-finite-budget-qualification.yml']),run:e.GITHUB_RUN_ID,attempt:1,node:process.versions.node};
           assert.equal(context.repository,'tokenizartinfo-ops/agent-friendly-web');assert.equal(context.repositoryId,'1347578006');assert.equal(context.ref,'refs/heads/feat/finite-native-cleanup-20261101');for(const key of ['source','tree','workflowBlob'])assert.match(context[key],/^[a-f0-9]{40}$/);assert.match(context.run,/^[1-9][0-9]*$/);assert.equal(git(['rev-parse','HEAD']),context.source);
