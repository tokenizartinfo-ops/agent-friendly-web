name: AFW round2 safe causal RED
run-name: AFW round2 private causal deficits ${{ github.sha }}
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-finite-budget-qualification.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
jobs:
  focused:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/feat/finite-native-cleanup-20261101' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tokenizartinfo-ops/agent-friendly-web
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Require fixed keyless scope and lock
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = tokenizartinfo-ops/agent-friendly-web
          test "$GITHUB_REF" = refs/heads/feat/finite-native-cleanup-20261101
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(node -v)" = v22.23.4
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "${AFW_SYN_CHECKPOINT_KEY+x}"
          mkdir -m 700 "$RUNNER_TEMP/afw-round2-private"
          mkdir -m 700 "$RUNNER_TEMP/afw-round2-public"
          npm ci --ignore-scripts --no-audit --no-fund >"$RUNNER_TEMP/afw-round2-private/install.log" 2>&1 || { echo locked_install_failed; exit 1; }
      - name: Execute fixed causal regressions once without I0
        id: regressions
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          actual=0
          env -u AFW_BUDGET_GROUP node --experimental-vm-modules test/fixtures/finite-budget-world.mjs verify-round2-red >"$RUNNER_TEMP/afw-round2-private/command.log" 2>&1 || actual=$?
          printf 'actual-exit=%s\n' "$actual" >>"$GITHUB_OUTPUT"
      - name: Publish only strict closed two-JSON evidence
        id: closed
        if: always() && !cancelled()
        env:
          ACTUAL_EXIT: ${{ steps.regressions.outputs.actual-exit }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile,readdir,lstat} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const e=process.env,hash=value=>createHash('sha256').update(value).digest('hex'),root=e.RUNNER_TEMP+'/afw-round2-public';
          function ok(value){if(!value)throw Error('closed_red_validation_failed');}
          function keys(value,expected){ok(value&&Object.getPrototypeOf(value)===Object.prototype);const actual=Object.keys(value).sort();ok(actual.length===expected.length&&actual.every((key,index)=>key===[...expected].sort()[index]));}
          const bool=value=>{ok(typeof value==='boolean');return value;},num=value=>{ok(Number.isSafeInteger(value)&&value>=0&&value<=1000000);return value;},choice=(value,list)=>{ok(list.includes(value));return value;};
          function arm(value){keys(value,['originalRejected','outward','flag','copies','copiedAfterDispose','copyWhileUncertain','disposed','uncertain','archived','sourceRetained','originalAttempts','outerErrorSame']);return {originalRejected:bool(value.originalRejected),outward:choice(value.outward,['not_entered','fulfilled','rejected']),flag:bool(value.flag),copies:num(value.copies),copiedAfterDispose:bool(value.copiedAfterDispose),copyWhileUncertain:bool(value.copyWhileUncertain),disposed:bool(value.disposed),uncertain:bool(value.uncertain),archived:bool(value.archived),sourceRetained:bool(value.sourceRetained),originalAttempts:num(value.originalAttempts),outerErrorSame:bool(value.outerErrorSame)};}
          function facts(group,value){
           if(value===null)return null;
           if(group==='F2'){keys(value,['acceptedDeadline','sameWorkWaitError','workPendingAtAbort','workStatus','waitStatus','workBeforeWait','waitBeforeAbort','heldNative','outwardAtDenial','originalQueue','genuineBusinessRoot']);return {acceptedDeadline:bool(value.acceptedDeadline),sameWorkWaitError:bool(value.sameWorkWaitError),workPendingAtAbort:bool(value.workPendingAtAbort),workStatus:choice(value.workStatus,['pending','rejected','fulfilled','unregistered']),waitStatus:choice(value.waitStatus,['pending','rejected','fulfilled','unregistered']),workBeforeWait:bool(value.workBeforeWait),waitBeforeAbort:bool(value.waitBeforeAbort),heldNative:num(value.heldNative),outwardAtDenial:num(value.outwardAtDenial),originalQueue:bool(value.originalQueue),genuineBusinessRoot:bool(value.genuineBusinessRoot)};}
           if(group==='F5'){keys(value,['normal','rejection']);return {normal:arm(value.normal),rejection:arm(value.rejection)};}
           keys(value,['baselineWorkflow','bodySha256','rawFiles','filesWithCanary','canaryReachedPrivateSandbox','sandboxOnly','baselineStatus']);ok(value.baselineWorkflow==='c72e31919d477280c9eef39b63ca46708acb82e7'&&/^[a-f0-9]{64}$/.test(value.bodySha256));return {baselineWorkflow:value.baselineWorkflow,bodySha256:value.bodySha256,rawFiles:num(value.rawFiles),filesWithCanary:num(value.filesWithCanary),canaryReachedPrivateSandbox:bool(value.canaryReachedPrivateSandbox),sandboxOnly:bool(value.sandboxOnly),baselineStatus:choice(value.baselineStatus,['pure_failed','pure_passed'])};
          }
          function error(value){if(value===null)return null;const message=value.message;return {name:choice(value.name,['Error','AssertionError','TypeError','SyntaxError','RangeError','other']),nativeError:bool(value.nativeError),code:choice(value.code,['ERR_ASSERTION','ERR_MODULE_NOT_FOUND','ERR_INVALID_ARG_TYPE','ERR_SCRIPT_EXECUTION_TIMEOUT','absent','other']),operator:choice(value.operator,['==','===','strictEqual','deepStrictEqual','match','ok','throws','rejects','absent','other']),messageBytes:message?.bytes===undefined?null:num(message.bytes),messageSha256:typeof message?.sha256==='string'&&/^[a-f0-9]{64}$/.test(message.sha256)?message.sha256:null};}
          try{
           let proof;try{const path=e.RUNNER_TEMP+'/afw-round2-private/result.json',st=await lstat(path);ok(st.isFile()&&st.size<=65536);proof=JSON.parse(await readFile(path,'utf8'));}catch{proof={purpose:'afw.round2-causal-red.safe.v1',source:e.GITHUB_SHA,run:e.GITHUB_RUN_ID,attempt:1,groups:['F2','F5','F8'].map(group=>({group,stage:'not_entered',causalDeficit:false,facts:null,error:null})),expectedCausalRed:false,I0Opened:false,nativeExecutionProduced:false,businessCases:0,operationalReadiness:false,completePackage:false,PCoff:false,globalNativeDrainVerified:false,sdkNamespaceEmptyVerified:false};}ok(proof.purpose==='afw.round2-causal-red.safe.v1'&&proof.source===e.GITHUB_SHA&&proof.run===e.GITHUB_RUN_ID&&proof.attempt===1);
           keys(proof,['purpose','source','run','attempt','groups','expectedCausalRed','I0Opened','nativeExecutionProduced','businessCases','operationalReadiness','completePackage','PCoff','globalNativeDrainVerified','sdkNamespaceEmptyVerified']);
           ok(Array.isArray(proof.groups)&&proof.groups.length===3&&new Set(proof.groups.map(row=>row.group)).size===3);const groups=proof.groups.map(row=>{keys(row,['group','stage','causalDeficit','facts','error']);const group=choice(row.group,['F2','F5','F8']);return {group,stage:choice(row.stage,['complete','observer_order','old_sealer_execute','producer_continuation','not_entered']),causalDeficit:bool(row.causalDeficit),facts:facts(group,row.facts),error:error(row.error)};});
           for(const flag of ['I0Opened','nativeExecutionProduced','operationalReadiness','completePackage','PCoff','globalNativeDrainVerified','sdkNamespaceEmptyVerified'])ok(proof[flag]===false);ok(proof.businessCases===0);
           const expectedCausalRed=bool(proof.expectedCausalRed);ok(expectedCausalRed===groups.every(row=>row.stage==='complete'&&row.causalDeficit));ok(/^[a-f0-9]{40}$/.test(e.GITHUB_SHA)&&/^[1-9][0-9]*$/.test(e.GITHUB_RUN_ID));
           let privateCommand={bytes:null,sha256:null,hashComplete:false};try{const path=e.RUNNER_TEMP+'/afw-round2-private/command.log',st=await lstat(path);privateCommand.bytes=st.size;if(st.size<=1048576){privateCommand.sha256=hash(await readFile(path));privateCommand.hashComplete=true;}}catch{}
           const result={purpose:proof.purpose,source:e.GITHUB_SHA,run:e.GITHUB_RUN_ID,attempt:1,actualExit:/^[0-9]+$/.test(e.ACTUAL_EXIT??'')?Number(e.ACTUAL_EXIT):null,expectedCausalRed,groups,privateCommand,I0Opened:false,nativeExecutionProduced:false,businessCases:0,operationalReadiness:false,completePackage:false,PCoff:false,globalNativeDrainVerified:false,sdkNamespaceEmptyVerified:false};
           const bytes=Buffer.from(JSON.stringify(result,null,2));ok(bytes.length<=32768);await writeFile(root+'/result.json',bytes);await writeFile(root+'/manifest.json',JSON.stringify({source:e.GITHUB_SHA,run:e.GITHUB_RUN_ID,attempt:1,files:[{path:'result.json',bytes:bytes.length,sha256:hash(bytes)}]}));ok((await readdir(root)).sort().join('|')==='manifest.json|result.json');await writeFile(e.GITHUB_OUTPUT,'expected-red='+expectedCausalRed+'\n',{flag:'a'});
          }catch{console.log('closed_red_preservation_failed');process.exitCode=1;}
          NODE
      - name: Upload only two closed JSON files
        id: upload
        if: always() && !cancelled() && steps.closed.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: finite-budget-round2-red-${{ github.sha }}
          path: ${{ runner.temp }}/afw-round2-public/
          retention-days: 7
          if-no-files-found: error
      - name: Recover exact assigned artifact ID first retrieval
        id: download1
        if: always() && !cancelled() && steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-round2-readback
          merge-multiple: true
      - name: Wait before second same-ID retrieval
        id: wait2
        if: always() && !cancelled() && steps.download1.outcome == 'failure'
        run: sleep 2
      - name: Recover exact same ID second retrieval
        id: download2
        if: always() && !cancelled() && steps.wait2.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-round2-readback
          merge-multiple: true
      - name: Wait before third same-ID retrieval
        id: wait3
        if: always() && !cancelled() && steps.download2.outcome == 'failure'
        run: sleep 5
      - name: Recover exact same ID third retrieval
        id: download3
        if: always() && !cancelled() && steps.wait3.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-round2-readback
          merge-multiple: true
      - name: Verify full same-ID closed evidence
        id: verified
        if: always() && !cancelled() && steps.upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          DOWNLOADED: ${{ steps.download1.outcome == 'success' || steps.download2.outcome == 'success' || steps.download3.outcome == 'success' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFile,readdir} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const e=process.env,root=e.RUNNER_TEMP+'/afw-round2-readback';assert.equal(e.DOWNLOADED,'true');assert.match(e.ARTIFACT_ID,/^[1-9][0-9]*$/);assert.deepEqual((await readdir(root)).sort(),['manifest.json','result.json']);
          const bytes=await readFile(root+'/result.json'),m=JSON.parse(await readFile(root+'/manifest.json','utf8'));assert.equal(m.source,e.GITHUB_SHA);assert.equal(m.run,e.GITHUB_RUN_ID);assert.equal(m.attempt,1);assert.deepEqual(m.files,[{path:'result.json',bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')}]);
          for(const name of ['manifest.json','result.json'])assert((await readFile(root+'/'+name)).equals(await readFile(e.RUNNER_TEMP+'/afw-round2-public/'+name)));
          console.log('ROUND2_SAFE_SAME_ID_VERIFIED '+e.ARTIFACT_ID);console.log(bytes.toString('utf8'));
          NODE
      - name: Retain actual RED outcome and stop
        if: always() && !cancelled()
        shell: bash
        run: |
          test '${{ steps.verified.outcome }}' = success
          test '${{ steps.closed.outputs.expected-red }}' = true
          test '${{ steps.regressions.outputs.actual-exit }}' = 0
