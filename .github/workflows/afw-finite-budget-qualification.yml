          const pins={};for(const[name,record]of Object.entries(p.programs)){assert(/^(?:[a-z0-9-]+\/)*[a-z0-9.-]+\.(?:mjs|js|json)$/.test(name)&&!name.includes('..'));const b=Buffer.from(record.content);assert.equal(b.length,record.bytes);assert.equal(hash(b),record.sha256);assert.equal(blob(b),record.blob);pins[name]={bytes:record.bytes,sha256:record.sha256,blob:record.blob};}assert.equal(hash(JSON.stringify(pins)+'\n'),expected.setSha256);
