      - name: Verify the two safe files before upload
        id: closed
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import {readdir,lstat,readFile} from 'node:fs/promises';import {join} from 'node:path';import {createHash} from 'node:crypto';
          try{
           const dir=join(process.env.RUNNER_TEMP,'afw-inspect-public'),names=(await readdir(dir)).sort();if(names.join('|')!=='diagnostic.json|manifest.json')throw Error();
           for(const name of names){const st=await lstat(join(dir,name));if(!st.isFile()||st.nlink!==1||st.size<1)throw Error();}
           const d=await readFile(join(dir,'diagnostic.json')),m=JSON.parse(await readFile(join(dir,'manifest.json'),'utf8'));
           if(m.workflowSource!==process.env.GITHUB_SHA||m.workflowRun!==process.env.GITHUB_RUN_ID||m.workflowAttempt!=='1'||m.inspectedSource!=='14071b396f8c9c66b70cf630d8823692a4521bd3'||m.originalRun!=='43121646075'||m.artifactId!=='13902156351'||m.files.length!==1||m.files[0].path!=='diagnostic.json'||m.files[0].bytes!==d.length||m.files[0].sha256!==createHash('sha256').update(d).digest('hex'))throw Error();
           console.log('safe_diagnostic_inventory_verified');
          }catch{console.log('safe_inventory_failed');process.exitCode=1;}
          NODE
      - name: Upload finite-budget-posthoc-diagnostic only
        id: upload
        if: success() && steps.closed.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: finite-budget-posthoc-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/afw-inspect-public/
          if-no-files-found: error
          retention-days: 7
      - name: Download diagnostic by exact ID attempt 1
        id: diagnostic_1
        if: success() && steps.upload.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-posthoc-readback
          merge-multiple: true
      - name: Wait 2s before diagnostic retrieval 2
        id: diagnostic_wait2
        if: always() && !cancelled() && steps.diagnostic_1.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sleep 2
      - name: Download diagnostic by exact ID attempt 2
        id: diagnostic_2
        if: always() && !cancelled() && steps.diagnostic_wait2.outcome == 'success' && steps.diagnostic_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-posthoc-readback
          merge-multiple: true
      - name: Wait 5s before diagnostic retrieval 3
        id: diagnostic_wait3
        if: always() && !cancelled() && steps.diagnostic_2.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sleep 5
      - name: Download diagnostic by exact ID attempt 3
        id: diagnostic_3
        if: always() && !cancelled() && steps.diagnostic_wait3.outcome == 'success' && steps.diagnostic_2.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-posthoc-readback
          merge-multiple: true
      - name: Require exact same-ID safe artifact bytes and source
        id: verified
        if: always() && !cancelled() && steps.upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          DOWNLOADED: ${{ steps.diagnostic_1.outcome == 'success' || steps.diagnostic_2.outcome == 'success' || steps.diagnostic_3.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$ARTIFACT_ID"
          test "$DOWNLOADED" = true || { echo evidence_not_preserved; exit 1; }
          node --input-type=module <<'NODE'
          import {readdir,lstat,readFile} from 'node:fs/promises';import {join} from 'node:path';import {createHash} from 'node:crypto';import {isDeepStrictEqual} from 'node:util';
          try{
           const tmp=process.env.RUNNER_TEMP,a=join(tmp,'afw-inspect-public'),b=join(tmp,'afw-posthoc-readback'),hash=v=>createHash('sha256').update(v).digest('hex');
           if((await readdir(b)).sort().join('|')!=='diagnostic.json|manifest.json')throw Error();
           const files=[];for(const name of ['diagnostic.json','manifest.json']){const st=await lstat(join(b,name)),v=await readFile(join(b,name));if(!st.isFile()||st.nlink!==1||!(await readFile(join(a,name))).equals(v))throw Error();files.push({path:name,bytes:v.length,sha256:hash(v)});}
           const m=JSON.parse(await readFile(join(b,'manifest.json'),'utf8'));if(!isDeepStrictEqual(m,{purpose:'afw.finite-budget-posthoc-manifest.syn.v1',workflowSource:process.env.GITHUB_SHA,workflowRun:process.env.GITHUB_RUN_ID,workflowAttempt:process.env.GITHUB_RUN_ATTEMPT,inspectedSource:'14071b396f8c9c66b70cf630d8823692a4521bd3',originalRun:'43121646075',originalAttempt:'1',artifactId:'13902156351',files:[files[0]]}))throw Error();
           console.log('POSTHOC_READBACK '+JSON.stringify({id:process.env.ARTIFACT_ID,files,workflowSource:m.workflowSource,workflowRun:m.workflowRun,attempt:m.workflowAttempt}));
          }catch{console.log('diagnostic_readback_failed');process.exitCode=1;}
          NODE
