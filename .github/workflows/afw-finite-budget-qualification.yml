          const reportPath='docs/superpowers/reports/2026-11-13-coherent-suite-qualification.md',report=readFileSync(reportPath),prefix=report.subarray(0,1010233);assert.equal(prefix.length,1010233);assert.equal(hash(prefix),'795890636d1025413c74052d31218dd2a15a62eab550b3a4c6e9394155b4e8ee');
