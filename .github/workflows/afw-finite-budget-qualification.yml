      - feat/finite-native-cleanup-20261101
    paths:
      - .github/workflows/afw-finite-budget-qualification.yml
permissions:
  contents: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
# Inactive observation. Qualification and Native remain held.
# R3 helpers materialized DATA; original18 remain DATA; I3 remains OPEN.
# Action-runtime warning M02 deferred; exact mandated pins unchanged.
jobs:
  readonly:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.event_name == 'push' && github.ref == 'refs/heads/feat/finite-native-cleanup-20261101' && github.run_attempt == 1 && github.event.head_commit.message == 'AFW-L05-OBSERVATION-ONEUSE-20261115' }}
