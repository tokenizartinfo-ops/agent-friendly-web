name: AFW readonly b09 diagnostic
run-name: AFW readonly b09 diagnostic ONEUSE ${{ github.sha }}
on:
  push:
    branches:
      - feat/finite-native-cleanup-20261101
    paths:
      - .github/workflows/afw-finite-budget-qualification.yml
permissions:
  contents: read
concurrency:
  group: afw-readonly-b09-diagnostic
  cancel-in-progress: false
# INACTIVE UNATTACHED DATA. Root gate and a separate one-use release required.
# One controlled b09 only; no qualification, Native, SDK, npm or artifact upload.
jobs:
  diagnose:
    if: ${{ github.repository_id == '1347578006' && github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/feat/finite-native-cleanup-20261101' && github.run_attempt == 1 && github.event_name == 'push' && github.workflow == 'AFW readonly b09 diagnostic' && github.workflow_ref == 'tokenizartinfo-ops/agent-friendly-web/.github/workflows/afw-finite-budget-qualification.yml@refs/heads/feat/finite-native-cleanup-20261101' && github.event.head_commit.message == 'AFW-READONLY-B09-DIAGNOSTIC-ONEUSE-20261114' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require exact diagnostic role
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY_ID" = 1347578006
          test "$GITHUB_REPOSITORY" = tokenizartinfo-ops/agent-friendly-web
          test "$GITHUB_REF" = refs/heads/feat/finite-native-cleanup-20261101
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_WORKFLOW" = 'AFW readonly b09 diagnostic'
          test "$GITHUB_WORKFLOW_REF" = 'tokenizartinfo-ops/agent-friendly-web/.github/workflows/afw-finite-budget-qualification.yml@refs/heads/feat/finite-native-cleanup-20261101'
          test "$GITHUB_JOB" = diagnose
          test -z "${NODE_OPTIONS+x}"
          test -z "${AFW_SYN_CHECKPOINT_KEY+x}"
          test -z "${GH_ARTIFACT_TOKEN+x}"
          test -z "${NODE_TEST_CONTEXT+x}"
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@v4
        with:
          repository: tokenizartinfo-ops/agent-friendly-web
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Use fixed Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Materialize and hash the bounded diagnostic
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -z "${NODE_OPTIONS+x}"
          cat >"$RUNNER_TEMP/afw-readonly-b09-diagnostic.mjs" <<'AFW_B09_DIAGNOSTIC'
          import assert from 'node:assert/strict';
          import {readFile,writeFile,mkdir,rm} from 'node:fs/promises';
