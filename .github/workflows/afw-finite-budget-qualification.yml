name: AFW readonly site contract finalfix
run-name: AFW readonly site contract finalfix HELD ${{ github.sha }}
on:
  push:
    branches:
      - feat/finite-native-cleanup-20261101
    paths:
      - .github/workflows/afw-finite-budget-qualification.yml
permissions:
  contents: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
# INACTIVE. ONE controls-only final-fix qualification; no Native release.
jobs:
  controls:
