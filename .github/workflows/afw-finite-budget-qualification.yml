name: AFW finite budget qualification
run-name: AFW custody contract RED ${{ github.sha }}
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-finite-budget-qualification.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
env:
  AFW_CUSTODY_PHASE: red
jobs:
  pure:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/feat/finite-native-cleanup-20261101' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Require the fixed AFW source and first attempt
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = tokenizartinfo-ops/agent-friendly-web
          test "$GITHUB_REF" = refs/heads/feat/finite-native-cleanup-20261101
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -z "${AFW_BUDGET_DIAGNOSTIC_CANDIDATE+x}"
          mkdir -m 700 "$RUNNER_TEMP/afw-pure-private"
      - name: Checkout this exact revision
        uses: actions/checkout@v4
        with:
          repository: tokenizartinfo-ops/agent-friendly-web
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install the locked fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npm ci --ignore-scripts --no-audit --no-fund >"$RUNNER_TEMP/afw-locked-install.log" 2>&1 || { echo locked_install_failed; exit 1; }
      - name: Record original custody contract and fixed-kind expectations
        id: custody
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -z "${AFW_SYN_CHECKPOINT_KEY+x}"
          test "$(node -v)" = v22.23.4
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dest="$RUNNER_TEMP/afw-pure-private"
          status=0
          node --test --test-reporter=tap test/finite-checkpoint-custody.test.mjs >"$dest/custody.tap" 2>&1 || status=$?
          echo "test_exit=$status" >> "$GITHUB_OUTPUT"
          AFW_TEST_EXIT="$status" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync,writeFileSync,copyFileSync,mkdirSync} from 'node:fs';
          import {join} from 'node:path';
          import {sealBudgetArtifact} from './test/fixtures/finite-budget-world.mjs';
          const env=process.env,source=join(env.RUNNER_TEMP,'afw-pure-private','custody.tap'),dest=join(env.RUNNER_TEMP,'afw-pure-public');
          const tap=readFileSync(source,'utf8');
          const kinds=['readonly-result','reduction-checkpoint','reduction-result-a','reduction-result-b'];
          const counts={};
          let expected=false;mkdirSync(dest,{mode:0o700});
          try{
           for(const [name,value] of Object.entries({tests:14,pass:9,fail:5,cancelled:0,skipped:0,todo:0})){
            const found=tap.match(new RegExp('^# '+name+' (\\d+)$','m'));
            assert(found);counts[name]=Number(found[1]);assert.equal(counts[name],value);
           }
           assert.equal(env.AFW_TEST_EXIT,'1');
           for(const kind of kinds)assert.match(tap,new RegExp('^\\s*not ok \\d+ - C9 fixed custody kind '+kind+'$','m'));
           assert.equal((tap.match(/error: 'custody_context'/g)??[]).length,4);
           assert(!tap.includes('SYN-PRIVATE-EVIDENCE-MARKER'));
           copyFileSync(source,join(dest,'custody.tap'));expected=true;
          }catch{}
          const reason=expected?'unsupported_fixed_custody_kinds':'unexpected_custody_outcome';
          writeFileSync(join(dest,'status.json'),JSON.stringify({phase:'red',reason,source:env.GITHUB_SHA,run:env.GITHUB_RUN_ID,attempt:env.GITHUB_RUN_ATTEMPT,counts,tapSha256:createHash('sha256').update(tap).digest('hex')}));
          try{await sealBudgetArtifact(dest,'pure');console.log(reason);writeFileSync(env.GITHUB_OUTPUT,'expected='+String(expected)+'\n',{flag:'a'});}catch{console.error('evidence_not_preserved');process.exitCode=1;}
          NODE
      - name: Upload finite-budget-pure only
        id: upload
        if: always() && !cancelled() && steps.custody.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: finite-budget-custody-red-${{ github.sha }}
          path: ${{ runner.temp }}/afw-pure-public/
          if-no-files-found: error
          retention-days: 7
      - name: Download pure_receipt by exact ID attempt 1
        id: pure_receipt_1
        if: always() && !cancelled() && steps.upload.outcome == 'success' && steps.upload.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-pure-receipt
          merge-multiple: true
      - name: Wait 2s before pure_receipt retrieval 2
        id: pure_receipt_wait2
        if: always() && !cancelled() && steps.pure_receipt_1.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sleep 2
      - name: Download pure_receipt by exact ID attempt 2
        id: pure_receipt_2
        if: always() && !cancelled() && steps.pure_receipt_wait2.outcome == 'success' && steps.pure_receipt_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-pure-receipt
          merge-multiple: true
      - name: Wait 5s before pure_receipt retrieval 3
        id: pure_receipt_wait3
        if: always() && !cancelled() && steps.pure_receipt_2.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sleep 5
      - name: Download pure_receipt by exact ID attempt 3
        id: pure_receipt_3
        if: always() && !cancelled() && steps.pure_receipt_wait3.outcome == 'success' && steps.pure_receipt_2.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-pure-receipt
          merge-multiple: true
      - name: Verify exact same-ID pure inventory
        id: pure_verified
        if: always() && !cancelled() && steps.upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          DOWNLOADED: ${{ steps.pure_receipt_1.outcome == 'success' || steps.pure_receipt_2.outcome == 'success' || steps.pure_receipt_3.outcome == 'success' }}
          READBACK: ${{ runner.temp }}/afw-pure-receipt
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$ARTIFACT_ID"
          test "$DOWNLOADED" = true || { echo evidence_not_preserved; exit 1; }
          if ! node --input-type=module -e "import {verifyBudgetArtifact} from './test/fixtures/finite-budget-world.mjs'; await verifyBudgetArtifact(process.env.READBACK,'pure',process.env.ARTIFACT_ID);" >"$RUNNER_TEMP/afw-pure-private/readback.log" 2>&1; then echo evidence_not_preserved; exit 1; fi
          if ! cmp -s "$RUNNER_TEMP/afw-pure-public/budget-artifact.json" "$READBACK/budget-artifact.json"; then echo evidence_not_preserved; exit 1; fi
          printf 'pure_verified artifact_id=%s\n' "$ARTIFACT_ID"
      - name: Preserve original failed custody test status
        if: always() && !cancelled() && steps.pure_verified.outcome == 'success'
        env:
          TEST_EXIT: ${{ steps.custody.outputs.test_exit }}
          EXPECTED: ${{ steps.custody.outputs.expected }}
        shell: bash
        run: |
          test "$EXPECTED" = true || { echo unexpected_custody_outcome; exit 1; }
          exit "$TEST_EXIT"
