          const TEST_IDS=["b01_real_three_ok","b02_real_first_failure_R1","b03_real_first_failure_R2","b04_real_first_failure_R3","b05_real_file_before_cases","b06_real_late_file_repeated_one","b07_real_failed_case_late_file_suppressed","b08_real_empty_file","b09_real_multiline_enumerable_poison","b10_suffix_never_interpreted","b11_no_coercion_and_absence","b12_whole_representation_caps","b13_prefix_structure_conflicts","b14_complete_summary_coherence","b15_closed_directives_and_zero_plan","b16_file_and_ordinal_allowlist","b17_all_ten_public_custody_guards","b18_first_real_guard_only","b19_custody_generic_and_conflicts","b20_custody_path_and_frame_bounds","b21_custody_absence_no_coercion_caps","b22_read_once_coherent_projections","b23_missing_unsafe_and_truncated_logs","b24_purpose_schema_and_canonicality","b25_context_job_manifest_and_limits","b26_closed_enums_rows_and_nonclaims","b27_availability_projection_truth","b28_production_role_keys_options","b29_production_version_refusal","b30_new_reader_hardlink_and_fd_race","b31_production_fixed_pair_and_async_validator","b32_ok_details_closed_grammar"],PHASES=["entry","poison_fixture","poison_canary","poison_injected","poison_project","poison_first","poison_no_canary","poison_no_code","poison_no_stack","marker_fixture","marker_count","marker_location","old_general","owned_root","write_command","write_seal","write_metadata","collect","pair","validate","pair_first","command_unknown","custody_guard","metadata_stage","metadata_http","pair_no_canary","repack","reject_sync","reject_async","complete"],BOUNDS={"family":{"bytes":1593,"sha256":"900018814e3cf4855be28483baaa1c5ecf4e23959af5b7bba35fd297662c665d"},"prefix":{"bytes":5365,"sha256":"b3b95ca24bb249f455f1948ab38ec513edba223ac022c826a063f5474377c62b"}},PAIRS=[["const poisoned=await real('poison');","__b09Phase='poison_fixture';const poisoned=await real('poison');__b09Stats=__b09ProjectStats(poisoned);"],["assert(poisoned.includes(canary))","__b09Phase='poison_canary';assert(poisoned.includes(canary))"],["assert(poisoned.includes('injected'))","__b09Phase='poison_injected';assert(poisoned.includes('injected'))"],["const pure=D.projectReadonlyTap(poisoned)","__b09Phase='poison_project';const pure=D.projectReadonlyTap(poisoned)"],["first(pure,2)","__b09Phase='poison_first';first(pure,2)"],["assert(!JSON.stringify(pure).includes(canary))","__b09Phase='poison_no_canary';assert(!JSON.stringify(pure).includes(canary))"],["assert(!JSON.stringify(pure).includes('code'))","__b09Phase='poison_no_code';assert(!JSON.stringify(pure).includes('code'))"],["assert(!JSON.stringify(pure).includes('stack'))","__b09Phase='poison_no_stack';assert(!JSON.stringify(pure).includes('stack'))"],["const text=await real('marker'),marker=","__b09Phase='marker_fixture';const text=await real('marker'),marker="],["assert.equal(text.split('\\n').filter(line=>line===marker).length,1)","__b09Stats=__b09ProjectStats(text);__b09Phase='marker_count';assert.equal(text.split('\\n').filter(line=>line===marker).length,1)"],["assert(text.indexOf('\\n'+marker+'\\n')>text.indexOf('not ok 2 - R2 fixed original SDK readonly budget\\n'))","__b09Phase='marker_location';assert(text.indexOf('\\n'+marker+'\\n')>text.indexOf('not ok 2 - R2 fixed original SDK readonly budget\\n'))"],["assert.deepEqual(D.projectLogText(text,P).failure,{code:'EACCES',site:'unknown'})","__b09Phase='old_general';assert.deepEqual(D.projectLogText(text,P).failure,{code:'EACCES',site:'unknown'})"],["await owned(async root=>{","__b09Phase='owned_root';await owned(async root=>{"],["await fs.writeFile(join(root,'command-output.log'),text)","__b09Phase='write_command';await fs.writeFile(join(root,'command-output.log'),text)"],["await fs.writeFile(join(root,'seal-custody.log'),custody(150))","__b09Phase='write_seal';await fs.writeFile(join(root,'seal-custody.log'),custody(150))"],["await fs.writeFile(join(root,'own-metadata.log'),","__b09Phase='write_metadata';await fs.writeFile(join(root,'own-metadata.log'),"],["const p=pair(await collect(root)),v=validate(p);","__b09Phase='collect';const __b09Observation=await collect(root);__b09Phase='pair';const p=pair(__b09Observation);__b09Phase='validate';const v=validate(p);"],["first(v.tap,2)","__b09Phase='pair_first';first(v.tap,2)"],["assert.deepEqual(v.logs[0],{log:'command',availability:'available',code:'unknown',site:'unknown'})","__b09Phase='command_unknown';assert.deepEqual(v.logs[0],{log:'command',availability:'available',code:'unknown',site:'unknown'})"],["assert.deepEqual(v.custodyLimit,{state:'observed',guard:'record_bytes'})","__b09Phase='custody_guard';assert.deepEqual(v.custodyLimit,{state:'observed',guard:'record_bytes'})"],["assert.deepEqual(v.stage,{state:'pending',stage:'metadata_get'})","__b09Phase='metadata_stage';assert.deepEqual(v.stage,{state:'pending',stage:'metadata_get'})"],["assert.equal(v.http,200)","__b09Phase='metadata_http';assert.equal(v.http,200)"],["assert(!JSON.stringify(v).includes(canary))","__b09Phase='pair_no_canary';assert(!JSON.stringify(v).includes(canary))"],["const q=repack(p,mutate)","__b09Phase='repack';const q=repack(p,mutate)"],["assert.throws(()=>validate(q))","__b09Phase='reject_sync';assert.throws(()=>validate(q))"],["await assert.rejects(()=>D.validateFixedReadonlyPair(q,context,'readonly'))","__b09Phase='reject_async';await assert.rejects(()=>D.validateFixedReadonlyPair(q,context,'readonly'))"]],HELPERS="\nconst __b09Marker='AFW_SYN_FAILURE/1 {\"code\":\"EACCES\",\"site\":\"unknown\"}';\nfunction __b09ProjectStats(text){\n assert.equal(typeof text,'string');const rawBytes=Buffer.byteLength(text);assert(rawBytes<=65536);const lines=text.split('\\n'),markerExactCount=lines.filter(l=>l===__b09Marker).length,markerMentionCount=lines.filter(l=>l.includes('AFW_SYN_FAILURE/1')).length,maxLineBytes=Math.max(0,...lines.map(l=>Buffer.byteLength(l)));assert(markerExactCount<=8&&markerMentionCount<=8&&maxLineBytes<=65536);const code=D.projectLogText(text,P).failure.code;return {markerExactCount,markerMentionCount,maxLineBytes,rawBytes,oldGeneralCode:code==='EACCES'?'EACCES':code==='unknown'?'unknown':'other'};\n}\nfunction __b09Emit(state,error,phase,stats){\n const own=key=>Object.getOwnPropertyDescriptor(error??{},key)?.value,number=v=>Number.isInteger(v)&&v>=0&&v<=65536?v:null;const value={state,phase,errorclass:own('code')==='ERR_ASSERTION'?'assertion':'other',actual:number(own('actual')),expected:number(own('expected')),stats};process.stdout.write('AFW_READONLY_B09_DIAGNOSTIC_CHILD/1 '+JSON.stringify(value)+'\\n');\n}\n";
          const NONCLAIMS=Object.freeze({historicalCauseProven:false,receiptAuthenticated:false,operationalReadiness:false,completePackage:false,PCoff:false,globalNativeDrainVerified:false,sdkNamespaceEmptyVerified:false});
          const sha=b=>createHash('sha256').update(b).digest('hex'),blob=b=>createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex'),git=args=>execFileSync('git',args,{encoding:'utf8',stdio:['ignore','pipe','pipe']}).trim();
          const fields=(v,keys)=>{assert(v&&typeof v==='object'&&!Array.isArray(v));assert.deepEqual(Object.keys(v),keys);};
