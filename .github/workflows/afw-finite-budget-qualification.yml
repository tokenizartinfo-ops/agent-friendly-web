  push:
    branches:
      - feat/finite-native-cleanup-20261101
    paths:
      - .github/workflows/afw-finite-budget-qualification.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: afw-stage-finalfix-qualification
  cancel-in-progress: false
