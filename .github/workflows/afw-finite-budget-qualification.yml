name: AFW readonly source site diagnostic
run-name: AFW readonly source site HELD ${{ github.sha }}
on:
  push:
    branches:
      - feat/finite-native-cleanup-20261101
    paths:
      - .github/workflows/afw-finite-budget-qualification.yml
permissions:
  contents: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
# INACTIVE DATA PREPARATION ONLY. Root owns the single future release and restoration.
jobs:
  readonly:
    if: ${{ false && github.event_name == 'push' && github.event.head_commit.message == 'AFW-READONLY-SOURCE-SITE-ONEUSE-20261114' && github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/feat/finite-native-cleanup-20261101' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Require exact readonly scope before setup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = tokenizartinfo-ops/agent-friendly-web
          test "$GITHUB_REPOSITORY_ID" = 1347578006
          test "$GITHUB_REF" = refs/heads/feat/finite-native-cleanup-20261101
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_JOB" = readonly
          test "$GITHUB_EVENT_NAME" = push
          test -z "${NODE_OPTIONS+x}"
          test -z "${AFW_SYN_CHECKPOINT_KEY+x}"
          test -z "${AFW_BUDGET_DIAGNOSTIC_CANDIDATE+x}"
          printf 'AFW_JOB_STARTED_MS=%s\n' "$(date +%s%3N)" >>"$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: tokenizartinfo-ops/agent-friendly-web
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Verify every pinned DATA byte before private materialization
        id: loader
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'AFW_SITE_LOADER' >"$RUNNER_TEMP/afw-site-loader-private.log" 2>&1
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,mkdirSync,lstatSync,realpathSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          import {execFileSync} from 'node:child_process';
          const e=process.env,hash=b=>createHash('sha256').update(b).digest('hex'),blob=b=>createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex'),canonical=v=>JSON.stringify(v)+'\n',git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const expected={"site-map.json":{"bytes":6631,"sha256":"1f1024c4feb46f242b1d3ab7d87c5a8d696cccdb51547f5336f5bae90217deaf","blob":"bcc38e8aeeffa82329701bf382e9868a34cf8ec0"},"runtime.mjs":{"bytes":3546,"sha256":"7fde32c0df8b06ab3a01db30fb9e75fb7429cf6e4f95ed8152ed16bd7d0ab40a","blob":"815c32f1020ff1f32799ed47a652ced314a903f7"},"closed.mjs":{"bytes":5785,"sha256":"cce547d7e23844003832498493e0d3b6d3bc352980408a66dd194949dab8e778","blob":"7d9e792fdcaac628f8c8724287904cba976772fd"},"qualified-driver.mjs":{"bytes":8545,"sha256":"fb168aed7ea6c508f7ca3d59b2bd125dfe5125f528a9d85ceb4bc4944198cf43","blob":"3ef70505e65c179dae68a9a1a504da591f840c49"},"preflight.mjs":{"bytes":9307,"sha256":"ef91d5f26567162d9a877657ffee92b4f997e4bd7a5d6511d9da77e0be1be37b","blob":"1b3ad02d1cbf183ac82f79d7097b4fe506a2093b"},"site.mjs":{"bytes":2893,"sha256":"9e705115a5da27f7e8a5f48ccd33b456cb99d98a7173fbecb9906cda0d0eee7a","blob":"b6cafcb75b4b158f7c36bbf336bf50b048699c4c"},"site-closed.mjs":{"bytes":3146,"sha256":"977a33043aba80faab0683e9a4dd33aba2d6ec3508dd14bcc7276ecaec2335d1","blob":"effb33c3e63802b1c54760d45b5523378938eb39"},"tiny-helper.mjs":{"bytes":782,"sha256":"28de3c28c64518466d14685629e9ff1a422af744a939a5d7e2d8ff826dad565a","blob":"179a3b28169f343c0f4fecf2ec15bab639743025"},"tiny.test.mjs":{"bytes":360,"sha256":"a1b35804648b1a4ec652d1f0e3ce0dfbfc2a7d78bcb24cd6986aae7ccfa52cf8","blob":"c0ac0a2efda993d9d9b203197528fdb837c9395d"},"tiny-reporter.mjs":{"bytes":2861,"sha256":"9976aadc5884652cddf57f6b1c3cd072023614bd604680cce1c0ada03b40307f","blob":"0d579212537dbde9579c6c9c9109151990db3efa"},"reporter.mjs":{"bytes":679,"sha256":"e32d8d83e5f1fefdcb9461f6d40c50c76441cbd19fc9dc0e708d2dcdf158ab97","blob":"399034feaa2a99d38ef55fe7cfa1a2e87385a816"},"tiny-map.json":{"bytes":652,"sha256":"571dcb6e511c9d53d032d918daaa9659250a5f952987b1d7e2fc3ca8676223bb","blob":"dda5dac6a1250d3166fc98d89fac901c610f5ceb"},"schema.json":{"bytes":12651,"sha256":"d850e3ad8216e3375cc31d920f39aa2a6a43fd63dbc6ab2ef68d3d09671ecb1e","blob":"afee53bae2103c48211bc0bb72fcef482a9a6ebc"},"contract.mjs":{"bytes":4564,"sha256":"ab17ec9b41626d8f97b53ab0f32b2056b35ed56bbda4378d4085247a93ff4b92","blob":"6f21b4f3931bb139f29bc3cd20c0edfc405dfb1b"},"controls.mjs":{"bytes":12243,"sha256":"cd8c26838910668bc01abf9976412dbd8b263253e95b48094177c589f4f7e97e","blob":"08fc3498299ca0653cbcd40ce9b0bc8ac4b5836b"},"pins.json":{"bytes":549,"sha256":"9536e8993238aa8be06c26d3fe259a57b0d2c25be7e2d56f4acb641362864265","blob":"9e79d5f0b4423471c91eefbce1e20709a6267575"},"main.mjs":{"bytes":7757,"sha256":"996c3410b6478270595ff6deb0b518f34f006321be02aa12bcab489506f9d0cb","blob":"ef21e1e44780b15418244f1e750b190e5e3070f9"},"emit.mjs":{"bytes":881,"sha256":"51ac4cd3b8abf6301dae6650bac156d1e9ed48d1eecf11b87f1fa906668d9249","blob":"42e7e3ab7e728fb1894abd6a1407af4a72f97e72"}},payloadPins={"expanded":{"bytes":90957,"sha256":"4abe79ed7522b88d90337fbb9528fdd7a94f1660539bf70ad9fdb1009aaa611a","blob":"7496f640707af500054d13ac75c7c906a73b8fdd"},"compressed":{"bytes":22284,"sha256":"f7bed5593d557b47691a10c32a34c742326ea73e6ec7e263220c1f5c29ed0dfd","blob":"66c7b07042eebb92dfdeb24b17004816e6196784"},"base64Characters":29712,"programCount":18,"programSetSha256":"174a5a8731fb99de1a1e5525b13dea012097fc243d128f171d9cae9c4f370551"};
          assert.equal(process.versions.node,'22.23.4');assert.equal(e.GITHUB_REPOSITORY,'tokenizartinfo-ops/agent-friendly-web');assert.equal(e.GITHUB_REPOSITORY_ID,'1347578006');assert.equal(e.GITHUB_REF,'refs/heads/feat/finite-native-cleanup-20261101');assert.equal(e.GITHUB_RUN_ATTEMPT,'1');assert.equal(e.GITHUB_JOB,'readonly');assert.equal(e.GITHUB_EVENT_NAME,'push');assert.match(e.GITHUB_SHA,/^[a-f0-9]{40}$/);assert.match(e.GITHUB_RUN_ID,/^[1-9][0-9]{0,19}$/);
          assert.equal(e.AFW_SYN_CHECKPOINT_KEY,undefined);assert.equal(e.AFW_BUDGET_DIAGNOSTIC_CANDIDATE,undefined);assert.equal(process.cwd(),realpathSync('.'));assert.equal(git('rev-parse','--show-toplevel'),process.cwd());assert.equal(git('rev-parse','HEAD'),e.GITHUB_SHA);assert.equal(git('log','-1','--format=%B'),'AFW-READONLY-SOURCE-SITE-ONEUSE-20261114');
          const f7='.github/workflows/afw-finite-budget-qualification.yml',same='docs/superpowers/reports/2026-11-13-coherent-suite-qualification.md';
          const files={};for(const path of [f7,same]){const st=lstatSync(path);assert(st.isFile()&&!st.isSymbolicLink()&&st.nlink===1);const b=readFileSync(path);assert(b.length<=(path===f7?500000:1200000));assert.equal(blob(b),git('rev-parse','HEAD:'+path));files[path]=b;}
          const prefix=files[same].subarray(0,857320);assert.equal(prefix.length,857320);assert.equal(blob(prefix),'057c93ba0e250c8df77d658bb41f4dfb1b4455de');assert.equal(hash(prefix),'c45eea01d67a398b04bfbf177d144c4c9f93e9928b88ce2e8c1dcb0c49207d6f');
          const leafRows=execFileSync('git',['ls-tree','-rz','--full-tree','HEAD']).toString('utf8').split('\0').filter(Boolean).map(x=>{const i=x.indexOf('\t');assert(i>0);return{tuple:x.slice(0,i),path:x.slice(i+1)};}).filter(x=>x.path!==f7&&x.path!==same).sort((a,b)=>Buffer.compare(Buffer.from(a.path),Buffer.from(b.path)));
          const core=Buffer.from(leafRows.map(x=>x.tuple+'\t'+x.path+'\0').join(''));assert.equal(leafRows.length,3200);assert.equal(core.length,324348);assert.equal(hash(core),'547d44f2938403fa92fc6f8de19ef0000728c7917983afc9cf415697e812f802');execFileSync('git',['diff','--exit-code','HEAD','--'],{stdio:['ignore','pipe','pipe']});
          const text=new TextDecoder('utf-8',{fatal:true}).decode(files[same]),begin='<!-- AFW-READONLY-SOURCE-SITE-PAYLOAD-V1:BEGIN -->',end='<!-- AFW-READONLY-SOURCE-SITE-PAYLOAD-V1:END -->';
          assert.equal(text.split(begin).length,2);assert.equal(text.split(end).length,2);const at=text.indexOf(begin),finish=text.indexOf(end);assert(Buffer.byteLength(text.slice(0,at))>=857320&&finish>at);
          const section=text.slice(at+begin.length,finish);assert.match(section,/^\n[A-Za-z0-9+/=\n]+\n$/);const b64=section.replaceAll('\n','');assert.equal(b64.length,payloadPins.base64Characters);assert(b64.length<=40000);assert.match(b64,/^[A-Za-z0-9+/]+={0,2}$/);
          const zipped=Buffer.from(b64,'base64');assert.equal(zipped.toString('base64'),b64);assert.equal(zipped.length,payloadPins.compressed.bytes);assert(zipped.length<=30000);assert.equal(hash(zipped),payloadPins.compressed.sha256);assert.equal(blob(zipped),payloadPins.compressed.blob);
          const bytes=gunzipSync(zipped,{maxOutputLength:100000});assert.equal(bytes.length,payloadPins.expanded.bytes);assert.equal(hash(bytes),payloadPins.expanded.sha256);assert.equal(blob(bytes),payloadPins.expanded.blob);
          const data=new TextDecoder('utf-8',{fatal:true}).decode(bytes),payload=JSON.parse(data);assert.equal(canonical(payload),data);assert.deepEqual(Object.keys(payload),['purpose','sourceBase','sourceBaseTree','programs']);assert.equal(payload.purpose,'afw.readonly-source-site.payload.v1');assert.equal(payload.sourceBase,'327e9b7ec2182588dfb02e58b238787abb37a017');assert.equal(payload.sourceBaseTree,'1e8af62f8622e444179fea1cafbaf4a2a08ddf30');
          const names=Object.keys(expected);assert.equal(names.length,18);assert.deepEqual(Object.keys(payload.programs),names);assert.equal(hash(canonical(expected)),payloadPins.programSetSha256);
          for(const name of names){assert.match(name,/^[a-z0-9][a-z0-9.-]{0,63}$/);const p=payload.programs[name],pin=expected[name];assert.deepEqual(Object.keys(p),['bytes','sha256','blob','content']);assert.equal(typeof p.content,'string');const b=Buffer.from(p.content);assert(b.length<=21000);assert.deepEqual({bytes:p.bytes,sha256:p.sha256,blob:p.blob},pin);assert.equal(b.length,pin.bytes);assert.equal(hash(b),pin.sha256);assert.equal(blob(b),pin.blob);}
          const map=JSON.parse(payload.programs['site-map.json'].content),pins=JSON.parse(payload.programs['pins.json'].content);assert.equal(map.spans.length,83);assert.equal(new Set(map.spans.map(x=>x.alias)).size,83);assert(map.spans.every(x=>/^(world|native)_[1-9][0-9]*_a[1-9][0-9]*$/.test(x.alias)));assert.deepEqual(map.files,{world:pins.world,native:pins.native});assert.deepEqual(pins.map,expected['site-map.json']);
          for(const pin of Object.values(map.files)){const st=lstatSync(pin.path);assert(st.isFile()&&!st.isSymbolicLink());const b=readFileSync(pin.path);assert.equal(b.length,pin.bytes);assert.equal(hash(b),pin.sha256);assert.equal(blob(b),pin.blob);assert.equal(git('rev-parse','HEAD:'+pin.path),pin.blob);}
          const sourceTree=git('rev-parse','HEAD^{tree}');assert.match(sourceTree,/^[a-f0-9]{40}$/);const root=join(e.RUNNER_TEMP,'afw-site');assert.equal(realpathSync(e.RUNNER_TEMP),e.RUNNER_TEMP);mkdirSync(root,{mode:0o700});
          for(const name of names)writeFileSync(join(root,name),payload.programs[name].content,{mode:0o600,flag:'wx'});
          for(const name of names){const b=readFileSync(join(root,name));assert.equal(b.length,expected[name].bytes);assert.equal(hash(b),expected[name].sha256);assert.equal(blob(b),expected[name].blob);}
          const binding={purpose:'afw.readonly-source-site.binding.v1',sourceBase:payload.sourceBase,source:e.GITHUB_SHA,sourceTree,workflowBlob:blob(files[f7]),sameBlob:blob(files[same]),programsVerified:true,programCount:names.length,programSetSha256:payloadPins.programSetSha256,payloadExpandedSha256:payloadPins.expanded.sha256,coreGitVerified:true,prefixVerified:true};
          writeFileSync(join(root,'binding.json'),canonical(binding),{mode:0o600,flag:'wx'});
          AFW_SITE_LOADER
      - name: Run actual tiny controls before install pure profile and one readonly CLI
        id: diagnostic
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node "$RUNNER_TEMP/afw-site/main.mjs" >"$RUNNER_TEMP/afw-site-main-private.log" 2>&1 || { echo readonly_site_diagnostic_held; exit 1; }
      - name: Emit one closed finite site record only
        if: always() && steps.loader.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node "$RUNNER_TEMP/afw-site/emit.mjs" 2>"$RUNNER_TEMP/afw-site-emit-private.log" || { echo readonly_site_wire_unavailable; exit 1; }
