      - name: Verify sixteen synthetic inspection pairs before artifact access
        shell: bash
        run: |
          set -euo pipefail
          cat >>"$RUNNER_TEMP/afw-inspection-pair-controls.mjs" <<'NODE_PAIR_TESTS'
          // These pairs exist only in memory, under the null Git object ID and an empty environment except for the two fixture identifiers.
          const pairControlIds=["observed_pass","observed_failure","observed_skip_todo","result_source","result_run","manifest_source","manifest_run","foreign_pair","fixture_count","unexamined","two_records","unknown_case","wrapper_only","manifest_bytes","manifest_digest","case_order"];
          function inspectedFixture(){
           const result=baseResult();
           result.status='inspected';
           result.artifact.verified=true;
           result.authentication={authenticated:true,innerInventoryVerified:true,fileCount:1,totalBytes:1};
           result.failureIdentity={verified:true,commandSucceeded:false,elapsedMs:1};
           result.phases={fixtures:'passed',download:'verified',authentication:'authenticated',identity:'verified',projection:'projected',cleanup:'complete'};
           result.timings={downloadMs:1,openMs:1,parseCleanupMs:1};
           result.fixtures.checks=91;
           result.tap.status='present';
           result.tap.recordedCaseCount=3;
           for(const item of result.cases) item.tap.status='pass';
           return result;
          }
          function checkPair(changeResult,changeManifest,reason){
           const result=inspectedFixture();
           if(changeResult) changeResult(result);
           const body=Buffer.from(JSON.stringify(result));
           const manifest={purpose:'afw.readonly-receipt-inspection-manifest.safe.v1',inspectorSource:process.env.GITHUB_SHA,inspectorRun:process.env.GITHUB_RUN_ID,attempt:1,files:[{path:'result.json',bytes:body.length,sha256:sha(body)}]};
           if(changeManifest) changeManifest(manifest);
           const pair=new Map([['result.json',body],['manifest.json',Buffer.from(JSON.stringify(manifest))]]);
           if(reason){
            assert.throws(()=>validateInspectionPair(pair),error=>error instanceof Rejected&&error.reason===reason);
           }else{
            const checked=validateInspectionPair(pair);
            assert.deepEqual(checked,result);
            for(const key of Object.keys(FLAGS)) assert.equal(checked[key],false);
           }
          }
          const otherSource='1'.repeat(40),otherRun='2';
          function clearCaseRecords(result){
           result.tap.recordedCaseCount=0;
           for(const item of result.cases) item.tap.status='unknown';
          }
          const pairChecks={
           observed_pass:()=>checkPair(),
           observed_failure:()=>checkPair(r=>{r.cases[1].tap.status='fail';}),
           observed_skip_todo:()=>checkPair(r=>{r.cases[0].tap.status='skipped';r.cases[2].tap.status='todo';}),
           result_source:()=>checkPair(r=>{r.inspector.source=otherSource;},null,'inspection_identity'),
           result_run:()=>checkPair(r=>{r.inspector.run=otherRun;},null,'inspection_identity'),
           manifest_source:()=>checkPair(null,m=>{m.inspectorSource=otherSource;},'inspection_manifest'),
           manifest_run:()=>checkPair(null,m=>{m.inspectorRun=otherRun;},'inspection_manifest'),
           foreign_pair:()=>checkPair(r=>{r.inspector.source=otherSource;r.inspector.run=otherRun;},m=>{m.inspectorSource=otherSource;m.inspectorRun=otherRun;},'inspection_manifest'),
           fixture_count:()=>checkPair(r=>{r.fixtures.checks=1;},null,'inspection_examined'),
           unexamined:()=>checkPair(r=>{r.tap.status='not_examined';clearCaseRecords(r);},null,'inspection_examined'),
           two_records:()=>checkPair(r=>{r.tap.recordedCaseCount=2;},null,'inspection_examined'),
           unknown_case:()=>checkPair(r=>{r.cases[1].tap.status='unknown';},null,'inspection_examined'),
           wrapper_only:()=>checkPair(r=>{clearCaseRecords(r);r.tap.fileWrapper.status='pass';},null,'inspection_examined'),
           manifest_bytes:()=>checkPair(null,m=>{m.files[0].bytes++;},'inspection_manifest'),
           manifest_digest:()=>checkPair(null,m=>{m.files[0].sha256='0'.repeat(64);},'inspection_manifest'),
           case_order:()=>checkPair(r=>{r.cases.reverse();},null,'public_cases')
          };
          const inventory=pairControlIds.map(id=>({id,status:'not_executed'}));
          let firstFailure=null;
          try{
           assert.deepEqual(Object.keys(pairChecks),pairControlIds);
           assert.equal(process.env.GITHUB_SHA,'0'.repeat(40));
           assert.equal(process.env.GITHUB_RUN_ID,'1');
           for(const row of inventory){
            try{pairChecks[row.id]();row.status='passed';}
            catch{row.status='failed';firstFailure=row.id;break;}
           }
          }catch{firstFailure='setup';}
          const pass=inventory.filter(row=>row.status==='passed').length;
          const fail=inventory.filter(row=>row.status==='failed').length;
          const record={marker:'INSPECTION_PAIR_CONTROLS',expected:16,completed:pass+fail,pass,fail,inventory,firstFailure};
          const line=JSON.stringify(record);
          assert.equal(inventory.length,16);
