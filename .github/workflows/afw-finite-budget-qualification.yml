          set -euo pipefail
          umask 077
          test -z "${AFW_SYN_CHECKPOINT_KEY+x}"
          node --input-type=module 2>"$RUNNER_TEMP/afw-inspection-control/projection-error.log" <<'NODE'
          import {readFile,writeFile,mkdir,lstat,readdir} from 'node:fs/promises';
