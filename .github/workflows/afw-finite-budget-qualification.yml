name: AFW round2 fixed lint diagnostic
run-name: AFW round2 structured lint Native16 HELD ${{ github.sha }}
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-finite-budget-qualification.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
jobs:
  lint_diagnostic:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/feat/finite-native-cleanup-20261101' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require fixed context
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = tokenizartinfo-ops/agent-friendly-web
          test "$GITHUB_REF" = refs/heads/feat/finite-native-cleanup-20261101
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -z "${AFW_SYN_CHECKPOINT_KEY+x}"
          mkdir -m 700 "$RUNNER_TEMP/afw-lint-private"
      - uses: actions/checkout@v4
        with:
          repository: tokenizartinfo-ops/agent-friendly-web
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install same locked dependencies privately
        id: install
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(node -v)" = v22.23.4
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci --ignore-scripts --no-audit --no-fund >"$RUNNER_TEMP/afw-lint-private/install.log" 2>&1 || { echo locked_install_failed; exit 1; }
      - name: Execute the exact five-input lint command with JSON formatter
        id: lint
        if: steps.install.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFile} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const inputs=[["test/fixtures/finite-budget-world.mjs","41be914c5c2133e6f25104ed63cd58047c7fbf0e"],["test/fixtures/finite-owner-cleanup.mjs","2f5dad6c306fac1be2f11845bef640bb204ad572"],["test/mcp-qa-finite-budget-native.test.mjs","533dafb5df5f8e57442c5b9029dc8dec6dded434"],["test/fixtures/finite-initial-entry-world.mjs","a7b730dc9be336528f0971544099f79d05758b1a"],["test/fixtures/finite-owner-cleanup-persistence.mjs","e0dda1fd3d66c1864fd0b20f873c7fc0c452f6d8"]];
          for(const [path,blob]of inputs){const bytes=await readFile(path);assert.equal(createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex'),blob);}
          NODE
          files=(test/fixtures/finite-budget-world.mjs test/fixtures/finite-owner-cleanup.mjs test/mcp-qa-finite-budget-native.test.mjs test/fixtures/finite-initial-entry-world.mjs test/fixtures/finite-owner-cleanup-persistence.mjs)
          actual=0
          npx --no-install eslint "${files[@]}" --format json >"$RUNNER_TEMP/afw-lint-private/lint.json" 2>"$RUNNER_TEMP/afw-lint-private/stderr.log" || actual=$?
          printf '%s\n' "$actual" >"$RUNNER_TEMP/afw-lint-private/exit.txt"
          printf 'actual-exit=%s\n' "$actual" >>"$GITHUB_OUTPUT"
      - name: Independently seal strict closed lint JSON
        id: closed
        if: always() && !cancelled() && steps.scope.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFile,writeFile,mkdir,lstat,readdir} from 'node:fs/promises';import {createHash} from 'node:crypto';import {join,resolve} from 'node:path';
          const inputs=[["test/fixtures/finite-budget-world.mjs","41be914c5c2133e6f25104ed63cd58047c7fbf0e"],["test/fixtures/finite-owner-cleanup.mjs","2f5dad6c306fac1be2f11845bef640bb204ad572"],["test/mcp-qa-finite-budget-native.test.mjs","533dafb5df5f8e57442c5b9029dc8dec6dded434"],["test/fixtures/finite-initial-entry-world.mjs","a7b730dc9be336528f0971544099f79d05758b1a"],["test/fixtures/finite-owner-cleanup-persistence.mjs","e0dda1fd3d66c1864fd0b20f873c7fc0c452f6d8"]],env=process.env,sha=bytes=>createHash('sha256').update(bytes).digest('hex'),root=join(env.RUNNER_TEMP,'afw-lint-private'),dest=join(env.RUNNER_TEMP,'afw-lint-public');
          const base={purpose:'afw.round2-lint-diagnostic.safe.v1',repository:'tokenizartinfo-ops/agent-friendly-web',ref:'refs/heads/feat/finite-native-cleanup-20261101',source:env.GITHUB_SHA,run:env.GITHUB_RUN_ID,attempt:1,node:'22.23.4',inputs:inputs.map(([file,blob])=>({file,blob})),commandExit:null,status:'diagnostic_invalid',reason:'command_not_completed',counts:{files:0,messages:0,errors:0,warnings:0,fatal:0,fixableErrors:0,fixableWarnings:0},fileCounts:[],entries:[],rawRetention:'runner_only_until_runner_cleanup',I0Opened:false,nativeExecutionProduced:false,businessCases:0,operationalReadiness:false,completePackage:false,PCoff:false};
          let reason='context';
          const integer=(v,min=0,max=10000000)=>assert(Number.isSafeInteger(v)&&v>=min&&v<=max);
          const keys=(value,allowed,required=[])=>{assert(value&&typeof value==='object'&&!Array.isArray(value));assert(Object.keys(value).every(key=>allowed.includes(key)));for(const key of required)assert(Object.hasOwn(value,key));};
          try{
           assert(env.GITHUB_REPOSITORY===base.repository&&env.GITHUB_REF===base.ref&&env.GITHUB_RUN_ATTEMPT==='1');assert(/^[a-f0-9]{40}$/.test(base.source)&&/^[1-9][0-9]*$/.test(base.run));
           reason='fixed_source';for(const[file,blob]of inputs){const bytes=await readFile(file);assert.equal(createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex'),blob);}
           reason='command_exit';const exit=Number((await readFile(join(root,'exit.txt'),'utf8')).trim());integer(exit,0,255);base.commandExit=exit;assert(exit===0||exit===1);
           reason='raw_size';const file=join(root,'lint.json'),st=await lstat(file);assert(st.isFile()&&st.nlink===1&&st.size>0&&st.size<=2097152);const bytes=await readFile(file);assert.equal(bytes.length,st.size);
           reason='raw_json';const result=JSON.parse(bytes);assert(Array.isArray(result)&&result.length===inputs.length);let seen=new Set(),entries=[],fileCounts=[],counts={...base.counts};
           for(const row of result){
            reason='result_keys';keys(row,['filePath','messages','suppressedMessages','errorCount','fatalErrorCount','warningCount','fixableErrorCount','fixableWarningCount','source','usedDeprecatedRules'],['filePath','messages','errorCount','fatalErrorCount','warningCount','fixableErrorCount','fixableWarningCount']);
            reason='unknown_file';const pair=inputs.find(([file])=>resolve(file)===row.filePath);assert(pair&&!seen.has(pair[0]));seen.add(pair[0]);const name=pair[0];
            reason='result_counts';for(const key of ['errorCount','fatalErrorCount','warningCount','fixableErrorCount','fixableWarningCount'])integer(row[key],0,256);
            if(Object.hasOwn(row,'source'))assert(typeof row.source==='string');if(Object.hasOwn(row,'suppressedMessages'))assert(Array.isArray(row.suppressedMessages)&&row.suppressedMessages.length<=256);if(Object.hasOwn(row,'usedDeprecatedRules'))assert(Array.isArray(row.usedDeprecatedRules)&&row.usedDeprecatedRules.length<=256);
            assert(Array.isArray(row.messages)&&row.messages.length<=256);let errors=0,warnings=0,fatal=0;
            for(const message of row.messages){
             reason='message_keys';keys(message,['ruleId','severity','fatal','message','line','column','endLine','endColumn','nodeType','messageId','fix','suggestions'],['ruleId','severity','message']);
             reason='message_shape';assert(message.severity===1||message.severity===2);assert(message.fatal===undefined||typeof message.fatal==='boolean');const isFatal=message.fatal===true;
             assert(message.ruleId===null?isFatal:typeof message.ruleId==='string'&&/^[a-zA-Z0-9@][a-zA-Z0-9_@/-]{0,127}$/.test(message.ruleId));assert(typeof message.message==='string'&&Buffer.byteLength(message.message)<=65536);
             const coordinate=key=>{if(message[key]===undefined)return null;integer(message[key],1);return message[key];};
             if(message.nodeType!==undefined)assert(message.nodeType===null||typeof message.nodeType==='string');if(message.messageId!==undefined)assert(typeof message.messageId==='string');
             if(message.fix!==undefined){keys(message.fix,['range','text'],['range','text']);assert(Array.isArray(message.fix.range)&&message.fix.range.length===2);message.fix.range.forEach(n=>integer(n));assert(typeof message.fix.text==='string');}
             if(message.suggestions!==undefined){assert(Array.isArray(message.suggestions)&&message.suggestions.length<=16);for(const suggestion of message.suggestions){keys(suggestion,['messageId','data','fix','desc'],['fix','desc']);assert(typeof suggestion.desc==='string');if(suggestion.messageId!==undefined)assert(typeof suggestion.messageId==='string');keys(suggestion.fix,['range','text'],['range','text']);assert(Array.isArray(suggestion.fix.range)&&suggestion.fix.range.length===2);suggestion.fix.range.forEach(n=>integer(n));assert(typeof suggestion.fix.text==='string');}}
             entries.push({file:name,ruleId:message.ruleId,line:coordinate('line'),column:coordinate('column'),endLine:coordinate('endLine'),endColumn:coordinate('endColumn'),severity:message.severity,fatal:isFatal,message:{bytes:Buffer.byteLength(message.message),sha256:sha(message.message)}});
             if(message.severity===2)errors++;else warnings++;if(isFatal)fatal++;
            }
            reason='count_reconciliation';assert.equal(row.errorCount,errors);assert.equal(row.warningCount,warnings);assert.equal(row.fatalErrorCount,fatal);assert(row.fixableErrorCount<=errors&&row.fixableWarningCount<=warnings);
            fileCounts.push({file:name,errors,warnings,fatal,fixableErrors:row.fixableErrorCount,fixableWarnings:row.fixableWarningCount});
            counts.files++;counts.messages+=row.messages.length;counts.errors+=errors;counts.warnings+=warnings;counts.fatal+=fatal;counts.fixableErrors+=row.fixableErrorCount;counts.fixableWarnings+=row.fixableWarningCount;
           }
           reason='total_bound';assert(entries.length<=256);assert.equal(seen.size,inputs.length);assert(exit===1?counts.errors>0:counts.errors===0);
           base.status=counts.errors||counts.warnings?'lint_findings':'lint_clean';base.reason='none';base.counts=counts;base.fileCounts=fileCounts.sort((a,b)=>a.file.localeCompare(b.file));base.entries=entries.sort((a,b)=>a.file.localeCompare(b.file)||(a.line??0)-(b.line??0)||(a.column??0)-(b.column??0));
          }catch{base.reason=reason;}
          await mkdir(dest,{mode:0o700});assert.deepEqual(await readdir(dest),[]);const bytes=Buffer.from(JSON.stringify(base,null,2));assert(bytes.length<=131072);await writeFile(join(dest,'result.json'),bytes);
          const manifest={purpose:'afw.round2-lint-diagnostic-manifest.safe.v1',source:base.source,run:base.run,attempt:1,files:[{path:'result.json',bytes:bytes.length,sha256:sha(bytes)}]};await writeFile(join(dest,'manifest.json'),JSON.stringify(manifest,null,2));
          await writeFile(env.GITHUB_OUTPUT,'valid='+(base.status!=='diagnostic_invalid')+'\n',{flag:'a'});
          NODE
      - name: Upload only two closed JSON files
        id: upload
        if: always() && !cancelled() && steps.closed.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: finite-budget-round2-lint-${{ github.sha }}
          path: ${{ runner.temp }}/afw-lint-public/
          if-no-files-found: error
          retention-days: 7
      - name: Download exact assigned lint artifact ID retrieval 1
        id: receipt1
        if: always() && !cancelled() && steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-lint-receipt
          merge-multiple: true
      - name: Wait 2s for assigned lint artifact retrieval 2
        id: wait2
        if: always() && !cancelled() && steps.receipt1.outcome == 'failure'
        shell: bash
        run: sleep 2
      - name: Download exact assigned lint artifact ID retrieval 2
        id: receipt2
        if: always() && !cancelled() && steps.wait2.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-lint-receipt
          merge-multiple: true
      - name: Wait 5s for assigned lint artifact retrieval 3
        id: wait3
        if: always() && !cancelled() && steps.receipt2.outcome == 'failure'
        shell: bash
        run: sleep 5
      - name: Download exact assigned lint artifact ID retrieval 3
        id: receipt3
        if: always() && !cancelled() && steps.wait3.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-lint-receipt
          merge-multiple: true
      - name: Verify exact full closed inventory and print only DTO
        id: verified
        if: always() && !cancelled() && steps.upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          DOWNLOADED: ${{ steps.receipt1.outcome == 'success' || steps.receipt2.outcome == 'success' || steps.receipt3.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$DOWNLOADED" = true || { echo lint_evidence_not_preserved; exit 1; }
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFile,readdir,lstat} from 'node:fs/promises';import {createHash} from 'node:crypto';import {join} from 'node:path';
          const e=process.env,root=join(e.RUNNER_TEMP,'afw-lint-receipt'),local=join(e.RUNNER_TEMP,'afw-lint-public'),sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          assert(/^[1-9][0-9]*$/.test(e.ARTIFACT_ID));assert.deepEqual((await readdir(root)).sort(),['manifest.json','result.json']);for(const name of ['manifest.json','result.json']){const st=await lstat(join(root,name));assert(st.isFile()&&st.nlink===1&&st.size<=131072);assert((await readFile(join(root,name))).equals(await readFile(join(local,name))));}
          const bytes=await readFile(join(root,'result.json')),m=JSON.parse(await readFile(join(root,'manifest.json'),'utf8')),v=JSON.parse(bytes);assert.equal(m.purpose,'afw.round2-lint-diagnostic-manifest.safe.v1');assert.equal(m.source,e.GITHUB_SHA);assert.equal(m.run,e.GITHUB_RUN_ID);assert.equal(m.attempt,1);assert.deepEqual(m.files,[{path:'result.json',bytes:bytes.length,sha256:sha(bytes)}]);assert.equal(v.purpose,'afw.round2-lint-diagnostic.safe.v1');assert.equal(v.source,e.GITHUB_SHA);assert.equal(v.run,e.GITHUB_RUN_ID);assert.equal(v.attempt,1);
          console.log('ROUND2_LINT_SAME_ID_VERIFIED '+e.ARTIFACT_ID);console.log(bytes.toString('utf8'));
          NODE
      - name: Require complete diagnostic, never interpret findings as fixed
        if: always() && !cancelled()
        shell: bash
        run: |
          test '${{ steps.verified.outcome }}' = success
          test '${{ steps.closed.outputs.valid }}' = true
          test '${{ steps.lint.outcome }}' = success
