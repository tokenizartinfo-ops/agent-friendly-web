name: AFW R3 delivery successor controls
run-name: AFW R3 delivery successor CONTROLS ONLY ${{ github.sha }}
on:
  push:
    branches:
      - feat/finite-native-cleanup-20261101
    paths:
      - .github/workflows/afw-finite-budget-qualification.yml
permissions:
  contents: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
# Inactive DATA; I3 OPEN. Root alone may release separate controls-only F7.
jobs:
  readonly:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'AFW-R3-DELIVERY-CONTROLS-ONEUSE-20261115' && github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/feat/finite-native-cleanup-20261101' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Require controls-only Source scope
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = tokenizartinfo-ops/agent-friendly-web
          test "$GITHUB_REPOSITORY_ID" = 1347578006
          test "$GITHUB_REF" = refs/heads/feat/finite-native-cleanup-20261101
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_JOB" = readonly
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_WORKFLOW_REF" = tokenizartinfo-ops/agent-friendly-web/.github/workflows/afw-finite-budget-qualification.yml@refs/heads/feat/finite-native-cleanup-20261101
          test -z "${NODE_OPTIONS+x}"
          test -z "${NODE_PATH+x}"
          test -z "${AFW_SYN_CHECKPOINT_KEY+x}"
          test -z "${AFW_BUDGET_DIAGNOSTIC_CANDIDATE+x}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tokenizartinfo-ops/agent-friendly-web
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Verify frozen production DATA and helper bytes then bind exact Source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
          node --input-type=module <<'AFW_R3_DELIVERY_LOADER'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,mkdirSync,lstatSync,realpathSync,statSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          import {execFileSync} from 'node:child_process';
          try{
           const e=process.env,sha=b=>createHash('sha256').update(b).digest('hex'),blob=b=>createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex'),canonical=JSON.stringify;
           const git=(...args)=>execFileSync('git',args,{encoding:'utf8',stdio:['ignore','pipe','pipe']}).trim();
           assert.equal(process.versions.node,'22.23.4');assert.equal(e.GITHUB_REPOSITORY,'tokenizartinfo-ops/agent-friendly-web');assert.equal(e.GITHUB_REPOSITORY_ID,'1347578006');assert.equal(e.GITHUB_JOB,'readonly');assert.equal(e.GITHUB_RUN_ATTEMPT,'1');assert.equal(e.GITHUB_REF,'refs/heads/feat/finite-native-cleanup-20261101');assert.equal(e.GITHUB_EVENT_NAME,'push');assert.equal(e.NODE_OPTIONS,undefined);assert.equal(e.NODE_PATH,undefined);
           assert.match(e.GITHUB_SHA,/^[a-f0-9]{40}$/);assert.match(e.GITHUB_RUN_ID,/^[1-9][0-9]{0,19}$/);assert.equal(git('rev-parse','HEAD'),e.GITHUB_SHA);assert.equal(git('rev-parse','--show-toplevel'),realpathSync('.'));assert.equal(process.cwd(),realpathSync('.'));
           const sourceTree=git('rev-parse','HEAD^{tree}');assert.match(sourceTree,/^[a-f0-9]{40}$/);
           const f7='.github/workflows/afw-finite-budget-qualification.yml',same='docs/superpowers/reports/2026-11-13-coherent-suite-qualification.md';
           const rawTree=execFileSync('git',['ls-tree','-rz','--full-tree','HEAD'],{stdio:['ignore','pipe','pipe']});
           const rows=rawTree.toString('utf8').split('\0').filter(Boolean).map(x=>{const n=x.indexOf('\t');assert(n>0);return{tuple:x.slice(0,n),path:x.slice(n+1)};}).filter(x=>![f7,same].includes(x.path)).sort((a,b)=>Buffer.compare(Buffer.from(a.path),Buffer.from(b.path)));
           const core=Buffer.from(rows.map(x=>x.tuple+'\t'+x.path+'\0').join(''));assert.equal(rows.length,3201);assert.equal(core.length,324448);assert.equal(sha(core),'aefb08c118db0e099833b8f1065779949be6bc8c1978eb828c26728ef0840703');
           execFileSync('git',['diff','--exit-code','HEAD','--'],{stdio:['ignore','pipe','pipe']});
           const st=lstatSync(same);assert(st.isFile()&&!st.isSymbolicLink()&&st.size<=1600000);const bytes=readFileSync(same);assert.equal(blob(bytes),git('rev-parse','HEAD:'+same));
           const prefix=bytes.subarray(0,1429126);assert.equal(prefix.length,1429126);assert.equal(sha(prefix),'a24175f3e29fcd0d9eb0a73edbcc45098fdf204b6eca2631be6a84cb20def476');assert.equal(blob(prefix),'9c3407fd3da75a9acbbb8b73ddc03c5e9148474a');
           const text=new TextDecoder('utf-8',{fatal:true}).decode(bytes),begin='<!-- AFW-R3-DELIVERY-SUCCESSOR-DATA-V1:BEGIN -->',end='<!-- AFW-R3-DELIVERY-SUCCESSOR-DATA-V1:END -->';assert.equal(text.split(begin).length,2);assert.equal(text.split(end).length,2);const start=text.indexOf(begin),finish=text.indexOf(end);assert(Buffer.byteLength(text.slice(0,start))>=1429126&&finish>start);
           const section=text.slice(start+begin.length,finish);assert.match(section,/^\n[A-Za-z0-9+/=\n]+\n$/);const b64=section.replaceAll('\n',''),payloadPins={"bytes":243697,"sha256":"7cc2e1d81f523d5b2f39b7347d6800ed8d8ff8cada7003fe2e3b2f7c6e4f6331","blob":"61413acd51dc9f51457d1d6e8acdf4f518061c70","compressed":{"bytes":50503,"sha256":"34a5b9984d58c93893709418c74567fd4f071c663b1f92a134ec43b67e8227aa","blob":"e9c42fac7e37ddc8439a1773b7a9649b65e34ab1"},"base64Characters":67340};assert.equal(b64.length,payloadPins.base64Characters);assert(b64.length<=87400);const zipped=Buffer.from(b64,'base64');assert.equal(zipped.toString('base64'),b64);assert.equal(zipped.length,payloadPins.compressed.bytes);assert(zipped.length<=65536);assert.equal(sha(zipped),payloadPins.compressed.sha256);assert.equal(blob(zipped),payloadPins.compressed.blob);
           const expanded=gunzipSync(zipped,{maxOutputLength:350000});assert.equal(expanded.length,payloadPins.bytes);assert.equal(sha(expanded),payloadPins.sha256);assert.equal(blob(expanded),payloadPins.blob);
           const raw=new TextDecoder('utf-8',{fatal:true}).decode(expanded),payload=JSON.parse(raw);assert.equal(canonical(payload),raw);assert.deepEqual(Object.keys(payload),['purpose','sourceParent','sourceParentTree','core','prefix','production','helpers']);assert.equal(payload.purpose,'afw.r3-delivery.successor-data.v1');assert.equal(payload.sourceParent,'8c065ff3a78c39c17a906990beec640e7c83b1a4');assert.equal(payload.sourceParentTree,'3c3b3ba7edeff2ea8d695f380b2ccef3f3c24be5');assert.deepEqual(payload.core,{"count":3201,"bytes":324448,"sha256":"aefb08c118db0e099833b8f1065779949be6bc8c1978eb828c26728ef0840703"});assert.deepEqual(payload.prefix,{"blob":"9c3407fd3da75a9acbbb8b73ddc03c5e9148474a","bytes":1429126,"sha256":"a24175f3e29fcd0d9eb0a73edbcc45098fdf204b6eca2631be6a84cb20def476"});
           const prod=payload.production;assert.deepEqual(Object.keys(prod),['blob','bytes','sha256','count','setSha256','data']);assert.equal(prod.count,18);assert.equal(prod.blob,'b88ebef9a2aa979772d20bfb778cbfe463dc3011');assert.equal(prod.bytes,95518);assert.equal(prod.sha256,'cfcb0dc7992d27246dc785ef2991104f6715e61c9aa49cfddc0317b219e6ac91');assert.equal(prod.setSha256,'71b4454f4cd90f716852bbdbb44f686d7f46191e8d93f890c465a7cb5f29d9af');
           const frozen=Buffer.from(prod.data);assert.equal(frozen.length,prod.bytes);assert.equal(sha(frozen),prod.sha256);assert.equal(blob(frozen),prod.blob);const original=JSON.parse(prod.data);assert.equal(JSON.stringify(original)+'\n',prod.data);assert.equal(original.productionCount,18);assert.equal(Object.keys(original.programs).length,18);
           const originalPins={};for(const[name,p]of Object.entries(original.programs)){const b=Buffer.from(p.content);assert.deepEqual(Object.keys(p),['bytes','sha256','blob','content']);assert.equal(b.length,p.bytes);assert.equal(sha(b),p.sha256);assert.equal(blob(b),p.blob);originalPins[name]={bytes:p.bytes,sha256:p.sha256,blob:p.blob};}assert.equal(sha(Buffer.from(canonical(originalPins)+'\n')),prod.setSha256);
           // Original18 verified DATA only. No production main/CLI materialized or invoked.
           const expected={"io.mjs":{"bytes":1588,"sha256":"46eabc3b6b2a3ebbfe5adf5f8e80c3483054c50d22b1ee58f95472bc0f3d5591","blob":"13cb25b6f5b3e41e00cc160352c98e28a1727cbe"},"emitter.mjs":{"bytes":3370,"sha256":"ebfd96162c79fceadedab3096c1019ad93d9823c707e044b30b295e6d2d7b30f","blob":"519d0aea014a914c3082d9879b81bb7a48bbf818"},"source-provenance.mjs":{"bytes":6690,"sha256":"b4d0872044216a275458d14b838ecf57628780092767ea88910dce18585408ce","blob":"fc6b339e54bf0fe91ad73f9b744ab7d46df35b0d"},"raw-sample.mjs":{"bytes":4289,"sha256":"1b594a7768a69cba5db1f41e83eb2a941f6451c82584490fdb77ba1fea85e9fc","blob":"8cdabb2324ae97b04fa17350846e24d666cd3536"},"site-schema.json":{"bytes":12651,"sha256":"5b55423937bbe38a18f1bbb8196d8cd85336d81187810b8c5b5abe8a593c37fd","blob":"4871edc102386fe6db65c773e51c21ecb94897e3"},"site-map.json":{"bytes":6630,"sha256":"1be6536669654bcc8c181ed7057b189352bef9b0587eb75f4124500477e4f2fe","blob":"57c5a96710f0a2d97656b400882d8b4b4a1a7e2f"},"envelope-schema.json":{"bytes":5616,"sha256":"49c2a27cf977f0c9247fb8f20539fb29a9ca002294d86eeb0d9db8f876e090e5","blob":"90831bbc3035d944c4ae8f96d2cfa6b24362eb9f"},"boundary.sh":{"bytes":842,"sha256":"b4862496b3742b7d21d27d8af685c6b2f44c5432a4e539c3c4d7bf4e0585ab76","blob":"5bb847a0331bd88a8fdbdd7d75fe8a8606b9f5bb"},"boundary.py":{"bytes":12831,"sha256":"258ee9db8ce4372696f06760c7bc185265959075977aab32c199752b90160490","blob":"edb544d09570ce3e87cbc57ddc145ca02e487088"},"delivery-schema.json":{"bytes":1380,"sha256":"d8332c8bf26c4224bd2a5da321dc50a28a2d6391b294bc262a438c2638fa2f60","blob":"ae706e0e659d0ee7647bbec8e6b3d9ebbcac3df8"},"unavailable-schema.json":{"bytes":1209,"sha256":"b6c19e0a101fb7ce2e4332f823fd9f33e1846bcd4707e81102fdd810e1d9497a","blob":"a3fd343363a9cd5023807482009c54098fa23655"},"controls-schema.json":{"bytes":2942,"sha256":"dc6f42e5ce74cdea1f4204da77c5ab6881f27176d221c503c9d8b67b17fc9604","blob":"7b474a875fc936d7fd4fae8d66a5a53ddf314417"},"matrix.json":{"bytes":6639,"sha256":"1ae00081c12e42676015