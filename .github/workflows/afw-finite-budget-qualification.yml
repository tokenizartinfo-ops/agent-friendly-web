name: AFW existing artifact aggregate inspection
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-finite-budget-qualification.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect fixed existing artifact without executing contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,hashlib,zipfile,io,urllib.request,urllib.parse,re,pathlib,sys,math
          stage="initialize"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          def sha(b): return hashlib.sha256(b).hexdigest()
          def api(path,limit):
           req=urllib.request.Request("https://api.github.com/repos/tokenizartinfo-ops/agent-friendly-web/"+path,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
           try:
            with opener.open(req,timeout=30) as r: return r.read(limit+1)
           except urllib.error.HTTPError as e:
            if path.endswith("/zip") and e.code in (301,302,303,307,308):
             u=e.headers.get("Location","");p=urllib.parse.urlsplit(u)
             assert p.scheme=="https" and p.username is None and p.password is None and p.port in (None,443)
             assert re.fullmatch(r"productionresultssa[a-z0-9]+\.blob\.core\.windows\.net",p.hostname or "") or re.fullmatch(r"[a-z0-9.-]+\.actions\.githubusercontent\.com",p.hostname or "")
             with opener.open(urllib.request.Request(u),timeout=30) as r: return r.read(limit+1)
            raise
          try:
           stage="metadata"
           meta=json.loads(api("actions/artifacts/13593821080",65536))
           assert meta["id"]==13593821080 and meta["size_in_bytes"]==751744 and not meta["expired"]
           assert meta["digest"]=="sha256:8a315c7bf559d621d9df681dcef75377bfd34483f15bc1c709851687a782742b"
           assert meta["workflow_run"]["id"]==42420218406 and meta["workflow_run"]["head_sha"]=="bbe7e518eac6b548e05384806da2f78c66c2e1e7"
           stage="archive"
           raw=api("actions/artifacts/13593821080/zip",1048576)
           assert len(raw)==751744 and sha(raw)=="8a315c7bf559d621d9df681dcef75377bfd34483f15bc1c709851687a782742b"
           z=zipfile.ZipFile(io.BytesIO(raw));infos=z.infolist()
           assert len(infos)==4 and sum(v.file_size for v in infos)<=100*1024*1024
           assert sorted(v.filename for v in infos)==["budget-artifact.json","epochs.json","full-result.json","tests.log"]
           stage="manifest"
           mb=z.read("budget-artifact.json")
           assert len(mb)==717 and sha(mb)=="6a5193d213864ce364c3bca24b0c729f70d6738576515a3ac0adebae9b2d792a"
           m=json.loads(mb)
           assert m["purpose"]=="afw.finite-budget-artifact.syn.v1" and m["kind"]=="positive"
           assert m["source"]=="bbe7e518eac6b548e05384806da2f78c66c2e1e7" and str(m["run"])=="42420218406" and str(m["attempt"])=="1"
           assert all(m[k] is False for k in ("operationalReadiness","completePackage","PCoff"))
           assert sorted(v["path"] for v in m["files"])==["epochs.json","full-result.json","tests.log"]
           for f in m["files"]:
            b=z.read(f["path"]);assert len(b)==f["bytes"] and sha(b)==f["sha256"]
           stage="result"
           b=z.read("full-result.json")
           assert len(b)==40267275 and sha(b)=="9746051b92b7454b4932d2bbf860b9348a0e19c5c91e762a6a4255da39578989"
           data=json.loads(b);del b,raw
           phases=["setup","authorize_get","authorize_post","sdk_lookup","token_exchange","mcp_read","monitoring_get","monitoring_post","cleanup_before_restore","restore","sdk_reduction","final_inventory"]
           resources=["CFcredential","CFdeployment","CFversion","CFworkflow","CFcontainer","CFschedule","CFtail","GHsource","JWKS","DO","SQL","KV","transport","rateLimiter"]
           operations=["get","list","put","delete","first","all","run","sync","transaction","getAlarm","setAlarm","deleteAlarm","fetch","read","cancel","batch","exec","rpc","limit"]
           statuses=["pending","fulfilled","rejected"]
           metrics=["nativeStarted","nativeSettled","nativeRejected","logicalDenied","cancelStarted","cancelSettled","active","peak","nativeBytesRead","chunksRead","nativeDurationSumMs","scopeGuardEvents","deniedScopes","observedWallMs"]
           def numeric(v): return v is None or type(v) in (int,float) and math.isfinite(v)
           def counts(rows,key,allowed): return [{"value":v,"count":sum(r.get(key)==v for r in rows)} for v in allowed if any(r.get(key)==v for r in rows)]
           summary={"purpose":"afw.budget-aggregate-inspection.v1","source":"bbe7e518eac6b548e05384806da2f78c66c2e1e7","run":42420218406,"attempt":1,"artifactId":13593821080,"collectorLimit":16384,"eventCalls":None,"eventCallsReason":"not_exposed","epochs":[],"operationalReadiness":False,"completePackage":False,"PCoff":False}
           stage="projection"
           for e in data["diagnostics"]["epochs"]:
            assert e["segment"] in ("producer","consumer") and e["role"] in ("M","QA") and type(e["epoch"]) is int
            s=e["snapshot"];rows=s["rows"];t=s["totals"];cov=s["coverage"]
            assert s["testRevision"]==summary["source"] and s["workerRole"]==e["role"]
            assert all(numeric(t.get(k)) for k in metrics)
            assert type(cov["overflow"]) is bool and all(type(cov[k]) is int for k in ("invalid","unattributed","nativeBytesUnavailable"))
            groups=[]
            for g in s["byPhaseResource"]:
             assert g["phase"] in phases and g["resourceClass"] in resources and all(numeric(g.get(k)) for k in metrics)
             groups.append({"phase":g["phase"],"resourceClass":g["resourceClass"],**{k:g[k] for k in metrics if k in g}})
            assert all(r["phase"] in phases and r["resourceClass"] in resources and r["operation"] in operations and r["status"] in statuses for r in rows)
            roots=set();children=set()
            for r in rows:
             assert type(r["rootOrdinal"]) is int and (r["childOrdinal"] is None or type(r["childOrdinal"]) is int)
             roots.add(r["rootOrdinal"])
             if r["childOrdinal"] is not None: children.add((r["rootOrdinal"],r["childOrdinal"]))
            summary["epochs"].append({"segment":e["segment"],"epoch":e["epoch"],"role":e["role"],"coverage":{k:cov[k] for k in ("overflow","invalid","unattributed","nativeBytesUnavailable")},"retainedRows":len(rows),"missingRows":t["nativeStarted"]-len(rows),"retainedRootCount":len(roots),"retainedChildCount":len(children),"scopeCount":len(t["scopes"]),"logicalScopeEventCount":len(s["logicalScopeEvents"]),"totals":{k:t[k] for k in metrics if k in t},"byPhaseResource":groups,"retainedByPhase":counts(rows,"phase",phases),"retainedByResource":counts(rows,"resourceClass",resources),"retainedByOperation":counts(rows,"operation",operations),"retainedByStatus":counts(rows,"status",statuses),"eventCalls":None,"eventCallsReason":"not_exposed"})
           stage="output"
           out=json.dumps(summary,separators=(",",":"),allow_nan=False).encode();assert len(out)<=65536
           p=pathlib.Path("aggregate");p.mkdir();(p/"summary.json").write_bytes(out)
           receipt={"source":os.environ["GITHUB_SHA"],"run":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"],"inputArtifactId":13593821080,"files":[{"path":"summary.json","bytes":len(out),"sha256":sha(out)}]}
           (p/"manifest.json").write_text(json.dumps(receipt,separators=(",",":")))
           print("AGGREGATE "+out.decode())
          except Exception:
           print("AGGREGATE_INSPECTION_FAILED "+stage);sys.exit(1)
          
          PY
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: finite-budget-aggregate-${{ github.sha }}
          path: aggregate/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: readback/
          merge-multiple: true
      - name: Same-ID aggregate receipt readback
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,os
          p=pathlib.Path("readback");assert sorted(x.name for x in p.iterdir())==["manifest.json","summary.json"]
          b=(p/"manifest.json").read_bytes();m=json.loads(b)
          assert m["source"]==os.environ["GITHUB_SHA"] and m["run"]==os.environ["GITHUB_RUN_ID"] and m["attempt"]==os.environ["GITHUB_RUN_ATTEMPT"] and m["inputArtifactId"]==13593821080
          assert len(m["files"])==1 and m["files"][0]["path"]=="summary.json"
          f=m["files"][0];s=(p/"summary.json").read_bytes();assert len(s)==f["bytes"] and hashlib.sha256(s).hexdigest()==f["sha256"]
          print("AGGREGATE SAME ID VERIFIED "+json.dumps({"artifactId":os.environ["ARTIFACT_ID"],"files":2,"manifestBytes":len(b),"manifestSha256":hashlib.sha256(b).hexdigest(),"summaryBytes":len(s),"summarySha256":hashlib.sha256(s).hexdigest()}))
          PY
