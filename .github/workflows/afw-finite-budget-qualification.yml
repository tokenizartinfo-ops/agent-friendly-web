      - name: Install only the exact lock without child credentials
        id: install
        if: steps.bootstrap.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" npm ci --ignore-scripts --no-audit --no-fund >"$RUNNER_TEMP/afw-native-private/logs/install.log" 2>&1
      - name: Run controls then current pure profile and one bounded diagnostic
        id: diagnostic
        if: always() && !cancelled() && steps.bootstrap.outcome == 'success'
        continue-on-error: true
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node "$RUNNER_TEMP/afw-frontier/main.mjs" >"$RUNNER_TEMP/afw-frontier/main.log" 2>&1
