name: AFW finite budget qualification
run-name: AFW final nine budget checks source ${{ github.sha }}
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-finite-budget-qualification.yml]
permissions:
  contents: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
env:
  AFW_BUDGET_GROUP: positive
jobs:
  pure:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Static checks and eight pure contract groups before I0
        shell: bash
        run: |
          mkdir -p output/finite-budget/pure
          set -o pipefail
          files=(test/fixtures/finite-budget-diagnostics.mjs test/fixtures/finite-budget-evidence.mjs test/fixtures/finite-budget-world.mjs test/fixtures/finite-owner-cleanup.mjs test/fixtures/finite-owner-cleanup-persistence.mjs test/fixtures/finite-initial-entry-world.mjs test/fixtures/finite-first-connection-publication.mjs test/finite-budget-diagnostics.test.mjs test/mcp-qa-finite-budget-native.test.mjs test/mcp-qa-finite-owner-cleanup-native.test.mjs)
          for file in "${files[@]}"; do node --check "$file"; done
          npx eslint "${files[@]}" 2>&1 | tee output/finite-budget/pure/lint.log
          node --test test/finite-budget-diagnostics.test.mjs 2>&1 | tee output/finite-budget/pure/tests.log
          node --input-type=module -e "import assert from 'node:assert/strict';import {readFile} from 'node:fs/promises';const log=await readFile('output/finite-budget/pure/tests.log','utf8');assert.match(log,/# tests 8\\b/);assert.match(log,/# pass 8\\b/);assert.match(log,/# fail 0\\b/);"
      - name: Exact prepared AST closure before I0
        shell: bash
        run: |
          set -o pipefail
          node test/fixtures/finite-budget-world.mjs preflight-budget 2>&1 | tee output/finite-budget/pure/preflight.log
      - name: Seal pure evidence
        if: always()
        run: node --input-type=module -e "import {sealBudgetArtifact} from './test/fixtures/finite-budget-world.mjs'; await sealBudgetArtifact('output/finite-budget/pure','pure');"
      - uses: actions/upload-artifact@v4
        id: upload
        if: always()
        with:
          name: finite-budget-pure-${{ github.sha }}
          path: output/finite-budget/pure/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/download-artifact@v4
        if: always() && steps.upload.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/budget-pure-readback
          merge-multiple: true
      - name: Same-ID pure readback
        if: always() && steps.upload.outputs.artifact-id != ''
        env:
          READBACK: ${{ runner.temp }}/budget-pure-readback
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: node --input-type=module -e "import {verifyBudgetArtifact} from './test/fixtures/finite-budget-world.mjs'; await verifyBudgetArtifact(process.env.READBACK,'pure',process.env.ARTIFACT_ID);"
  positive_prepare:
    needs: pure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Original producer job budget
        run: echo "AFW_JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.pure.outputs.artifact-id }}
          path: output/finite-budget/prior-pure
          merge-multiple: true
      - name: Verify pure artifact and exact prior preflight
        env:
          ARTIFACT_ID: ${{ needs.pure.outputs.artifact-id }}
        run: node --input-type=module -e "import {verifyBudgetArtifact} from './test/fixtures/finite-budget-world.mjs'; await verifyBudgetArtifact('output/finite-budget/prior-pure','pure',process.env.ARTIFACT_ID);"
      - name: Actual SDK Notice and original native 900s checkpoint
        env:
          AFW_BUDGET_PREFLIGHT: output/finite-budget/prior-pure/preflight.json
        shell: bash
        run: |
          mkdir -p output/finite-budget/producer
          set -o pipefail
          node test/fixtures/finite-budget-world.mjs prepare-positive output/finite-budget/producer/checkpoint 2>&1 | tee output/finite-budget/producer/console.log
      - name: Seal producer evidence
        if: always()
        run: node --input-type=module -e "import {sealBudgetArtifact} from './test/fixtures/finite-budget-world.mjs'; await sealBudgetArtifact('output/finite-budget/producer','checkpoint');"
      - uses: actions/upload-artifact@v4
        id: upload
        if: always()
        with:
          name: finite-budget-checkpoint-${{ github.sha }}
          path: output/finite-budget/producer/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/download-artifact@v4
        if: always() && steps.upload.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/budget-producer-readback
          merge-multiple: true
      - name: Same-ID producer readback
        if: always() && steps.upload.outputs.artifact-id != ''
        env:
          READBACK: ${{ runner.temp }}/budget-producer-readback
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: node --input-type=module -e "import {verifyBudgetArtifact} from './test/fixtures/finite-budget-world.mjs'; await verifyBudgetArtifact(process.env.READBACK,'checkpoint',process.env.ARTIFACT_ID);"
  positive_consume:
    needs: positive_prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.positive_prepare.outputs.artifact-id }}
          path: output/finite-budget/prior-producer
          merge-multiple: true
      - name: Verify exact checkpoint before native cold load
        env:
          ARTIFACT_ID: ${{ needs.positive_prepare.outputs.artifact-id }}
        run: |
          node --input-type=module -e "import {verifyBudgetArtifact} from './test/fixtures/finite-budget-world.mjs'; await verifyBudgetArtifact('output/finite-budget/prior-producer','checkpoint',process.env.ARTIFACT_ID);"
          node test/fixtures/finite-budget-world.mjs verify-positive output/finite-budget/prior-producer/checkpoint
      - name: P1 original alarm restore reduction and final inventory
        env:
          AFW_BUDGET_CHECKPOINT: output/finite-budget/prior-producer/checkpoint
        shell: bash
        run: |
          mkdir -p output/finite-budget/positive
          set -o pipefail
          node --test test/mcp-qa-finite-budget-native.test.mjs 2>&1 | tee output/finite-budget/positive/tests.log
          node --input-type=module -e "import assert from 'node:assert/strict';import {readFile} from 'node:fs/promises';const log=await readFile('output/finite-budget/positive/tests.log','utf8');assert.match(log,/# tests 1\\b/);assert.match(log,/# pass 1\\b/);assert.match(log,/# fail 0\\b/);"
      - name: Seal consumer evidence
        if: always()
        run: node --input-type=module -e "import {sealBudgetArtifact} from './test/fixtures/finite-budget-world.mjs'; await sealBudgetArtifact('output/finite-budget/positive','positive');"
      - uses: actions/upload-artifact@v4
        id: upload
        if: always()
        with:
          name: finite-budget-positive-${{ github.sha }}
          path: output/finite-budget/positive/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/download-artifact@v4
        if: always() && steps.upload.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/budget-positive-readback
          merge-multiple: true
      - name: Same-ID final evidence readback
        if: always() && steps.upload.outputs.artifact-id != ''
        env:
          READBACK: ${{ runner.temp }}/budget-positive-readback
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: node --input-type=module -e "import {verifyBudgetArtifact} from './test/fixtures/finite-budget-world.mjs'; await verifyBudgetArtifact(process.env.READBACK,'positive',process.env.ARTIFACT_ID);"
