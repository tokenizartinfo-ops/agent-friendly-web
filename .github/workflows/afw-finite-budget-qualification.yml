name: AFW native preparation round1 focused RED
run-name: AFW actual wrapper causal RED ${{ github.sha }}
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-finite-budget-qualification.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
jobs:
  focused:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/feat/finite-native-cleanup-20261101' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tokenizartinfo-ops/agent-friendly-web
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Require fixed keyless source and current lock
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = tokenizartinfo-ops/agent-friendly-web
          test "$GITHUB_REF" = refs/heads/feat/finite-native-cleanup-20261101
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -z "${AFW_SYN_CHECKPOINT_KEY+x}"
          test "$(node -v)" = v22.23.4
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -m 700 "$RUNNER_TEMP/afw-round1-public"
          npm ci --ignore-scripts --no-audit --no-fund >"$RUNNER_TEMP/afw-round1-install.log" 2>&1 || { echo locked_install_failed; exit 1; }
      - name: Execute actual F1 wrapper order once without native execution
        id: control
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          result=0
          AFW_BUDGET_CONTROL_PHASE=red env -u AFW_BUDGET_GROUP node test/fixtures/finite-budget-world.mjs verify-native-preparation-round1 >"$RUNNER_TEMP/afw-round1-private.log" 2>&1 || result=$?
          export AFW_ROUND1_EXIT="$result"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFile,writeFile} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const e=process.env,root=e.RUNNER_TEMP+'/afw-round1-public',hash=bytes=>createHash('sha256').update(bytes).digest('hex');let proof=null;
          try{proof=JSON.parse(await readFile('output/finite-budget/round1-controls/result.json','utf8'));}catch{}
          const expectedCausalRed=e.AFW_ROUND1_EXIT!=='0'&&proof?.causalF1Deficit===true&&proof?.groups?.[0]?.stage==='complete';
          const utility=[];for(const family of ['readonly','reduction']){try{utility.push({family,...JSON.parse(await readFile('output/finite-budget/round1-controls/utility-'+family+'.json','utf8'))});}catch{}}
          const result={utility,purpose:'afw.round1-focused-red.safe.v1',source:e.GITHUB_SHA,run:e.GITHUB_RUN_ID,attempt:1,actualExit:Number(e.AFW_ROUND1_EXIT),expectedCausalRed,proof,privateLogSha256:hash(await readFile(e.RUNNER_TEMP+'/afw-round1-private.log')),I0Opened:false,nativeExecutionProduced:false,businessCases:0,operationalReadiness:false,completePackage:false,PCoff:false};
          const bytes=Buffer.from(JSON.stringify(result,null,2));assert(bytes.length<=65536);await writeFile(root+'/result.json',bytes);await writeFile(root+'/manifest.json',JSON.stringify({source:e.GITHUB_SHA,run:e.GITHUB_RUN_ID,attempt:1,files:[{path:'result.json',bytes:bytes.length,sha256:hash(bytes)}]}));await writeFile(e.GITHUB_OUTPUT,'exit='+e.AFW_ROUND1_EXIT+'\ncausal-red='+expectedCausalRed+'\n',{flag:'a'});
          NODE
      - name: Upload safe actual causal outcome
        id: upload
        if: always() && !cancelled() && steps.control.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: finite-budget-round1-red-${{ github.sha }}
          path: ${{ runner.temp }}/afw-round1-public/
          retention-days: 7
          if-no-files-found: error
      - name: Download same assigned control artifact ID
        id: download
        if: always() && !cancelled() && steps.upload.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-round1-readback
          merge-multiple: true
      - name: Verify exact safe inventory and print closed outcome
        id: verified
        if: always() && !cancelled() && steps.download.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFile,readdir} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const e=process.env,root=e.RUNNER_TEMP+'/afw-round1-readback';assert.match(e.ARTIFACT_ID,/^[1-9][0-9]*$/);assert.deepEqual((await readdir(root)).sort(),['manifest.json','result.json']);
          const raw=await readFile(root+'/result.json'),m=JSON.parse(await readFile(root+'/manifest.json','utf8'));assert.equal(m.source,e.GITHUB_SHA);assert.equal(m.run,e.GITHUB_RUN_ID);assert.equal(m.attempt,1);assert.deepEqual(m.files,[{path:'result.json',bytes:raw.length,sha256:createHash('sha256').update(raw).digest('hex')}]);
          for(const name of ['manifest.json','result.json'])assert((await readFile(root+'/'+name)).equals(await readFile(e.RUNNER_TEMP+'/afw-round1-public/'+name)));console.log('ROUND1_RED_SAME_ID_VERIFIED '+e.ARTIFACT_ID);console.log(raw.toString('utf8'));
          NODE
      - name: Preserve actual failing control status
        if: always() && !cancelled()
        shell: bash
        run: |
          test '${{ steps.verified.outcome }}' = success
          test '${{ steps.control.outputs.causal-red }}' = true
          test '${{ steps.control.outputs.exit }}' = 0
