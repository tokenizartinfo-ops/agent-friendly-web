          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();assert.equal(git('rev-parse','HEAD'),e.GITHUB_SHA);const sourceTree=git('rev-parse','HEAD^{tree}'),treeRaw=execFileSync('git',['ls-tree','-rz','--full-tree','HEAD']),rows=treeRaw.toString('utf8').split('\0').filter(Boolean).map(s=>{const i=s.indexOf('\t');return{tuple:s.slice(0,i),path:s.slice(i+1)};}).filter(x=>!['.github/workflows/afw-finite-budget-qualification.yml',reportPath].includes(x.path)).sort((a,b)=>Buffer.compare(Buffer.from(a.path),Buffer.from(b.path))),core=Buffer.from(rows.map(x=>x.tuple+'\t'+x.path+'\0').join(''));assert.equal(rows.length,p.core.count);assert.equal(core.length,p.core.bytes);assert.equal(hash(core),p.core.sha256);
          for(const[path,pin]of Object.entries(p.sourcePins)){const b=readFileSync(path);assert.equal(b.length,pin.bytes);assert.equal(hash(b),pin.sha256);assert.equal(blob(b),pin.blob);assert.equal(git('rev-parse','HEAD:'+path),pin.blob);}
          const proof=JSON.parse(p.programs['source-proof.json'].content),world=readFileSync('test/fixtures/finite-budget-world.mjs','utf8'),fixture=readFileSync('test/fixtures/finite-owner-cleanup.mjs','utf8');
          assert(world.endsWith(proof.worldAppend));let inverse=world.slice(0,-proof.worldAppend.length),lines=inverse.split('\n');for(const edit of proof.worldEdits){assert.equal(lines[edit.line-1],edit.after);lines[edit.line-1]=edit.before;}inverse=lines.join('\n');assert.equal(blob(Buffer.from(inverse)),proof.worldBefore.blob);assert.equal(hash(inverse),proof.worldBefore.sha256);
          const index=fixture.indexOf('export const finiteBudgetSynAdapterSource=');assert(index>0);assert.equal(Buffer.byteLength(fixture.slice(0,index)),proof.fixturePrefixBytes);assert.equal(hash(fixture.slice(0,index)),proof.fixturePrefixSha256);const literal=fixture.split('\n')[301],syn=JSON.parse(literal.slice(literal.indexOf('=')+1,-1));assert.equal(hash(syn),proof.synAfterSha256);for(const[key,count]of Object.entries(proof.inventory))assert.equal(syn.split(key).length-1,count);
          const originalSyn=syn.replace(proof.phaseAppend+'\n','').replace('foreignUnchanged:foreign===state.sentinelRaw,phase:__afwR3Phase(this),grantRemaining:','foreignUnchanged:foreign===state.sentinelRaw,grantRemaining:');assert.equal(originalSyn,proof.synBefore);
          const fixtureInverse=fixture.replace('export const finiteBudgetSynAdapterSource='+JSON.stringify(syn)+';','export const finiteBudgetSynAdapterSource='+JSON.stringify(originalSyn)+';');assert.equal(blob(Buffer.from(fixtureInverse)),proof.fixtureBefore.blob);assert.equal(hash(fixtureInverse),proof.fixtureBefore.sha256);
          assert.equal(git('rev-parse','HEAD:test/fixtures/finite-budget-failure-diagnostic.mjs'),proof.legacyMapBlob);assert.equal(git('rev-parse','HEAD:test/fixtures/finite-budget-descriptors.json'),'be695028e4c12c3cb7d3b7bf2c5f2e7508f3db15');assert.equal(git('rev-parse','HEAD:test/mcp-qa-finite-budget-native.test.mjs'),'533dafb5df5f8e57442c5b9029dc8dec6dded434');assert.equal(git('rev-parse','HEAD:lib/mcp-qa-finite-owner-cleanup.mjs'),'1a5a2583d266179cdd89f799c64199f29044fec5');assert.equal(git('rev-parse','HEAD:lib/mcp-qa-finite-owner-phase-context.mjs'),'7eb8f28760de60f143e487eeb6988705059a0a44');
          const site=JSON.parse(p.programs['fixed/afw-site/site-map.json'].content);assert.equal(site.spans.length,83);assert.deepEqual(site.files.world,p.sourcePins['test/fixtures/finite-budget-world.mjs']?{path:'test/fixtures/finite-budget-world.mjs',...p.sourcePins['test/fixtures/finite-budget-world.mjs']}:null);for(const span of site.spans){const s=readFileSync(site.files[span.file].path,'utf8').split('\n')[span.line-1].slice(span.start-1,span.end);assert(/^assert(?:\.|\()/.test(s));}
          execFileSync('git',['diff','--exit-code','HEAD','--'],{stdio:['ignore','pipe','pipe']});const root=join(e.RUNNER_TEMP,'afw-r3');mkdirSync(root,{mode:0o700});
