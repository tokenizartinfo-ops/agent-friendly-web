name: AFW round3 persisted ownership RED
run-name: AFW round3 fixed custody RED Native16 HELD ${{ github.sha }}
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-finite-budget-qualification.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
jobs:
  focused_red:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/feat/finite-native-cleanup-20261101' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require fixed context
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = tokenizartinfo-ops/agent-friendly-web
          test "$GITHUB_REF" = refs/heads/feat/finite-native-cleanup-20261101
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -z "${AFW_SYN_CHECKPOINT_KEY+x}"
          mkdir -m 700 "$RUNNER_TEMP/afw-round3-private"
      - uses: actions/checkout@v4
        with:
          repository: tokenizartinfo-ops/agent-friendly-web
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install same locked dependencies privately
        id: install
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(node -v)" = v22.23.4
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci --ignore-scripts --no-audit --no-fund >"$RUNNER_TEMP/afw-round3-private/install.log" 2>&1 || { echo locked_install_failed; exit 1; }
      - name: Execute only the current fixed dispose_reject persisted regression
        id: regressions
        if: steps.install.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          actual=0
          env -u AFW_BUDGET_GROUP node --experimental-vm-modules test/fixtures/finite-budget-world.mjs verify-round3-owned-red >"$RUNNER_TEMP/afw-round3-private/command.log" 2>&1 || actual=$?
          printf '%s\n' "$actual" >"$RUNNER_TEMP/afw-round3-private/exit.txt"
          printf 'actual-exit=%s\n' "$actual" >>"$GITHUB_OUTPUT"
      - name: Independently seal strict causal ownership JSON
        id: closed
        if: always() && !cancelled() && steps.scope.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFile,writeFile,mkdir,readdir,lstat} from 'node:fs/promises';import {createHash} from 'node:crypto';import {join} from 'node:path';
          const env=process.env,root=join(env.RUNNER_TEMP,'afw-round3-private'),dest=join(env.RUNNER_TEMP,'afw-round3-public'),sha=bytes=>createHash('sha256').update(bytes).digest('hex'),closed=(v,keys)=>{assert(v&&typeof v==='object'&&!Array.isArray(v));assert.deepEqual(Object.keys(v).sort(),keys.slice().sort());};
          const flags={I0Opened:false,nativeExecutionProduced:false,businessCases:0,operationalReadiness:false,completePackage:false,PCoff:false,globalNativeDrainVerified:false,sdkNamespaceEmptyVerified:false},context={purpose:'afw.round3-owned-closure-red.safe.v1',source:env.GITHUB_SHA,run:env.GITHUB_RUN_ID,attempt:1,case:'dispose_reject'},result={...context,stage:'input_invalid',facts:null,error:null,expectedCausalRed:false,commandExit:null,valid:false,reason:'input_missing',...flags};
          let reason='context';
          try{
           assert(env.GITHUB_REPOSITORY==='tokenizartinfo-ops/agent-friendly-web'&&env.GITHUB_REF==='refs/heads/feat/finite-native-cleanup-20261101'&&env.GITHUB_RUN_ATTEMPT==='1');assert(/^[a-f0-9]{40}$/.test(env.GITHUB_SHA)&&/^[1-9][0-9]*$/.test(env.GITHUB_RUN_ID));
           reason='input_bound';const file=join(root,'result.json'),st=await lstat(file);assert(st.isFile()&&st.nlink===1&&st.size<=65536);const raw=JSON.parse(await readFile(file,'utf8'));
           reason='root_schema';closed(raw,[...Object.keys(context),'stage','facts','error','expectedCausalRed',...Object.keys(flags)]);for(const[key,value]of Object.entries(context))assert.equal(raw[key],value);for(const[key,value]of Object.entries(flags))assert.equal(raw[key],value);assert(['owned_case','ownership_readback','criteria','complete'].includes(raw.stage));assert.equal(typeof raw.expectedCausalRed,'boolean');
           if(raw.facts!==null){
            reason='facts_schema';closed(raw.facts,['actualComplete','expectedComplete','ancillaryFailureCount','disposalUncertain','disposed','archived','originalErrorSame','originalAttempts','checkpointCopies','sourceRetained','poisonPreserved']);for(const[key,value]of Object.entries(raw.facts)){if(['ancillaryFailureCount','originalAttempts','checkpointCopies'].includes(key))assert(Number.isSafeInteger(value)&&value>=0&&value<=16);else assert.equal(typeof value,'boolean');}assert.equal(raw.facts.expectedComplete,false);
           }
           let error=null;if(raw.error!==null){
            reason='error_schema';closed(raw.error,['name','nativeError','code','operator','actual','expected','message']);assert(['Error','AssertionError','TypeError','SyntaxError','RangeError','other'].includes(raw.error.name));assert.equal(typeof raw.error.nativeError,'boolean');assert(['ERR_ASSERTION','ERR_MODULE_NOT_FOUND','ERR_INVALID_ARG_TYPE','ERR_SCRIPT_EXECUTION_TIMEOUT','absent','other'].includes(raw.error.code));assert(['==','===','strictEqual','deepStrictEqual','match','ok','throws','rejects','absent','other'].includes(raw.error.operator));
            const message=raw.error.message;assert(message&&typeof message==='object');if(Object.hasOwn(message,'sha256')){closed(message,['bytes','sha256','publicLabel']);assert(Number.isSafeInteger(message.bytes)&&message.bytes>=0&&message.bytes<=65536);assert(/^[a-f0-9]{64}$/.test(message.sha256));assert(typeof message.publicLabel==='string'&&message.publicLabel.length<256);error={name:raw.error.name,nativeError:raw.error.nativeError,code:raw.error.code,operator:raw.error.operator,message:{bytes:message.bytes,sha256:message.sha256}};}else{closed(message,['type']);assert(['undefined','object','string'].includes(message.type));error={name:raw.error.name,nativeError:raw.error.nativeError,code:raw.error.code,operator:raw.error.operator,message:{type:message.type}};}
           }
           reason='causal_reconciliation';const f=raw.facts,expected=raw.stage==='complete'&&error===null&&f?.actualComplete===true&&f.expectedComplete===false&&f.ancillaryFailureCount===0&&f.disposalUncertain===true&&f.disposed===false&&f.archived===false&&f.originalErrorSame===true&&f.originalAttempts===1&&f.checkpointCopies===0&&f.sourceRetained===true&&f.poisonPreserved===true;assert.equal(raw.expectedCausalRed,expected);
           reason='command_exit';const exit=Number((await readFile(join(root,'exit.txt'),'utf8')).trim());assert(Number.isSafeInteger(exit)&&exit>=0&&exit<=255);Object.assign(result,{stage:raw.stage,facts:raw.facts,error,expectedCausalRed:expected,commandExit:exit,valid:true,reason:'none'});
          }catch{result.reason=reason;}
          await mkdir(dest,{mode:0o700});assert.deepEqual(await readdir(dest),[]);const bytes=Buffer.from(JSON.stringify(result,null,2));assert(bytes.length<=65536);await writeFile(join(dest,'result.json'),bytes);await writeFile(join(dest,'manifest.json'),JSON.stringify({purpose:'afw.round3-owned-closure-manifest.safe.v1',source:result.source,run:result.run,attempt:1,files:[{path:'result.json',bytes:bytes.length,sha256:sha(bytes)}]},null,2));await writeFile(env.GITHUB_OUTPUT,'valid='+result.valid+'\nexpected-red='+result.expectedCausalRed+'\n',{flag:'a'});
          NODE
      - name: Upload only two closed JSON files
        id: upload
        if: always() && !cancelled() && steps.closed.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: finite-budget-round3-owner-red-${{ github.sha }}
          path: ${{ runner.temp }}/afw-round3-public/
          if-no-files-found: error
          retention-days: 7
      - name: Download exact assigned lint artifact ID retrieval 1
        id: receipt1
        if: always() && !cancelled() && steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-round3-receipt
          merge-multiple: true
      - name: Wait 2s for assigned lint artifact retrieval 2
        id: wait2
        if: always() && !cancelled() && steps.receipt1.outcome == 'failure'
        shell: bash
        run: sleep 2
      - name: Download exact assigned lint artifact ID retrieval 2
        id: receipt2
        if: always() && !cancelled() && steps.wait2.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-round3-receipt
          merge-multiple: true
      - name: Wait 5s for assigned lint artifact retrieval 3
        id: wait3
        if: always() && !cancelled() && steps.receipt2.outcome == 'failure'
        shell: bash
        run: sleep 5
      - name: Download exact assigned lint artifact ID retrieval 3
        id: receipt3
        if: always() && !cancelled() && steps.wait3.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-round3-receipt
          merge-multiple: true
      - name: Verify exact full closed inventory and print only DTO
        id: verified
        if: always() && !cancelled() && steps.upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          DOWNLOADED: ${{ steps.receipt1.outcome == 'success' || steps.receipt2.outcome == 'success' || steps.receipt3.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$DOWNLOADED" = true || { echo round3_evidence_not_preserved; exit 1; }
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFile,readdir,lstat} from 'node:fs/promises';import {createHash} from 'node:crypto';import {join} from 'node:path';
          const e=process.env,root=join(e.RUNNER_TEMP,'afw-round3-receipt'),local=join(e.RUNNER_TEMP,'afw-round3-public'),sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          assert(/^[1-9][0-9]*$/.test(e.ARTIFACT_ID));assert.deepEqual((await readdir(root)).sort(),['manifest.json','result.json']);for(const name of ['manifest.json','result.json']){const st=await lstat(join(root,name));assert(st.isFile()&&st.nlink===1&&st.size<=131072);assert((await readFile(join(root,name))).equals(await readFile(join(local,name))));}
          const bytes=await readFile(join(root,'result.json')),m=JSON.parse(await readFile(join(root,'manifest.json'),'utf8')),v=JSON.parse(bytes);assert.equal(m.purpose,'afw.round3-owned-closure-manifest.safe.v1');assert.equal(m.source,e.GITHUB_SHA);assert.equal(m.run,e.GITHUB_RUN_ID);assert.equal(m.attempt,1);assert.deepEqual(m.files,[{path:'result.json',bytes:bytes.length,sha256:sha(bytes)}]);assert.equal(v.purpose,'afw.round3-owned-closure-red.safe.v1');assert.equal(v.source,e.GITHUB_SHA);assert.equal(v.run,e.GITHUB_RUN_ID);assert.equal(v.attempt,1);
          console.log('ROUND3_OWNER_SAME_ID_VERIFIED '+e.ARTIFACT_ID);console.log(bytes.toString('utf8'));
          NODE
      - name: Require exact causal RED and retain actual regression failure
        if: always() && !cancelled()
        shell: bash
        run: |
          test '${{ steps.verified.outcome }}' = success
          test '${{ steps.closed.outputs.valid }}' = true
          test '${{ steps.regressions.outcome }}' = success
          test '${{ steps.closed.outputs.expected-red }}' = true
          test '${{ steps.regressions.outputs.actual-exit }}' = 0
