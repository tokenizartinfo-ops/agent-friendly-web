          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        id: node
        with:
          node-version: '22.23.4'
      - name: Observe the single baseline L05
        if: always()
        shell: bash
        env:
          AFW_CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          AFW_NODE_OUTCOME: ${{ steps.node.outcome }}
        run: |
          set +e
          umask 077
          if test "${AFW_CHECKOUT_OUTCOME-}" != success || test "${AFW_NODE_OUTCOME-}" != success || test -n "${NODE_OPTIONS+x}" || test -n "${NODE_PATH+x}" || test -n "${AFW_SYN_CHECKPOINT_KEY+x}" || test -n "${AFW_BUDGET_DIAGNOSTIC_CANDIDATE+x}"; then
            printf '%s\n' 'AFW_L05_OBSERVATION/1 {"purpose":"afw.l05.observation.v1","source":"unknown","sourceTree":"unknown","run":"unknown","attempt":"unknown","job":"unknown","node":"unknown","originalResult":"unknown","probeCleanup":"unknown","caseCleanup":"unknown","firstSite":"unknown","checkAtSite":"unknown","eventAtCheck":"unknown","stopClass":"unknown","creatorSeen":"unknown","shimSeen":"unknown","wakeSeen":"unknown","deadSeen":"unknown","shimTerminalBeforeCleanup":"unknown","kernelSite":"unknown","kernelClass":"unknown","markerAtOracle":"unknown","markerAtCleanup":"unknown","streams":"unknown","nonclaims":{"historicalCauseProven":false,"receiptAuthenticated":false,"operationalReadiness":false,"completePackage":false,"PCoff":false,"globalNativeDrainVerified":false,"sdkNamespaceEmptyVerified":false}}' 2>/dev/null; exit 1
          fi
          if ! { test -d "${PWD-}" && pwd -P >/dev/null; } 2>/dev/null; then
            printf '%s\n' 'AFW_L05_OBSERVATION/1 {"purpose":"afw.l05.observation.v1","source":"unknown","sourceTree":"unknown","run":"unknown","attempt":"unknown","job":"unknown","node":"unknown","originalResult":"unknown","probeCleanup":"unknown","caseCleanup":"unknown","firstSite":"unknown","checkAtSite":"unknown","eventAtCheck":"unknown","stopClass":"unknown","creatorSeen":"unknown","shimSeen":"unknown","wakeSeen":"unknown","deadSeen":"unknown","shimTerminalBeforeCleanup":"unknown","kernelSite":"unknown","kernelClass":"unknown","markerAtOracle":"unknown","markerAtCleanup":"unknown","streams":"unknown","nonclaims":{"historicalCauseProven":false,"receiptAuthenticated":false,"operationalReadiness":false,"completePackage":false,"PCoff":false,"globalNativeDrainVerified":false,"sdkNamespaceEmptyVerified":false}}' 2>/dev/null; exit 1
          fi
          if ! exec 2>/dev/null; then
            printf '%s\n' 'AFW_L05_OBSERVATION/1 {"purpose":"afw.l05.observation.v1","source":"unknown","sourceTree":"unknown","run":"unknown","attempt":"unknown","job":"unknown","node":"unknown","originalResult":"unknown","probeCleanup":"unknown","caseCleanup":"unknown","firstSite":"unknown","checkAtSite":"unknown","eventAtCheck":"unknown","stopClass":"unknown","creatorSeen":"unknown","shimSeen":"unknown","wakeSeen":"unknown","deadSeen":"unknown","shimTerminalBeforeCleanup":"unknown","kernelSite":"unknown","kernelClass":"unknown","markerAtOracle":"unknown","markerAtCleanup":"unknown","streams":"unknown","nonclaims":{"historicalCauseProven":false,"receiptAuthenticated":false,"operationalReadiness":false,"completePackage":false,"PCoff":false,"globalNativeDrainVerified":false,"sdkNamespaceEmptyVerified":false}}' 2>/dev/null; exit 1
          fi
          r3_image_ready=0
          r3_image_root=
          if test -n "${RUNNER_TEMP-}" && test -d "${RUNNER_TEMP-}"; then
            r3_image_root=$(/usr/bin/mktemp -d -- "${RUNNER_TEMP%/}/afw-r3-node.XXXXXXXX")
            case "$r3_image_root" in
              "${RUNNER_TEMP%/}"/afw-r3-node.????????)
                if exec 9<"$r3_image_root"; then r3_image_ready=1; fi
                ;;
            esac
          fi
          unset r3_image_root
          if test "$r3_image_ready" != 1; then
            printf '%s\n' 'AFW_L05_OBSERVATION/1 {"purpose":"afw.l05.observation.v1","source":"unknown","sourceTree":"unknown","run":"unknown","attempt":"unknown","job":"unknown","node":"unknown","originalResult":"unknown","probeCleanup":"unknown","caseCleanup":"unknown","firstSite":"unknown","checkAtSite":"unknown","eventAtCheck":"unknown","stopClass":"unknown","creatorSeen":"unknown","shimSeen":"unknown","wakeSeen":"unknown","deadSeen":"unknown","shimTerminalBeforeCleanup":"unknown","kernelSite":"unknown","kernelClass":"unknown","markerAtOracle":"unknown","markerAtCleanup":"unknown","streams":"unknown","nonclaims":{"historicalCauseProven":false,"receiptAuthenticated":false,"operationalReadiness":false,"completePackage":false,"PCoff":false,"globalNativeDrainVerified":false,"sdkNamespaceEmptyVerified":false}}' 2>/dev/null; exit 1
          fi
          exec 4</proc/thread-self
          /usr/bin/python3 -I -S /proc/self/fd/5 bootstrap-initial 5<<'AFW_R3_CONTROLS_ENTRY'
          # Fixed Source literal: verified module/kernel snapshots only, no caller code/path selection.
          import os,sys,stat,fcntl,base64,zlib,hashlib
          def need(v):
           if not v:raise ValueError()
          def sealed_source(data,label,maximum):
           need(type(data) is bytes and 0<len(data)<=maximum and maximum in [32768,65536] and label in ['afw-r3-lifetime','afw-r3-module','afw-r3-parent','afw-r3-helper'])
           f=os.memfd_create(label,os.MFD_CLOEXEC|os.MFD_ALLOW_SEALING)
           try:
            at=0
            while at<len(data):
             n=os.write(f,memoryview(data)[at:]);need(n>0);at+=n
            os.fchmod(f,0o400);os.lseek(f,0,os.SEEK_SET)
            seals=fcntl.F_SEAL_WRITE|fcntl.F_SEAL_GROW|fcntl.F_SEAL_SHRINK|fcntl.F_SEAL_SEAL
            fcntl.fcntl(f,fcntl.F_ADD_SEALS,seals);need(fcntl.fcntl(f,fcntl.F_GET_SEALS)&seals==seals)
            return f
           except BaseException:os.close(f);raise
          def unpack(pin):
           need(type(pin) is dict and list(pin)==['bytes','sha256','zipBytes','zipSha256','data','cap'] and pin['cap'] in [32768,65536] and 0<pin['bytes']<=pin['cap'] and len(pin['data'])<=131072)
           compressed=base64.b64decode(pin['data'],validate=True);need(base64.b64encode(compressed).decode()==pin['data'] and len(compressed)==pin['zipBytes']<=98304 and hashlib.sha256(compressed).hexdigest()==pin['zipSha256'])
           dec=zlib.decompressobj(31);data=dec.decompress(compressed,pin['cap']+1)
           need(len(data)==pin['bytes'] and dec.eof and dec.unused_data==b'' and dec.unconsumed_tail==b'' and hashlib.sha256(data).hexdigest()==pin['sha256']);return data
          _r3_kernel={"bytes":16025,"sha256":"ae23b6e242cb41d3978b391c3bde1095ee7e0c0c717db98a598fe8fd9dcb2a27","zipBytes":5068,"zipSha256":"04c09340f1905de5de82701608244fef61275f1bc1b15d151d02b0ceaf0c10ec","data":"","cap":32768}
          _r3_module={"bytes":46272,"sha256":"5b3c089772d7cb8eade3f849ad177b5ff01146a5d8d4c15298542b3d90b761f1","zipBytes":15886,"zipSha256":"55935a0089f901b94981c8e66debce01effba6aec2258a3c61b85ba03340c8ef","data":"","cap":65536}
          _l05_wire="AFW_L05_OBSERVATION/1 {\"purpose\":\"afw.l05.observation.v1\",\"source\":\"unknown\",\"sourceTree\":\"unknown\",\"run\":\"unknown\",\"attempt\":\"unknown\",\"job\":\"unknown\",\"node\":\"unknown\",\"originalResult\":\"unknown\",\"probeCleanup\":\"unknown\",\"caseCleanup\":\"unknown\",\"firstSite\":\"unknown\",\"checkAtSite\":\"unknown\",\"eventAtCheck\":\"unknown\",\"stopClass\":\"unknown\",\"creatorSeen\":\"unknown\",\"shimSeen\":\"unknown\",\"wakeSeen\":\"unknown\",\"deadSeen\":\"unknown\",\"shimTerminalBeforeCleanup\":\"unknown\",\"kernelSite\":\"unknown\",\"kernelClass\":\"unknown\",\"markerAtOracle\":\"unknown\",\"markerAtCleanup\":\"unknown\",\"streams\":\"unknown\",\"nonclaims\":{\"historicalCauseProven\":false,\"receiptAuthenticated\":false,\"operationalReadiness\":false,\"completePackage\":false,\"PCoff\":false,\"globalNativeDrainVerified\":false,\"sdkNamespaceEmptyVerified\":false}}\n"
          try:
           kernel=unpack(_r3_kernel);f=sealed_source(kernel,'afw-r3-lifetime',32768);os.dup2(f,5,inheritable=True)
           os.set_inheritable(5,True)
           need(os.get_inheritable(5) is True)
           if f!=5:os.close(f)
           if _r3_module is not None:
            module=unpack(_r3_module);f=sealed_source(module,'afw-r3-module',_r3_module['cap'])
            if sys.argv[1]!='node-race-creator':os.dup2(f,0,inheritable=True)
            if f!=0:os.close(f)
           need(len(sys.argv)==2 and sys.argv[1] in ['bootstrap-initial','bootstrap-delivery','bootstrap-controls','parent-delivery','parent-controls','case-delivery','case-controls','case-missing-cwd','node-witness','remove-empty-cwd','make-fifo','node-race-creator','life-timeout','life-python','life-outer','life-bash','life-race'])
           # Fixed single-use private sink. Never map either endpoint over a normal role FD.
           for n in (10,11):
            try:os.fstat(n)
            except OSError as e:need(e.errno==9)
            else:raise ValueError()
           r,w=os.pipe2(os.O_NONBLOCK|os.O_CLOEXEC)
           os.dup2(w,11,inheritable=True);os.dup2(r,10,inheritable=True)
           for n in (r,w):
            if n not in (10,11):os.close(n)
           for n,access in ((10,os.O_RDONLY),(11,os.O_WRONLY)):
            os.set_inheritable(n,True);flags=fcntl.fcntl(n,fcntl.F_GETFL)
            need(stat.S_ISFIFO(os.fstat(n).st_mode) and flags&os.O_ACCMODE==access and flags&os.O_NONBLOCK and fcntl.fcntl(n,fcntl.F_GETPIPE_SZ)>=4096)
           os.execve('/usr/bin/python3',['python3','-I','-S','/proc/self/fd/5',sys.argv[1]],dict(os.environ))
          except BaseException:
           role=sys.argv[1] if len(sys.argv)==2 else ''
           if role in ['bootstrap-initial','bootstrap-delivery','bootstrap-controls']:
            kind='delivery' if role=='bootstrap-delivery' else 'controls'
            try:os.write(1,_l05_wire.encode('ascii'))
            except BaseException:pass
           raise SystemExit(1)
          AFW_R3_CONTROLS_ENTRY
          r3_controls_status=$?
          if test "$r3_controls_status" = 0; then
            /usr/bin/python3 -I -S - >/dev/null <<'AFW_R3_IMAGE_CLEANUP'
          import os,stat,fcntl,re
          def need(v):
           if not v:raise ValueError()
          def private_root():
           r=os.fstat(9);path=os.readlink('/proc/self/fd/9');parent=os.environ.get('RUNNER_TEMP','').rstrip('/')
           need(os.path.isabs(parent) and os.path.realpath(parent)==parent and re.fullmatch(re.escape(parent)+r'/afw-r3-node\.[A-Za-z0-9]{8}',path) is not None)
           need(stat.S_ISDIR(r.st_mode) and r.st_uid==os.getuid() and r.st_mode&0o7777==0o700 and r.st_nlink==2 and fcntl.fcntl(9,fcntl.F_GETFL)&os.O_ACCMODE==os.O_RDONLY)
           p=os.open('..',os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW,dir_fd=9)
           try:
            s=os.fstat(p);need(stat.S_ISDIR(s.st_mode) and s.st_uid in [0,os.getuid()] and not s.st_mode&0o022 and os.readlink('/proc/self/fd/'+str(p))==parent)
            name=os.path.basename(path);n=os.stat(name,dir_fd=p,follow_symlinks=False)
            need((n.st_dev,n.st_ino)==(r.st_dev,r.st_ino) and stat.S_ISDIR(n.st_mode));return p,name,r
           except BaseException:os.close(p);raise
          def cleanup_image():
           p=f=None
           try:
            p,name,r=private_root();entries=os.listdir(9);need(entries in [[],['node']])
            if entries:
             f=os.open('node',os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK,dir_fd=9);s=os.fstat(f);n=os.stat('node',dir_fd=9,follow_symlinks=False)
             need(stat.S_ISREG(s.st_mode) and s.st_uid==os.getuid() and s.st_nlink==1 and s.st_mode&0o7777 in [0o600,0o500] and (s.st_dev,s.st_ino)==(n.st_dev,n.st_ino))
             os.unlink('node',dir_fd=9);need(os.fstat(f).st_nlink==0);os.close(f);f=None
            need(not os.listdir(9));n=os.stat(name,dir_fd=p,follow_symlinks=False);need((n.st_dev,n.st_ino)==(r.st_dev,r.st_ino))
            os.rmdir(name,dir_fd=p);need(os.fstat(9).st_nlink==0);os.close(p);p=None;return True
           except BaseException:return False
           finally:
            for fd in [f,p]:
             if fd is not None:
              try:os.close(fd)
              except BaseException:pass
          raise SystemExit(0 if cleanup_image() else 1)
          AFW_R3_IMAGE_CLEANUP
            r3_cleanup_status=$?
            if test "$r3_cleanup_status" = 0; then exit 0; fi
          fi
          # No fallback after Node may have published. Failed/uncertain teardown retains image until VM ends.
          exit 1
