          import assert from 'node:assert/strict';import {readFile} from 'node:fs/promises';import {createHash} from 'node:crypto';
          try{assert.equal(process.versions.node,'22.23.4');const b=await readFile(process.env.RUNNER_TEMP+'/afw-readonly-b09-diagnostic.mjs');assert.equal(b.length,14680);assert.equal(createHash('sha256').update(b).digest('hex'),'1d802f5dab20db5d6aa4affa288c11ff4040a7ee2172c23ee71359c984796b85');}catch{process.exitCode=1;}
