name: AFW fixed SYN pure diagnostic
run-name: AFW three-profile pure diagnostic ${{ github.sha }}
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-finite-budget-qualification.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
jobs:
  diagnostic:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/feat/finite-native-cleanup-20261101' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tokenizartinfo-ops/agent-friendly-web
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Require exact keyless source and install current lock
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = tokenizartinfo-ops/agent-friendly-web
          test "$GITHUB_REF" = refs/heads/feat/finite-native-cleanup-20261101
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -z "${AFW_SYN_CHECKPOINT_KEY+x}"
          test "$(node -v)" = v22.23.4
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -m 700 "$RUNNER_TEMP/afw-diagnostic-public"
          npm ci --ignore-scripts --no-audit --no-fund >"$RUNNER_TEMP/afw-diagnostic-install.log" 2>&1 || { echo locked_install_failed; exit 1; }
      - name: Catch all three fixed preflight profiles without native execution
        id: diagnostic
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE' >"$RUNNER_TEMP/afw-diagnostic-private.log" 2>&1
          import {createHash} from 'node:crypto';import {writeFile} from 'node:fs/promises';import {execFileSync} from 'node:child_process';
          const hash=value=>createHash('sha256').update(value).digest('hex'),root=process.env.RUNNER_TEMP+'/afw-diagnostic-public';
          const labels=['same existing named DO class','no SYN method collision','closed fixed adapter operation inventory','exact original emitted prefix','exact two original enqueue notifications after pinned baseline transform','single passive actual SDK settlement site','original SDK call and retain unchanged','composed QA entry bytes','composed QA entry pin','exact composed entry native member selectors','exact composed entry SQL/body selectors','complete role reader catalog before I0','closed prepared role input map','scope input raw pin','raw SHA256 pin','raw byte pin','exact prepared AST count','exact installed package selector','installed package byte pin','installed package hash pin','native prepared role hooks match exact prior pure preflight before I0','exact fixed SYN additional-emission provenance before I0'];
          function data(value,key){try{for(let n=0;value&&n<4;n++,value=Object.getPrototypeOf(value)){const descriptor=Object.getOwnPropertyDescriptor(value,key);if(descriptor)return Object.hasOwn(descriptor,'value')?descriptor.value:undefined;}}catch{}return undefined;}
          function safe(value){if(typeof value==='number'&&Number.isFinite(value)||typeof value==='boolean'||value===null)return value;if(typeof value==='string')return {type:'string',bytes:Buffer.byteLength(value),sha256:hash(value)};return {type:typeof value};}
          const profiles=[];
          for(const profile of ['positive','readonly','reduction_a']){
            process.env.AFW_BUDGET_GROUP=profile;let stage='import';
            try{const mod=await import('./test/fixtures/finite-budget-world.mjs');stage='preflight';const result=await mod.preflightBudgetCompilation();profiles.push({profile,stage:'complete',passed:true,I0Opened:result.I0Opened,nativeExecutionProduced:result.nativeExecutionProduced,additionalSYNCount:result.additionalSYN.length,additionalSYN:result.additionalSYN.map(x=>({path:x.path,family:x.family??null,sites:x.sites??null,sdkSettlementSites:x.sdkSettlementSites??null,baselineBytes:x.baselineBytes,baselineSha256:x.baselineSha256,literalBytes:x.literalBytes??null,literalSha256:x.literalSha256??null,emittedBytes:x.emittedBytes,emittedSha256:x.emittedSha256}))});}
            catch(error){const message=data(error,'message'),name=data(error,'name'),code=data(error,'code'),operator=data(error,'operator');profiles.push({profile,stage,passed:false,error:{name:['Error','AssertionError','TypeError','SyntaxError','RangeError'].includes(name)?name:'other',code:['ERR_ASSERTION','ERR_MODULE_NOT_FOUND','ERR_INVALID_ARG_TYPE','ERR_UNKNOWN_FILE_EXTENSION','ERR_REQUIRE_ESM'].includes(code)?code:code===undefined?'absent':'other',operator:['strictEqual','deepStrictEqual','==','===','match','ok'].includes(operator)?operator:operator===undefined?'absent':'other',actual:safe(data(error,'actual')),expected:safe(data(error,'expected')),message:typeof message==='string'?{bytes:Buffer.byteLength(message),sha256:hash(message),publicLabel:labels.find(label=>message.includes(label))??'unmatched'}:{type:typeof message}}});}
          }
          const result={purpose:'afw.fixed-budget-pure-diagnostic.syn.v1',source:process.env.GITHUB_SHA,tree:execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),run:process.env.GITHUB_RUN_ID,attempt:1,profiles,allPassed:profiles.every(x=>x.passed),I0Opened:false,nativeExecutionProduced:false,operationalReadiness:false,completePackage:false,PCoff:false};
          const bytes=Buffer.from(JSON.stringify(result,null,2));if(bytes.length>65536)throw Error('safe_diagnostic_limit');
          await writeFile(root+'/diagnostics.json',bytes);
          await writeFile(root+'/manifest.json',JSON.stringify({purpose:'afw.fixed-budget-pure-diagnostic-manifest.syn.v1',source:result.source,run:result.run,attempt:1,files:[{path:'diagnostics.json',bytes:bytes.length,sha256:hash(bytes)}]}));
          await writeFile(process.env.GITHUB_OUTPUT,'all-passed='+result.allPassed+'\n',{flag:'a'});
          NODE
      - name: Upload safe diagnostic on success and failure
        id: upload
        if: always() && !cancelled() && steps.diagnostic.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: finite-budget-fixed-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/afw-diagnostic-public/
          retention-days: 7
          if-no-files-found: error
      - name: Download same assigned diagnostic artifact ID
        id: download
        if: always() && !cancelled() && steps.upload.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-diagnostic-readback
          merge-multiple: true
      - name: Verify exact safe inventory and print bounded diagnostic
        id: verified
        if: always() && !cancelled() && steps.download.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFile,readdir} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const e=process.env,root=e.RUNNER_TEMP+'/afw-diagnostic-readback';assert.match(e.ARTIFACT_ID,/^[1-9][0-9]*$/);
          assert.deepEqual((await readdir(root)).sort(),['diagnostics.json','manifest.json']);
          const raw=await readFile(root+'/diagnostics.json'),manifestRaw=await readFile(root+'/manifest.json'),manifest=JSON.parse(manifestRaw);
          assert.equal(manifest.source,e.GITHUB_SHA);assert.equal(manifest.run,e.GITHUB_RUN_ID);assert.equal(manifest.attempt,1);
          assert.deepEqual(manifest.files,[{path:'diagnostics.json',bytes:raw.length,sha256:createHash('sha256').update(raw).digest('hex')}]);
          for(const file of ['diagnostics.json','manifest.json'])assert((await readFile(e.RUNNER_TEMP+'/afw-diagnostic-public/'+file)).equals(await readFile(root+'/'+file)));
          console.log('DIAGNOSTIC_SAME_ID_VERIFIED '+e.ARTIFACT_ID);console.log(raw.toString('utf8'));
          NODE
      - name: Preserve actual profile outcome
        if: always() && !cancelled()
        shell: bash
        run: |
          test '${{ steps.diagnostic.outputs.all-passed }}' = true
          test '${{ steps.verified.outcome }}' = success
