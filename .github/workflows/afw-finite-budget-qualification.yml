           for(const name of names){const st=await lstat(join(dir,name));if(!st.isFile()||st.nlink!==1||st.size>(name==='envelope.bin'?5395225:131072))throw Error();}
           const envelope=await readFile(join(dir,'envelope.bin')),body=await readFile(join(dir,'receipt.json')),manifest=JSON.parse(await readFile(join(dir,'manifest.json'),'utf8'));
           const digest=hash(envelope);if(envelope.length!==5395225||digest!=='d7e78f8b52037d14c48a274be9843d331c249f74d98f11d0f04a61f77f9a4b66')throw Error();
           const expected={purpose:'afw.finite-checkpoint-custody-receipt.syn.v1',context,envelopeBytes:5395225,envelopeSha256:digest,fileCount:4,totalBytes:198334868,authenticated:true,innerInventoryVerified:true,operationalReadiness:false,completePackage:false,PCoff:false};
           if(!isDeepStrictEqual(JSON.parse(body),expected)||!isDeepStrictEqual(manifest,{purpose:'afw.finite-checkpoint-custody-manifest.syn.v1',context,files:[{path:'envelope.bin',bytes:envelope.length,sha256:digest},{path:'receipt.json',bytes:body.length,sha256:hash(body)}]}))throw Error();
           console.log('closed_original_envelope_verified');
          }catch{console.log('outer_validation_failed');process.exitCode=1;}
          NODE
      - name: Authenticate the one historical failure into a private directory
        id: open
        env:
          AFW_SYN_CHECKPOINT_KEY: ${{ secrets.AFW_SYN_CHECKPOINT_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
