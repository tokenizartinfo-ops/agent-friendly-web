          const EXPECTED_EXPANSION_IDS=Object.freeze(['two_valid','identities_flags','required_bounds','optional_types','array_bounds','private_canary','file_missing_bad','file_bound_links','gate_no_read','timeout_cleanup','uncertain_no_cleanup','strict_envelope','lc_pair','lc_last','lc_unknown','lc_ops','lc_steps','lc_schema','lc_clean','lc_clock','lc_manifest','lc_bounds']);
          // Completion stays private and bound to fixed module-owned callback identities; fixture IDs never join actual22/18.
          const WITNESS_REASONS=Object.freeze(['registration','wrapper_registration','identity','duplicate_issue','duplicate_completion','issuance_count','return_token','barrier_incomplete']);
          class WitnessRejected extends Error{constructor(reason){super(reason);this.reason=reason;}}
          function witnessNeed(ok,reason){assert(WITNESS_REASONS.includes(reason));if(!ok)throw new WitnessRejected(reason);}
          let activeWitness=null,fixedWitnessCallbacks,p4FixtureInventory=null,p4FixtureInvocations=0,p4ReceiverBoundary=null;
          function postAssertion(id){
           const active=activeWitness;witnessNeed(active!==null,'identity');active.attempts++;
           const registered=Object.hasOwn(privateFixtureCallbacks,id)?privateFixtureCallbacks[id]:fixedWitnessCallbacks[id];
           witnessNeed(active.id===id&&typeof registered==='function'&&active.callback===registered,'identity');
           witnessNeed(active.issued===0,'duplicate_issue');active.issued++;return active.token;
          }
          function createExpansionHarness(expected,callbacks){
           witnessNeed(JSON.stringify(Object.keys(callbacks))===JSON.stringify(expected),'registration');
           const completed=new Map(expected.map(id=>[id,0])),states=new Map();
           return {
            wrap(id,original){
             witnessNeed(expected.includes(id)&&typeof original==='function'&&typeof callbacks[id]==='function','wrapper_registration');
             return async()=>{
              witnessNeed(completed.get(id)===0,'duplicate_completion');await original();
              const active={id,callback:callbacks[id],attempts:0,issued:0,received:0,token:Object.freeze({})},previous=activeWitness;let result;
              states.set(id,active);activeWitness=active;const callback=active.callback;try{result=await callback();}finally{activeWitness=previous;}
              witnessNeed(active.issued===1,'issuance_count');witnessNeed(result===active.token,'return_token');
              witnessNeed(completed.get(id)===0,'duplicate_completion');completed.set(id,1);
             };
            },
            barrier(){witnessNeed(completed.size===expected.length&&expected.every(id=>completed.get(id)===1),'barrier_incomplete');return expected.map(id=>({id,count:completed.get(id),postAssertion:true}));},
            snapshot(id){assert(expected.includes(id));const state=states.get(id);return {attempts:state?.attempts??0,issued:state?.issued??0,received:state?.received??0,completed:completed.get(id)};}
           };
          }
          // These fixed, private fixture identities have no public control IDs and never call an actual22/18 callback.
          const privateFixtureCallbacks=Object.freeze({
           p4_skipped:()=>postAssertion('p4_skipped'),
           p4_no_op:()=>undefined,
           p4_forged_no_issue:()=>Symbol('p4_forged'),
           p4_fabricated_return:()=>{const token=postAssertion('p4_fabricated_return');activeWitness.received+=Number(token===activeWitness.token);return Symbol('p4_forged');},
           p4_unreturned:()=>{const token=postAssertion('p4_unreturned');activeWitness.received+=Number(token===activeWitness.token);},
           p4_doubled:()=>{const first=postAssertion('p4_doubled');activeWitness.received+=Number(first===activeWitness.token);return postAssertion('p4_doubled');},
           p4_bare:()=>postAssertion('p4_bare'),
           p4_inert_assertion:()=>assert.fail('p4_inert_assertion'),
           p4_positive:()=>{assert.equal(1,1);const token=postAssertion('p4_positive');activeWitness.received+=Number(token===activeWitness.token);return token;}
          });
          function assertWitnessReason(operation,reason){let observed=null;assert.throws(operation,error=>{if(error instanceof WitnessRejected&&WITNESS_REASONS.includes(error.reason)){observed=error.reason;return observed===reason;}return false;});assert.equal(observed,reason);return observed;}
          async function assertWitnessRejection(operation,reason){let observed=null;await assert.rejects(operation,error=>{if(error instanceof WitnessRejected&&WITNESS_REASONS.includes(error.reason)){observed=error.reason;return observed===reason;}return false;});assert.equal(observed,reason);return observed;}
          async function witnessCounterexamples(){
           const rows=[];
           const row=(id,reason,state,barrier)=>({id,reason,attempts:state.attempts,issued:state.issued,received:state.received,barrier});
           const zero={attempts:0,issued:0,received:0,completed:0};
           assertWitnessReason(()=>createExpansionHarness(['p4_missing'],{}),'registration');rows.push(row('p4_missing','registration',zero,'unavailable'));
           const skipped=createExpansionHarness(['p4_skipped'],{p4_skipped:privateFixtureCallbacks.p4_skipped});
           assertWitnessReason(()=>skipped.barrier(),'barrier_incomplete');assert.deepEqual(skipped.snapshot('p4_skipped'),zero);rows.push(row('p4_skipped','barrier_incomplete',zero,'incomplete'));
           for(const [id,reason,attempts,issued,received]of [
            ['p4_no_op','issuance_count',0,0,0],['p4_forged_no_issue','issuance_count',0,0,0],
            ['p4_fabricated_return','return_token',1,1,1],['p4_unreturned','return_token',1,1,1],['p4_doubled','duplicate_issue',2,1,1]
           ]){
            const failed=createExpansionHarness([id],{[id]:privateFixtureCallbacks[id]});
            const observed=await assertWitnessRejection(()=>failed.wrap(id,async()=>{})(),reason);
            const state=failed.snapshot(id);assert.deepEqual(state,{attempts,issued,received,completed:0});
            assertWitnessReason(()=>failed.barrier(),'barrier_incomplete');rows.push(row(id,observed,state,'incomplete'));
           }
