name: AFW fixed SYN pair disposal control
run-name: AFW paired disposer pure control ${{ github.sha }}
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-finite-budget-qualification.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
jobs:
  diagnostic:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/feat/finite-native-cleanup-20261101' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tokenizartinfo-ops/agent-friendly-web
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Require exact keyless source and install current lock
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = tokenizartinfo-ops/agent-friendly-web
          test "$GITHUB_REF" = refs/heads/feat/finite-native-cleanup-20261101
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -z "${AFW_SYN_CHECKPOINT_KEY+x}"
          test "$(node -v)" = v22.23.4
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -m 700 "$RUNNER_TEMP/afw-diagnostic-public"
          npm ci --ignore-scripts --no-audit --no-fund >"$RUNNER_TEMP/afw-diagnostic-install.log" 2>&1 || { echo locked_install_failed; exit 1; }
      - name: Check syntax lint and actual paired disposer with inert callbacks
        id: diagnostic
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          syntax=0; lint=0; control=0
          node --check test/fixtures/finite-budget-world.mjs >"$RUNNER_TEMP/afw-disposer-syntax.log" 2>&1 || syntax=$?
          if test "$syntax" = 0; then npx --no-install eslint test/fixtures/finite-budget-world.mjs >"$RUNNER_TEMP/afw-disposer-lint.log" 2>&1 || lint=$?; else lint=1; fi
          if test "$syntax" = 0 && test "$lint" = 0; then env -u AFW_BUDGET_GROUP node test/fixtures/finite-budget-world.mjs verify-pair-disposer >"$RUNNER_TEMP/afw-disposer-control.log" 2>&1 || control=$?; else control=1; fi
          export AFW_CONTROL_SYNTAX="$syntax" AFW_CONTROL_LINT="$lint" AFW_CONTROL_EXIT="$control"
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const e=process.env,root=e.RUNNER_TEMP+'/afw-diagnostic-public',hash=bytes=>createHash('sha256').update(bytes).digest('hex');let control=null;
          try{control=JSON.parse(await readFile('output/finite-budget/disposer-control/result.json','utf8'));}catch{}
          if(control){assert.equal(control.purpose,'afw.fixed-budget-pair-disposer-control.syn.v1');assert.equal(control.source,e.GITHUB_SHA);assert.equal(control.tests,1);assert.equal(control.businessCases,0);assert.equal(control.I0Opened,false);assert.equal(control.nativeExecutionProduced,false);assert.equal(control.scenarios.length,3);}
          const allPassed=e.AFW_CONTROL_SYNTAX==='0'&&e.AFW_CONTROL_LINT==='0'&&e.AFW_CONTROL_EXIT==='0'&&control?.passed===true;
          const result={purpose:'afw.fixed-budget-disposer-covering.syn.v1',source:e.GITHUB_SHA,run:e.GITHUB_RUN_ID,attempt:1,syntaxPassed:e.AFW_CONTROL_SYNTAX==='0',lintPassed:e.AFW_CONTROL_LINT==='0',controlCompleted:e.AFW_CONTROL_EXIT==='0',control,allPassed,I0Opened:false,nativeExecutionProduced:false,operationalReadiness:false,completePackage:false,PCoff:false};
          const bytes=Buffer.from(JSON.stringify(result,null,2));assert(bytes.length<65536);await writeFile(root+'/diagnostics.json',bytes);
          await writeFile(root+'/manifest.json',JSON.stringify({purpose:'afw.fixed-budget-pure-diagnostic-manifest.syn.v1',source:e.GITHUB_SHA,run:e.GITHUB_RUN_ID,attempt:1,files:[{path:'diagnostics.json',bytes:bytes.length,sha256:hash(bytes)}]}));await writeFile(e.GITHUB_OUTPUT,'all-passed='+allPassed+'\n',{flag:'a'});
          NODE
      - name: Upload safe diagnostic on success and failure
        id: upload
        if: always() && !cancelled() && steps.diagnostic.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: finite-budget-pair-disposer-control-${{ github.sha }}
          path: ${{ runner.temp }}/afw-diagnostic-public/
          retention-days: 7
          if-no-files-found: error
      - name: Download same assigned diagnostic artifact ID
        id: download
        if: always() && !cancelled() && steps.upload.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/afw-diagnostic-readback
          merge-multiple: true
      - name: Verify exact safe inventory and print bounded diagnostic
        id: verified
        if: always() && !cancelled() && steps.download.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFile,readdir} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const e=process.env,root=e.RUNNER_TEMP+'/afw-diagnostic-readback';assert.match(e.ARTIFACT_ID,/^[1-9][0-9]*$/);
          assert.deepEqual((await readdir(root)).sort(),['diagnostics.json','manifest.json']);
          const raw=await readFile(root+'/diagnostics.json'),manifestRaw=await readFile(root+'/manifest.json'),manifest=JSON.parse(manifestRaw);
          assert.equal(manifest.source,e.GITHUB_SHA);assert.equal(manifest.run,e.GITHUB_RUN_ID);assert.equal(manifest.attempt,1);
          assert.deepEqual(manifest.files,[{path:'diagnostics.json',bytes:raw.length,sha256:createHash('sha256').update(raw).digest('hex')}]);
          for(const file of ['diagnostics.json','manifest.json'])assert((await readFile(e.RUNNER_TEMP+'/afw-diagnostic-public/'+file)).equals(await readFile(root+'/'+file)));
          console.log('DISPOSER_CONTROL_SAME_ID_VERIFIED '+e.ARTIFACT_ID);console.log(raw.toString('utf8'));
          NODE
      - name: Preserve actual disposer control outcome
        if: always() && !cancelled()
        shell: bash
        run: |
          test '${{ steps.diagnostic.outputs.all-passed }}' = true
          test '${{ steps.verified.outcome }}' = success
