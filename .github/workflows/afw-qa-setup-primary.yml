name: AFW QA primary setup verification
on:
  push:
    branches: [lab/afw-qa-setup-primary-20261118]
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/lab/afw-qa-setup-primary-20261118' && github.run_attempt == '1' && github.event.head_commit.message == 'AFW-QA-SETUP-PRIMARY-20261118' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the setup receipt against primary Workflow and deployment evidence
        run: node --test test/mcp-qa-finite-adoption-source.test.mjs test/mcp-qa-finite-adoption-wait.test.mjs test/mcp-qa-finite-http.test.mjs test/build-finite-native-package.test.mjs
