name: AFW preparation Worker build only

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/afw-preparation-worker-build.yml'
      - 'worker/mcp-preparation/**'
      - 'lib/**'
      - 'scripts/build-preparation-worker.mjs'
      - 'scripts/mcp-release-source.mjs'
      - 'test/preparation-worker*'
      - 'test/fixtures/preparation-worker*'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.npmrc'
  push:
    branches: [main]
    paths:
      - '.github/workflows/afw-preparation-worker-build.yml'
      - 'worker/mcp-preparation/**'
      - 'lib/**'
      - 'scripts/build-preparation-worker.mjs'
      - 'scripts/mcp-release-source.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.npmrc'

permissions:
  contents: read

concurrency:
  group: afw-preparation-worker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    if: >-
      github.repository == 'tokenizartinfo-ops/agent-friendly-web' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AFW_BUILD_SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AFW_BUILD_SOURCE_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile exact source without publishing
        run: node scripts/build-preparation-worker.mjs "$AFW_BUILD_SOURCE_REVISION"
      - name: Verify compiled bytes and provenance
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const bytes=readFileSync('output/preparation-worker/index.mjs');
          const m=JSON.parse(readFileSync('output/preparation-worker/build.json','utf8'));
          assert.equal(m.sourceRevision,process.env.AFW_BUILD_SOURCE_REVISION);
          assert.equal(m.sourceCheck,'git-inputs-before-after-v1');
          assert.match(m.sourceTree,/^[a-f0-9]{40}$/);
          assert.equal(m.buildOnly,true);assert.equal(m.runtimeConfigIncluded,false);
          assert.ok(bytes.length>0&&bytes.length<=2097152);
          assert.equal(m.workerBytes,bytes.length);
          assert.equal(m.workerHash,createHash('sha256').update(bytes).digest('hex'));
          console.log(JSON.stringify(m));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: afw-preparation-worker-${{ env.AFW_BUILD_SOURCE_REVISION }}
          path: |
            output/preparation-worker/index.mjs
            output/preparation-worker/build.json
          if-no-files-found: error
          retention-days: 7
