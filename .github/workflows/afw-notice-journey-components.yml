name: AFW notice journey components
on:
  push:
    branches: [lab/afw-notice-journey-components-20261118]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/lab/afw-notice-journey-components-20261118' && github.event.head_commit.message == 'AFW-NOTICE-JOURNEY-COMPONENTS-20261118' && github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Check AFW notice components
        run: node scripts/qa/afw-notice-journey.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: afw-notice-journey-components
          path: afw-notice-journey-result.json
          if-no-files-found: error
          retention-days: 7
