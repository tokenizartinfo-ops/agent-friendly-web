name: AFW first connection qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-first-connection-qualification.yml]
permissions:
  contents: read
jobs:
  A-native-negatives:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Native causal negatives
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/task3
          run_case() {
            label="$1"; expected="$2"; shift 2
            set +e
            "$@" 2>&1 | tee "output/task3/$label.log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";const[label,expected,exit,teeExit]=process.argv.slice(1),raw=readFileSync("output/task3/"+label+".log","utf8"),read=k=>Number(raw.match(new RegExp("(?:^|\\n)ℹ "+k+" (\\d+)"))?.[1]??NaN),result={label,expected:Number(expected),executed:read("tests"),pass:read("pass"),fail:read("fail"),cancel:read("cancelled"),skip:read("skipped"),commandExit:Number(exit),teeExit:Number(teeExit)};writeFileSync("output/task3/"+label+".json",JSON.stringify(result));console.log("TASK3_COUNTS "+JSON.stringify(result));if(result.executed!==result.expected||result.pass!==result.executed||result.fail!==0||result.cancel!==0||result.skip!==0||result.commandExit!==0||result.teeExit!==0)process.exit(1);' "$label" "$expected" "${statuses[0]}" "${statuses[1]}"
          }
          failed=0
          run_case native-negatives 25 node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^(T2 |T3 (?!same initial bytes))' test/mcp-qa-finite-first-connection-publication-native.test.mjs || failed=1
          exit "$failed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task3-${{ github.job }}-${{ github.sha }}
          path: |
            output/task3
            output/t2-native-graphs
          retention-days: 7
  B-context-and-downstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Context and focal downstream
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/task3
          run_case() {
            label="$1"; expected="$2"; shift 2
            set +e
            "$@" 2>&1 | tee "output/task3/$label.log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";const[label,expected,exit,teeExit]=process.argv.slice(1),raw=readFileSync("output/task3/"+label+".log","utf8"),read=k=>Number(raw.match(new RegExp("(?:^|\\n)ℹ "+k+" (\\d+)"))?.[1]??NaN),result={label,expected:Number(expected),executed:read("tests"),pass:read("pass"),fail:read("fail"),cancel:read("cancelled"),skip:read("skipped"),commandExit:Number(exit),teeExit:Number(teeExit)};writeFileSync("output/task3/"+label+".json",JSON.stringify(result));console.log("TASK3_COUNTS "+JSON.stringify(result));if(result.executed!==result.expected||result.pass!==result.executed||result.fail!==0||result.cancel!==0||result.skip!==0||result.commandExit!==0||result.teeExit!==0)process.exit(1);' "$label" "$expected" "${statuses[0]}" "${statuses[1]}"
          }
          failed=0
          run_case context 27 node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^(closed source keeps original A and stable original context|original approval and enrollment stay closed without publication|settled first connection derives read_consent from exact primary state|unknown SEND denies|retained original backup denies|actual current module and profile independently deny|original retained read blocks foreign root until actual settlement|fresh QA pointer drift after the first snapshot denies)' test/mcp-qa-finite-owner-phase-context-native.test.mjs || failed=1
          run_case get 4 node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^(GET acknowledged original after actual QA code M token MCP and D04 reader|full empty and totally absent schema preserve reader; GET partial schema fails before journal|foreign preconnection and UUID history is neither enumerated nor changed|owned native hold-before denies bearer continuation and only own stack ACKs)$' test/mcp-qa-finite-owner-notice-get-native.test.mjs || failed=1
          run_case post 10 node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^(native consent POST records original decision after actual ticket GET|native consent own SQL continuation alone accepts pending SEND|native consent captured failure cannot resume commit|native consent correlated DATA denies )' test/mcp-qa-finite-owner-notice-consent-native.test.mjs || failed=1
          run_case sdk 2 node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^(D04 actual exchange retains factual read_consent and immutable grant ACK|D04 actual exchange then SYN valid native timestamp drift at observation two denies)$' test/mcp-qa-finite-owner-qa-sdk-token-compat-native.test.mjs || failed=1
          run_case link 1 node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^native notice link factual mismatch denies valid codec and journal data$' test/mcp-qa-finite-owner-notice-link-native.test.mjs || failed=1
          exit "$failed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task3-${{ github.job }}-${{ github.sha }}
          path: |
            output/task3
            output/t2-native-graphs
          retention-days: 7
  C-accepted-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fixed consumers compiler and lint
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/task3
          run_case() {
            label="$1"; expected="$2"; shift 2
            set +e
            "$@" 2>&1 | tee "output/task3/$label.log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";const[label,expected,exit,teeExit]=process.argv.slice(1),raw=readFileSync("output/task3/"+label+".log","utf8"),read=k=>Number(raw.match(new RegExp("(?:^|\\n)ℹ "+k+" (\\d+)"))?.[1]??NaN),result={label,expected:Number(expected),executed:read("tests"),pass:read("pass"),fail:read("fail"),cancel:read("cancelled"),skip:read("skipped"),commandExit:Number(exit),teeExit:Number(teeExit)};writeFileSync("output/task3/"+label+".json",JSON.stringify(result));console.log("TASK3_COUNTS "+JSON.stringify(result));if(result.executed!==result.expected||result.pass!==result.executed||result.fail!==0||result.cancel!==0||result.skip!==0||result.commandExit!==0||result.teeExit!==0)process.exit(1);' "$label" "$expected" "${statuses[0]}" "${statuses[1]}"
          }
          failed=0
          run_case pure 55 node --test --test-reporter=spec --test-concurrency=1 test/mcp-qa-finite-first-connection-publication.test.mjs || failed=1
          run_case transport 4 node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^(read_version_current_candidate_and_historical_rollback|wrong_role_denied_before_mutation|actual consumed owner approval without original native cleanup capsule remains pending and has no SEND/POST|T1 known failure retains real cancellation)$' test/mcp-qa-finite-policy-transport.test.mjs || failed=1
          run_case setup 3 node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^(Task4 actual native wrapper DO store and two-effect engine installs only actual ACK versions|Task4 lost activation ACK cannot produce installed receipt or repeat effects|Task4 held nested hydration retains original lineage after response until actual settlement)$' test/mcp-qa-finite-policy-setup-native.test.mjs || failed=1
          run_case compiler 2 node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^(actual compiler staging hashes final bytes and retains source classes without eligible manifest|missing_factory_blocks_package)$' test/build-finite-native-package.test.mjs || failed=1
          npx eslint lib/mcp-qa-finite-owner-native-receiver.mjs lib/mcp-qa-finite-owner-preparation.mjs lib/mcp-qa-finite-owner-phase-context.mjs test/mcp-qa-finite-first-connection-publication-native.test.mjs test/fixtures/finite-first-connection-publication.mjs test/fixtures/finite-initial-entry-world.mjs test/mcp-qa-finite-owner-phase-context-native.test.mjs || failed=1
          exit "$failed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task3-${{ github.job }}-${{ github.sha }}
          path: |
            output/task3
            output/t2-native-graphs
          retention-days: 7
