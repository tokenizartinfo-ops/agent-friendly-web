name: AFW first connection scoped completion
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-first-connection-qualification.yml]
permissions:
  contents: read
jobs:
  controls-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d11dff63b0d693b89ac6ef8d6ec6c60ca01af751
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exact pinned-source remaining controls and lint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/task3
          cat > output/task3/manifest.json <<'AFW_MANIFEST'
          {
            "purpose": "Task3 explicit composite verification completion, not an original-run success",
            "job": "scoped-completion",
            "checkedOutHead": "d11dff63b0d693b89ac6ef8d6ec6c60ca01af751",
            "checkedOutTree": "4e30df2ae4abe2bf087b123823185fa6ab082fa8",
            "allowedBlobs": [
              {
                "path": "lib/mcp-qa-finite-owner-native-receiver.mjs",
                "sha": "e760b3579a38f1dbb73b177bb73b06d814eb881f"
              },
              {
                "path": "lib/mcp-qa-finite-owner-preparation.mjs",
                "sha": "152e730f83af7ef063b6b1db89f8b0a779c2b60e"
              },
              {
                "path": "lib/mcp-qa-finite-owner-phase-context.mjs",
                "sha": "e482ad1617adc001c3a32c94e71eeb41d27f3d1d"
              },
              {
                "path": "test/mcp-qa-finite-first-connection-publication-native.test.mjs",
                "sha": "bc9f717d79e6e1ad60a40f358351093371331bee"
              },
              {
                "path": "test/fixtures/finite-first-connection-publication.mjs",
                "sha": "2cda37157bc0d1c9622784c33aa3b0fd94dc0e48"
              },
              {
                "path": "test/fixtures/finite-initial-entry-world.mjs",
                "sha": "297b57846bbbe13bfc80ac52c5b033a382aef4b6"
              },
              {
                "path": "test/mcp-qa-finite-owner-phase-context-native.test.mjs",
                "sha": "be1ff27807934797f371ea703cd9a2c6f7f3675a"
              }
            ],
            "allowedPaths": [
              "lib/mcp-qa-finite-owner-native-receiver.mjs",
              "lib/mcp-qa-finite-owner-preparation.mjs",
              "lib/mcp-qa-finite-owner-phase-context.mjs",
              "test/mcp-qa-finite-first-connection-publication-native.test.mjs",
              "test/fixtures/finite-first-connection-publication.mjs",
              "test/fixtures/finite-initial-entry-world.mjs",
              "test/mcp-qa-finite-owner-phase-context-native.test.mjs"
            ],
            "positiveEvidence": {
              "run": 42236775067,
              "head": "d11dff63b0d693b89ac6ef8d6ec6c60ca01af751",
              "expected": 167,
              "executed": 167,
              "pass": 167,
              "originalConclusion": "cancelled, controls and lint incomplete"
            },
            "cases": [
              {
                "label": "mutant-public-partial",
                "file": "test/mcp-qa-finite-first-connection-publication-native.test.mjs",
                "expected": 1,
                "names": [
                  "T3 upload uncertainty cannot activate: upload-lost"
                ],
                "mutant": "public-partial",
                "target": "public partial connection cannot appear closed_ui"
              },
              {
                "label": "mutant-existing-ack",
                "file": "test/mcp-qa-finite-first-connection-publication-native.test.mjs",
                "expected": 1,
                "names": [
                  "T3 own completion requires genuinely recorded original ACK even when foreign bytes match"
                ],
                "mutant": "existing-ack",
                "target": "existing foreign ACK cannot be accepted by own continuation"
              }
            ],
            "lint": true
          }
          AFW_MANIFEST
          cat > output/task3/run.mjs <<'AFW_RUNNER'
          import{spawn,execFileSync}from'node:child_process';
          import{readFileSync,writeFileSync,appendFileSync,readdirSync,existsSync}from'node:fs';
          const manifest=JSON.parse(readFileSync('output/task3/manifest.json','utf8'));
          const triggerHead=process.env.GITHUB_SHA,sourceHead=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),sourceTree=execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          function verifySource(stage){
           if(sourceHead!==manifest.checkedOutHead||sourceTree!==manifest.checkedOutTree)throw Error('Pinned checkout provenance mismatch');
           const status=execFileSync('git',['status','--porcelain','--untracked-files=no'],{encoding:'utf8'});if(status.trim())throw Error('Tracked checkout changed');
           const actual=manifest.allowedBlobs.map(({path,sha})=>{const object=execFileSync('git',['rev-parse','HEAD:'+path],{encoding:'utf8'}).trim(),working=execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim();if(object!==sha||working!==sha)throw Error('Source blob mismatch '+path);return {path,sha,working};});
           console.log('TASK3_PROVENANCE '+JSON.stringify({stage,triggerHead,checkedOutHead:sourceHead,checkedOutTree:sourceTree,actual,childGithubShaReason:'existing fixture testRevision must name actual pinned compiled checkout, not later workflow trigger'}));
          }
          verifySource('before');
          
          const escape=x=>x.replace(/[.*+?^$()|[\]\\]/g,'\\$&');
          const results=[];let failed=false;
          async function run(c){
           const args=['--test','--test-concurrency=1','--test-reporter=spec','--test-reporter=tap','--test-reporter-destination=stdout','--test-reporter-destination=output/task3/'+c.label+'.tap'];
           if(c.names)args.push('--test-name-pattern=^(?:'+c.names.map(escape).join('|')+')$');else if(c.pattern)args.push('--test-name-pattern='+c.pattern);
           args.push(c.file);
           const begin=Date.now(),log='output/task3/'+c.label+'.log';writeFileSync(log,'');
           const child=spawn(process.execPath,args,{env:{...process.env,GITHUB_SHA:sourceHead,...c.mutant?{AFW_T3_MUTANT:c.mutant}:{}}});
           child.stdout.on('data',b=>{appendFileSync(log,b);process.stdout.write(b);});child.stderr.on('data',b=>{appendFileSync(log,b);process.stderr.write(b);});
           const completion=await new Promise(resolve=>{child.once('error',error=>resolve({exit:null,signal:null,error:error.message}));child.once('close',(exit,signal)=>resolve({exit,signal}));});
           let tap='';try{tap=readFileSync('output/task3/'+c.label+'.tap','utf8');}catch{}
           const n=k=>Number(tap.match(new RegExp('^# '+k+' (\\d+)$','m'))?.[1]??NaN),names=[...tap.matchAll(/^# Subtest: (.*)$/gm)].map(m=>m[1]),raw=readFileSync(log,'utf8');
           const r={head:sourceHead,triggerHead,label:c.label,expected:c.expected,executed:n('tests'),topLevel:names.length,subtests:n('tests')-names.length,pass:n('pass'),fail:n('fail'),cancel:n('cancelled'),skip:n('skipped'),todo:n('todo'),commandExit:completion.exit,signal:completion.signal,elapsedMs:Date.now()-begin,names,native:!!c.native,mutant:c.mutant??null,targetMessage:c.target?raw.includes(c.target):null};
           const namesOk=!c.names||JSON.stringify([...names].sort())===JSON.stringify([...c.names].sort());
           const expectedFailure=!!c.mutant;
           r.accepted=namesOk&&r.executed===c.expected&&r.pass===(expectedFailure?0:c.expected)&&r.fail===(expectedFailure?c.expected:0)&&r.cancel===0&&r.skip===0&&r.todo===0&&r.commandExit===(expectedFailure?1:0)&&r.signal===null&&(!expectedFailure||r.targetMessage===true);
           results.push(r);writeFileSync('output/task3/'+c.label+'.json',JSON.stringify(r,null,2));console.log('TASK3_COUNTS '+JSON.stringify(r));if(!r.accepted)failed=true;
          }
          if(manifest.cases.length!==2||manifest.cases.some(c=>!c.mutant||c.expected!==1))throw Error('completion scope mismatch');
          for(const c of manifest.cases)await run(c);
          if(manifest.lint){
           const lintArgs=['eslint','--max-warnings=0',...manifest.allowedPaths],begin=Date.now(),p=spawn('npx',lintArgs);let raw='';p.stdout.on('data',b=>{raw+=b;process.stdout.write(b);});p.stderr.on('data',b=>{raw+=b;process.stderr.write(b);});const status=await new Promise(resolve=>p.once('close',(exit,signal)=>resolve({exit,signal})));writeFileSync('output/task3/lint.log',raw);const r={label:'lint',commandExit:status.exit,signal:status.signal,elapsedMs:Date.now()-begin};results.push(r);console.log('TASK3_LINT '+JSON.stringify(r));if(status.exit!==0||status.signal!==null)failed=true;
          }
          if(existsSync('output/t2-native-graphs'))for(const entry of readdirSync('output/t2-native-graphs',{withFileTypes:true})){if(entry.isDirectory()&&/^[a-f0-9]{64}$/.test(entry.name)){const path='output/t2-native-graphs/'+entry.name+'/native-syn.json';if(existsSync(path))console.log('TASK3_BUILD '+JSON.stringify({path,...JSON.parse(readFileSync(path,'utf8'))}));}}
          verifySource('after');
          writeFileSync('output/task3/results.json',JSON.stringify({head:sourceHead,triggerHead,job:manifest.job,results},null,2));process.exitCode=failed?1:0;
          
          AFW_RUNNER
          node output/task3/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task3-completion-source-d11dff63-trigger-${{ github.sha }}
          path: |
            output/task3
            output/t2-native-graphs
          retention-days: 7
