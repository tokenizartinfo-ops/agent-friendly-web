name: AFW first connection qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths:
      - 'lib/mcp-qa-finite-fixed-policy-engine.mjs'
      - 'lib/mcp-qa-finite-preparation-enrollment-writer.mjs'
      - 'lib/mcp-qa-finite-policy-transport.mjs'
      - 'test/mcp-qa-finite-policy-transport.test.mjs'
      - 'test/mcp-qa-finite-first-connection-publication.test.mjs'
      - 'test/fixtures/finite-first-connection-publication.mjs'
      - 'test/fixtures/finite-initial-entry-world.mjs'
      - '.github/workflows/afw-first-connection-qualification.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^T1 ' test/mcp-qa-finite-policy-transport.test.mjs test/mcp-qa-finite-first-connection-publication.test.mjs
