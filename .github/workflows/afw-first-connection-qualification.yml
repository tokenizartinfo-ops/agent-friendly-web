name: AFW first connection qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths:
      - .github/workflows/afw-first-connection-qualification.yml
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: T2 focal RED
        run: |
          set -o pipefail
          mkdir -p output/t2-red
          node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^T2 ' test/mcp-qa-finite-first-connection-publication.test.mjs test/mcp-qa-finite-first-connection-publication-native.test.mjs 2>&1 | tee output/t2-red/result.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-connection-task2-red
          path: output/t2-red/
          retention-days: 7
