name: AFW first connection qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths:
      - 'lib/mcp-qa-finite-fixed-policy-engine.mjs'
      - 'lib/mcp-qa-finite-preparation-enrollment-writer.mjs'
      - 'lib/mcp-qa-finite-policy-transport.mjs'
      - 'test/mcp-qa-finite-policy-transport.test.mjs'
      - 'test/mcp-qa-finite-first-connection-publication.test.mjs'
      - 'test/fixtures/finite-first-connection-publication.mjs'
      - 'test/fixtures/finite-initial-entry-world.mjs'
      - '.github/workflows/afw-first-connection-qualification.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          set -o pipefail
          node --test --test-reporter=spec --test-concurrency=1 test/mcp-qa-finite-policy-transport.test.mjs test/mcp-qa-finite-first-connection-publication.test.mjs | tee task1-contracts.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task1-contracts
          path: task1-contracts.log
          retention-days: 7
      - run: npx --no-install eslint lib/mcp-qa-finite-fixed-policy-engine.mjs lib/mcp-qa-finite-preparation-enrollment-writer.mjs lib/mcp-qa-finite-policy-transport.mjs test/mcp-qa-finite-policy-transport.test.mjs test/mcp-qa-finite-first-connection-publication.test.mjs test/fixtures/finite-first-connection-publication.mjs test/fixtures/finite-initial-entry-world.mjs
