name: AFW first connection qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-first-connection-qualification.yml]
permissions:
  contents: read
jobs:
  A-identity-and-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native identity source expiry and history
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/task3
          node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^T3 (identity|source|original deadline|admission)' test/mcp-qa-finite-first-connection-publication-native.test.mjs 2>&1 | tee output/task3/identity.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task3-identity-${{ github.sha }}
          path: |
            output/task3
            output/t2-native-graphs
          retention-days: 7
  B-context-and-downstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Context and focal downstream
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/task3
          run_case() {
            label="$1"; expected="$2"; shift 2
            set +e
            "$@" 2>&1 | tee "output/task3/$label.log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";const[label,expected,exit,teeExit]=process.argv.slice(1),raw=readFileSync("output/task3/"+label+".log","utf8"),read=k=>Number(raw.match(new RegExp("(?:^|\\n)ℹ "+k+" (\\d+)"))?.[1]??NaN),result={label,expected:Number(expected),executed:read("tests"),pass:read("pass"),fail:read("fail"),cancel:read("cancelled"),skip:read("skipped"),commandExit:Number(exit),teeExit:Number(teeExit)};writeFileSync("output/task3/"+label+".json",JSON.stringify(result));console.log("TASK3_COUNTS "+JSON.stringify(result));if(result.executed!==result.expected||result.pass!==result.executed||result.fail!==0||result.cancel!==0||result.skip!==0||result.commandExit!==0||result.teeExit!==0)process.exit(1);' "$label" "$expected" "${statuses[0]}" "${statuses[1]}"
          }
          failed=0
          run_case context 7 node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^T3 ' test/mcp-qa-finite-owner-phase-context-native.test.mjs || failed=1
          run_case get 4 node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^(GET acknowledged original after actual QA code M token MCP and D04 reader|full empty and totally absent schema preserve reader; GET partial schema fails before journal|foreign preconnection and UUID history is neither enumerated nor changed|owned native hold-before denies bearer continuation and only own stack ACKs)$' test/mcp-qa-finite-owner-notice-get-native.test.mjs || failed=1
          run_case post 10 node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^(native consent POST records original decision after actual ticket GET|native consent own SQL continuation alone accepts pending SEND|native consent captured failure cannot resume commit|native consent correlated DATA denies )' test/mcp-qa-finite-owner-notice-consent-native.test.mjs || failed=1
          run_case sdk 2 node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^(D04 actual exchange retains factual read_consent and immutable grant ACK|D04 actual exchange then SYN valid native timestamp drift at observation two denies)$' test/mcp-qa-finite-owner-qa-sdk-token-compat-native.test.mjs || failed=1
          run_case link 1 node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^native notice link factual mismatch denies valid codec and journal data$' test/mcp-qa-finite-owner-notice-link-native.test.mjs || failed=1
          exit "$failed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task3-${{ github.job }}-${{ github.sha }}
          path: |
            output/task3
            output/t2-native-graphs
          retention-days: 7
