name: AFW first connection qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-first-connection-qualification.yml]
permissions:
  contents: read
jobs:
  A-causal-correlations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Actual positive and precise correlation boundaries
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/task3
          node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern='^T3 (same initial bytes|source and rollback|enrollment|resealed completed|own completion)' test/mcp-qa-finite-first-connection-publication-native.test.mjs 2>&1 | tee output/task3/correlations.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task3-${{ github.job }}-${{ github.sha }}
          path: |
            output/task3
            output/t2-native-graphs
          retention-days: 7

  B-negative-mutation-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Exact single-guard negative controls
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/task3
          run_mutant() {
            label="$1"; pattern="$2"; message="$3"
            set +e
            AFW_T3_MUTANT="$label" node --test --test-reporter=spec --test-concurrency=1 --test-name-pattern="$pattern" test/mcp-qa-finite-first-connection-publication-native.test.mjs 2>&1 | tee "output/task3/mutant-$label.log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";const[label,target,exit,teeExit]=process.argv.slice(1),raw=readFileSync("output/task3/mutant-"+label+".log","utf8"),read=k=>Number(raw.match(new RegExp("(?:^|\\n)ℹ "+k+" (\\d+)"))?.[1]??NaN),result={label,target,executed:read("tests"),pass:read("pass"),fail:read("fail"),cancel:read("cancelled"),skip:read("skipped"),commandExit:Number(exit),teeExit:Number(teeExit),targetMessage:raw.includes(target)};writeFileSync("output/task3/mutant-"+label+".json",JSON.stringify(result));console.log("TASK3_MUTATION "+JSON.stringify(result));if(result.executed!==1||result.pass!==0||result.fail!==1||result.cancel!==0||result.skip!==0||result.commandExit!==1||result.teeExit!==0||!result.targetMessage)process.exit(1);' "$label" "$message" "${statuses[0]}" "${statuses[1]}"
          }
          failed=0
          run_mutant public-partial '^T3 upload uncertainty cannot activate: upload-lost$' 'public partial connection cannot appear closed_ui' || failed=1
          run_mutant existing-ack '^T3 own completion requires genuinely recorded original ACK even when foreign bytes match$' 'existing foreign ACK cannot be accepted by own continuation' || failed=1
          exit "$failed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task3-${{ github.job }}-${{ github.sha }}
          path: |
            output/task3
            output/t2-native-graphs
          retention-days: 7
