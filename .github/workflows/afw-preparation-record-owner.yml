name: AFW preparation record ownership
on:
  pull_request:
    paths: ['lib/delegated-preparation-consent-store.mjs', 'test/preparation-record-owner.test.mjs', 'test/fixtures/preparation-consent-store.mjs', '.github/workflows/afw-preparation-record-owner.yml']
  push:
    branches: [main]
    paths: ['lib/delegated-preparation-consent-store.mjs', 'test/preparation-record-owner.test.mjs', 'test/fixtures/preparation-consent-store.mjs', '.github/workflows/afw-preparation-record-owner.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/preparation-record-owner.test.mjs
