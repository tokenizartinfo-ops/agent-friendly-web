name: AFW D0.1 source qualifier
on:
  push:
    branches:
      - feat/finite-native-cleanup-20261101
    paths:
      - 'lib/mcp-qa-finite-profile.mjs'
      - 'lib/mcp-qa-finite-owner-sdk-binding-facts.mjs'
      - 'wrangler.independent-closure-qa.finite.jsonc'
      - 'test/mcp-qa-finite-profile.test.mjs'
      - 'test/mcp-qa-finite-profile-native.test.mjs'
      - 'test/mcp-qa-finite-owner-sdk-binding-facts.test.mjs'
      - 'test/mcp-qa-finite-bootstrap.test.mjs'
      - 'test/mcp-qa-finite-bootstrap-native.test.mjs'
      - 'test/mcp-qa-finite-bootstrap-compiler.test.mjs'
      - 'test/mcp-qa-finite-initial-capsule-native.test.mjs'
      - '.github/workflows/afw-d01-source-qualifier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d01:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint first
        run: npm run lint
      - name: Scoped profile, bootstrap, material and capsule tests
        run: node --test test/mcp-qa-finite-owner-sdk-binding-facts.test.mjs test/mcp-qa-finite-profile.test.mjs test/mcp-qa-finite-profile-native.test.mjs test/mcp-qa-finite-bootstrap.test.mjs test/mcp-qa-finite-bootstrap-native.test.mjs test/mcp-qa-finite-bootstrap-primary.test.mjs test/mcp-qa-finite-bootstrap-issuer.test.mjs test/mcp-qa-finite-initial-material-records.test.mjs test/mcp-qa-finite-initial-capsule-records.test.mjs test/mcp-qa-finite-initial-capsule-native.test.mjs
      - name: One final actual finite native compiler gate
        run: node --test test/mcp-qa-finite-bootstrap-compiler.test.mjs
