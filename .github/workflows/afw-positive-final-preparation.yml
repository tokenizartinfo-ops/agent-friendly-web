name: AFW ordinary final preparation
on:
  push:
    branches: [lab/afw-positive-final-preparation-20261118]
permissions:
  contents: read
jobs:
  observe:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/lab/afw-positive-final-preparation-20261118' && github.run_attempt == '1' && github.event.head_commit.message == 'AFW-POSITIVE-FINAL-PREPARATION-20261118-REUSE-VERIFIED-CONTEXT-FINAL-APPROVAL-GROUPED-READS-READ-COHORTS' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize the pinned lab sources
        run: |
          node docs/superpowers/source-lab/afw-positive-final-preparation/mount.mjs
          cp docs/superpowers/source-lab/afw-positive-final-preparation/ordinary-preparation.txt test/afw-positive-final-preparation.lab.test.mjs
      - name: Observe the ordinary flow on loopback
        shell: bash
        run: |
          node_path="$(command -v node)"
          sudo -n timeout --kill-after=5s 205s unshare --net --pid --fork --kill-child=SIGKILL \
            /bin/sh -c 'ip link set lo up && exec /usr/bin/setpriv --reuid "$1" --regid "$2" --clear-groups --no-new-privs /usr/bin/env -i PATH="$3:/usr/bin:/bin" HOME="$4" TMPDIR="$4" LANG=C.UTF-8 "$5" --test --test-reporter=tap "$6"' \
            afw "$(id -u)" "$(id -g)" "$(dirname "$node_path")" "$RUNNER_TEMP" "$node_path" "test/afw-positive-final-preparation.lab.test.mjs"
