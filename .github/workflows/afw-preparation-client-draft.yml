name: AFW preparation client draft
on:
  pull_request:
    paths: ['lib/preparation-client-draft.mjs', 'lib/agent-consumption-input.mjs', 'test/preparation-client-draft.test.mjs', '.github/workflows/afw-preparation-client-draft.yml']
  push:
    branches: [main]
    paths: ['lib/preparation-client-draft.mjs', 'lib/agent-consumption-input.mjs', 'test/preparation-client-draft.test.mjs', '.github/workflows/afw-preparation-client-draft.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/preparation-client-draft.test.mjs
