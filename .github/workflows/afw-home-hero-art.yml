name: AFW home hero art encoding
on:
  pull_request:
    paths:
      - 'config/home-hero-art-20261027.json'
      - 'scripts/encode-home-hero-art.mjs'
      - '.github/workflows/afw-home-hero-art.yml'
permissions:
  contents: read
jobs:
  encode:
    if: github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AFW_QA_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Encode the fixed public generated asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/encode-home-hero-art.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: afw-home-hero-art-${{ github.event.pull_request.head.sha }}
          path: output/home-hero-art/
          if-no-files-found: error
          retention-days: 7
