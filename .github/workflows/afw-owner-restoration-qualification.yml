name: AFW owner restoration qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-owner-restoration-qualification.yml]
permissions:
  contents: read
jobs:
  g5_original_checkpoint_audit:
    permissions: {contents: read, actions: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Pin original g5 checkpoint artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const r=await fetch('https://api.github.com/repos/tokenizartinfo-ops/agent-friendly-web/actions/artifacts/13576692464',{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});assert.equal(r.status,200);const a=await r.json();assert.equal(a.id,13576692464);assert.equal(a.workflow_run.id,42377143830);assert.equal(a.workflow_run.head_sha,'e5f96c1802e7ee2d5d242f9d4887df6bfeda33fb');assert.equal(a.size_in_bytes,11008780);assert.equal(a.expired,false);assert.equal(a.digest,'sha256:93b3942f8aabbc44491bae7a68e69fedf6c0f7e903c3e2ccd4a983e6339b20f0');console.info('Historical artifact pinned',a.id,a.digest);
          NODE
      - name: Download exact artifact historical_preflight attempt 1
        id: historical_preflight_1
        if: ${{ success() }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ '13576692464' }}
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: tokenizartinfo-ops/agent-friendly-web
          run-id: 42377143830
          path: ${{ runner.temp }}/g5-original-checkpoint
      - name: Wait two seconds before exact artifact retry
        if: ${{ always() && steps.historical_preflight_1.outcome == 'failure' }}
        run: sleep 2
      - name: Download exact artifact historical_preflight attempt 2
        id: historical_preflight_2
        if: ${{ always() && steps.historical_preflight_1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ '13576692464' }}
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: tokenizartinfo-ops/agent-friendly-web
          run-id: 42377143830
          path: ${{ runner.temp }}/g5-original-checkpoint
      - name: Wait five seconds before final exact artifact retry
        if: ${{ always() && steps.historical_preflight_2.outcome == 'failure' }}
        run: sleep 5
      - name: Download exact artifact historical_preflight attempt 3
        id: historical_preflight_3
        if: ${{ always() && steps.historical_preflight_2.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ '13576692464' }}
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: tokenizartinfo-ops/agent-friendly-web
          run-id: 42377143830
          path: ${{ runner.temp }}/g5-original-checkpoint
      - name: Require successful exact artifact download
        if: ${{ always() }}
        env:
          ARTIFACT_ID: ${{ '13576692464' }}
          DOWNLOAD_OK: ${{ steps.historical_preflight_1.outcome == 'success' || steps.historical_preflight_2.outcome == 'success' || steps.historical_preflight_3.outcome == 'success' }}
        run: test -n "$ARTIFACT_ID" && test "$DOWNLOAD_OK" = true
      - name: Audit all original checkpoint bytes and M configuration without execution
        shell: bash
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' | tee g5-existing-audit.log
          import {readFile,readdir,writeFile} from 'node:fs/promises';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const expectedEvidenceSource='e5f96c1802e7ee2d5d242f9d4887df6bfeda33fb',root=process.env.RUNNER_TEMP+'/g5-original-checkpoint',hash=b=>createHash('sha256').update(b).digest('hex'),read=p=>readFile(root+'/'+p),parse=async p=>JSON.parse(await read(p));
          assert.deepEqual((await readdir(root)).sort(),['group.json','principal']);const group=await parse('group.json');assert.equal(group.source,expectedEvidenceSource);assert.equal(group.group,'g5');assert.equal(group.graphs,3);assert.deepEqual(group.lineages.map(x=>x.path),['principal']);
          const manifestBytes=await read('principal/manifest.json'),manifest=JSON.parse(manifestBytes);assert.equal(manifest.source,expectedEvidenceSource);assert.equal(manifest.purpose,'afw.owner-cleanup-checkpoint.syn.v1');assert.equal(manifest.files.length,47);assert.equal(hash(manifestBytes),'5e81a7aa27d82aacc0bcac5b1392c14a36d3bdef6fbcea0bf78e5c2836e9299b');
          const actual=[];async function walk(p=''){for(const e of await readdir(root+'/principal/'+p,{withFileTypes:true})){assert(!e.isSymbolicLink());const path=p?p+'/'+e.name:e.name;if(e.isDirectory())await walk(path);else{assert(e.isFile());if(path==='manifest.json')continue;const b=await read('principal/'+path);actual.push({path,bytes:b.length,sha256:hash(b)});}}}await walk();actual.sort((a,b)=>a.path.localeCompare(b.path));assert.deepEqual(actual,manifest.files);
          const c=await parse('principal/checkpoint.json');assert.equal(c.plan.I0,1794059090000);assert.equal(c.plan.C0,1794059990000);assert.equal(c.plan.C1,1794060170000);assert.equal(c.facts.alarm,c.plan.C0);assert.equal(c.facts.signal.entered,0);assert.equal(c.state.nowOffset,0);
          const m=c.options.workers.find(x=>x.name==='canary-first-connection'),qa=c.options.workers.find(x=>x.name==='qa-first-connection');assert(m&&qa);assert.equal(c.options.resourcePersistencePath,'$NATIVE_STATE');assert.equal(c.options.upstream,'https://delegated-canary.agentfriendlyweb.dev');assert.equal(m.kvNamespaces.OAUTH_KV,'first-connection-oauth');assert.equal(qa.kvNamespaces.AFW_FINITE_OWNER_OAUTH_KV,m.kvNamespaces.OAUTH_KV);assert.equal(m.bindings.AFW_DELEGATED_OAUTH_ENABLED,'true');assert.equal(m.bindings.AFW_OAUTH_REFRESH_ENABLED,'false');
          const M=await read('principal/graphs/canary-index.mjs'),QA=await read('principal/graphs/qa-index.mjs'),graph=await parse('principal/graphs/metafiles.json'),native=await parse('principal/graphs/native-syn.json');assert.equal(hash(M),'c49303bee6b3a97fa1e022bfb697bb2e94fd1e37bcdd925ae9d86c774537cc32');assert.equal(hash(M),hash(m.script));assert.equal(hash(M),c.build.M.sha256);assert.equal(hash(QA),c.build.QA.sha256);assert.equal(native.testRevision,expectedEvidenceSource);assert.equal(Object.keys(graph.M.inputs).length,340);
          const flags=Object.fromEntries(Object.entries(m.bindings).filter(([k])=>k.endsWith('_ENABLED'))),sdk=c.options.workers.find(x=>x.name==='sdk-only-first-connection');assert.equal(hash(sdk.script),c.sdkOnlyBuild.sha256);assert.equal(c.sdkOnlyBuild.MAdmission,false);
          const result={label:'original g5 checkpoint byte audit; no worker mounted',sourceArtifact:expectedEvidenceSource,sourceVerifier:process.env.GITHUB_SHA,artifactId:13576692464,runId:42377143830,archiveBytes:11008780,archiveDigest:'sha256:93b3942f8aabbc44491bae7a68e69fedf6c0f7e903c3e2ccd4a983e6339b20f0',manifestSha256:hash(manifestBytes),files:manifest.files,I0:c.plan.I0,C0:c.plan.C0,C1:c.plan.C1,M:{worker:m.name,scriptHash:hash(M),bytes:M.length,inputs:Object.keys(graph.M.inputs).length,optionsHash:hash(JSON.stringify(m)),bindingsHash:hash(JSON.stringify(m.bindings)),upstream:c.options.upstream,issuer:m.bindings.AFW_OAUTH_ISSUER,resource:m.bindings.AFW_OAUTH_RESOURCE,serviceMode:m.bindings.AFW_OAUTH_SERVICE_MODE,serviceExpiresAt:m.bindings.AFW_OAUTH_PILOT_EXPIRES_AT,flags,refresh:m.bindings.AFW_OAUTH_REFRESH_ENABLED,namespace:m.kvNamespaces.OAUTH_KV,d1Databases:m.d1Databases,durableObjects:m.durableObjects,compatibilityDate:m.compatibilityDate,compatibilityFlags:m.compatibilityFlags,keys:Object.keys(m)},sdkOnly:{scriptHash:c.sdkOnlyBuild.sha256,MAdmission:c.sdkOnlyBuild.MAdmission},readbackVerified:true,newI0:false,workerMounted:false,nativeEffectsReproduced:false,operationalReadiness:false,completePackage:false,PCoff:false};
          await writeFile('g5-existing-audit.json',JSON.stringify(result,null,2));console.info('R2 original g5 audit',JSON.stringify({...result,files:result.files.length}));
          NODE
      - name: Inventory audit receipt
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir,writeFile} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const files=[];for(const path of (await readdir('.')).filter(p=>/^g5-existing-audit\.(json|log)$/.test(p)).sort()){const b=await readFile(path);files.push({path,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')});}await writeFile('g5-audit-manifest.json',JSON.stringify({source:process.env.GITHUB_SHA,files},null,2));
          NODE
      - name: Preserve original g5 audit receipt
        if: always()
        id: audit
        uses: actions/upload-artifact@v4
        with:
          name: r2-g5-original-audit-${{ github.sha }}
          path: |
            g5-existing-audit.json
            g5-existing-audit.log
            g5-audit-manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Download exact artifact audit_receipt attempt 1
        id: audit_receipt_1
        if: ${{ always() && steps.audit.outputs.artifact-id != '' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.audit.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/audit-receipt
      - name: Wait two seconds before exact artifact retry
        if: ${{ always() && steps.audit_receipt_1.outcome == 'failure' }}
        run: sleep 2
      - name: Download exact artifact audit_receipt attempt 2
        id: audit_receipt_2
        if: ${{ always() && steps.audit_receipt_1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.audit.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/audit-receipt
      - name: Wait five seconds before final exact artifact retry
        if: ${{ always() && steps.audit_receipt_2.outcome == 'failure' }}
        run: sleep 5
      - name: Download exact artifact audit_receipt attempt 3
        id: audit_receipt_3
        if: ${{ always() && steps.audit_receipt_2.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.audit.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/audit-receipt
      - name: Require successful exact artifact download
        if: ${{ always() }}
        env:
          ARTIFACT_ID: ${{ steps.audit.outputs.artifact-id }}
          DOWNLOAD_OK: ${{ steps.audit_receipt_1.outcome == 'success' || steps.audit_receipt_2.outcome == 'success' || steps.audit_receipt_3.outcome == 'success' }}
        run: test -n "$ARTIFACT_ID" && test "$DOWNLOAD_OK" = true
      - name: Verify complete audit receipt readback
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const root=process.env.RUNNER_TEMP+'/audit-receipt',names=['g5-audit-manifest.json','g5-existing-audit.json','g5-existing-audit.log'];assert.deepEqual((await readdir(root)).sort(),names);
          const m=JSON.parse(await readFile(root+'/g5-audit-manifest.json','utf8'));assert.equal(m.source,process.env.GITHUB_SHA);assert.deepEqual(m.files.map(f=>f.path),names.slice(1));for(const f of m.files){const b=await readFile(root+'/'+f.path);assert.equal(b.length,f.bytes);assert.equal(createHash('sha256').update(b).digest('hex'),f.sha256);}
          const a=JSON.parse(await readFile(root+'/g5-existing-audit.json','utf8'));assert.equal(a.sourceVerifier,process.env.GITHUB_SHA);assert.equal(a.sourceArtifact,'e5f96c1802e7ee2d5d242f9d4887df6bfeda33fb');assert.equal(a.artifactId,13576692464);assert.equal(a.readbackVerified,true);assert.equal(a.files.length,47);assert.equal(a.newI0,false);assert.equal(a.workerMounted,false);console.info('R2 original g5 audit receipt verified',JSON.stringify({sourceArtifact:a.sourceArtifact,sourceVerifier:a.sourceVerifier,files:a.files.length,M:a.M}));
          NODE
