name: AFW owner restoration qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-owner-restoration-qualification.yml]
permissions:
  contents: read
jobs:
  component_preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fixed component preflight before any I0
        shell: bash
        run: |
          mkdir -p output/owner-cleanup
          set -o pipefail
          for file in lib/mcp-qa-finite-stage-work.mjs lib/mcp-qa-finite-owner-cleanup-records.mjs lib/mcp-qa-finite-owner-cleanup-journal.mjs lib/mcp-qa-finite-owner-cleanup.mjs lib/mcp-qa-finite-initial-cleanup.mjs lib/mcp-qa-finite-preparation-issuer-store.mjs test/mcp-qa-finite-owner-cleanup.test.mjs; do node --check "$file"; done
          npx eslint lib/mcp-qa-finite-stage-work.mjs lib/mcp-qa-finite-owner-cleanup-records.mjs lib/mcp-qa-finite-owner-cleanup-journal.mjs lib/mcp-qa-finite-owner-cleanup.mjs lib/mcp-qa-finite-initial-cleanup.mjs lib/mcp-qa-finite-preparation-issuer-store.mjs test/mcp-qa-finite-owner-cleanup.test.mjs | tee output/owner-cleanup/lint.log
          node --test --test-reporter=tap test/mcp-qa-finite-owner-cleanup.test.mjs | tee output/owner-cleanup/contracts.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-component-preflight-${{ github.sha }}
          path: output/owner-cleanup/
          if-no-files-found: error
          retention-days: 7
