          const root=process.env.RUNNER_TEMP+'/r2-g0-outcome-readback',m=JSON.parse(await readFile(root+'/evidence-manifest.json','utf8'));assert.equal(m.source,process.env.GITHUB_SHA);assert.equal(m.group,'g0');assert.deepEqual(m.files.map(f=>f.path).sort(),["green-g0.tap","principal.json","sdk-expiry-same-occurrence.json"]);assert.deepEqual((await readdir(root)).sort(),[...m.files.map(f=>f.path),'evidence-manifest.json'].sort());
