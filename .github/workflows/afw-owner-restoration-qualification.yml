name: AFW owner restoration qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-owner-restoration-qualification.yml]
permissions:
  contents: read
jobs:
  directed_sdk_preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Directed syntax and lint no I0
        run: |
          for file in test/fixtures/finite-first-connection-publication.mjs test/fixtures/finite-initial-entry-world.mjs test/fixtures/finite-owner-cleanup.mjs test/fixtures/finite-owner-cleanup-persistence.mjs test/mcp-qa-finite-owner-cleanup-native.test.mjs; do node --check "$file" || exit; done
          npx eslint test/fixtures/finite-first-connection-publication.mjs test/fixtures/finite-initial-entry-world.mjs test/fixtures/finite-owner-cleanup.mjs test/fixtures/finite-owner-cleanup-persistence.mjs test/mcp-qa-finite-owner-cleanup-native.test.mjs
      - name: Real SDK component and compiled named M no I0
        run: node test/fixtures/finite-owner-cleanup-persistence.mjs preflight
      - name: Preserve directed component evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: r2-directed-sdk-preflight-${{ github.sha }}
          path: output/owner-cleanup-preflight/
          if-no-files-found: error
          retention-days: 7
      - name: Download exact artifact evidence_read attempt 1
        id: evidence_read_1
        if: ${{ always() && steps.evidence.outputs.artifact-id != '' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.evidence.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/r2-directed-readback
      - name: Wait two seconds before exact artifact retry
        if: ${{ always() && steps.evidence_read_1.outcome == 'failure' }}
        run: sleep 2
      - name: Download exact artifact evidence_read attempt 2
        id: evidence_read_2
        if: ${{ always() && steps.evidence_read_1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.evidence.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/r2-directed-readback
      - name: Wait five seconds before final exact artifact retry
        if: ${{ always() && steps.evidence_read_2.outcome == 'failure' }}
        run: sleep 5
      - name: Download exact artifact evidence_read attempt 3
        id: evidence_read_3
        if: ${{ always() && steps.evidence_read_2.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.evidence.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/r2-directed-readback
      - name: Require successful exact artifact download
        if: ${{ always() }}
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          DOWNLOAD_OK: ${{ steps.evidence_read_1.outcome == 'success' || steps.evidence_read_2.outcome == 'success' || steps.evidence_read_3.outcome == 'success' }}
        run: test -n "$ARTIFACT_ID" && test "$DOWNLOAD_OK" = true
      - name: Strict actual downloaded manifest readback
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const root=process.env.RUNNER_TEMP+'/r2-directed-readback',m=JSON.parse(await readFile(root+'/manifest.json','utf8'));assert.equal(m.source,process.env.GITHUB_SHA);assert.equal(m.files.length,7);
          assert.deepEqual((await readdir(root)).sort(),[...m.files.map(f=>f.path),'manifest.json'].sort());
          for(const f of m.files){assert(!f.path.includes('/')&&!f.path.includes('..'));const b=await readFile(root+'/'+f.path);assert.equal(b.length,f.bytes);assert.equal(createHash('sha256').update(b).digest('hex'),f.sha256);}
          const r=JSON.parse(await readFile(root+'/result.json','utf8'));assert.equal(r.noAFWI0,true);assert.equal(r.componentOnly,true);assert.equal(r.settled.sdkReturned,true);console.info('R2 directed exact artifact readback',m.source,m.files.length);
          NODE
