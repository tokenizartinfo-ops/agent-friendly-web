name: AFW owner restoration qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths: [.github/workflows/afw-owner-restoration-qualification.yml]
permissions:
  contents: read
jobs:
  routing_and_preservation_preflight:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check only affected fixture syntax and lint
        run: |
          node --check test/fixtures/finite-owner-cleanup.mjs
          node --check test/fixtures/finite-owner-cleanup-persistence.mjs
          ./node_modules/.bin/eslint test/fixtures/finite-owner-cleanup.mjs test/fixtures/finite-owner-cleanup-persistence.mjs
      - name: Pin the existing g4 artifact without reproducing effects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/owner-cleanup
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {writeFile} from 'node:fs/promises';
          const response=await fetch('https://api.github.com/repos/tokenizartinfo-ops/agent-friendly-web/actions/artifacts/13575185515',{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
          assert.equal(response.status,200);const a=await response.json();assert.equal(a.id,13575185515);assert.equal(a.workflow_run.id,42371498327);assert.equal(a.workflow_run.head_sha,'818bc4d4e6fb1935e594951ba09d3f9536ba49d6');assert.equal(a.size_in_bytes,10872023);assert.equal(a.expired,false);assert.equal(a.digest,'sha256:90edd8e83d2789fce9cca75b53d02102080e6ba0d60c891eac81fc90aff777e8');
          await writeFile('output/owner-cleanup/g4-artifact-metadata.json',JSON.stringify({artifactId:a.id,runId:a.workflow_run.id,sourceArtifact:a.workflow_run.head_sha,sourceVerifier:process.env.GITHUB_SHA,archiveBytes:a.size_in_bytes,archiveDigest:a.digest,expiresAt:a.expires_at},null,2));console.info('Pinned existing g4 artifact',a.id,a.digest);
          NODE
      - name: Download exact artifact historical_g4 attempt 1
        id: historical_g4_1
        if: ${{ success() }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ '13575185515' }}
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: tokenizartinfo-ops/agent-friendly-web
          run-id: 42371498327
          path: ${{ runner.temp }}/historical-g4
      - name: Wait two seconds before exact artifact retry
        if: ${{ always() && steps.historical_g4_1.outcome == 'failure' }}
        run: sleep 2
      - name: Download exact artifact historical_g4 attempt 2
        id: historical_g4_2
        if: ${{ always() && steps.historical_g4_1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ '13575185515' }}
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: tokenizartinfo-ops/agent-friendly-web
          run-id: 42371498327
          path: ${{ runner.temp }}/historical-g4
      - name: Wait five seconds before final exact artifact retry
        if: ${{ always() && steps.historical_g4_2.outcome == 'failure' }}
        run: sleep 5
      - name: Download exact artifact historical_g4 attempt 3
        id: historical_g4_3
        if: ${{ always() && steps.historical_g4_2.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ '13575185515' }}
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: tokenizartinfo-ops/agent-friendly-web
          run-id: 42371498327
          path: ${{ runner.temp }}/historical-g4
      - name: Require successful exact artifact download
        if: ${{ always() }}
        env:
          ARTIFACT_ID: ${{ '13575185515' }}
          DOWNLOAD_OK: ${{ steps.historical_g4_1.outcome == 'success' || steps.historical_g4_2.outcome == 'success' || steps.historical_g4_3.outcome == 'success' }}
        run: test -n "$ARTIFACT_ID" && test "$DOWNLOAD_OK" = true
      - name: Audit historical g4 bytes and original partial checkpoint
        run: |
          node --input-type=module <<'NODE'
          import {verifyCleanupG4Outcome,writeCleanupEvidence} from './test/fixtures/finite-owner-cleanup-persistence.mjs';
          const r=await verifyCleanupG4Outcome(process.env.RUNNER_TEMP+'/historical-g4',{expectedEvidenceSource:'818bc4d4e6fb1935e594951ba09d3f9536ba49d6',historicalArchive:true});await writeCleanupEvidence('g4-existing-audit',r);console.info('R2 historical g4 audit',JSON.stringify(r));
          NODE
      - name: Genuine short I0 diagnostic for exact ordinary M transport
        shell: bash
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' | tee output/owner-cleanup/routing-preflight.log
          import {verifyCleanupMTransportPremises} from './test/fixtures/finite-owner-cleanup-persistence.mjs';
          console.info('R2 M routing preflight',JSON.stringify(await verifyCleanupMTransportPremises()));
          NODE
      - name: Inventory current preflight evidence
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readdir,readFile,writeFile} from 'node:fs/promises';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const files=[];async function walk(path){for(const e of await readdir('output/'+path,{withFileTypes:true})){assert(!e.isSymbolicLink());const p=path+'/'+e.name;if(e.isDirectory())await walk(p);else{assert(e.isFile());const b=await readFile('output/'+p);files.push({path:p,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')});}}}
          for(const dir of ['owner-cleanup','t2-native-graphs'])try{await walk(dir);}catch(e){if(e.code!=='ENOENT')throw e;}
          files.sort((a,b)=>a.path.localeCompare(b.path));await writeFile('output/evidence-manifest.json',JSON.stringify({source:process.env.GITHUB_SHA,label:'SYN diagnostic I0; no C0 closure; outside GREEN51',files,operationalReadiness:false,completePackage:false,PCoff:false},null,2));
          NODE
      - name: Preserve preflight evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: r2-routing-preservation-preflight-${{ github.sha }}
          path: |
            output/evidence-manifest.json
            output/owner-cleanup/
            output/t2-native-graphs/
          if-no-files-found: error
          retention-days: 7
      - name: Download exact artifact preflight_read attempt 1
        id: preflight_read_1
        if: ${{ always() && steps.evidence.outputs.artifact-id != '' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.evidence.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/routing-preflight-readback
      - name: Wait two seconds before exact artifact retry
        if: ${{ always() && steps.preflight_read_1.outcome == 'failure' }}
        run: sleep 2
      - name: Download exact artifact preflight_read attempt 2
        id: preflight_read_2
        if: ${{ always() && steps.preflight_read_1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.evidence.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/routing-preflight-readback
      - name: Wait five seconds before final exact artifact retry
        if: ${{ always() && steps.preflight_read_2.outcome == 'failure' }}
        run: sleep 5
      - name: Download exact artifact preflight_read attempt 3
        id: preflight_read_3
        if: ${{ always() && steps.preflight_read_2.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.evidence.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/routing-preflight-readback
      - name: Require successful exact artifact download
        if: ${{ always() }}
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          DOWNLOAD_OK: ${{ steps.preflight_read_1.outcome == 'success' || steps.preflight_read_2.outcome == 'success' || steps.preflight_read_3.outcome == 'success' }}
        run: test -n "$ARTIFACT_ID" && test "$DOWNLOAD_OK" = true
      - name: Verify exact preflight evidence after download
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readdir,readFile} from 'node:fs/promises';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const root=process.env.RUNNER_TEMP+'/routing-preflight-readback',m=JSON.parse(await readFile(root+'/evidence-manifest.json','utf8'));assert.equal(m.source,process.env.GITHUB_SHA);const actual=[];
          async function walk(path=''){for(const e of await readdir(root+'/'+path,{withFileTypes:true})){assert(!e.isSymbolicLink());const p=path?path+'/'+e.name:e.name;if(e.isDirectory())await walk(p);else{assert(e.isFile());if(p!=='evidence-manifest.json')actual.push(p);}}}await walk();assert.deepEqual(actual.sort(),m.files.map(f=>f.path).sort());
          const required=['g4-artifact-metadata.json','g4-existing-audit.json','m-transport-preflight.json','routing-preflight.log','sdk-only-current.mjs','sdk-only-current-metafile.json'].map(n=>'owner-cleanup/'+n);for(const p of required)assert(actual.includes(p));const graphs=actual.filter(p=>p.startsWith('t2-native-graphs/'));assert.equal(graphs.length,3);assert(graphs.some(p=>p.endsWith('/canary-index.mjs')));assert(graphs.some(p=>p.endsWith('/qa-index.mjs')));assert(graphs.some(p=>p.endsWith('/metafiles.json')));assert.equal(actual.length,9);
          for(const f of m.files){assert(!f.path.includes('..'));const b=await readFile(root+'/'+f.path);assert.equal(b.length,f.bytes);assert.equal(createHash('sha256').update(b).digest('hex'),f.sha256);}
          const r=JSON.parse(await readFile(root+'/owner-cleanup/m-transport-preflight.json','utf8'));assert.equal(r.source,process.env.GITHUB_SHA);assert.equal(r.closureProved,false);assert.equal(r.disposedBeforeC0,true);assert.equal(r.positive.worker,'canary-first-connection');assert.equal(r.positive.dataRead,true);assert.equal(r.negative.dataDenied,true);assert.equal(r.sdkOnly.holdRepeated,false);console.info('R2 routing preflight exact readback',m.files.length);
          NODE
