        env:
          ARTIFACT_ID: ${{ steps.checkpoint.outputs.artifact-id }}
          DOWNLOAD_OK: ${{ steps.checkpoint_read_1.outcome == 'success' || steps.checkpoint_read_2.outcome == 'success' || steps.checkpoint_read_3.outcome == 'success' }}
