name: AFW public JSON inactive upload

on:
  pull_request:
    paths:
      - 'scripts/public-inactive-upload.py'
      - 'scripts/public-json-inactive-upload.py'
      - 'test/public_json_upload_test.py'
      - '.github/workflows/afw-public-json-inactive-upload.yml'

permissions:
  contents: read

jobs:
  verify-json:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s test -p 'public*upload_test.py' -v
