name: AFW finite request signal opt-in qualification
on:
  push:
    branches: [feat/finite-native-cleanup-20261101]
    paths:
      - .github/workflows/finite-request-signal-opt-in-qualification.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Finite hash and named plan call site inventory
        run: rg -n 'activationConfigurationHash|resolveNamedActivationPlan|validateNamedCancellationHistory|createActivationObserver' lib/mcp-qa-finite-*.mjs lib/mcp-finite-*.mjs
