name: AFW synthetic linked notice journey
on:
  push:
    branches: [lab/afw-linked-notice-journey-20261118]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'tokenizartinfo-ops/agent-friendly-web' && github.ref == 'refs/heads/lab/afw-linked-notice-journey-20261118' && github.event.head_commit.message == 'AFW-LINKED-NOTICE-JOURNEY-20261118-PROJECTED-EVENT' && github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Install locked dependencies
        id: deps
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check ordinary native preparation
        run: node --test --test-reporter=tap --test-name-pattern='^initial owned synthetic selection needs no OAuth grant and uses release primary$' test/mcp-qa-finite-owner-preparation-native.test.mjs
      - name: Check one linked synthetic notice
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        run: node --test --test-reporter=tap test/mcp-own-notice-journey-linked.test.mjs
