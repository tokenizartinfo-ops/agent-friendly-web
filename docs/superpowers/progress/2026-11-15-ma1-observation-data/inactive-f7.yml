           need(all(e.get(k)==v for k,v in expected.items()) and e.get('GITHUB_SHA')==c['source'] and e.get('GITHUB_WORKFLOW_SHA')==c['source'] and e.get('GITHUB_RUN_ID')==c['run'])
           return c
          def observe():
           fds=[];links=[]
