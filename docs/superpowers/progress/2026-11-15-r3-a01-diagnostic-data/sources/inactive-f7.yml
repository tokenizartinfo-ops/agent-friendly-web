      - .github/workflows/afw-finite-budget-qualification.yml
permissions:
  contents: read
concurrency:
  group: afw-finite-budget-qualification
  cancel-in-progress: false
# Fixed A01 diagnostic. Original readonly CLI/Native HELD.
