            printf '%s\n' 'AFW_R3_DELIVERY_A01_DIAGNOSTIC/1 {"purpose":"afw.r3-delivery.a01-diagnostic.v1","source":"unknown","sourceTree":"unknown","run":"unknown","attempt":"unknown","job":"unknown","node":"unknown","case":"A01","baseline":{"phase":"unknown","binding":"unknown","atExec":"unknown","exit":"unknown","output":"unknown","stderr":"unknown"},"control":{"phase":"unknown","binding":"unknown","atExec":"unknown","exit":"unknown","output":"unknown","stderr":"unknown"},"originalCLIInvoked":0,"nativeBusinessCases":0,"nonclaims":{"historicalCauseProven":false,"receiptAuthenticated":false,"operationalReadiness":false,"completePackage":false,"PCoff":false,"globalNativeDrainVerified":false,"sdkNamespaceEmptyVerified":false}}' 2>/dev/null; exit 1
          fi
          if ! exec 2>/dev/null; then
            printf '%s\n' 'AFW_R3_DELIVERY_A01_DIAGNOSTIC/1 {"purpose":"afw.r3-delivery.a01-diagnostic.v1","source":"unknown","sourceTree":"unknown","run":"unknown","attempt":"unknown","job":"unknown","node":"unknown","case":"A01","baseline":{"phase":"unknown","binding":"unknown","atExec":"unknown","exit":"unknown","output":"unknown","stderr":"unknown"},"control":{"phase":"unknown","binding":"unknown","atExec":"unknown","exit":"unknown","output":"unknown","stderr":"unknown"},"originalCLIInvoked":0,"nativeBusinessCases":0,"nonclaims":{"historicalCauseProven":false,"receiptAuthenticated":false,"operationalReadiness":false,"completePackage":false,"PCoff":false,"globalNativeDrainVerified":false,"sdkNamespaceEmptyVerified":false}}' 2>/dev/null; exit 1
          fi
          r3_image_ready=0
          r3_image_root=
          if test -n "${RUNNER_TEMP-}" && test -d "${RUNNER_TEMP-}"; then
            r3_image_root=$(/usr/bin/mktemp -d -- "${RUNNER_TEMP%/}/afw-r3-node.XXXXXXXX")
            case "$r3_image_root" in
              "${RUNNER_TEMP%/}"/afw-r3-node.????????)
                if exec 9<"$r3_image_root"; then r3_image_ready=1; fi
                ;;
            esac
          fi
          unset r3_image_root
          if test "$r3_image_ready" != 1; then
            printf '%s\n' 'AFW_R3_DELIVERY_A01_DIAGNOSTIC/1 {"purpose":"afw.r3-delivery.a01-diagnostic.v1","source":"unknown","sourceTree":"unknown","run":"unknown","attempt":"unknown","job":"unknown","node":"unknown","case":"A01","baseline":{"phase":"unknown","binding":"unknown","atExec":"unknown","exit":"unknown","output":"unknown","stderr":"unknown"},"control":{"phase":"unknown","binding":"unknown","atExec":"unknown","exit":"unknown","output":"unknown","stderr":"unknown"},"originalCLIInvoked":0,"nativeBusinessCases":0,"nonclaims":{"historicalCauseProven":false,"receiptAuthenticated":false,"operationalReadiness":false,"completePackage":false,"PCoff":false,"globalNativeDrainVerified":false,"sdkNamespaceEmptyVerified":false}}' 2>/dev/null; exit 1
          fi
          exec 4</proc/thread-self
          /usr/bin/python3 -I -S /proc/self/fd/5 bootstrap-initial 5<<'AFW_R3_CONTROLS_ENTRY'
          # Fixed Source literal: verified module/kernel snapshots only, no caller code/path selection.
          import os,sys,stat,fcntl,base64,zlib,hashlib
          def need(v):
           if not v:raise ValueError()
          def sealed_source(data,label,maximum):
           need(type(data) is bytes and 0<len(data)<=maximum and maximum in [32768,65536] and label in ['afw-r3-lifetime','afw-r3-module','afw-r3-parent','afw-r3-helper'])
           f=os.memfd_create(label,os.MFD_CLOEXEC|os.MFD_ALLOW_SEALING)
           try:
            at=0
            while at<len(data):
             n=os.write(f,memoryview(data)[at:]);need(n>0);at+=n
            os.fchmod(f,0o400);os.lseek(f,0,os.SEEK_SET)
            seals=fcntl.F_SEAL_WRITE|fcntl.F_SEAL_GROW|fcntl.F_SEAL_SHRINK|fcntl.F_SEAL_SEAL
            fcntl.fcntl(f,fcntl.F_ADD_SEALS,seals);need(fcntl.fcntl(f,fcntl.F_GET_SEALS)&seals==seals)
            return f
           except BaseException:os.close(f);raise
          def unpack(pin):
           need(type(pin) is dict and list(pin)==['bytes','sha256','zipBytes','zipSha256','data','cap'] and pin['cap'] in [32768,65536] and 0<pin['bytes']<=pin['cap'] and len(pin['data'])<=131072)
           compressed=base64.b64decode(pin['data'],validate=True);need(base64.b64encode(compressed).decode()==pin['data'] and len(compressed)==pin['zipBytes']<=98304 and hashlib.sha256(compressed).hexdigest()==pin['zipSha256'])
           dec=zlib.decompressobj(31);data=dec.decompress(compressed,pin['cap']+1)
           need(len(data)==pin['bytes'] and dec.eof and dec.unused_data==b'' and dec.unconsumed_tail==b'' and hashlib.sha256(data).hexdigest()==pin['sha256']);return data
          _r3_kernel={"bytes":17191,"sha256":"7ae472665f7ed6ce77a07e7a8b788ab27aa42830f92a32a3efbf938cbe1fb680","zipBytes":5347,"zipSha256":"c478677462feec2c6fa7e9a0b5f64e61a32e5d4779e262d9d7d39c2ba0f56859","data":"","cap":32768}
          _r3_module={"bytes":27937,"sha256":"c5d405ddd51444132399a903f61fa577a213e46cdd4e71ebbf25b062f4ad939e","zipBytes":10061,"zipSha256":"42c8de045e80caa6df145dfbc70f3eb7776837e3e9dea2d7e32acf31eb09bca6","data":"","cap":65536}
          _r3_fallback={"delivery":{"purpose":"afw.r3-delivery.unavailable.v1","reason":"outer_startup_unavailable","source":"unknown","sourceTree":"unknown","run":"unknown","attempt":"unknown","job":"unknown","node":"unknown","controls":"unknown","availability":"unavailable","sourceQualified":False,"collectionComplete":"unknown","sampleObserved":"unknown","nonclaims":{"historicalCauseProven":False,"receiptAuthenticated":False,"operationalReadiness":False,"completePackage":False,"PCoff":False,"globalNativeDrainVerified":False,"sdkNamespaceEmptyVerified":False}},"controls":{"purpose":"afw.r3-delivery.controls-unavailable.v1","reason":"outer_startup_unavailable","source":"unknown","sourceTree":"unknown","run":"unknown","attempt":"unknown","job":"unknown","node":"unknown","allPassed":"unknown","expected":104,"passed":"unknown","failed":"unknown","unknown":"unknown","results":"unknown","mutants":"unknown","nativeBusinessCases":0,"nonclaims":{"historicalCauseProven":False,"receiptAuthenticated":False,"operationalReadiness":False,"completePackage":False,"PCoff":False,"globalNativeDrainVerified":False,"sdkNamespaceEmptyVerified":False}}}
          try:
           kernel=unpack(_r3_kernel);f=sealed_source(kernel,'afw-r3-lifetime',32768);os.dup2(f,5,inheritable=True)
           if f!=5:os.close(f)
           if _r3_module is not None:
            module=unpack(_r3_module);f=sealed_source(module,'afw-r3-module',_r3_module['cap'])
            if sys.argv[1]!='node-race-creator':os.dup2(f,0,inheritable=True)
            if f!=0:os.close(f)
           need(len(sys.argv)==2 and sys.argv[1] in ['bootstrap-initial','bootstrap-delivery','bootstrap-controls','parent-delivery','parent-controls','case-delivery','case-controls','case-missing-cwd','node-witness','remove-empty-cwd','make-fifo','node-race-creator','life-timeout','life-python','life-outer','life-bash','life-race'])
           os.execve('/usr/bin/python3',['python3','-I','-S','/proc/self/fd/5',sys.argv[1]],dict(os.environ))
          except BaseException:
           role=sys.argv[1] if len(sys.argv)==2 else ''
           if role=='bootstrap-initial':
            try:os.write(1,b"AFW_R3_DELIVERY_A01_DIAGNOSTIC/1 {\"purpose\":\"afw.r3-delivery.a01-diagnostic.v1\",\"source\":\"unknown\",\"sourceTree\":\"unknown\",\"run\":\"unknown\",\"attempt\":\"unknown\",\"job\":\"unknown\",\"node\":\"unknown\",\"case\":\"A01\",\"baseline\":{\"phase\":\"unknown\",\"binding\":\"unknown\",\"atExec\":\"unknown\",\"exit\":\"unknown\",\"output\":\"unknown\",\"stderr\":\"unknown\"},\"control\":{\"phase\":\"unknown\",\"binding\":\"unknown\",\"atExec\":\"unknown\",\"exit\":\"unknown\",\"output\":\"unknown\",\"stderr\":\"unknown\"},\"originalCLIInvoked\":0,\"nativeBusinessCases\":0,\"nonclaims\":{\"historicalCauseProven\":false,\"receiptAuthenticated\":false,\"operationalReadiness\":false,\"completePackage\":false,\"PCoff\":false,\"globalNativeDrainVerified\":false,\"sdkNamespaceEmptyVerified\":false}}\n")
            except BaseException:pass
           raise SystemExit(1)
          AFW_R3_CONTROLS_ENTRY
          # Diagnostic is always nonzero. Root retains FD9 image and case state until VM teardown.
          # No Bash publication after the sealed module may have attempted a write.
          exit 1
